[workspace]
members = ["fase-api", "fase-controller"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.98"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
fase-api = { path = "./fase-api" }
clap = { version = "4", features = ["derive"] }
k8s-openapi = { version = "0.28", features = ["v1_36"] }
kube = { version = "4", features = ["derive", "runtime"] }
object_store = { version = "0.14.0", default-features = false, features = ["aws"] }
rustls = { version = "0.23", features = ["aws_lc_rs"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
sha2 = "0.11"
tar = "0.4"
tokio = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
