[workspace]
members = ["fase-api"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
fase-api = { path = "./fase-api" }

clap = { version = "4", features = ["derive"] }
compio = { version = "0.19.0-rc.1", features = [
  "io-uring",
  "io",
  "fs",
  "fs-dir",
  "runtime",
  "macros",
] }
regex = { version = "1" }
serde = { version = "1", features = ["derive"] }
serde-value = { version = "0.7" }
serde_yml = { version = "0.0.12" }
url = { version = "2", features = ["serde"] }
