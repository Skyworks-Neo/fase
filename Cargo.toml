[workspace]
members = ["fase-api", "fase-cli", "fase-runtime"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
fase-api = { path = "./fase-api" }
fase-cli = { path = "./fase-cli" }
fase-runtime = { path = "./fase-runtime" }

bytes = { version = "1" }
cel = { version = "0.13" }
clap = { version = "4", features = ["derive"] }
compio = { version = "0.19.0-rc.2", features = [
  "bytes",
  "io-uring",
  "polling",
  "io",
  "fs",
  "fs-dir",
  "runtime",
  "macros",
] }
cyper = { version = "0.9.0-rc.3" }
futures = { version = "0.3" }
futures-util = { version = "0.3" }
lasso = { version = "0.7", features = ["multi-threaded"] }
regex = { version = "1" }
serde = { version = "1", features = ["derive"] }
serde-value = { version = "0.7" }
serde_yml = { version = "0.0.12" }
sha2 = { version = "0.11" }
url = { version = "2", features = ["serde"] }
zstd = { version = "0.13" }
