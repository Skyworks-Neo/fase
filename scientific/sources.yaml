apiVersion: skyw.top/v1beta1
kind: Task
metadata:
  name: fetch-url
  labels:
    capability: fetch-url
spec:
  image: curlimages/curl:8.19.0
  imagePullSecrets:
  - name: fase-ghcr-pull
  - name: fase-registry-pull
  command:
  - /bin/sh
  resources:
    requests:
      cpu: 200m
      memory: 128Mi
      ephemeral-storage: 256Mi
    limits:
      cpu: '2'
      memory: 1Gi
      ephemeral-storage: 4Gi
  inputs:
    variables:
    - name: url
      env: FASE_VAR_URL
      required: true
    - name: sha256
      env: FASE_VAR_SHA256
      required: true
    - name: version
      env: FASE_VAR_VERSION
      required: true
  outputs:
    artifacts:
    - name: source
      path: source
      kind: file
  script: "set -eu\n\ncase \"$FASE_VAR_URL\" in\n  */) echo \"url must name a file, not a directory: $FASE_VAR_URL\"\
    \ >&2; exit 1 ;;\nesac\n\ncurl --fail --location --silent --show-error \\\n     --retry 5 --retry-delay 3 --retry-all-errors\
    \ \\\n     --connect-timeout 30 --max-time 1800 \\\n     --output \"$FASE_OUTPUT_ROOT/source\" \\\n     \"$FASE_VAR_URL\"\
    \n\nprintf '%s  %s\\n' \"$FASE_VAR_SHA256\" \"$FASE_OUTPUT_ROOT/source\" | sha256sum -c -\n\nprintf 'fetched\
    \ %s version=%s bytes=%s\\n' \\\n  \"$FASE_VAR_URL\" \"$FASE_VAR_VERSION\" \"$(wc -c < \"$FASE_OUTPUT_ROOT/source\"\
    )\" >&2\n"
---
apiVersion: skyw.top/v1beta1
kind: Recipe
metadata:
  name: fetch-llvm-project-22-1-6
spec:
  outputs:
    artifacts:
    - name: source
      from:
        task: fetch
        artifact: source
      labels:
        name:
          value: llvm-project-source
        version:
          value: 22.1.6
        recipe:
          value: fetch-v1
        kind:
          value: source
  tasks:
  - name: fetch
    variables:
      url:
        value: https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.6/llvm-project-22.1.6.src.tar.xz
      sha256:
        value: 6e0b376a1f6d9873e7dfb09ae6e04b9c7024400f01733fa4c29be69d5c138bc2
      version:
        value: 22.1.6
    outputs:
    - name: source
    taskSelector:
      matchLabels:
        capability: fetch-url
---
