apiVersion: skyw.top/v1beta1
kind: Task
metadata:
  name: musl-sysroot
  labels:
    capability: musl-sysroot
spec:
  image: gcc:16.2.0-trixie
  imagePullSecrets:
  - name: fase-ghcr-pull
  - name: fase-registry-pull
  command:
  - /bin/bash
  securityContext:
    runAsUser: 0
    runAsNonRoot: false
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: '32'
      memory: 64Gi
      ephemeral-storage: 200Gi
    limits:
      cpu: '32'
      memory: 64Gi
      ephemeral-storage: 300Gi
  inputs:
    variables:
    - name: jobs
      env: FASE_VAR_JOBS
      required: true
    artifacts:
    - name: source
      path: tarball
      kind: file
    - name: packtar
      path: packtar.py
      kind: file
  outputs:
    artifacts:
    - name: tc
      path: tc
      kind: file
  script: "set -euo pipefail\n\ntc=/opt/tc\nsysroot=\"$tc/x86_64-linux-musl\"\nbuild=/workspace/build\n\nrm -rf\
    \ \"$tc\" \"$build\"\nmkdir -p \"$tc\" \"$build\"\n\n# `archive` ports are stored as tar.zst, so the step has\
    \ to produce one.\n# The packer needs zstd; the Debian image does not carry it.\ncommand -v zstd >/dev/null\
    \ 2>&1 || {\n  export DEBIAN_FRONTEND=noninteractive\n  apt-get update -qq >/dev/null\n  apt-get install -y\
    \ -qq --no-install-recommends zstd >/dev/null\n}\ncommand -v zstd >/dev/null\n\n# The source arrives as opaque\
    \ bytes; detect the container by magic.\nmagic=$(head -c 6 \"$FASE_INPUT_ROOT/tarball\" | od -An -tx1 | tr -d\
    \ ' \\n')\ncase \"$magic\" in\n  1f8b*)              tar -xzf \"$FASE_INPUT_ROOT/tarball\" -C \"$build\" ;;\n\
    \  fd377a585a00|28b52ffd) tar -xf  \"$FASE_INPUT_ROOT/tarball\" -C \"$build\" ;;\n  425a68*)            tar\
    \ -xjf \"$FASE_INPUT_ROOT/tarball\" -C \"$build\" ;;\n  *) echo \"unrecognised archive magic: $magic\" >&2;\
    \ exit 1 ;;\nesac\n\nsrc=$(find \"$build\" -maxdepth 1 -type d -name 'musl-*')\ntest -n \"$src\"\ncd \"$src\"\
    \n\n# --prefix=/usr --syslibdir=/lib plus DESTDIR is how musl-cross-make lays\n# out a sysroot; GCC then finds\
    \ everything under --with-sysroot.\n#\n# Deliberately no --target: musl derives CROSS_COMPILE=\"$target-\" whenever\n\
    # the target differs from the build triple, and would then insist on an\n# x86_64-linux-musl-gcc that does not\
    \ exist yet \u2014 this is the step that has\n# to work with the bare host compiler. The host is x86_64, so\
    \ the detected\n# architecture is already the one we want.\n./configure --prefix=/usr --syslibdir=/lib\nmake\
    \ -j\"$FASE_VAR_JOBS\"\nmake install DESTDIR=\"$sysroot\"\n\n# musl's install rule for the dynamic loader is\n\
    #     install.sh -D -l $(libdir)/libc.so $(syslibdir)/ld-musl-x86_64.so.1\n# i.e. an *absolute* symlink to /usr/lib/libc.so.\
    \ That is right for a real\n# target root, but wrong here twice over: our prefix is not /, so the link\n# resolves\
    \ to the Debian host's /usr/lib/libc.so (a linker script), and the\n# archive format only stores regular files.\
    \ Materialise it as a copy of the\n# real shared object, which is also what it is on the target.\nloader=\"\
    $sysroot/lib/ld-musl-x86_64.so.1\"\ntest -L \"$loader\" || { echo \"expected $loader to be a symlink\" >&2;\
    \ exit 1; }\ntest \"$(readlink \"$loader\")\" = /usr/lib/libc.so || {\n  echo \"unexpected loader symlink target:\
    \ $(readlink \"$loader\")\" >&2; exit 1\n}\n# rm first: the link target /usr/lib/libc.so does not exist on the\
    \ Debian\n# build host (its linker script lives in /usr/lib/x86_64-linux-gnu), so the\n# symlink is dangling\
    \ and cp would refuse to write through it.\nrm -f \"$loader\"\ncp \"$sysroot/usr/lib/libc.so\" \"$loader\"\n\
    \n# --- structural verification -------------------------------------------\ntest -f \"$sysroot/usr/include/stdio.h\"\
    \ntest -f \"$sysroot/usr/include/stdlib.h\"\ntest -f \"$sysroot/usr/include/sys/socket.h\"\ntest -f \"$sysroot/usr/lib/libc.a\"\
    \ntest -f \"$loader\"\nfor crt in crt1.o crti.o crtn.o Scrt1.o rcrt1.o; do\n  test -f \"$sysroot/usr/lib/$crt\"\
    \ || { echo \"missing $crt\" >&2; exit 1; }\ndone\ntest -x \"$loader\"\n# The loader is an ELF shared object,\
    \ not a linker script.\nhead -c 4 \"$loader\" | od -An -tx1 | tr -d ' \\n' | grep -qx 7f454c46\n# The shared\
    \ object doubles as the loader; nothing may point outside the\n# prefix, because packing dereferences every\
    \ link.\nif find \"$tc\" -type l -printf '%p -> %l\\n' | grep -q ' -> /'; then\n  echo \"absolute symlink left\
    \ inside the prefix:\" >&2\n  find \"$tc\" -type l -printf '%p -> %l\\n' | grep ' -> /' >&2\n  exit 1\nfi\n\n\
    # The loader must not itself need a libc.\nif readelf -d \"$loader\" | grep -q NEEDED; then\n  echo \"musl loader\
    \ unexpectedly has DT_NEEDED entries\" >&2\n  exit 1\nfi\n\n# --- record what was built ---------------------------------------------\n\
    {\n  printf 'version\\t%s\\n' \"$(sed -n 's/^MUSL_VERSION=//p' Makefile 2>/dev/null | head -1 || true)\"\n \
    \ printf 'libc_a_bytes\\t%s\\n' \"$(wc -c < \"$sysroot/usr/lib/libc.a\")\"\n  printf 'loader_bytes\\t%s\\n'\
    \ \"$(wc -c < \"$sysroot/lib/ld-musl-x86_64.so.1\")\"\n  printf 'header_count\\t%s\\n' \"$(find \"$sysroot/usr/include\"\
    \ -type f | wc -l)\"\n  printf 'arch\\t%s\\n' \"$(uname -m)\"\n  printf 'jobs\\t%s\\n' \"$FASE_VAR_JOBS\"\n\
    } > \"$tc/BUILD-INFO-musl.txt\"\n\n# Ship the whole prefix as one tar.zst; later stages get it unrolled back\n\
    # into /opt/tc by the input helper.\nmkdir -p \"$FASE_OUTPUT_ROOT\"\npython3 \"$FASE_INPUT_ROOT/packtar.py\"\
    \ \"$FASE_OUTPUT_ROOT/tc\" \"$tc\"\n# Integrity only: the output companion runs fase's real validator, which\
    \ is\n# the authority on archive shape.\nzstd -q -t \"$FASE_OUTPUT_ROOT/tc\"\nzstd -dc \"$FASE_OUTPUT_ROOT/tc\"\
    \ | python3 -c \"\nimport sys, tarfile\ntf = tarfile.open(fileobj=sys.stdin.buffer, mode='r|')\nprint('entries',\
    \ sum(1 for _ in tf))\n\"\ndu -sh \"$FASE_OUTPUT_ROOT/tc\"\n"
  workspace:
    taskSizeLimit: 300Gi
    inputSizeLimit: 32Gi
    outputSizeLimit: 32Gi
    transferSizeLimit: 32Gi
  nodeSelector:
    kubernetes.io/hostname: node1
