apiVersion: skyw.top/v1beta1
kind: Task
metadata:
  name: scipy-build
  labels:
    capability: scipy-build
spec:
  image: gcc:16.2.0-trixie
  imagePullSecrets:
  - name: fase-ghcr-pull
  - name: fase-registry-pull
  command:
  - /bin/bash
  securityContext:
    runAsUser: 0
    runAsNonRoot: false
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: '32'
      memory: 64Gi
      ephemeral-storage: 200Gi
    limits:
      cpu: '32'
      memory: 64Gi
      ephemeral-storage: 300Gi
  env:
  - name: DEBIAN_FRONTEND
    value: noninteractive
  inputs:
    variables:
    - name: jobs
      env: FASE_VAR_JOBS
      required: true
    artifacts:
    - name: tc
      path: tc.tar.zst
      kind: file
    - name: fortran
      path: fortran-tc.tar.zst
      kind: file
    - name: openblas
      path: openblas.tar.zst
      kind: file
    - name: pyruntime
      path: python-runtime.tar.zst
      kind: file
    - name: pystdlib
      path: python-stdlib.tar.zst
      kind: file
    - name: pydev
      path: python-dev.tar.zst
      kind: file
    - name: pydeps
      path: python-deps.tar.zst
      kind: file
    - name: numpywheel
      path: numpy.whl
      kind: file
    - name: numpyruntime
      path: numpy-runtime.tar.zst
      kind: file
    - name: source
      path: tarball
      kind: file
    - name: pip
      path: pip.whl
      kind: file
    - name: meson
      path: meson.whl
      kind: file
    - name: mesonpython
      path: meson-python.whl
      kind: file
    - name: pyprojectmetadata
      path: pyproject-metadata.whl
      kind: file
    - name: packaging
      path: packaging.whl
      kind: file
    - name: cython
      path: cython.whl
      kind: file
    - name: pybind11
      path: pybind11.whl
      kind: file
    - name: pythran
      path: pythran.whl
      kind: file
    - name: beniget
      path: beniget.whl
      kind: file
    - name: gast
      path: gast.whl
      kind: file
    - name: ply
      path: ply.whl
      kind: file
    - name: setuptools
      path: setuptools.whl
      kind: file
    - name: ninja
      path: ninja.whl
      kind: file
  outputs:
    artifacts:
    - name: wheel
      path: scipy-1.18.1-cp313-cp313-musllinux_1_2_x86_64.whl
      kind: file
    - name: report
      path: scipy-build-info.txt
      kind: file
  script: "set -eu\nif ! command -v zstd >/dev/null 2>&1; then\n  apt-get update -qq >/dev/null\n  apt-get install\
    \ -y -qq --no-install-recommends zstd >/dev/null\nfi\nmkdir -p /workspace/inputs\nmkdir -p \"/workspace/inputs/tc\"\
    \nzstd -dc \"/in/tc.tar.zst\" | tar -xf - -C \"/workspace/inputs/tc\"\nmkdir -p \"/workspace/inputs/fortran-tc\"\
    \nzstd -dc \"/in/fortran-tc.tar.zst\" | tar -xf - -C \"/workspace/inputs/fortran-tc\"\nmkdir -p \"/workspace/inputs/openblas\"\
    \nzstd -dc \"/in/openblas.tar.zst\" | tar -xf - -C \"/workspace/inputs/openblas\"\nmkdir -p \"/workspace/inputs/python-runtime\"\
    \nzstd -dc \"/in/python-runtime.tar.zst\" | tar -xf - -C \"/workspace/inputs/python-runtime\"\nmkdir -p \"/workspace/inputs/python-stdlib\"\
    \nzstd -dc \"/in/python-stdlib.tar.zst\" | tar -xf - -C \"/workspace/inputs/python-stdlib\"\nmkdir -p \"/workspace/inputs/python-dev\"\
    \nzstd -dc \"/in/python-dev.tar.zst\" | tar -xf - -C \"/workspace/inputs/python-dev\"\nmkdir -p \"/workspace/inputs/python-deps\"\
    \nzstd -dc \"/in/python-deps.tar.zst\" | tar -xf - -C \"/workspace/inputs/python-deps\"\nmkdir -p \"/workspace/inputs/numpy-runtime\"\
    \nzstd -dc \"/in/numpy-runtime.tar.zst\" | tar -xf - -C \"/workspace/inputs/numpy-runtime\"\nln -s \"/in/numpy.whl\"\
    \ \"/workspace/inputs/numpy.whl\"\nln -s \"/in/tarball\" \"/workspace/inputs/tarball\"\nln -s \"/in/pip.whl\"\
    \ \"/workspace/inputs/pip.whl\"\nln -s \"/in/meson.whl\" \"/workspace/inputs/meson.whl\"\nln -s \"/in/meson-python.whl\"\
    \ \"/workspace/inputs/meson-python.whl\"\nln -s \"/in/pyproject-metadata.whl\" \"/workspace/inputs/pyproject-metadata.whl\"\
    \nln -s \"/in/packaging.whl\" \"/workspace/inputs/packaging.whl\"\nln -s \"/in/cython.whl\" \"/workspace/inputs/cython.whl\"\
    \nln -s \"/in/pybind11.whl\" \"/workspace/inputs/pybind11.whl\"\nln -s \"/in/pythran.whl\" \"/workspace/inputs/pythran.whl\"\
    \nln -s \"/in/beniget.whl\" \"/workspace/inputs/beniget.whl\"\nln -s \"/in/gast.whl\" \"/workspace/inputs/gast.whl\"\
    \nln -s \"/in/ply.whl\" \"/workspace/inputs/ply.whl\"\nln -s \"/in/setuptools.whl\" \"/workspace/inputs/setuptools.whl\"\
    \nln -s \"/in/ninja.whl\" \"/workspace/inputs/ninja.whl\"\nexport FASE_INPUT_ROOT=/workspace/inputs\nset -Eeuo\
    \ pipefail\n# A stage this long fails somewhere in the middle of a build system that\n# reports the failing\
    \ command itself, and the line number is what says which\n# of the two hundred lines of this script chose it.\n\
    trap 'code=$?; printf \"FAILED (exit %s) line %s: %s\\n\" \"$code\" \"$LINENO\" \"$BASH_COMMAND\" >&2' ERR\n\
    \ntc=/opt/tc\nsys=\"$tc/x86_64-linux-musl\"\nft=/opt/ft\nob=/opt/ob\npy=/opt/py\nnr=/opt/nr\nbuild=/workspace/build\n\
    src=\"$build/src\"\nwheelhouse=\"$build/wheelhouse\"\nout=\"$build/out\"\n\nrm -rf \"$tc\" \"$ft\" \"$ob\" \"\
    $py\" \"$nr\" \"$build\"\nmkdir -p \"$tc\" \"$ft\" \"$ob\" \"$py\" \"$nr\" \"$src\" \"$wheelhouse\" \"$out\"\
    \n\ncp -a \"$FASE_INPUT_ROOT/tc/.\" \"$tc/\"\ncp -a \"$FASE_INPUT_ROOT/fortran-tc/.\" \"$ft/\"\ncp -a \"$FASE_INPUT_ROOT/openblas/.\"\
    \ \"$ob/\"\ncp -a \"$FASE_INPUT_ROOT/numpy-runtime/.\" \"$nr/\"\nfor part in python-runtime python-stdlib python-dev\
    \ python-deps; do\n  cp -a \"$FASE_INPUT_ROOT/$part/.\" \"$py/\"\ndone\n\n# zstd unpacks the input archives;\
    \ patchelf is meson-python's RPATH\n# rewriter, which it looks for only when the project installs a shared\n\
    # library of its own -- and it looks for it after the build, when writing\n# the wheel. See the numpy stage\
    \ for the full note, including why these are\n# five attempts rather than one: this is the only network access\
    \ any of\n# these stages has, and it is not reliable.\nmissing=()\nfor t in zstd patchelf; do\n  command -v\
    \ \"$t\" >/dev/null 2>&1 || missing+=(\"$t\")\ndone\nif test \"${#missing[@]}\" -gt 0; then\n  echo \"installing:\
    \ ${missing[*]}\"\n  installed=0\n  for attempt in 1 2 3 4 5; do\n    apt-get update -qq >/dev/null 2>&1 ||\
    \ true\n    if apt-get install -y -qq --no-install-recommends \"${missing[@]}\" >/dev/null 2>&1; then\n    \
    \  installed=1\n      break\n    fi\n    echo \"apt attempt $attempt did not complete, retrying in $((attempt\
    \ * 15))s\" >&2\n    sleep $((attempt * 15))\n  done\n  test \"$installed\" = 1\nfi\ncommand -v zstd\ncommand\
    \ -v patchelf\n\n# --- the inputs, asserted before any of them is used -------------------\n#\n# Same rule as\
    \ the numpy stage: a plan selects artifacts by label and a\n# build compiles files, so every label this stage\
    \ depends on is checked\n# against the bytes that arrived.\npypy=\"$py/usr/bin/python3.13\"\ntest -x \"$pypy\"\
    \ntest -s \"$py/usr/include/python3.13/Python.h\"\ntest -s \"$py/usr/lib/libpython3.13.a\"\n# The deps tree,\
    \ and the one file that says whether it arrived: `zlib` is the\n# first standard library module anything here\
    \ uses -- pip cannot even read\n# its own wheel without it -- so an interpreter with no libz.so.1 is an\n# interpreter\
    \ that runs `-V` and nothing else.\ntest -s \"$py/usr/lib/libz.so.1\"\ntest -x \"$tc/bin/clang\"\ntest -x \"\
    $tc/bin/clang++\"\ntest -x \"$ft/bin/x86_64-linux-musl-gfortran\"\ntest -s \"$ob/usr/include/cblas.h\"\ntest\
    \ -s \"$ob/usr/lib/libopenblas.so.0\"\ntest -s \"$ob/usr/lib/pkgconfig/openblas.pc\"\n# Upstream's .pc spells\
    \ the library with three make variables it leaves\n# empty, so what the file means is only visible after pkg-config\
    \ substitutes\n# into it -- and meson is about to ask exactly that question, with the same\n# static-link name\
    \ this returns. A stage that grepped the `Libs:` line for a\n# literal `-lopenblas` would fail against a good\
    \ file; asking pkg-config is\n# both the correct check and the one that matches the consumer.\ncommand -v pkg-config\n\
    # Normalized, because pkg-config's bytes are not portable between\n# implementations: the pkgconf in this image\
    \ (1.8.1) pads `--libs-only-l`\n# with a trailing space, so comparing against `-lopenblas` directly fails on\n\
    # a file that says exactly that. `awk '{$1=$1}1'` re-splits the line on\n# whitespace and prints it back single-spaced.\n\
    pc_field() {\n  PKG_CONFIG_LIBDIR=\"$ob/usr/lib/pkgconfig\" pkg-config \"$@\" | awk '{$1=$1}1'\n}\ntest \"$(pc_field\
    \ --libs-only-l openblas)\" = -lopenblas\ntest \"$(pc_field --modversion openblas)\" = 0.3.34\n# The interface\
    \ version the four files carry is LAPACK's, which is what a\n# consumer's dependency check reads, and it is\
    \ the reason those files exist\n# at all. scipy's own meson build asks pkg-config for `lapack`.\ngrep -qx 'version=3.12.0'\
    \ \"$ob/usr/lib/pkgconfig/lapack.pc\"\ngrep -qx 'version=3.12.0' \"$ob/usr/lib/pkgconfig/blas.pc\"\ntest \"\
    $(pc_field --modversion lapack)\" = 3.12.0\ntest -s \"$FASE_INPUT_ROOT/numpy.whl\"\n# The five shared objects\
    \ the image will have: this stage's extensions must\n# link nothing outside them, and this is the list the check\
    \ at the end reads.\nfor lib in libopenblas.so.0 libgfortran.so.5 libquadmath.so.0 libgcc_s.so.1 libstdc++.so.6;\
    \ do\n  test -s \"$nr/usr/lib/$lib\"\ndone\nls \"$nr/usr/lib\"\n\n# --- the loader, and every directory the\
    \ run needs ---------------------\n#\n# Before the four binaries asserted at the end of the block above, and\n\
    # before every one of them: a musl binary whose ELF interpreter field names\n# a loader that is not at that\
    \ path does not run at all, and the message it\n# prints -- `/opt/py/usr/bin/python3.13: cannot execute: required\
    \ file not\n# found` -- names neither musl nor the loader. The numpy stage found this\n# by running it; this\
    \ stage was written with the same order and never got\n# that far.\nmkdir -p /lib\nln -sf \"$sys/lib/ld-musl-x86_64.so.1\"\
    \ /lib/ld-musl-x86_64.so.1\nexport PATH=\"$py/usr/bin:$tc/bin:$PATH\"\nrt=$(find \"$ob\" \"$ft\" \"$tc\" \\\n\
    \       \\( -name 'libopenblas.so.0' -o -name 'libgfortran.so.5' \\\n          -o -name 'libquadmath.so.0' -o\
    \ -name 'libgcc_s.so.1' \\\n          -o -name 'libstdc++.so.6' \\) -printf '%h\\n' | sort -u | paste -sd:)\n\
    test -n \"$rt\"\nprintf '%s\\n' \"$py/usr/lib:$sys/usr/lib:$sys/lib64:$sys/lib:$rt:/lib:/usr/lib\" > /etc/ld-musl-x86_64.path\n\
