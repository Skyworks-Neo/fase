    \ these.\n\"$pypy\" > \"$vf/config.txt\" <<'PY'\nimport json\nimport numpy as np\nimport scipy\nprint(\"scipy\"\
    , scipy.__version__, scipy.__file__)\nprint(\"numpy\", np.__version__, np.__file__)\ncfg = scipy.show_config(mode=\"\
