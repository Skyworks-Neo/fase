    \    return PyModule_Create(&module);\n}\nC\ninc=$(\"$pypy\" -c 'import numpy; print(numpy.get_include())')\n\
    ext=$(\"$pypy\" -c 'import sysconfig; print(sysconfig.get_config_var(\"EXT_SUFFIX\"))')\n\"$tc/bin/clang\" -O2\
    \ -fPIC -shared \\\n  -I\"$py/usr/include/python3.13\" -I\"$inc\" \\\n  \"$vf/fasesp.c\" -o \"$vf/fasesp$ext\"\
    \n\"$pypy\" -c '\nimport sys\nsys.path.insert(0, sys.argv[1])\nimport fasesp\nprint(\"extension\", f\"{float(fasesp.trace_det()):.1f}\"\
    )\n' \"$vf\" | tee \"$vf/extension.txt\"\ngrep -qx 'extension -2.0' \"$vf/extension.txt\"\n\n# --- what the\
    \ artifact says about itself -------------------------------\n#\n# Each value is computed into a variable before\
    \ the block that prints it.\n# The compact form -- `printf 'k\\t%s\\n' \"$(cmd)\"` -- is not equivalent and\n\
    # is a trap: printf's status is its own, so a command substitution that\n# fails writes an empty field and the\
    \ step exits 0. These fields are the\n# published record of what this artifact is, so a field that could not\
    \ be\n# computed has to fail the step rather than become a blank line in it.\nmkdir -p \"$FASE_OUTPUT_ROOT\"\
    \ncp \"$wheel\" \"$FASE_OUTPUT_ROOT/scipy-1.18.1-cp313-cp313-musllinux_1_2_x86_64.whl\"\nstage=$(\"$pypy\" -c\
    \ 'import sysconfig; print(sysconfig.get_platform())')\ninterpreter=$(\"$pypy\" -V 2>&1)\ncompiler=$(\"$tc/bin/clang\"\
    \ --version | head -1)\nfortran_compiler=$(\"$FC\" --version | head -1)\nblas_pc_version=$(sed -n 's/^version=//p'\
    \ \"$ob/usr/lib/pkgconfig/openblas.pc\" | head -1)\nlapack_pc_version=$(sed -n 's/^version=//p' \"$ob/usr/lib/pkgconfig/lapack.pc\"\
    \ | head -1)\nnumpy_version=$(\"$pypy\" -c 'import numpy; print(numpy.__version__)')\nextensions=$(find \"$site/scipy\"\
    \ -name '*.so' | wc -l)\n# How much Fortran there is to build, and where. Both numbers are facts\n# about the\
    \ sdist rather than about this build; the proof that gfortran ran\n# is `libgfortran.so.5` in the `needed` field\
    \ below.\nfortran_in_sdist=$(find \"$srcdir\" \\( -name '*.f' -o -name '*.f90' \\) | wc -l)\nfortran_odrpack=$(find\
    \ \"$srcdir/scipy/odr/odrpack\" -name '*.f' | wc -l)\npythran_log_lines=$(grep -ci pythran \"$build/workspace/build.log\"\
    \ || true)\nneeded=$(paste -sd, \"$vf/needed.txt\")\nruntime=$(ls \"$nr/usr/lib\" | paste -sd, -)\nfor v in\
    \ stage interpreter compiler fortran_compiler blas_pc_version \\\n         lapack_pc_version numpy_version needed\
    \ runtime; do\n  : \"${!v:?$v came out empty}\"\ndone\ntest \"$stage\" = musllinux_1_2_x86_64\n{\n  printf 'name\\\
    tscipy\\n'\n  printf 'version\\t1.18.1\\n'\n  printf 'python\\tcp313\\n'\n  printf 'platform\\t%s\\n' \"$stage\"\
    \n  printf 'wheel\\t%s\\n' \"$(basename \"$wheel\")\"\n  printf 'wheel_bytes\\t%s\\n' \"$(stat -c %s \"$wheel\"\
    )\"\n  printf 'interpreter\\t%s\\n' \"$interpreter\"\n  printf 'compiler\\t%s\\n' \"$compiler\"\n  printf 'fortran\\\
    t%s\\n' \"$fortran_compiler\"\n  printf 'blas\\t%s\\n' \"$blas_pc_version\"\n  printf 'lapack\\t%s\\n' \"$lapack_pc_version\"\
    \n  printf 'numpy\\t%s\\n' \"$numpy_version\"\n  printf 'extensions\\t%s\\n' \"$extensions\"\n  printf 'fortran_in_sdist\\\
    t%s\\n' \"$fortran_in_sdist\"\n  printf 'fortran_odrpack\\t%s\\n' \"$fortran_odrpack\"\n  printf 'pythran_log_lines\\\
    t%s\\n' \"$pythran_log_lines\"\n  printf 'needed\\t%s\\n' \"$needed\"\n  printf 'runtime\\t%s\\n' \"$runtime\"\
    \n  printf 'jobs\\t%s\\n' \"$FASE_VAR_JOBS\"\n} > \"$FASE_OUTPUT_ROOT/scipy-build-info.txt\"\ncat \"$FASE_OUTPUT_ROOT/scipy-build-info.txt\"\
    \ndu -sh \"$site\" \"$wheel\"\n"
  workspace:
    taskSizeLimit: 300Gi
    inputSizeLimit: 32Gi
    outputSizeLimit: 32Gi
    transferSizeLimit: 32Gi
  nodeSelector:
    kubernetes.io/hostname: node1
---
