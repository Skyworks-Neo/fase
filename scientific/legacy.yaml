    \ the\n# interpreter and the libraries it loads, which is what an ldd on a musl system\n# is. The shim does\
    \ nothing else and is only on the path of this run.\nmkdir -p \"$build/bin\"\nprintf '#!/bin/sh\\nexec %s --list\
    \ \"$@\"\\n' \\\n  \"$sys/lib/ld-musl-x86_64.so.1\" > \"$build/bin/ldd\"\nchmod 0755 \"$build/bin/ldd\"\nexport\
    \ PATH=\"$build/bin:$PATH\"\n\n# Both, and neither is enough on its own: `set +e` is what stops the shell\n\
