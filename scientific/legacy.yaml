apiVersion: skyw.top/v1beta1
kind: Task
metadata:
  name: packtar-tool
  labels:
    capability: packtar-tool
spec:
  image: gcc:16.2.0-trixie
  imagePullSecrets:
  - name: fase-ghcr-pull
  - name: fase-registry-pull
  command:
  - /bin/bash
  securityContext:
    runAsUser: 0
    runAsNonRoot: false
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
      ephemeral-storage: 256Mi
    limits:
      cpu: '1'
      memory: 512Mi
      ephemeral-storage: 2Gi
  outputs:
    artifacts:
    - name: tool
      path: packtar.py
      kind: file
  script: "set -euo pipefail\n\ncat > \"$FASE_OUTPUT_ROOT/packtar.py\" <<'PY'\n#!/usr/bin/env python3\n\"\"\"Deterministic\
    \ tar.zst packer for fase `archive` ports.\n\nusage: packtar.py OUT.tar.zst ROOT [MEMBER ...]\n\nEmits regular-file\
    \ and directory entries only, with names free of any\ntrailing slash or '.' component, ownership normalised\
    \ to root, modes\nreduced to 0755/0644 and timestamps zeroed. Symlinks and hard links are\nmaterialised, because\
    \ fase's archive format has no representation for\nthem and its extractor accepts nothing else. Directory symlinks\
    \ are\nfollowed and their subtree emitted in place; cycles are refused.\n\nMEMBERs are the top-level entries\
    \ of ROOT to include; the default is all\nof them.\n\"\"\"\nimport os\nimport stat as stat_mod\nimport subprocess\n\
    import sys\nimport tarfile\n\n# ustar, not gnu or pax: the two latter formats encode long names as extra\n#\
    \ archive entries of type 'L'/'x', and fase's validator accepts only\n# regular-file and directory entries.\
    \ ustar instead splits a long name\n# across its 155-byte prefix and 100-byte name fields, which the Rust tar\n\
    # reader understands. A path that will not fit in 255 bytes is a hard\n# error rather than a silently malformed\
    \ archive.\nFORMAT = tarfile.USTAR_FORMAT\n\n\ndef collect(root, members):\n    \"\"\"Return sorted (arcname,\
    \ abspath, is_dir) triples for the tree.\"\"\"\n    found = []\n    # Guard against symlink cycles: a directory\
    \ may be visited once.\n    seen = set()\n\n    def walk(abs_dir, rel_dir):\n        with os.scandir(abs_dir)\
    \ as it:\n            children = sorted(it, key=lambda entry: entry.name)\n        for child in children:\n\
    \            rel = child.name if not rel_dir else rel_dir + \"/\" + child.name\n            try:\n         \
    \       st = child.stat()\n            except OSError as exc:\n                raise SystemExit(\"cannot stat\
    \ %s: %s\" % (child.path, exc))\n            if stat_mod.S_ISDIR(st.st_mode):\n                key = (st.st_dev,\
    \ st.st_ino)\n                if key in seen:\n                    raise SystemExit(\n                     \
    \   \"directory symlink cycle at %s\" % child.path\n                    )\n                seen.add(key)\n \
    \               found.append((rel, child.path, True))\n                walk(child.path, rel)\n            elif\
    \ stat_mod.S_ISREG(st.st_mode):\n                found.append((rel, child.path, False))\n            else:\n\
    \                raise SystemExit(\"unsupported file type at %s\" % child.path)\n\n    for member in members:\n\
    \        abs_path = os.path.join(root, member)\n        try:\n            st = os.stat(abs_path)\n        except\
    \ OSError as exc:\n            raise SystemExit(\"cannot stat %s: %s\" % (abs_path, exc))\n        if stat_mod.S_ISDIR(st.st_mode):\n\
    \            seen.add((st.st_dev, st.st_ino))\n            found.append((member, abs_path, True))\n        \
    \    walk(abs_path, member)\n        elif stat_mod.S_ISREG(st.st_mode):\n            found.append((member, abs_path,\
    \ False))\n        else:\n            raise SystemExit(\"unsupported member %s\" % member)\n\n    return sorted(found,\
    \ key=lambda item: item[0])\n\n\ndef build(root, members, plain_tar):\n    count = 0\n    with tarfile.open(plain_tar,\
    \ \"w\", format=FORMAT) as tf:\n        for arcname, abspath, is_dir in collect(root, members):\n          \
    \  st = os.stat(abspath)\n            info = tarfile.TarInfo(arcname)\n            info.uid = 0\n          \
    \  info.gid = 0\n            info.uname = \"\"\n            info.gname = \"\"\n            info.mtime = 0\n\
    \            if is_dir:\n                info.type = tarfile.DIRTYPE\n                info.mode = 0o755\n  \
    \              info.size = 0\n                tf.addfile(info)\n            else:\n                info.type\
    \ = tarfile.REGTYPE\n                info.mode = 0o755 if st.st_mode & 0o111 else 0o644\n                info.size\
    \ = st.st_size\n                with open(abspath, \"rb\") as fh:\n                    tf.addfile(info, fh)\n\
    \            count += 1\n    return count\n\n\ndef strip_directory_slashes(plain_tar):\n    \"\"\"Remove the\
    \ trailing '/' from directory entry names, in place.\n\n    CPython's TarInfo.tobuf() appends one to every DIRTYPE\
    \ name and there\n    is no way to switch that off. fase's valid_path rejects it, so the\n    header is rewritten:\
    \ drop the byte, refresh the octal checksum (which\n    covers the whole header with the checksum field read\
    \ as spaces).\n    \"\"\"\n    patched_count = 0\n    with open(plain_tar, \"r+b\") as fh:\n        while True:\n\
    \            header = fh.read(512)\n            if len(header) < 512 or header == b\"\\0\" * 512:\n        \
    \        return patched_count\n            size_field = header[124:136].split(b\"\\0\")[0].strip()\n       \
    \     size = int(size_field or b\"0\", 8)\n            if header[156:157] == b\"5\":\n                # Name\
    \ lives at 0..100, the ustar prefix at 345..500.\n                for lo, hi in ((0, 100), (345, 500)):\n  \
    \                  field = header[lo:hi].split(b\"\\0\")[0]\n                    if not field.endswith(b\"/\"\
    ):\n                        continue\n                    stripped = field[:-1]\n                    header\
    \ = (\n                        header[:lo]\n                        + stripped\n                        + b\"\
    \\0\" * (hi - lo - len(stripped))\n                        + header[hi:]\n                    )\n          \
    \      header = header[:148] + b\" \" * 8 + header[156:]\n                checksum = sum(header)\n         \
    \       header = header[:148] + (b\"%06o\\0 \" % checksum) + header[156:]\n                fh.seek(-512, 1)\n\
    \                fh.write(header)\n                patched_count += 1\n            fh.seek(((size + 511) //\
    \ 512) * 512, 1)\n\n\ndef main(argv):\n    if len(argv) < 3:\n        raise SystemExit(__doc__)\n    out, root\
    \ = argv[1], argv[2]\n    members = argv[3:] or sorted(os.listdir(root))\n    plain_tar = out + \".tar\"\n \
    \   try:\n        count = build(root, members, plain_tar)\n    except ValueError as exc:\n        raise SystemExit(\"\
    path too long for ustar: %s\" % exc)\n    dirs = strip_directory_slashes(plain_tar)\n    subprocess.run(\n \
    \       [\"zstd\", \"-q\", \"-3\", \"-T0\", \"-f\", \"-o\", out, plain_tar],\n        check=True,\n    )\n \
    \   os.unlink(plain_tar)\n    print(\n        \"packed %d entries (%d directories) from %s\" % (count, dirs,\
    \ root)\n    )\n\n\nif __name__ == \"__main__\":\n    main(sys.argv)\nPY\n\npython3 -c \"import ast; ast.parse(open('$FASE_OUTPUT_ROOT/packtar.py').read())\"\
    \nchmod 0755 \"$FASE_OUTPUT_ROOT/packtar.py\"\n# No arguments: prints the usage line and exits non-zero on purpose.\n\
    python3 \"$FASE_OUTPUT_ROOT/packtar.py\" 2>&1 | head -1 || true\nwc -l \"$FASE_OUTPUT_ROOT/packtar.py\"\n"
---
