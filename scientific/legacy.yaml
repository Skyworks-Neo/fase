apiVersion: skyw.top/v1beta1
kind: Task
metadata:
  name: binutils-cross
  labels:
    capability: binutils-cross
spec:
  image: gcc:16.2.0-trixie
  imagePullSecrets:
  - name: fase-ghcr-pull
  - name: fase-registry-pull
  command:
  - /bin/bash
  securityContext:
    runAsUser: 0
    runAsNonRoot: false
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: '32'
      memory: 64Gi
      ephemeral-storage: 200Gi
    limits:
      cpu: '32'
      memory: 64Gi
      ephemeral-storage: 300Gi
  inputs:
    variables:
    - name: jobs
      env: FASE_VAR_JOBS
      required: true
    artifacts:
    - name: tc
      path: tc.tar.zst
      kind: file
    - name: source
      path: tarball
      kind: file
    - name: packtar
      path: packtar.py
      kind: file
  outputs:
    artifacts:
    - name: tc
      path: tc
      kind: file
  script: "set -eu\nif ! command -v zstd >/dev/null 2>&1; then\n  apt-get update -qq >/dev/null\n  apt-get install\
    \ -y -qq --no-install-recommends zstd >/dev/null\nfi\nmkdir -p /workspace/inputs\nmkdir -p \"/workspace/inputs/tc\"\
    \nzstd -dc \"/in/tc.tar.zst\" | tar -xf - -C \"/workspace/inputs/tc\"\nln -s \"/in/tarball\" \"/workspace/inputs/tarball\"\
    \nln -s \"/in/packtar.py\" \"/workspace/inputs/packtar.py\"\nexport FASE_INPUT_ROOT=/workspace/inputs\nset -euo\
    \ pipefail\n\ntc=/opt/tc\nsysroot=\"$tc/x86_64-linux-musl\"\nbuild=/workspace/build\n\nrm -rf \"$tc\" \"$build\"\
    \nmkdir -p \"$tc\" \"$build\"\ncp -a \"$FASE_INPUT_ROOT/tc/.\" \"$tc/\"\n\ncommand -v zstd >/dev/null 2>&1 ||\
    \ {\n  export DEBIAN_FRONTEND=noninteractive\n  apt-get update -qq >/dev/null\n  apt-get install -y -qq --no-install-recommends\
    \ zstd >/dev/null\n}\n\n# The musl sysroot has to be there before binutils links anything with it.\ntest -f\
    \ \"$sysroot/usr/lib/libc.a\"\ntest -x \"$sysroot/lib/ld-musl-x86_64.so.1\"\n\ntar -xf \"$FASE_INPUT_ROOT/tarball\"\
    \ -C \"$build\"\nsrc=$(find \"$build\" -maxdepth 1 -type d -name 'binutils-*')\ntest -n \"$src\"\nmkdir -p \"\
    $build/obj-binutils\"\ncd \"$build/obj-binutils\"\n\n\"$src/configure\" \\\n  --target=x86_64-linux-musl \\\n\
    \  --prefix=\"$tc\" \\\n  --with-sysroot=\"$sysroot\" \\\n  --disable-nls \\\n  --disable-werror \\\n  --disable-gdb\
    \ \\\n  --disable-gprofng \\\n  --disable-sim \\\n  --disable-libdecnumber \\\n  --disable-readline \\\n  --enable-deterministic-archives\
    \ \\\n  --enable-new-dtags\n\n# No makeinfo/install-info in the Debian image; docs are not wanted anyway.\n\
    make -j\"$FASE_VAR_JOBS\" MAKEINFO=true\nmake install MAKEINFO=true INSTALL_INFO=true\n\n# --- verification\
    \ ------------------------------------------------------\nfor tool in as ld ar ranlib nm objdump readelf strip\
    \ objcopy; do\n  test -x \"$tc/bin/x86_64-linux-musl-$tool\" || { echo \"missing $tool\" >&2; exit 1; }\ndone\n\
    \"$tc/bin/x86_64-linux-musl-ld\" --version | head -1\n\n# Assemble and link a freestanding object, with no libc\
    \ involved at all:\n# proves the assembler and linker work against the musl sysroot.\ncat > \"$build/start.S\"\
    \ <<'ASM'\n.globl _start\n.text\n_start:\n    movl $1, %eax\n    movl $7, %ebx\n    int  $0x80\nASM\n\"$tc/bin/x86_64-linux-musl-as\"\
    \ -o \"$build/start.o\" \"$build/start.S\"\n\"$tc/bin/x86_64-linux-musl-ld\" -o \"$build/start\" \"$build/start.o\"\
    \n# The binary exits 7; capture the code before `set -e` can act on it.\nset +e\n\"$build/start\"\nrc=$?\nset\
    \ -e\ntest \"$rc\" -eq 7 || { echo \"freestanding link ran with status $rc\" >&2; exit 1; }\n\n{\n  printf 'ld_version\\\
    t%s\\n' \"$(\"$tc/bin/x86_64-linux-musl-ld\" --version | head -1)\"\n  printf 'as_version\\t%s\\n' \"$(\"$tc/bin/x86_64-linux-musl-as\"\
    \ --version | head -1)\"\n  printf 'jobs\\t%s\\n' \"$FASE_VAR_JOBS\"\n} > \"$tc/BUILD-INFO-binutils.txt\"\n\n\
    # Packing dereferences every symlink, so a link that leaves the prefix\n# would silently embed host files. Refuse\
    \ instead.\nif find \"$tc\" -type l -printf '%p -> %l\\n' | grep -q ' -> /'; then\n  echo \"absolute symlink\
    \ left inside the prefix:\" >&2\n  find \"$tc\" -type l -printf '%p -> %l\\n' | grep ' -> /' >&2\n  exit 1\n\
    fi\nif test -n \"$(find \"$tc\" -xtype l)\"; then\n  echo \"dangling symlink left inside the prefix:\" >&2\n\
    \  find \"$tc\" -xtype l >&2\n  exit 1\nfi\n\n# Publish the cumulative prefix through the shared packer, which\
    \ emits the\n# entry shapes fase's archive validator accepts.\nmkdir -p \"$FASE_OUTPUT_ROOT\"\npython3 \"$FASE_INPUT_ROOT/packtar.py\"\
    \ \"$FASE_OUTPUT_ROOT/tc\" \"$tc\"\nzstd -q -t \"$FASE_OUTPUT_ROOT/tc\"\nzstd -dc \"$FASE_OUTPUT_ROOT/tc\" |\
    \ python3 -c \"\nimport sys, tarfile\ntf = tarfile.open(fileobj=sys.stdin.buffer, mode='r|')\nprint('entries',\
    \ sum(1 for _ in tf))\n\"\ndu -sh \"$tc\" \"$FASE_OUTPUT_ROOT/tc\"\n"
  workspace:
    taskSizeLimit: 300Gi
    inputSizeLimit: 32Gi
    outputSizeLimit: 32Gi
    transferSizeLimit: 32Gi
  nodeSelector:
    kubernetes.io/hostname: node1
