    \ onfail and exiting there instead. The suite's own\n# exit status is not the verdict -- the list of what failed\
    \ is, below -- so it\n# is recorded and not checked.\nset +e\ntrap - ERR\n# shellcheck disable=SC2086\npy_out\
    \ -m test -j \"$test_jobs\" --timeout 600 --tempdir \"$build/test-tmp\" \\\n  --junit-xml \"$logs/tests.xml\"\
    \ -q $tests > \"$logs/tests.log\" 2>&1\ntests_rc=$?\ntrap onfail ERR\nset -e\ntail -25 \"$logs/tests.log\"\n\
    \n# ---------------------------------------------------------------------------\n# what the suite may fail on,\
    \ and what it may not\n#\n# musl is not glibc, and a handful of the standard library's tests assert\n# glibc's\
    \ behaviour rather than the language's: a loader that answers to\n# `libc.so.<anything>`, collation in a locale,\
    \ pathconf on a bad descriptor.\n# Every distribution that ships CPython on musl carries a list like this one\
    \ --\n# Alpine patches the tests out, Debian carries failing tests per architecture --\n# and the alternative,\
    \ not running those files at all, would hide the other\n# hundred and sixty tests that are in them.\n#\n# The\
    \ reasons are written down rather than the exceptions being swallowed,\n# because the list is checked in both\
    \ directions: a failure that is not on it\n# fails this step, and a listed failure that *passes* fails it too.\
    \ An excuse\n# that has quietly stopped being true is how a regression gets through.\n# ---------------------------------------------------------------------------\n\
    current=tests-expected\npython3 - \"$logs/tests.xml\" <<'PY' 2>&1 | tee \"$logs/tests-expected.log\"\nimport\
    \ sys\nimport xml.etree.ElementTree as ET\n\nKNOWN = {\n    # musl's loader, its C library and its libm are\
    \ one object, and it answers\n    # to any version of those sonames -- libc.so.9 loads, and so does\n    # libm.so.99,\
    \ while libssl.so.99 does not. The test uses `libc.so.9` to mean\n    # \"a library that cannot exist\", which\
    \ is true on glibc and false here.\n    \"test.test_ctypes.test_loading.LoaderTest.test_load_version\":\n  \
    \      \"musl answers to libc.so.<anything>: loader and C library are one file\",\n\n    # A GNU indirect function\
    \ whose resolver returns NULL. musl's dlsym treats\n    # the NULL resolution as \"symbol not found\" and sets\
    \ that message; glibc\n    # returns NULL with dlerror() clear, and CPython then substitutes its own\n    #\
    \ text, which is what the test asserts. (Reproduced outside the suite: a\n    # five line ifunc library loaded\
    \ from this interpreter says\n    # \"Symbol not found: foo\".)\n    \"test.test_ctypes.test_dlerror.TestNullDlsym.test_null_dlsym\"\
    :\n        \"musl calls a NULL-resolving ifunc 'not found'; glibc leaves no dlerror\",\n\n    # musl has no\
    \ LC_COLLATE at all: strcoll and strxfrm order by code point in\n    # every locale, so 'a-grave' sorts after\
    \ 'b' rather than with 'a'.\n    \"test.test_locale.TestEnUSCollation.test_strcoll_with_diacritic\":\n     \
    \   \"musl has no collation tables; strcoll is code point order\",\n    \"test.test_locale.TestEnUSCollation.test_strxfrm_with_diacritic\"\
    :\n        \"musl has no collation tables; strxfrm is code point order\",\n\n    # re.L|re.I asks the C library\
    \ to case fold bytes in the current locale's\n    # charset. musl's LC_CTYPE maps do not fold 0xc5 to 0xe5 in\
    \ an ISO-8859-1\n    # locale where glibc's do, so the pattern does not match.\n    \"test.test_re.ReTests.test_locale_caching\"\
    :\n        \"musl's LC_CTYPE does not case fold bytes the way glibc's does\",\n    \"test.test_re.ReTests.test_locale_compiled\"\
    :\n        \"musl's LC_CTYPE does not case fold bytes the way glibc's does\",\n\n    # fpathconf(2) on a descriptor\
    \ that is not one: musl returns its default\n    # value instead of failing with EBADF, which is what CPython\
    \ turns into the\n    # OSError the test expects.\n    \"test.test_os.TestInvalidFD.test_fpathconf\":\n    \
    \    \"musl's fpathconf does not fail with EBADF on a bad descriptor\",\n}\n\nran = failed = 0\nseen = {}\n\
    for case in ET.parse(sys.argv[1]).getroot().iter(\"testcase\"):\n    ran += 1\n    marks = [c for c in case\
    \ if c.tag in (\"failure\", \"error\")]\n    if marks:\n        failed += 1\n        message = (marks[0].get(\"\
    message\") or \"\").strip().splitlines()\n        seen[case.get(\"name\")] = (marks[0].tag, message[0] if message\
    \ else \"\")\n\nexpected = sorted(n for n in seen if n in KNOWN)\nunexpected = sorted(n for n in seen if n not\
    \ in KNOWN)\nstale = sorted(n for n in KNOWN if n not in seen)\n\nprint(\"tests run            %d\" % ran)\n\
    print(\"tests failed         %d\" % failed)\nprint(\"on the known list    %d\" % len(KNOWN))\nprint(\"failed\
    \ as expected   %d\" % len(expected))\nprint(\"unexpected failures  %d\" % len(unexpected))\nprint()\nprint(\"\
    --- failed, and expected to be ---\")\nfor name in expected:\n    print(\"  %s\" % name)\n    print(\"     \
    \ %s\" % KNOWN[name])\nprint()\nfor name in unexpected:\n    print(\"UNEXPECTED %s\" % name)\n    print(\" \
    \     %s: %s\" % seen[name])\nfor name in stale:\n    print(\"STALE      %s\" % name)\n    print(\"      does\
    \ not fail here; the list says: %s\" % KNOWN[name])\n\n# A suite that ran nothing would have no unexpected failures\
    \ either, which is\n# the one way this check could pass while proving nothing.\nif ran < 15000:\n    print()\n\
    \    print(\"the suite ran %d tests; that is not the curated list\" % ran)\n    sys.exit(1)\nsys.exit(1 if (unexpected\
    \ or stale) else 0)\nPY\n\n# ---------------------------------------------------------------------------\n#\
    \ the report\n# ---------------------------------------------------------------------------\ncurrent=report\n\
    {\n  printf 'python3.13 verification\\n'\n  printf 'version\\t%s\\n' \"$(chroot \"$root\" /usr/bin/python3.13\
    \ -c 'import platform; print(platform.python_version())')\"\n  printf 'toolchain\\t%s\\n' \"$(clang --version\
    \ | head -1)\"\n  printf 'tree-bytes\\t%s\\n' \"$(du -sb \"$root\" | cut -f1)\"\n  printf 'tree-files\\t%s\\\
    n' \"$(find \"$root\" -type f | wc -l)\"\n  printf '\\n--- parts ---\\n'\n  for part in deps python-runtime\
    \ python-stdlib python-dev; do\n    printf '%-16s %10s bytes  %5s files\\n' \"$part\" \\\n      \"$(du -sb \"\
    $src/$part\" 2>/dev/null | cut -f1)\" \\\n      \"$(find \"$src/$part\" -type f 2>/dev/null | wc -l)\"\n  done\n\
    \  printf '\\n--- static ---\\n'\n  cat \"$logs/static.log\"\n  printf '\\n--- census ---\\n'\n  grep -E '^(stdlib\
    \ names|imported|expected missing|unexpected missing|expected but absent)' \\\n    \"$logs/census.log\"\n  printf\
    \ '\\n--- dependency modules ---\\n'\n  cat \"$logs/deps-modules.log\"\n  printf '\\n--- probes ---\\n'\n  cat\
    \ \"$logs/probe.log\"\n  printf '\\n--- extension ---\\n'\n  cat \"$logs/extension-import.log\"\n  printf '\\\
    n--- embedding ---\\n'\n  cat \"$logs/embed-run.log\"\n  printf '\\n--- test suite ---\\n'\n  tail -6 \"$logs/tests.log\"\
    \n  printf '\\n--- the suite against the list of what musl may fail ---\\n'\n  cat \"$logs/tests-expected.log\"\
    \n} > \"$report\"\ncat \"$report\"\n"
  workspace:
    taskSizeLimit: 300Gi
    inputSizeLimit: 32Gi
    outputSizeLimit: 32Gi
    transferSizeLimit: 32Gi
  nodeSelector:
    kubernetes.io/hostname: node1
---
apiVersion: skyw.top/v1beta1
kind: Recipe
metadata:
  name: python-verify
spec:
  inputs:
    artifacts:
    - name: tc
      artifactSelector:
        matchLabels:
          name: clang-musl-tc
          rev: l3
    - name: deps
      artifactSelector:
        matchLabels:
          name: python-deps
          recipe: python-deps-v1
    - name: runtime
      artifactSelector:
        matchLabels:
          name: python-runtime
          version: 3.13.15
    - name: stdlib
      artifactSelector:
        matchLabels:
          name: python-stdlib
          version: 3.13.15
    - name: dev
      artifactSelector:
        matchLabels:
          name: python-dev
          version: 3.13.15
  outputs:
    artifacts:
    - name: python-verify-report
      from:
        task: verify
        artifact: report
      labels:
        name:
          value: python-verify-report
        version:
          fromInput:
            input: runtime
            label: version
        recipe:
          value: python-verify-v1
        libc:
          value: musl
        arch:
          value: amd64
        kind:
          value: report
  tasks:
  - name: verify
    variables:
      jobs:
        value: '16'
    inputs:
      artifacts:
      - name: tc
        from:
          recipeInput: tc
      - name: deps
        from:
          recipeInput: deps
      - name: runtime
        from:
          recipeInput: runtime
      - name: stdlib
        from:
          recipeInput: stdlib
      - name: dev
        from:
          recipeInput: dev
    outputs:
    - name: report
    taskSelector:
      matchLabels:
        capability: python-verify
---
apiVersion: skyw.top/v1beta1
kind: Task
metadata:
  name: openblas
  labels:
    capability: openblas
spec:
  image: gcc:16.2.0-trixie
  imagePullSecrets:
  - name: fase-ghcr-pull
  - name: fase-registry-pull
  command:
  - /bin/bash
  securityContext:
    runAsUser: 0
    runAsNonRoot: false
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: '32'
      memory: 64Gi
      ephemeral-storage: 200Gi
    limits:
      cpu: '32'
      memory: 64Gi
      ephemeral-storage: 300Gi
  env:
  - name: DEBIAN_FRONTEND
    value: noninteractive
  inputs:
    variables:
    - name: jobs
      env: FASE_VAR_JOBS
      required: true
    artifacts:
    - name: tc
      path: tc.tar.zst
      kind: file
    - name: source
      path: tarball
      kind: file
    - name: packtar
      path: packtar.py
      kind: file
  outputs:
    artifacts:
    - name: openblas
      path: openblas
      kind: file
  script: "set -eu\nif ! command -v zstd >/dev/null 2>&1; then\n  apt-get update -qq >/dev/null\n  apt-get install\
    \ -y -qq --no-install-recommends zstd >/dev/null\nfi\nmkdir -p /workspace/inputs\nmkdir -p \"/workspace/inputs/tc\"\
    \nzstd -dc \"/in/tc.tar.zst\" | tar -xf - -C \"/workspace/inputs/tc\"\nln -s \"/in/tarball\" \"/workspace/inputs/tarball\"\
    \nln -s \"/in/packtar.py\" \"/workspace/inputs/packtar.py\"\nexport FASE_INPUT_ROOT=/workspace/inputs\nset -Eeuo\
    \ pipefail\n\n# A failing line inside a `set -e` script dies silently, and in a stage this\n# long the interesting\
    \ part of the failure is which line it was. The trap is\n# here because a stage that failed once without saying\
    \ where costs a build.\ntrap 'code=$?; printf \"FAILED (exit %s) line %s: %s\\n\" \"$code\" \"$LINENO\" \"$BASH_COMMAND\"\
    \ >&2' ERR\n\ntc=/opt/tc\nsys=\"$tc/x86_64-linux-musl\"\nbuild=/workspace/build\nsrc=\"$build/src\"\nout=\"\
    $build/out\"\nprefix=\"$out/usr\"\n\nrm -rf \"$tc\" \"$build\"\nmkdir -p \"$tc\" \"$build\" \"$src\" \"$prefix\"\
    \ncp -a \"$FASE_INPUT_ROOT/tc/.\" \"$tc/\"\n\nif ! command -v zstd >/dev/null 2>&1; then\n  apt-get update -qq\
    \ >/dev/null\n  apt-get install -y -qq --no-install-recommends zstd >/dev/null\nfi\ncommand -v zstd\n\n# ---\
    \ the toolchain -----------------------------------------------------\ncc=\"$tc/bin/x86_64-linux-musl-gcc\"\n\
    fc=\"$tc/bin/x86_64-linux-musl-gfortran\"\ntest -x \"$cc\" && test -x \"$fc\"\ntest -x \"$tc/bin/x86_64-linux-musl-ar\"\
    \ntest -x \"$tc/bin/x86_64-linux-musl-ranlib\"\ntest -x \"$tc/bin/x86_64-linux-musl-as\"\ntest -x \"$tc/bin/x86_64-linux-musl-ld\"\
    \ntest -f \"$sys/usr/include/stdio.h\"\ntest -f \"$sys/usr/lib/libc.so\"\n\"$cc\" --version | head -1\n\"$fc\"\
    \ --version | head -1\n\n# The compiler that builds getarch -- OpenBLAS's CPU probe -- is the\n# container's\
    \ own: getarch is compiled for the host and then *run* by the\n# build, so it must be a program this container\
    \ can execute. It is resolved\n# by name here, before the toolchain goes on PATH, because after that `gcc`\n\
    # may mean a compiler for the target that cannot produce such a program; and\n# it is resolved by name rather\
    \ than by path because this image keeps its\n# gcc in /usr/local/bin, so /usr/bin/gcc is not a path that exists.\
    \ The\n# toolchain goes on PATH afterwards for the opposite reason: `as` and `ld`\n# reached through PATH are\
    \ how the driver finds the target binutils rather\n# than the container's.\nhostcc=$(command -v gcc)\ntest -x\
    \ \"$hostcc\"\n\"$hostcc\" --version | head -1\nexport PATH=\"$tc/bin:$PATH\"\ncommand -v x86_64-linux-musl-as\n\
    command -v x86_64-linux-musl-ld\n\n# The loader, and the search path the *built* programs need in order to run.\n\
    # The path file replaces musl's built-in default rather than adding to it, so\n# it has to name everything:\
    \ the sysroot's lib directory, whichever\n# directories of the toolchain hold the Fortran and C++ runtimes,\
    \ and the two\n# musl would have looked in by itself. Those directories are found rather\n# than written down,\
    \ because a prefix that moves a runtime library and a\n# search path that still names the old directory is a\
    \ failure that shows up\n# as a missing library much later.\nmkdir -p /lib\nln -sf \"$sys/usr/lib/libc.so\"\
    \ /lib/ld-musl-x86_64.so.1\nrt=$(find \"$tc\" \\\n       \\( -name 'libgfortran.so.5' -o -name 'libquadmath.so.0'\
    \ \\\n          -o -name 'libgcc_s.so.1' -o -name 'libstdc++.so.6' \\) \\\n       -printf '%h\\n' | sort -u\
    \ | paste -sd:)\ntest -n \"$rt\"\nprintf '%s\\n' \"$sys/usr/lib:$rt:/lib:/usr/lib\" > /etc/ld-musl-x86_64.path\n\
    cat /etc/ld-musl-x86_64.path\n\n# --- the source --------------------------------------------------------\n\
    tar -xf \"$FASE_INPUT_ROOT/tarball\" -C \"$src\"\nsrcdir=$(find \"$src\" -maxdepth 1 -mindepth 1 -type d -name\
    \ 'OpenBLAS-*' | head -1)\ntest -n \"$srcdir\"\ncd \"$srcdir\"\n\n# The tarball is asserted to be the one that\
    \ bundles LAPACK, because the\n# alternative is a library that passes a BLAS test and has no LAPACK in it.\n\
    # OpenBLAS can be built that way on purpose (NOFORTRAN=1, or ONLY_CBLAS=1)\n# and the result is not an error,\
    \ it is a library missing dpotrf.\ntest -d lapack-netlib/SRC\ntest -f lapack-netlib/LAPACKE/include/lapacke.h\n\
    grep -m1 'LAPACK_MINOR_VERSION' lapack-netlib/CMakeLists.txt || true\ngrep -m1 'VERSION =' Makefile.rule\n\n\
    # --- the build ---------------------------------------------------------\n#\n# OpenBLAS has no configure; its\
    \ Makefile system reads these variables, and\n# each one below is a decision rather than a default:\n#\n#  \
    \ CROSS=1          This suppresses execution of the test binaries the build\n#                    would otherwise\
    \ run. It is not what makes this a cross\n#                    build -- OpenBLAS decides that itself by comparing\
    \ the\n#                    target with the host -- it is the flag that stops the\n#                    build\
    \ from trying to execute a musl binary before the\n#                    search path above is in place. The tests\
    \ are not part of\n#                    this artifact either way; this stage runs its own.\n#\n#   TARGET=NEHALEM\
    \   The baseline every non-dispatched code path is compiled\n#                    for: SSE4.2, which every x86_64\
    \ CPU since 2008 has. Not\n#                    naming it is the mistake this variable exists to\n#        \
    \            prevent -- without it the \"generic\" code is compiled for\n#                    whatever CPU the\
    \ build pod happens to have, and the\n#                    library then faults with an illegal instruction on\
    \ an\n#                    older machine.\n#\n#   DYNAMIC_ARCH=1   One library carrying kernel sets for every\
    \ CPU from\n#                    Sandy Bridge to Sapphire Rapids, chosen at run time by\n#                 \
    \   CPUID. This is what makes the artifact portable: the pod\n#                    that builds it and the machine\
    \ that runs it do not have\n#                    to be the same one. It is also what makes this stage\n#   \
    \                 expensive -- the kernels are compiled once per\n#                    generation -- and that\
    \ cost is paid once, here, instead\n#                    of being paid by every user whose CPU is older than\
    \ the\n#                    build host's.\n#\n#   NUM_THREADS=64   The upper bound the library will use when\
    \ a program does\n#                    not set one. Debian's is 64 for the same reason: large\n#           \
    \         enough for the machines this runs on, small enough that\n#                    the internal buffer\
    \ sizing stays reasonable.\n#\n#   USE_OPENMP=0     Pthread threads. The alternative needs libgomp, which\n\
    #                    this toolchain deliberately does not build, and numpy's\n#                    threading\
    \ does not require it.\n#\n#   HOSTCC           getarch, the little program that decides the CPU\n#        \
    \            configuration, is compiled for the *host* and then run\n#                    by the build. It must\
    \ therefore be the container's own\n#                    compiler; `$hostcc` above is that compiler, resolved\n\
    #                    before the target toolchain was put on PATH.\n#\n#   AR / RANLIB      Named explicitly.\
    \ OpenBLAS derives the target binutils\n#                    prefix from the basename of $CC, and only when\
    \ that\n#                    basename contains a dash -- `x86_64-linux-musl-gcc` does,\n#                  \
    \  but the library also builds with a bare `clang`, and\n#                    relying on that inspection is\
    \ how a build silently uses\n#                    the host `ar`.\n#\n# NO_AFFINITY and NO_WARMUP are the defaults\
    \ in this release and are set here\n# for the record: a container does not own the CPUs it runs on, so pinning\n\
    # threads to cores and warming them up at startup are both wrong.\nmakeopts=(\n  CC=\"$cc\"\n  FC=\"$fc\"\n\
    \  HOSTCC=\"$hostcc\"\n  AR=\"$tc/bin/x86_64-linux-musl-ar\"\n  RANLIB=\"$tc/bin/x86_64-linux-musl-ranlib\"\n\
    \  CROSS=1\n  BINARY=64\n  DYNAMIC_ARCH=1\n  TARGET=NEHALEM\n  NUM_THREADS=64\n  USE_OPENMP=0\n  NO_AFFINITY=1\n\
    \  NO_WARMUP=1\n  PREFIX=/usr\n)\n\n# `libs shared` rather than the default `all`: all also builds the test\n\
    # programs, which this stage does not run and would only spend time on.\nmake -j\"$FASE_VAR_JOBS\" \"${makeopts[@]}\"\
    \ libs shared\n\n# The same options again, and that is not redundancy: OpenBLAS re-derives\n# the library name\
    \ from them at install time, and an install run without\n# them looks for a file the build did not produce.\n\
    #\n# PREFIX is /usr and DESTDIR is the staging tree, which is how a package is\n# built for a prefix it is not\
    \ running under. The consequence worth naming is\n# in the files: openblas.pc and the CMake package file record\
    \ /usr/lib and\n# /usr/include, not the path this stage happens to be building in, so a\n# consumer that reads\
    \ them gets the paths the library will have when the\n# image it is part of is running.\nmake \"${makeopts[@]}\"\
    \ DESTDIR=\"$out\" install\n\n# --- the published layout ----------------------------------------------\n#\n\
    # Upstream installs the library under the name it was built with\n# (`libopenblasp-r0.3.34.so`, the `p` for\
    \ pthreads and the version in the\n# name) and then two symlinks. What Debian publishes, and what a consumer\n\
    # links against, is the soname: libopenblas.so.0, with libopenblas.so for the\n# linker and libopenblas.a for\
    \ a static link. The real file is renamed to the\n# soname so that the artifact contains each of the three names\
    \ once -- an\n# archive cannot hold symlinks, so every alias left in place would be a\n# second copy of a 40MB\
    \ library.\ncd \"$prefix/lib\"\nrealso=$(find . -maxdepth 1 -type f -name 'libopenblas*-r*.so' | head -1)\n\
    reala=$(find . -maxdepth 1 -type f -name 'libopenblas*-r*.a' | head -1)\ntest -n \"$realso\" && test -n \"$reala\"\
    \nreadelf -d \"$realso\" | grep -q 'SONAME.*libopenblas\\.so\\.0'\nfind . -maxdepth 1 -type l -name 'libopenblas*'\
    \ -delete\nmv \"$realso\" libopenblas.so.0\nmv \"$reala\" libopenblas.a\nln -sfn libopenblas.so.0 libopenblas.so\n\
    ls -l \"$prefix/lib\"\ntest -f \"$prefix/lib/libopenblas.so.0\"\ntest -f \"$prefix/lib/libopenblas.a\"\n\n#\
    \ The headers, which are also the interface: cblas.h for the C API,\n# f77blas.h for the Fortran one, lapacke.h\
    \ for the C interface to LAPACK,\n# lapack.h for the Fortran one, and openblas_config.h, which is generated\n\
    # from this build's configuration and is how a consumer discovers that the\n# library it found is threaded and\
    \ dynamically dispatched rather than\n# assuming it.\nfor h in cblas.h f77blas.h lapack.h lapacke.h lapacke_config.h\
    \ \\\n         lapacke_mangling.h lapacke_utils.h openblas_config.h; do\n  test -s \"$prefix/include/$h\"\n\
    done\n# What the generated header says about this build. The core name is the\n# baseline the non-dispatched\
    \ paths were compiled for -- the one thing this\n# stage chose rather than inherited -- and the version is spelled\
    \ with the\n# spaces upstream puts around it. DYNAMIC_ARCH is deliberately not looked for\n# here: it is a make\
    \ variable, not a header define, and the header a build\n# produces has no trace of it; it appears in the configuration\
    \ string the\n# library returns at run time, which is where the verification reads it, and\n# in the pkg-config\
    \ file below.\ngrep -q 'OPENBLAS_CHAR_CORENAME \"NEHALEM\"' \"$prefix/include/openblas_config.h\"\ngrep -q 'OPENBLAS_VERSION\
    \ \" OpenBLAS 0.3.34 \"' \"$prefix/include/openblas_config.h\"\ntest -s \"$prefix/lib/pkgconfig/openblas.pc\"\
    \n# Upstream's .pc keeps the version in a variable and refers to it from the\n# `Version:` field, so the line\
    \ to assert on is the assignment.\ngrep -q '^version=0.3.34' \"$prefix/lib/pkgconfig/openblas.pc\"\ngrep -q\
    \ 'DYNAMIC_ARCH=1' \"$prefix/lib/pkgconfig/openblas.pc\"\ngrep -q 'NEHALEM MAX_THREADS=64' \"$prefix/lib/pkgconfig/openblas.pc\"\
    \n# That file is upstream's, and its `Libs:` line is spelled with three make\n# variables upstream leaves empty\
    \ in this configuration\n# (`-l${libprefix}openblas${libsuffix}${libnamesuffix}`). Nothing but\n# pkg-config\
    \ can say what it means, so pkg-config is asked: the name it\n# resolves has to be the renamed library, and\
    \ the version it reports has to\n# be the one the label on this artifact promises. This is the reader every\n\
    # consumer of this stage goes through, and a stage that never exercises it is\n# a stage that ships the wrong\
    \ answer to the question it exists to answer.\ncommand -v pkg-config\npc_libdir=\"$prefix/lib/pkgconfig\"\n\
    # Normalized, because pkg-config's bytes are not portable between\n# implementations: the pkgconf in this image\
    \ (1.8.1) pads `--libs-only-l`\n# with a trailing space and the one on a modern workstation does not, so a\n\
    # bare comparison against `-lopenblas` fails on a file that says exactly\n# that. `awk '{$1=$1}1'` re-splits\
    \ the line on whitespace and prints it back\n# single-spaced.\npc_field() {\n  PKG_CONFIG_LIBDIR=\"$pc_libdir\"\
    \ pkg-config \"$@\" | awk '{$1=$1}1'\n}\ntest \"$(pc_field --libs-only-l openblas)\" = -lopenblas\ntest \"$(pc_field\
    \ --modversion openblas)\" = 0.3.34\ntest -s \"$prefix/lib/cmake/openblas/OpenBLASConfig.cmake\"\n# The CMake\
    \ package file names the library too, and it is read from a path\n# relative to the artifact root rather than\
    \ from the file it sits in, so a\n# rename that missed it produces a package file pointing at nothing.\ngrep\
    \ -q 'libopenblas\\.so' \"$prefix/lib/cmake/openblas/OpenBLASConfig.cmake\"\nif grep -rq 'openblasp' \"$prefix/lib/pkgconfig\"\
    \ \"$prefix/lib/cmake\"; then\n  echo \"a pkg-config or CMake file still names the pre-rename library\" >&2\n\
    \  exit 1\nfi\n\n# The names other build systems ask for. Debian ships BLAS and LAPACK as\n# separate packages\
    \ whose pkg-config files come from whichever\n# implementation the alternatives system points at, and `pkg-config\
    \ --libs\n# lapack` is what a great many numerical build systems actually run. Here\n# there is one implementation,\
    \ so the four names are four small files that\n# each name libopenblas: without them the same build systems\
    \ find nothing\n# and either fall back to a bundled copy or stop.\n#\n# The version in them is the *LAPACK*\
    \ version and not OpenBLAS's, which is\n# what Debian's blas.pc and lapack.pc carry: those packages are versioned\n\
    # with LAPACK because that is the interface they provide, and a consumer\n# asking for `lapack >= 3.9` is asking\
    \ about the routines, not about which\n# implementation of them is installed. Writing 0.3.34 there -- which\
    \ is what\n# the first revision of this file did -- makes `pkg-config --modversion\n# lapack` a false statement\
    \ that fails exactly the checks it was written to\n# satisfy. It is read out of the LAPACK that is inside the\
    \ tarball rather\n# than written down here, so the two cannot drift.\nlapack_version=$(awk -F'[() ]+' '\n  /^set\\\
    (LAPACK_MAJOR_VERSION/ { major = $3 }\n  /^set\\(LAPACK_MINOR_VERSION/ { minor = $3 }\n  /^set\\(LAPACK_PATCH_VERSION/\
    \ { patch = $3 }\n  END { if (major != \"\" && minor != \"\" && patch != \"\") print major \".\" minor \".\"\
    \ patch }\n' \"$srcdir/lapack-netlib/CMakeLists.txt\")\ntest -n \"$lapack_version\"\necho \"lapack version $lapack_version\"\
    \n# The artifact's own labels say which LAPACK this is, and a consumer\n# selecting on them is entitled to the\
    \ version it gets. The two are written\n# in different places -- the label in the plan, this in the source --\
    \ so the\n# one check that keeps them from drifting is this one, and bumping OpenBLAS\n# to a LAPACK that is\
    \ not 3.12.0 means updating the label in the same change.\ntest \"$lapack_version\" = 3.12.0\nob_version=0.3.34\n\
    pcdir=\"$prefix/lib/pkgconfig\"\npc_entry() {\n  {\n    printf 'libdir=/usr/lib\\n'\n    printf 'includedir=/usr/include\\\
    n'\n    printf 'version=%s\\n' \"$lapack_version\"\n    printf '\\n'\n    printf 'Name: %s\\n' \"$1\"\n    printf\
    \ 'Description: %s, provided by OpenBLAS %s\\n' \"$2\" \"$ob_version\"\n    printf 'Version: ${version}\\n'\n\
    \    printf 'URL: https://github.com/xianyi/OpenBLAS\\n'\n    printf 'Libs: -L${libdir} -lopenblas\\n'\n   \
    \ printf 'Libs.private: -lm -lpthread -lgfortran\\n'\n    printf 'Cflags: -I${includedir}\\n'\n  } > \"$pcdir/$1.pc\"\
    \n}\npc_entry blas 'BLAS reference implementation'\npc_entry cblas 'CBLAS interface to BLAS'\npc_entry lapack\
    \ 'LAPACK linear algebra library'\npc_entry lapacke 'C interface to LAPACK'\nfor p in blas cblas lapack lapacke;\
    \ do\n  test -s \"$pcdir/$p.pc\"\n  grep -qx 'Libs: -L${libdir} -lopenblas' \"$pcdir/$p.pc\"\n  grep -qx \"\
    version=$lapack_version\" \"$pcdir/$p.pc\"\ndone\n\n# --- verification ------------------------------------------------------\n\
    #\n# Three interfaces, because a BLAS that exports one and not the others is a\n# library that links for one\
    \ consumer and not the next: cblas (what numpy\n# calls), the Fortran BLAS (what LAPACK and every Fortran program\
    \ calls), and\n# LAPACKE (what scipy calls, and what proves the LAPACK inside this tarball\n# was actually compiled\
    \ rather than skipped -- the NOFORTRAN=1 build passes\n# every BLAS test and has none of this).\nvf=\"$build/verify\"\
    \nmkdir -p \"$vf\"\n\n# Linking against this library means linking against its Fortran runtime,\n# because the\
    \ linker resolves a shared object's own dependencies while it\n# links: without a search path for libgfortran\
    \ the link fails with \"needed\n# by libopenblas.so, not found\" and a page of undefined `_gfortran_`\n# references,\
    \ which reads like a broken library rather than a missing -L.\n# -rpath-link is that path for the linker only;\
    \ the run-time path is set\n# separately below, because the linker never reads it.\nlinkflags=(-L\"$prefix/lib\"\
    \ \"-Wl,-rpath-link,$prefix/lib\")\nwhile IFS= read -r d; do\n  test -n \"$d\" && linkflags+=(\"-Wl,-rpath-link,$d\"\
    )\ndone < <(printf '%s\\n' \"$rt\" | tr ':' '\\n')\n\ncat > \"$vf/capi.c\" <<'C'\n#include <stdio.h>\n#include\
    \ <stdlib.h>\n#include <string.h>\n#include <time.h>\n#include <cblas.h>\n#include <lapacke.h>\n#include <openblas_config.h>\n\
    \nstatic double now(void) {\n    struct timespec ts;\n    clock_gettime(CLOCK_MONOTONIC, &ts);\n    return (double)ts.tv_sec\
    \ + (double)ts.tv_nsec / 1e9;\n}\n\nint main(void) {\n    /* cblas_dgemm, row major: [[1,2],[3,4]] * [[5,6],[7,8]]\
    \ */\n    double a[4] = {1, 2, 3, 4}, b[4] = {5, 6, 7, 8}, c[4] = {0, 0, 0, 0};\n    cblas_dgemm(CblasRowMajor,\
    \ CblasNoTrans, CblasNoTrans,\n                2, 2, 2, 1.0, a, 2, b, 2, 0.0, c, 2);\n    if (c[0] != 19 ||\
    \ c[1] != 22 || c[2] != 43 || c[3] != 50) {\n        printf(\"cblas_dgemm wrong: %g %g %g %g\\n\", c[0], c[1],\
    \ c[2], c[3]);\n        return 1;\n    }\n    printf(\"cblas 19 22 43 50\\n\");\n\n    /* LAPACKE_dgesv on [[3,1],[1,2]]\
    \ x = [9,8], whose solution is (2,3) */\n    double m[4] = {3, 1, 1, 2}, x[2] = {9, 8};\n    lapack_int ipiv[2];\n\
    \    lapack_int info = LAPACKE_dgesv(LAPACK_ROW_MAJOR, 2, 1, m, 2, ipiv, x, 1);\n    if (info != 0) {\n    \
    \    printf(\"LAPACKE_dgesv failed: info=%d\\n\", (int)info);\n        return 1;\n    }\n    printf(\"lapack\
    \ %.6f %.6f\\n\", x[0], x[1]);\n    if (x[0] < 1.999999 || x[0] > 2.000001) return 1;\n    if (x[1] < 2.999999\
    \ || x[1] > 3.000001) return 1;\n\n    /* What the library says it is. The config string is generated from the\n\
    \       build and is the one place the version can disagree with the label on\n       the artifact. */\n   \
    \ char *cfg = openblas_get_config();\n    printf(\"config %s\\n\", cfg);\n    printf(\"core %s\\n\", openblas_get_corename());\n\
    \    printf(\"parallel %d\\n\", openblas_get_parallel());\n    if (!strstr(cfg, \"DYNAMIC_ARCH\")) return 1;\n\
    \    if (!strstr(cfg, \"0.3.34\")) return 1;\n    /* pthread threads, not OpenMP and not sequential, and the\
    \ thread\n       ceiling this stage asked for. */\n    if (openblas_get_parallel() != OPENBLAS_THREAD) return\
    \ 1;\n    if (!strstr(cfg, \"MAX_THREADS=64\")) return 1;\n\n    /* A real matrix multiplication, timed. The\
    \ correctness above would also\n       pass on a library whose dispatched kernels were never reached; a\n  \
    \     gigaflop floor is what distinguishes \"the kernels run\" from \"the\n       fallback path runs and happens\
    \ to be correct\". The floor is set an\n       order of magnitude below what one core of this generation reaches.\
    \ */\n    int n = 1024;\n    double *p = malloc((size_t)n * n * sizeof(double));\n    double *q = malloc((size_t)n\
    \ * n * sizeof(double));\n    double *r = malloc((size_t)n * n * sizeof(double));\n    if (!p || !q || !r) return\
    \ 1;\n    for (int i = 0; i < n * n; i++) {\n        p[i] = (double)(i % 17) * 0.5 + 1.0;\n        q[i] = (double)(i\
    \ % 13) * 0.25 + 1.0;\n        r[i] = 0.0;\n    }\n    double t0 = now();\n    cblas_dgemm(CblasRowMajor, CblasNoTrans,\
    \ CblasNoTrans,\n                n, n, n, 1.0, p, n, q, n, 0.0, r, n);\n    double dt = now() - t0;\n    double\
    \ gflops = 2.0 * (double)n * n * n / dt / 1e9;\n    printf(\"dgemm1024 %.3f %.2f\\n\", dt, gflops);\n    if\
    \ (gflops < 1.0) return 1;\n    if (r[0] <= 0.0) return 1;\n    free(p); free(q); free(r);\n    return 0;\n\
    }\nC\n\"$cc\" -O2 -I\"$prefix/include\" \"$vf/capi.c\" -o \"$vf/capi\" \\\n  \"${linkflags[@]}\" -lopenblas\n\
    \n# The same program once more, linked the way a consumer links it: the flag\n# list is whatever pkg-config\
    \ prints and nothing else, so this is the check\n# that fails if the .pc file names a library that is not in\
    \ the artifact.\n# The compile above proves the library works; this proves the description of\n# it does, which\
    \ is a separate thing to get wrong and was -- upstream's\n# file, read literally, names `-lopenblasp`.\npcflags=$(PKG_CONFIG_LIBDIR=\"\
    $pc_libdir\" PKG_CONFIG_SYSROOT_DIR=\"$out\" \\\n  pkg-config --cflags --libs openblas)\necho \"openblas pc\
    \ flags: $pcflags\"\n# Unquoted on purpose: this is a flag list, and the split is what turns it\n# back into\
    \ arguments.\n\"$cc\" -O2 $pcflags \"$vf/capi.c\" -o \"$vf/capi-pc\" \"${linkflags[@]}\"\n\ncat > \"$vf/fapi.f90\"\
    \ <<'F90'\nprogram fapi\n  implicit none\n  real(8) :: a(2, 2), b(2, 2), c(2, 2)\n  ! Column major, so these\
    \ are [[1,2],[3,4]] and [[5,6],[7,8]].\n  a = reshape([1d0, 3d0, 2d0, 4d0], [2, 2])\n  b = reshape([5d0, 7d0,\
    \ 6d0, 8d0], [2, 2])\n  c = 0d0\n  call dgemm('N', 'N', 2, 2, 2, 1d0, a, 2, b, 2, 0d0, c, 2)\n  write(*, '(A,4F8.1)')\
    \ 'f77 ', c(1, 1), c(2, 1), c(1, 2), c(2, 2)\nend program fapi\nF90\n\"$fc\" -O2 \"$vf/fapi.f90\" -o \"$vf/fapi\"\
    \ \"${linkflags[@]}\" -lopenblas\n\n# The run is what needs the paths, not the link.\nexport LD_LIBRARY_PATH=\"\
    $prefix/lib${rt:+:$rt}\"\n\"$vf/capi\" | tee \"$vf/capi.txt\"\ngrep -qx 'cblas 19 22 43 50' \"$vf/capi.txt\"\
    \ngrep -qx 'lapack 2.000000 3.000000' \"$vf/capi.txt\"\ngrep -q '^config .*DYNAMIC_ARCH' \"$vf/capi.txt\"\n\
    grep -qx 'parallel 1' \"$vf/capi.txt\"\nawk '/^dgemm1024/ { if ($3 < 1.0) exit 1 }' \"$vf/capi.txt\"\n\n# The\
    \ pkg-config-linked copy answers the same questions, and the answers are\n# the ones the first copy gave.\n\"\
    $vf/capi-pc\" | tee \"$vf/capi-pc.txt\"\ngrep -qx 'cblas 19 22 43 50' \"$vf/capi-pc.txt\"\ngrep -qx 'lapack\
    \ 2.000000 3.000000' \"$vf/capi-pc.txt\"\ngrep -qx 'parallel 1' \"$vf/capi-pc.txt\"\n\n\"$vf/fapi\" | tee \"\
    $vf/fapi.txt\"\ngrep -qx 'f77     19.0    43.0    22.0    50.0' \"$vf/fapi.txt\"\n\n# The three interfaces must\
    \ be in the shared object's dynamic symbol table,\n# under the names their users link with. A library that has\
    \ them only as\n# static objects, or under a symbol suffix, passes the compile above and\n# fails the first\
    \ program that links against the installed library.\nnm -D --defined-only \"$prefix/lib/libopenblas.so.0\" >\
    \ \"$vf/syms.txt\"\nfor s in cblas_dgemm dgemm_ LAPACKE_dgesv; do\n  grep -qE \" $s\\$\" \"$vf/syms.txt\"\n\
    done\n\n# And what it needs at run time, recorded rather than asserted in full: the\n# Fortran runtime is the\
    \ dependency this stage is responsible for, and the\n# rest of the list is information for whichever image ships\
    \ it.\nreadelf -d \"$prefix/lib/libopenblas.so.0\" | grep -q 'libgfortran'\nreadelf -d \"$prefix/lib/libopenblas.so.0\"\
    \ | sed -n 's/.*NEEDED.*\\[\\(.*\\)\\]/\\1/p' \\\n  | tee \"$vf/needed.txt\"\n\n# Nothing here may be a glibc\
    \ object. The container is Debian and the\n# compiler is not; the failure this catches is a link line that reached\
    \ for\n# the host's libraries instead of the sysroot's.\nif readelf -d \"$prefix/lib/libopenblas.so.0\" | grep\
    \ -qi 'libc\\.so\\.6'; then\n  echo \"libopenblas links against glibc\" >&2\n  exit 1\nfi\n# Not `strings \u2026\
    \ | grep -q`. Under `set -o pipefail` that idiom is dead:\n# grep -q exits at the first match, strings dies\
    \ of SIGPIPE, and the\n# pipeline's status is 141 -- so the test takes the *false* branch in\n# exactly the\
    \ case it exists to catch, on a thirty-seven-megabyte shared\n# object that is certain to trigger it. Measured\
    \ on 11 MB of text with the\n# pattern on the first line: 141. Process substitution leaves grep as the\n# only\
    \ process whose status is read.\nif grep -q 'GLIBC_2\\.' < <(strings \"$prefix/lib/libopenblas.so.0\"); then\n\
    \  echo \"libopenblas carries glibc symbol versions\" >&2\n  exit 1\nfi\nif readelf -d \"$vf/capi\" | grep -qi\
    \ 'libc\\.so\\.6'; then\n  echo \"the verification program links against glibc\" >&2\n  exit 1\nfi\n\n{\n  printf\
    \ 'openblas\\t%s\\n' \"$(sed -n 's/^config //p' \"$vf/capi.txt\")\"\n  printf 'corename\\t%s\\n' \"$(sed -n\
    \ 's/^core //p' \"$vf/capi.txt\")\"\n  printf 'parallel\\t%s\\n' \"$(sed -n 's/^parallel //p' \"$vf/capi.txt\"\
    )\"\n  printf 'build\\t%s\\n' \"$(hostname)\"\n  printf 'cc\\t%s\\n' \"$(\"$cc\" --version | head -1)\"\n  printf\
    \ 'fc\\t%s\\n' \"$(\"$fc\" --version | head -1)\"\n  printf 'lapack\\t3.12.0\\n'\n  printf 'soname\\t%s\\n'\
    \ \"$(readelf -d \"$prefix/lib/libopenblas.so.0\" | sed -n 's/.*SONAME.*\\[\\(.*\\)\\]/\\1/p')\"\n  printf 'shared_bytes\\\
    t%s\\n' \"$(stat -c %s \"$prefix/lib/libopenblas.so.0\")\"\n  printf 'static_bytes\\t%s\\n' \"$(stat -c %s \"\
    $prefix/lib/libopenblas.a\")\"\n  printf 'needed\\t%s\\n' \"$(paste -sd, \"$vf/needed.txt\")\"\n  printf 'jobs\\\
    t%s\\n' \"$FASE_VAR_JOBS\"\n} > \"$prefix/OPENBLAS-BUILD-INFO.txt\"\n\n# The artifact is a library prefix, so\
    \ what is stripped is the library:\n# --strip-unneeded on the shared object keeps the dynamic symbols and drops\n\
    # the rest, and -g on the archive keeps the objects usable for a static link\n# while dropping the debug information\
    \ that makes them three times the size.\nstrip --strip-unneeded \"$prefix/lib/libopenblas.so.0\"\nstrip -g \"\
    $prefix/lib/libopenblas.a\"\nreadelf -d \"$prefix/lib/libopenblas.so.0\" | grep -q 'SONAME'\n{\n  printf 'stripped\\\
    tyes\\n'\n  printf 'shared_bytes\\t%s\\n' \"$(stat -c %s \"$prefix/lib/libopenblas.so.0\")\"\n  printf 'static_bytes\\\
    t%s\\n' \"$(stat -c %s \"$prefix/lib/libopenblas.a\")\"\n} >> \"$prefix/OPENBLAS-BUILD-INFO.txt\"\n\n# Packing\
    \ dereferences symlinks, so a link that leaves the prefix would\n# silently embed host files. This prefix has\
    \ exactly one symlink in it, and\n# it is a relative one pointing at a file in the same directory.\nif find\
    \ \"$out\" -type l -printf '%p -> %l\\n' | grep -q ' -> /'; then\n  echo \"absolute symlink left inside the\
    \ prefix:\" >&2\n  find \"$out\" -type l -printf '%p -> %l\\n' | grep ' -> /' >&2\n  exit 1\nfi\nif test -n\
    \ \"$(find \"$out\" -xtype l)\"; then\n  echo \"dangling symlink left inside the prefix:\" >&2\n  find \"$out\"\
    \ -xtype l >&2\n  exit 1\nfi\n\nmkdir -p \"$FASE_OUTPUT_ROOT\"\npython3 \"$FASE_INPUT_ROOT/packtar.py\" \"$FASE_OUTPUT_ROOT/openblas\"\
    \ \"$out\"\nzstd -q -t \"$FASE_OUTPUT_ROOT/openblas\"\nzstd -dc \"$FASE_OUTPUT_ROOT/openblas\" | python3 -c\
    \ \"\nimport sys, tarfile\nprint('entries', sum(1 for _ in tarfile.open(fileobj=sys.stdin.buffer, mode='r|')))\n\
    \"\ndu -sh \"$out\" \"$FASE_OUTPUT_ROOT/openblas\"\n"
  workspace:
    taskSizeLimit: 300Gi
    inputSizeLimit: 32Gi
    outputSizeLimit: 32Gi
    transferSizeLimit: 32Gi
  nodeSelector:
    kubernetes.io/hostname: node1
---
apiVersion: skyw.top/v1beta1
kind: Recipe
metadata:
  name: openblas-build
spec:
  inputs:
    artifacts:
    - name: tc
      artifactSelector:
        matchLabels:
          name: fase-tc
          rev: r5
    - name: source
      artifactSelector:
        matchLabels:
          name: openblas-source
          version: 0.3.34
          recipe: fetch-v1
    - name: packtar
      artifactSelector:
        matchLabels:
          name: packtar-tool
          version: v2
  outputs:
    artifacts:
    - name: openblas
      from:
        task: build
        artifact: openblas
      labels:
        name:
          value: openblas
        version:
          fromInput:
            input: source
            label: version
        recipe:
          value: openblas-v3
        libc:
          value: musl
        toolchain:
          fromInput:
            input: tc
            label: rev
        compiler:
          value: gcc
        fortran:
          value: gfortran
        arch:
          value: amd64
        target:
          value: nehalem
        dispatch:
          value: dynamic
        threading:
          value: pthread
        interface:
          value: lp64
        lapack:
          value: 3.12.0
        kind:
          value: library
  tasks:
  - name: build
    variables:
      jobs:
        value: '48'
    inputs:
      artifacts:
      - name: tc
        from:
          recipeInput: tc
      - name: source
        from:
          recipeInput: source
      - name: packtar
        from:
          recipeInput: packtar
    outputs:
    - name: openblas
    taskSelector:
      matchLabels:
        capability: openblas
---
apiVersion: skyw.top/v1beta1
kind: Task
metadata:
  name: numpy-build
  labels:
    capability: numpy-build
spec:
  image: gcc:16.2.0-trixie
  imagePullSecrets:
  - name: fase-ghcr-pull
  - name: fase-registry-pull
  command:
  - /bin/bash
  securityContext:
    runAsUser: 0
    runAsNonRoot: false
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: '32'
      memory: 64Gi
      ephemeral-storage: 200Gi
    limits:
      cpu: '32'
      memory: 64Gi
      ephemeral-storage: 300Gi
  env:
  - name: DEBIAN_FRONTEND
    value: noninteractive
  inputs:
    variables:
    - name: jobs
      env: FASE_VAR_JOBS
      required: true
    artifacts:
    - name: tc
      path: tc.tar.zst
      kind: file
    - name: openblas
      path: openblas.tar.zst
      kind: file
    - name: pyruntime
      path: python-runtime.tar.zst
      kind: file
    - name: pystdlib
      path: python-stdlib.tar.zst
      kind: file
    - name: pydev
      path: python-dev.tar.zst
      kind: file
    - name: pydeps
      path: python-deps.tar.zst
      kind: file
    - name: fortran
      path: fortran-tc.tar.zst
      kind: file
    - name: source
      path: tarball
      kind: file
    - name: pip
      path: pip.whl
      kind: file
    - name: meson
      path: meson.whl
      kind: file
    - name: mesonpython
      path: meson-python.whl
      kind: file
    - name: pyprojectmetadata
      path: pyproject-metadata.whl
      kind: file
    - name: packaging
      path: packaging.whl
      kind: file
    - name: cython
      path: cython.whl
      kind: file
    - name: ninja
      path: ninja.whl
      kind: file
    - name: packtar
      path: packtar.py
      kind: file
  outputs:
    artifacts:
    - name: wheel
      path: numpy-2.5.3-cp313-cp313-musllinux_1_2_x86_64.whl
      kind: file
    - name: runtime
      path: numpy-runtime
      kind: file
    - name: report
      path: numpy-build-info.txt
      kind: file
  script: "set -eu\nif ! command -v zstd >/dev/null 2>&1; then\n  apt-get update -qq >/dev/null\n  apt-get install\
    \ -y -qq --no-install-recommends zstd >/dev/null\nfi\nmkdir -p /workspace/inputs\nmkdir -p \"/workspace/inputs/tc\"\
    \nzstd -dc \"/in/tc.tar.zst\" | tar -xf - -C \"/workspace/inputs/tc\"\nmkdir -p \"/workspace/inputs/openblas\"\
    \nzstd -dc \"/in/openblas.tar.zst\" | tar -xf - -C \"/workspace/inputs/openblas\"\nmkdir -p \"/workspace/inputs/python-runtime\"\
    \nzstd -dc \"/in/python-runtime.tar.zst\" | tar -xf - -C \"/workspace/inputs/python-runtime\"\nmkdir -p \"/workspace/inputs/python-stdlib\"\
    \nzstd -dc \"/in/python-stdlib.tar.zst\" | tar -xf - -C \"/workspace/inputs/python-stdlib\"\nmkdir -p \"/workspace/inputs/python-dev\"\
    \nzstd -dc \"/in/python-dev.tar.zst\" | tar -xf - -C \"/workspace/inputs/python-dev\"\nmkdir -p \"/workspace/inputs/python-deps\"\
    \nzstd -dc \"/in/python-deps.tar.zst\" | tar -xf - -C \"/workspace/inputs/python-deps\"\nmkdir -p \"/workspace/inputs/fortran-tc\"\
    \nzstd -dc \"/in/fortran-tc.tar.zst\" | tar -xf - -C \"/workspace/inputs/fortran-tc\"\nln -s \"/in/tarball\"\
    \ \"/workspace/inputs/tarball\"\nln -s \"/in/pip.whl\" \"/workspace/inputs/pip.whl\"\nln -s \"/in/meson.whl\"\
    \ \"/workspace/inputs/meson.whl\"\nln -s \"/in/meson-python.whl\" \"/workspace/inputs/meson-python.whl\"\nln\
    \ -s \"/in/pyproject-metadata.whl\" \"/workspace/inputs/pyproject-metadata.whl\"\nln -s \"/in/packaging.whl\"\
    \ \"/workspace/inputs/packaging.whl\"\nln -s \"/in/cython.whl\" \"/workspace/inputs/cython.whl\"\nln -s \"/in/ninja.whl\"\
    \ \"/workspace/inputs/ninja.whl\"\nln -s \"/in/packtar.py\" \"/workspace/inputs/packtar.py\"\nexport FASE_INPUT_ROOT=/workspace/inputs\n\
    set -Eeuo pipefail\ntrap 'code=$?; printf \"FAILED (exit %s) line %s: %s\\n\" \"$code\" \"$LINENO\" \"$BASH_COMMAND\"\
    \ >&2' ERR\n\ntc=/opt/tc\nsys=\"$tc/x86_64-linux-musl\"\nob=/opt/ob\npy=/opt/py\nft=/opt/ft\nbuild=/workspace/build\n\
    src=\"$build/src\"\nwheelhouse=\"$build/wheelhouse\"\nout=\"$build/out\"\n\nrm -rf \"$tc\" \"$ob\" \"$py\" \"\
    $ft\" \"$build\"\nmkdir -p \"$tc\" \"$ob\" \"$py\" \"$ft\" \"$src\" \"$wheelhouse\" \"$out\"\n\ncp -a \"$FASE_INPUT_ROOT/tc/.\"\
    \ \"$tc/\"\ncp -a \"$FASE_INPUT_ROOT/openblas/.\" \"$ob/\"\ncp -a \"$FASE_INPUT_ROOT/fortran-tc/.\" \"$ft/\"\
    \nfor part in python-runtime python-stdlib python-dev python-deps; do\n  cp -a \"$FASE_INPUT_ROOT/$part/.\"\
    \ \"$py/\"\ndone\n\n# Two tools the container does not have, and both are installed from the\n# network during\
    \ a build, which is a thing this repository does not\n# otherwise do.\n#\n# zstd is how an input archive arrives,\
    \ so nothing can be unpacked without\n# it. patchelf is what meson-python uses to rewrite the RPATH of every\n\
    # object in the wheel, but only when the project installs a shared library\n# of its own -- so its absence is\
    \ either fatal or invisible depending on\n# what the project does, and it is looked for at *wheel writing* time,\n\
    # after the whole build. Installing it up front turns a possible total loss\n# at minute sixty into ten seconds\
    \ at minute zero.\n#\n# The loop is the third thing learned here, and it was learned the\n# expensive way: three\
    \ consecutive attempts of this stage died on this\n# line with `Unable to locate package zstd`, one minute after\
    \ a build on\n# the same image had installed the same package, and there is nothing a pod\n# can do to tell\
    \ a mirror that is briefly unreachable from a mirror that\n# does not have the package. Five attempts with a\
    \ growing pause is what\n# turns that from a failed build into a slow one.\nmissing=()\nfor t in zstd patchelf;\
    \ do\n  command -v \"$t\" >/dev/null 2>&1 || missing+=(\"$t\")\ndone\nif test \"${#missing[@]}\" -gt 0; then\n\
    \  echo \"installing: ${missing[*]}\"\n  installed=0\n  for attempt in 1 2 3 4 5; do\n    apt-get update -qq\
    \ >/dev/null 2>&1 || true\n    if apt-get install -y -qq --no-install-recommends \"${missing[@]}\" >/dev/null\
    \ 2>&1; then\n      installed=1\n      break\n    fi\n    echo \"apt attempt $attempt did not complete, retrying\
    \ in $((attempt * 15))s\" >&2\n    sleep $((attempt * 15))\n  done\n  test \"$installed\" = 1\nfi\ncommand -v\
    \ zstd\ncommand -v patchelf\n\n# --- the loader, and every directory the run needs ---------------------\n#\n\
    # This block is first for a reason worth stating, because it was not first\n# and that cost this stage a revision.\
    \ The assertions below *run* musl\n# binaries -- the interpreter, clang, gfortran -- and a musl binary whose\n\
    # ELF interpreter field names a loader that is not at that path fails to\n# exec at all, with a message that\
    \ names neither musl nor the loader:\n#\n#   /opt/py/usr/bin/python3.13: cannot execute: required file not found\n\
    #\n# which is what the fifth revision of this stage printed, at the first\n# `\"$pypy\" -V`, on the first revision\
    \ that got that far. Nothing in this\n# script may run before the loader is in place.\n#\n# The interpreter\
    \ is a musl binary, the compiler is a musl binary, the\n# OpenBLAS the extensions link is a musl library with\
    \ a Fortran runtime\n# behind it, and ninja -- which comes from a musllinux wheel -- is a musl\n# binary too.\
    \ All of them need the loader, and the search path file replaces\n# musl's default rather than adding to it.\n\
    mkdir -p /lib\nln -sf \"$sys/lib/ld-musl-x86_64.so.1\" /lib/ld-musl-x86_64.so.1\n# The interpreter's own bin\
    \ directory first: the console scripts the build\n# tools install (ninja, meson) live there, and they are the\
    \ ones this build\n# is supposed to use rather than any the container may happen to carry.\nexport PATH=\"$py/usr/bin:$tc/bin:$PATH\"\
    \nrt=$(find \"$ob\" \"$ft\" \"$tc\" \\\n       \\( -name 'libopenblas.so.0' -o -name 'libgfortran.so.5' \\\n\
    \          -o -name 'libquadmath.so.0' -o -name 'libgcc_s.so.1' \\\n          -o -name 'libstdc++.so.6' \\)\
    \ -printf '%h\\n' | sort -u | paste -sd:)\ntest -n \"$rt\"\nprintf '%s\\n' \"$py/usr/lib:$sys/usr/lib:$sys/lib64:$sys/lib:$rt:/lib:/usr/lib\"\
    \ > /etc/ld-musl-x86_64.path\ncat /etc/ld-musl-x86_64.path\n\n# --- the inputs, asserted before any of them\
    \ is used -------------------\n#\n# Each assertion is a thing the plan selected by label, checked against the\n\
    # thing that arrived: labels are how artifacts are chosen and files are what\n# is built from, and a stage that\
    \ trusts the first to describe the second is\n# a stage that builds against whatever happened to be in the store.\n\
    pypy=\"$py/usr/bin/python3.13\"\ntest -x \"$pypy\"\ntest -s \"$py/usr/include/python3.13/Python.h\"\ntest -s\
    \ \"$py/usr/lib/libpython3.13.a\"\ntest -d \"$py/usr/lib/python3.13/lib-dynload\"\n# The deps tree, and the\
    \ one file that says whether it arrived: `zlib` is the\n# first standard library module anything here uses --\
    \ pip cannot even read\n# its own wheel without it -- so an interpreter with no libz.so.1 is an\n# interpreter\
    \ that runs `-V` and nothing else.\ntest -s \"$py/usr/lib/libz.so.1\"\ntest -x \"$tc/bin/clang\"\ntest -x \"\
    $tc/bin/clang++\"\ntest -s \"$ob/usr/include/cblas.h\"\ntest -s \"$ob/usr/include/lapacke.h\"\ntest -s \"$ob/usr/lib/libopenblas.so.0\"\
    \ntest -s \"$ob/usr/lib/pkgconfig/openblas.pc\"\n# Upstream's .pc keeps the version in a variable and refers\
    \ to it from the\n# `Version:` field, so the assignment is the line that carries it. Its Libs\n# line, by contrast,\
    \ is spelled with three make variables upstream leaves\n# empty -- `-l${libprefix}openblas${libsuffix}${libnamesuffix}`\
    \ -- so\n# grepping it for a literal `-lopenblas` fails against a perfectly good file,\n# which is what the\
    \ third revision of this stage did before it was fixed\n# here. What the file *means* is only visible after\
    \ pkg-config substitutes\n# into it, so that is what is asked, with the same reader the build uses.\ngrep -q\
    \ '^version=0.3.34' \"$ob/usr/lib/pkgconfig/openblas.pc\"\ncommand -v pkg-config\n# Asked through a normalizer,\
    \ because pkg-config's *bytes* are not portable\n# between implementations: the pkgconf in this image (1.8.1)\
    \ pads\n# `--libs-only-l` with a trailing space and the one the assertion was first\n# written against (3.0.7)\
    \ does not, so a bare string comparison against\n# `-lopenblas` fails here on a file that says exactly that.\
    \ `awk '{$1=$1}1'`\n# re-splits the line on whitespace and prints it back single-spaced, which\n# is the normalization\
    \ every comparison below goes through.\npc_field() {\n  PKG_CONFIG_LIBDIR=\"$ob/usr/lib/pkgconfig\" pkg-config\
    \ \"$@\" | awk '{$1=$1}1'\n}\ntest \"$(pc_field --libs-only-l openblas)\" = -lopenblas\ntest \"$(pc_field --modversion\
    \ openblas)\" = 0.3.34\ntest -s \"$ob/usr/lib/pkgconfig/blas.pc\"\ntest -s \"$ob/usr/lib/pkgconfig/lapack.pc\"\
    \n# The version in those files is LAPACK's, not OpenBLAS's, because that is\n# the interface they name -- and\
    \ it is the number a consumer's dependency\n# check reads, so it is asserted here on the artifact rather than\
    \ trusted.\ngrep -qx 'version=3.12.0' \"$ob/usr/lib/pkgconfig/lapack.pc\"\ngrep -qx 'version=3.12.0' \"$ob/usr/lib/pkgconfig/blas.pc\"\
    \ntest -x \"$ft/bin/x86_64-linux-musl-gfortran\"\n\"$pypy\" -V\n\"$tc/bin/clang\" --version | head -1\n\n# ---\
    \ the build tools ---------------------------------------------------\n#\n# The loader and the search path are\
    \ already in place, above, before the\n# assertions that run musl binaries.\n#\n# The wheelhouse is assembled\
    \ from the pinned artifacts rather than\n# downloaded: the filenames are written out here because a wheel's\
    \ filename\n# is its metadata and pip reads the name, version and tags out of it, while\n# an artifact arrives\
    \ named after the input it was bound to.\ninstall -m 0644 \"$FASE_INPUT_ROOT/pip.whl\"            \"$wheelhouse/pip-26.2.1-py3-none-any.whl\"\
    \ninstall -m 0644 \"$FASE_INPUT_ROOT/meson.whl\"          \"$wheelhouse/meson-1.12.1-py3-none-any.whl\"\ninstall\
    \ -m 0644 \"$FASE_INPUT_ROOT/meson-python.whl\"   \"$wheelhouse/meson_python-0.21.1-py3-none-any.whl\"\ninstall\
    \ -m 0644 \"$FASE_INPUT_ROOT/pyproject-metadata.whl\" \"$wheelhouse/pyproject_metadata-0.12.1-py3-none-any.whl\"\
    \ninstall -m 0644 \"$FASE_INPUT_ROOT/packaging.whl\"      \"$wheelhouse/packaging-26.3-py3-none-any.whl\"\n\
    install -m 0644 \"$FASE_INPUT_ROOT/cython.whl\"         \"$wheelhouse/cython-3.3.0-cp39-abi3-musllinux_1_2_x86_64.whl\"\
    \ninstall -m 0644 \"$FASE_INPUT_ROOT/ninja.whl\"          \"$wheelhouse/ninja-1.13.2-py3-none-musllinux_1_2_x86_64.whl\"\
    \n\n# pip is run out of the wheel itself: a wheel is a zip and pip is a package\n# inside it, so there is no\
    \ need to install a package manager before using\n# the package manager. It is installed anyway -- meson-python\
    \ imports\n# `packaging` and `pyproject_metadata` from the interpreter that runs the\n# build, and `--no-build-isolation`\
    \ is what makes the build use *these*\n# pinned copies rather than downloading its own.\n\"$pypy\" \"$wheelhouse/pip-26.2.1-py3-none-any.whl/pip\"\
    \ install \\\n  --no-index --find-links \"$wheelhouse\" --no-cache-dir --no-deps \\\n  pip meson meson-python\
    \ pyproject-metadata packaging cython ninja\n\"$pypy\" -c \"import mesonpy, Cython, packaging, pyproject_metadata\
    \ as m; print('mesonpy', mesonpy.__version__); print('cython', Cython.__version__); print('pyproject-metadata',\
    \ m.__version__)\"\n\"$pypy\" -m pip --version\nninja --version\n\n# --- the source --------------------------------------------------------\n\
    tar -xf \"$FASE_INPUT_ROOT/tarball\" -C \"$src\"\nsrcdir=$(find \"$src\" -maxdepth 1 -mindepth 1 -type d -name\
    \ 'numpy-*' | head -1)\ntest -n \"$srcdir\"\ncd \"$srcdir\"\ngrep -m1 '^version' pyproject.toml || true\ntest\
    \ -f numpy/_core/meson.build\n\n# --- the build ---------------------------------------------------------\n\
    #\n# PKG_CONFIG_LIBDIR is set as well as PKG_CONFIG_PATH, and the difference\n# matters: the first *replaces*\
    \ the search path, the second adds to it. With\n# only the path set, pkg-config would also see whatever the\
    \ build container\n# has installed, and a container that happens to carry a BLAS would be a\n# build that silently\
    \ links the host's.\n#\n# PKG_CONFIG_SYSROOT_DIR is the third of the three, and it is the one that\n# is easy\
    \ to leave out and expensive to leave out. The OpenBLAS stage\n# installed with `PREFIX=/usr DESTDIR=<staging>`,\
    \ so the .pc files it wrote\n# say `-L/usr/lib -lopenblas` and `-I/usr/include` -- correct for the image\n#\
    \ they belong to, and wrong for the tree this build is running in. With the\n# sysroot variable unset, meson\
    \ hands those paths to the compiler as\n# written: `-L/usr/lib` finds nothing (loud, and harmless), but\n# `-I/usr/include`\
    \ finds the *container's* glibc headers, and this\n# compiler's own implicit search path does not contain /usr/include,\
    \ so\n# meson cannot recognise it as a system directory and drop it. That is a\n# musl build including Debian's\
    \ headers: it mostly compiles, which is what\n# makes it worth a variable. With it set, pkg-config prefixes\
    \ every path it\n# emits with the staging root, and `/usr/include` means the one in the\n# artifact.\nexport\
    \ PKG_CONFIG_PATH=\"$ob/usr/lib/pkgconfig\"\nexport PKG_CONFIG_LIBDIR=\"$ob/usr/lib/pkgconfig\"\nexport PKG_CONFIG_SYSROOT_DIR=\"\
    $ob\"\npkg-config --cflags --libs openblas\nexport CC=\"$tc/bin/clang\"\nexport CXX=\"$tc/bin/clang++\"\nrpathlink=\"\
    -Wl,-rpath-link,$ob/usr/lib\"\nwhile read -r d; do\n  test -n \"$d\" && rpathlink=\"$rpathlink -Wl,-rpath-link,$d\"\
    \ndone < <(printf '%s' \"$rt\" | tr ':' '\\n')\nexport LDFLAGS=\"-L$ob/usr/lib $rpathlink -Wl,-z,relro -Wl,-z,now\"\
    \nexport _PYTHON_HOST_PLATFORM=musllinux_1_2_x86_64\n\n# The tag is asserted before the build rather than after,\
    \ because it comes\n# from this variable and the variable is what the wheel name is made of.\n\"$pypy\" -c 'import\
    \ sysconfig; p = sysconfig.get_platform(); print(\"platform\", p); assert p == \"musllinux_1_2_x86_64\", p'\n\
    \n# The job count reaches ninja through `compile-args`: meson-python does not\n# read the environment for it,\
    \ and a wheel built on one core is a wheel that\n# takes an hour to appear.\n\"$pypy\" -m pip wheel --no-build-isolation\
    \ --no-deps -w \"$out\" \\\n  -Csetup-args=-Dblas=openblas \\\n  -Csetup-args=-Dlapack=openblas \\\n  -Csetup-args=-Dbuildtype=release\
    \ \\\n  -Ccompile-args=-j$FASE_VAR_JOBS \\\n  .\n\nwheel=\"$out/numpy-2.5.3-cp313-cp313-musllinux_1_2_x86_64.whl\"\
    \ntest -s \"$wheel\"\nls -l \"$out\"\n\n# --- verification ------------------------------------------------------\n\
    vf=\"$build/verify\"\nmkdir -p \"$vf\"\n# Out of the source tree, before anything is imported. The build above\
    \ runs\n# with the cwd inside `numpy-2.5.3` because meson-python takes `.` as the\n# source directory -- and\
    \ a Python program whose script is read from stdin\n# has `''` as `sys.path[0]`, which is the cwd, which is\
    \ searched *ahead* of\n# PYTHONPATH. Left there, `import numpy` finds the source package instead of\n# the installed\
    \ wheel and dies on `numpy/__init__.py`'s \"you should not try\n# to import numpy from its source directory\"\
    \ guard -- after the whole build\n# has been paid for. Same trap as the scipy stage; every path below is\n#\
    \ absolute, and the only relative ones above are already done with.\ncd \"$vf\"\n\n# The wheel's own metadata,\
    \ which is what an installer reads before it\n# installs anything: the tag and the dependency list.\n\"$pypy\"\
    \ - \"$wheel\" > \"$vf/wheel-metadata.txt\" <<'PY'\nimport sys, zipfile\nz = zipfile.ZipFile(sys.argv[1])\n\
    for name in z.namelist():\n    if name.endswith(\".dist-info/WHEEL\"):\n        print(z.read(name).decode())\n\
    PY\ncat \"$vf/wheel-metadata.txt\"\ngrep -q 'Tag: cp313-cp313-musllinux_1_2_x86_64' \"$vf/wheel-metadata.txt\"\
    \n\n# Installed into a target directory rather than into the interpreter, so\n# that what is exercised is the\
    \ wheel and nothing but the wheel.\nsite=\"$build/site\"\n\"$pypy\" -m pip install --no-index --no-deps --target\
    \ \"$site\" \"$wheel\" >/dev/null\nexport PYTHONPATH=\"$site\"\n\n# What numpy says it was built against --\
    \ not what the build was asked for,\n# but what the finished library reports, which is the only version of the\n\
    # claim that cannot be wrong. `show_config` in its dictionary form is\n# machine-readable by design, so the\
    \ assertion is on the value rather than on\n# a string that a future release could reword.\n\"$pypy\" > \"$vf/config.txt\"\
    \ <<'PY'\nimport json\nimport numpy as np\nprint(\"numpy\", np.__version__, np.__file__)\ncfg = np.show_config(mode=\"\
    dicts\")\nprint(json.dumps(cfg, indent=1, default=str))\nblas = cfg[\"Build Dependencies\"][\"blas\"]\nassert\
    \ blas[\"found\"], blas\nassert \"openblas\" in blas[\"name\"].lower(), blas\nassert cfg[\"Build Dependencies\"\
    ][\"lapack\"][\"found\"], cfg[\"Build Dependencies\"][\"lapack\"]\nPY\ngrep -q '\"name\": \"openblas\"' \"$vf/config.txt\"\
    \ngrep -qi '\"lapack\"' \"$vf/config.txt\"\n\n# Linear algebra through the library that was just linked, at\
    \ a size where\n# the answer is exact and a fallback implementation cannot fake it: an\n# integer matrix whose\
    \ inverse is known by construction, a solve checked\n# against it, and a symmetric eigenproblem whose spectrum\
    \ is known.\n\"$pypy\" - > \"$vf/numpy.txt\" <<'PY'\nimport numpy as np\na = np.array([[2.0, 1.0], [1.0, 3.0]])\n\
    b = np.array([3.0, 5.0])\nx = np.linalg.solve(a, b)\nprint(\"solve\", \" \".join(f\"{v:.6f}\" for v in x))\n\
    print(\"det\", f\"{np.linalg.det(a):.1f}\")\nm = np.arange(1.0, 10.0).reshape(3, 3)\nprint(\"matmul\", int(np.matmul(m,\
    \ m)[0, 0]), int(np.matmul(m, m)[2, 2]))\nw = np.linalg.eigvalsh(np.array([[2.0, 0.0], [0.0, 5.0]]))\nprint(\"\
    eig\", \" \".join(f\"{v:.1f}\" for v in w))\nq, _ = np.linalg.qr(m)\nprint(\"orth\", f\"{np.abs(q.T @ q - np.eye(3)).max():.1e}\"\
    )\ns = np.linalg.svd(m, compute_uv=False)\nprint(\"svd\", \" \".join(f\"{v:.3f}\" for v in s))\nf = np.fft.fft(np.array([1.0,\
    \ 2.0, 3.0, 4.0]))\nprint(\"fft\", f\"{f[0].real:.1f}\")\nrng = np.random.default_rng(12345)\nprint(\"random\"\
    , f\"{rng.random(3).sum():.3f}\")\nPY\ncat \"$vf/numpy.txt\"\ngrep -qx 'solve 0.800000 1.400000' \"$vf/numpy.txt\"\
    \ngrep -qx 'det 5.0' \"$vf/numpy.txt\"\ngrep -qx 'matmul 30 150' \"$vf/numpy.txt\"\ngrep -qx 'eig 2.0 5.0' \"\
    $vf/numpy.txt\"\ngrep -qx 'fft 10.0' \"$vf/numpy.txt\"\nawk '/^orth/ { if ($2 + 0 > 1.0e-14) exit 1 }' \"$vf/numpy.txt\"\
    \n# The largest singular value of a 3x3 matrix of 1..9 is 16.848; the check\n# is a window rather than an equality\
    \ because it is a different code path\n# (a divide-and-conquer SVD) from the ones above.\nawk '/^svd/ { if ($2\
    \ + 0 < 16.0 || $2 + 0 > 17.0) exit 1 }' \"$vf/numpy.txt\"\nawk '/^random/ { if ($2 + 0 <= 0) exit 1 }' \"$vf/numpy.txt\"\
    \n\n# The extension modules must have linked the OpenBLAS that was built for\n# them, and must not have reached\
    \ for a glibc library on the way.\numath=$(find \"$site/numpy\" -name '_multiarray_umath*.so' | head -1)\ntest\
    \ -n \"$umath\"\nreadelf -d \"$umath\" | sed -n 's/.*NEEDED.*\\[\\(.*\\)\\]/\\1/p' | tee \"$vf/needed.txt\"\n\
    readelf -d \"$umath\" | grep -q 'libopenblas'\nif readelf -d \"$umath\" | grep -qi 'libc\\.so\\.6'; then\n \
    \ echo \"_multiarray_umath links against glibc\" >&2\n  exit 1\nfi\n# Not `strings \u2026 | grep -q`. That idiom\
    \ is dead under `set -o pipefail`:\n# grep -q exits at the first match, strings then dies of SIGPIPE, and the\n\
    # pipeline's status is 141 -- so the test takes the *false* branch in\n# exactly the case it exists to catch.\
    \ Measured on 11 MB of text with the\n# pattern on the first line: 141. Process substitution leaves grep as\
    \ the\n# only process in the pipeline whose status is read.\nif grep -q 'GLIBC_2\\.' < <(strings \"$umath\"\
    ); then\n  echo \"_multiarray_umath carries glibc symbol versions\" >&2\n  exit 1\nfi\n\n# And the C API, from\
    \ outside: a third-party extension compiled against the\n# headers in python-dev, importing numpy, and using\
    \ numpy's array type. This\n# is what a distribution's python3-numpy-dev exists for, and it is a\n# different\
    \ thing from numpy importing itself.\ninc=$(\"$pypy\" -c 'import numpy; print(numpy.get_include())')\next=$(\"\
    $pypy\" -c 'import sysconfig; print(sysconfig.get_config_var(\"EXT_SUFFIX\"))')\ncat > \"$vf/fasenp.c\" <<'C'\n\
    #include <Python.h>\n#define NPY_NO_DEPRECATED_API NPY_1_7_API_VERSION\n#include <numpy/arrayobject.h>\n\nstatic\
    \ PyObject *fase_mat(PyObject *self, PyObject *args) {\n    npy_intp dims[2] = {2, 2};\n    PyObject *a = PyArray_SimpleNew(2,\
    \ dims, NPY_DOUBLE);\n    if (a == NULL) return NULL;\n    double *d = (double *)PyArray_DATA((PyArrayObject\
    \ *)a);\n    d[0] = 1.0; d[1] = 2.0; d[2] = 3.0; d[3] = 4.0;\n    return a;\n}\n\nstatic PyMethodDef methods[]\
    \ = {\n    {\"mat\", fase_mat, METH_NOARGS, \"a 2x2 matrix, made with the C API\"},\n    {NULL, NULL, 0, NULL}\n\
    };\n\nstatic struct PyModuleDef module = {\n    PyModuleDef_HEAD_INIT, \"fasenp\", NULL, -1, methods, NULL,\
    \ NULL, NULL, NULL\n};\n\nPyMODINIT_FUNC PyInit_fasenp(void) {\n    import_array();\n    return PyModule_Create(&module);\n\
    }\nC\n\"$tc/bin/clang\" -O2 -fPIC -shared \\\n  -I\"$py/usr/include/python3.13\" -I\"$inc\" \\\n  \"$vf/fasenp.c\"\
    \ -o \"$vf/fasenp$ext\"\n\"$pypy\" -c '\nimport sys\nsys.path.insert(0, sys.argv[1])\nimport fasenp, numpy as\
    \ np\na = fasenp.mat()\nprint(\"extension\", a.dtype, a.shape, int((a @ a)[1, 1]))\n' \"$vf\" | tee \"$vf/extension.txt\"\
    \ngrep -qx 'extension float64 (2, 2) 22' \"$vf/extension.txt\"\n\n# --- the shared objects the wheel needs at\
    \ run time --------------------\n#\n# A wheel is not a program. numpy's extensions link libopenblas, libopenblas\n\
    # links libgfortran, libgfortran links libquadmath and libgcc_s, and the C++\n# extensions link libstdc++ --\
    \ five libraries that an image has to carry if\n# `import numpy` is to get past the loader, and that a distribution\
    \ ships as\n# the packages python3-numpy depends on (libopenblas0, libgfortran5,\n# libquadmath0, libgcc-s1,\
    \ libstdc++6). One build here produces both halves,\n# so both are published, and the wheel's dependencies are\
    \ answered by the\n# stage that knows what they are instead of by whoever assembles an image.\n#\n# The set\
    \ is *computed* from the objects rather than written down: take what\n# the wheel's own objects say they need,\
    \ follow it into the libraries being\n# shipped, and stop at libc.so -- musl, which belongs to whatever image\
    \ this\n# ends up in and is the one name every object asks for and no artifact\n# carries. A dependency that\
    \ nobody ships then fails here, in the stage that\n# can still see it, rather than at import time in an image\
    \ several stages\n# further along.\nruntime=\"$build/runtime\"\nlibdir=\"$runtime/usr/lib\"\nmkdir -p \"$libdir\"\
    \n\n# A library is shipped under the name its users ask for, which is its\n# soname, and not under the versioned\
    \ name the compiler gave the file. The\n# toolchain keeps real files and links beside them; an artifact cannot\
    \ carry\n# a link, so where a link is what the search finds, the file it points at is\n# copied -- and the closure\
    \ check below is what proves that nothing was left\n# behind under a name that is still being asked for.\nship_lib()\
    \ { # ship_lib SONAME\n  local soname=$1 src\n  src=$(find \"$ob\" \"$ft\" \"$tc\" -maxdepth 5 -name \"$soname\"\
    \ -print -quit)\n  test -n \"$src\"\n  cp -L \"$src\" \"$libdir/$soname\"\n  chmod 0755 \"$libdir/$soname\"\n\
    \  printf 'runtime %s %s\\n' \"$soname\" \"$(stat -c %s \"$libdir/$soname\")\"\n}\nship_lib libopenblas.so.0\n\
    ship_lib libgfortran.so.5\nship_lib libquadmath.so.0\nship_lib libgcc_s.so.1\nship_lib libstdc++.so.6\ntest\
    \ \"$(ls \"$libdir\" | wc -l)\" -eq 5\n\nneeded_of() {\n  readelf -d \"$@\" 2>/dev/null | sed -n 's/.*NEEDED.*\\\
    [\\(.*\\)\\]/\\1/p'\n}\nmapfile -t objs < <(find \"$site/numpy\" -type f -name '*.so')\ntest \"${#objs[@]}\"\
    \ -gt 0\nmissing=\"\"\nfor dep in $(needed_of \"${objs[@]}\" \"$libdir\"/*.so.* | sort -u); do\n  test \"$dep\"\
    \ = libc.so && continue\n  test -e \"$libdir/$dep\" || missing=\"$missing $dep\"\ndone\nif test -n \"$missing\"\
    ; then\n  echo \"the wheel needs objects this artifact does not carry:$missing\" >&2\n  exit 1\nfi\nprintf 'runtime\
    \ objects\\t%s\\n' \"$(ls \"$libdir\" | paste -sd' ')\"\n# The check above says every name that is asked for\
    \ is present. This one\n# says every name that is present is asked for: an object that nothing links\n# against\
    \ is a library that was shipped because it looked related, and it\n# would be found by the loader in a program\
    \ that never should have used it.\nfor f in \"$libdir\"/*.so.*; do\n  name=$(basename \"$f\")\n  case \" $(needed_of\
    \ \"${objs[@]}\" \"$libdir\"/*.so.* | sort -u | tr '\\n' ' ') \" in\n    *\" $name \"*) ;;\n    *)\n      echo\
    \ \"$name is in the runtime artifact but nothing links against it\" >&2\n      exit 1\n      ;;\n  esac\ndone\n\
    \npython3 \"$FASE_INPUT_ROOT/packtar.py\" \"$FASE_OUTPUT_ROOT/numpy-runtime\" \"$runtime\"\nzstd -q -t \"$FASE_OUTPUT_ROOT/numpy-runtime\"\
    \ndu -sh \"$runtime\" \"$FASE_OUTPUT_ROOT/numpy-runtime\"\n\n# --- what the artifact says about itself -------------------------------\n\
    #\n# Each value is computed into a variable before the block that prints it.\n# `printf 'k\\t%s\\n' \"$(cmd)\"\
    ` is not equivalent and is a trap: printf's\n# status is its own, so a substitution that fails writes an empty\
    \ field and\n# the step still exits 0 -- and this file is the published record of what\n# the artifact is. A\
    \ field that could not be computed fails the step.\nmkdir -p \"$FASE_OUTPUT_ROOT\"\ncp \"$wheel\" \"$FASE_OUTPUT_ROOT/numpy-2.5.3-cp313-cp313-musllinux_1_2_x86_64.whl\"\
    \nstage=$(\"$pypy\" -c 'import sysconfig; print(sysconfig.get_platform())')\ninterpreter=$(\"$pypy\" -V 2>&1)\n\
    compiler=$(\"$tc/bin/clang\" --version | head -1)\nblas_pc_version=$(sed -n 's/^version=//p' \"$ob/usr/lib/pkgconfig/openblas.pc\"\
    \ | head -1)\nlapack_pc_version=$(sed -n 's/^version=//p' \"$ob/usr/lib/pkgconfig/lapack.pc\" | head -1)\nneeded=$(paste\
    \ -sd, \"$vf/needed.txt\")\nextensions=$(find \"$site/numpy\" -name '*.so' | wc -l)\nruntime=$(ls \"$libdir\"\
    \ | paste -sd, -)\nruntime_bytes=$(du -sb \"$libdir\" | cut -f1)\nfor v in stage interpreter compiler blas_pc_version\
    \ lapack_pc_version \\\n         needed runtime runtime_bytes; do\n  : \"${!v:?$v came out empty}\"\ndone\n\
    test \"$stage\" = musllinux_1_2_x86_64\n{\n  printf 'name\\tnumpy\\n'\n  printf 'version\\t2.5.3\\n'\n  printf\
    \ 'python\\tcp313\\n'\n  printf 'platform\\t%s\\n' \"$stage\"\n  printf 'wheel\\t%s\\n' \"$(basename \"$wheel\"\
    )\"\n  printf 'wheel_bytes\\t%s\\n' \"$(stat -c %s \"$wheel\")\"\n  printf 'interpreter\\t%s\\n' \"$interpreter\"\
    \n  printf 'compiler\\t%s\\n' \"$compiler\"\n  printf 'blas\\t%s\\n' \"$blas_pc_version\"\n  printf 'lapack\\\
    t%s\\n' \"$lapack_pc_version\"\n  printf 'needed\\t%s\\n' \"$needed\"\n  printf 'extensions\\t%s\\n' \"$extensions\"\
    \n  printf 'runtime\\t%s\\n' \"$runtime\"\n  printf 'runtime_bytes\\t%s\\n' \"$runtime_bytes\"\n  printf 'jobs\\\
    t%s\\n' \"$FASE_VAR_JOBS\"\n} > \"$FASE_OUTPUT_ROOT/numpy-build-info.txt\"\ncat \"$FASE_OUTPUT_ROOT/numpy-build-info.txt\"\
    \ndu -sh \"$site\" \"$wheel\"\n"
  workspace:
    taskSizeLimit: 300Gi
    inputSizeLimit: 32Gi
    outputSizeLimit: 32Gi
    transferSizeLimit: 32Gi
  nodeSelector:
    kubernetes.io/hostname: node1
---
