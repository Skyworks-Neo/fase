apiVersion: skyw.top/v1beta1
kind: Task
metadata:
  name: linux-headers-install
  labels:
    capability: linux-headers-install
spec:
  image: gcc:16.2.0-trixie
  imagePullSecrets:
  - name: fase-ghcr-pull
  - name: fase-registry-pull
  command:
  - /bin/bash
  securityContext:
    runAsUser: 0
    runAsNonRoot: false
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: '32'
      memory: 64Gi
      ephemeral-storage: 200Gi
    limits:
      cpu: '32'
      memory: 64Gi
      ephemeral-storage: 300Gi
  env:
  - name: DEBIAN_FRONTEND
    value: noninteractive
  inputs:
    variables:
    - name: jobs
      env: FASE_VAR_JOBS
      required: true
    artifacts:
    - name: source
      path: tarball
      kind: file
    - name: packtar
      path: packtar.py
      kind: file
  outputs:
    artifacts:
    - name: headers
      path: headers.tar.zst
      kind: file
  script: "set -euo pipefail\n\nbuild=/workspace/build\njobs=\"$FASE_VAR_JOBS\"\n\nrm -rf \"$build\"\nmkdir -p \"\
    $build\"\n\ncommand -v zstd >/dev/null 2>&1 || {\n  apt-get update -qq >/dev/null\n  apt-get install -y -qq\
    \ --no-install-recommends zstd >/dev/null\n}\n# headers_install drives the kernel's own build machinery, which\
    \ builds a\n# couple of small helper programs with the host compiler. It never\n# compiles anything for the\
    \ target, so the glibc toolchain of the base\n# image is the right one to use here.\n#\n# rsync is a hard requirement\
    \ of upstream's rule, not a convenience we\n# chose: the last command of the `headers_install` target is\n#\n\
    #   rsync -mrl --include='*/' --include='*.h' --exclude='*' \\\n#       usr/include $(INSTALL_HDR_PATH)\n#\n\
    # (Makefile:1312). Everything before it -- unifdef, the syscall tables,\n# the per-architecture headers -- has\
    \ already run by the time it is\n# reached, so omitting it fails the build at the very last step.\nmissing=\"\
    \"\nfor tool in flex bison rsync; do\n  command -v \"$tool\" >/dev/null 2>&1 || missing=\"$missing $tool\"\n\
    done\nif [ -n \"$missing\" ]; then\n  apt-get update -qq >/dev/null\n  # shellcheck disable=SC2086\n  apt-get\
    \ install -y -qq --no-install-recommends $missing >/dev/null\nfi\n\ntar -xf \"$FASE_INPUT_ROOT/tarball\" -C\
    \ \"$build\"\nsrc=$(find \"$build\" -maxdepth 1 -mindepth 1 -type d -name 'linux-*' | head -1)\ntest -f \"$src/Makefile\"\
    \n\n# INSTALL_HDR_PATH produces <path>/include; the sysroot wants usr/include,\n# so install into a scratch\
    \ path and move the tree into place afterwards.\nmake -C \"$src\" -j\"$jobs\" headers_install INSTALL_HDR_PATH=\"\
    $build/hdr\" \\\n  > \"$build/headers_install.log\" 2>&1 || {\n    echo \"headers_install failed; last 40 lines:\"\
    \ >&2\n    tail -40 \"$build/headers_install.log\" >&2\n    exit 1\n  }\n\nmkdir -p \"$build/out/usr\"\nmv \"\
    $build/hdr/include\" \"$build/out/usr/include\"\n\n# --- verification ------------------------------------------------------\n\
    # A sample of headers across the kernel's user-space ABI, chosen because\n# each one is what a *different* class\
    \ of program includes: netlink\n# configuration tools, block device tools, sound, and the UAPI base.\nfor header\
    \ in asm/types.h asm/unistd.h linux/rtnetlink.h linux/if_tun.h \\\n              linux/fs.h linux/limits.h linux/netlink.h\
    \ mtd/mtd-user.h \\\n              sound/asound.h; do\n  test -f \"$build/out/usr/include/$header\" || {\n \
    \   echo \"missing kernel header: $header\" >&2; exit 1\n  }\ndone\n# The kernel's headers must not leak kernel-internal\
    \ includes: every\n# #include in the installed tree has to resolve inside it or to a libc\n# header. A relative\
    \ escape shows up as an include of a path that does\n# not exist.\n#\n# There is exactly one exception, and\
    \ it is upstream's, not ours:\n# include/uapi/xen/privcmd.h includes <xen/interface/xen.h>, which lives\n# in\
    \ the Xen hypervisor's source tree. The kernel exports privcmd.h\n# anyway; Debian's linux-libc-dev carries\
    \ the same dangling include. The\n# exception is named rather than the check being weakened, so that a\n# *second*\
    \ dangling include -- the actual failure this guards against --\n# still stops the build.\nallowed_dangling=\"\
    xen/interface/xen.h\"\nmissing_include=0\nwhile read -r inc; do\n  case \"$inc\" in\n    generated/*|linux/version.h)\
    \ continue ;;\n    \"$allowed_dangling\") continue ;;\n  esac\n  if [ ! -e \"$build/out/usr/include/$inc\" ];\
    \ then\n    echo \"installed header references absent $inc\" >&2\n    missing_include=1\n  fi\ndone < <(grep\
    \ -rhoE '^#include <(asm|linux|mtd|sound|drm|rdma|xen|video|scsi|crypto|kvm)/[^>]+>' \\\n           \"$build/out/usr/include\"\
    \ | sed -e 's/^#include <//' -e 's/>$//' | sort -u)\ntest \"$missing_include\" -eq 0\n\n# x86_64 exports exactly\
    \ 1000 files. The count is asserted because the\n# checks above are all \"does this that should be there exist\"\
    ; a truncated\n# export that dropped a whole subtree would satisfy them by removing the\n# reference along with\
    \ the target. It is self-diagnosing: a mismatch\n# prints the number it actually found.\nheaders=$(find \"$build/out/usr/include\"\
    \ -type f | wc -l)\necho \"exported $headers headers\"\ntest \"$headers\" -eq 1000\ndu -sh \"$build/out/usr/include\"\
    \n\n# Packing dereferences every symlink, so a link that leaves the tree would\n# silently embed host files.\
    \ The kernel's headers_install is careful to\n# emit real files, but the assertion is cheap.\nif find \"$build/out\"\
    \ -type l -printf '%p -> %l\\n' | grep -q ' -> /'; then\n  echo \"absolute symlink in the installed headers:\"\
    \ >&2; exit 1\nfi\nif [ -n \"$(find \"$build/out\" -xtype l)\" ]; then\n  echo \"dangling symlink in the installed\
    \ headers:\" >&2\n  find \"$build/out\" -xtype l >&2; exit 1\nfi\n\nmkdir -p \"$FASE_OUTPUT_ROOT\"\npython3\
    \ \"$FASE_INPUT_ROOT/packtar.py\" \"$FASE_OUTPUT_ROOT/headers.tar.zst\" \\\n  \"$build/out\" usr\nzstd -q -t\
    \ \"$FASE_OUTPUT_ROOT/headers.tar.zst\"\ndu -sh \"$FASE_OUTPUT_ROOT/headers.tar.zst\"\n"
  workspace:
    taskSizeLimit: 300Gi
    inputSizeLimit: 32Gi
    outputSizeLimit: 32Gi
    transferSizeLimit: 32Gi
  nodeSelector:
    kubernetes.io/hostname: node1
---
