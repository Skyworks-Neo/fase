    \ test_codecs test_csv\n       test_signal test_atexit test_contextlib test_random test_statistics\n       test_concurrent_futures\
    \ test_smtplib test_http_cookiejar test_urllib\"\ntest_jobs=$(( jobs < 16 ? jobs : 16 ))\n# One question the\
    \ suite asks by running a program, and the answer has to come\n# from the right program. `test.support.linked_to_musl()`\
    \ runs `ldd` on the\n# interpreter and looks for the string in its output, because that is how a\n# test suite\
