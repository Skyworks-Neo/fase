apiVersion: skyw.top/v1beta1
kind: Task
metadata:
  name: gcc-cross
  labels:
    capability: gcc-cross
spec:
  image: gcc:16.2.0-trixie
  imagePullSecrets:
  - name: fase-ghcr-pull
  - name: fase-registry-pull
  command:
  - /bin/bash
  securityContext:
    runAsUser: 0
    runAsNonRoot: false
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: '32'
      memory: 64Gi
      ephemeral-storage: 200Gi
    limits:
      cpu: '32'
      memory: 64Gi
      ephemeral-storage: 300Gi
  env:
  - name: DEBIAN_FRONTEND
    value: noninteractive
  inputs:
    variables:
    - name: jobs
      env: FASE_VAR_JOBS
      required: true
    artifacts:
    - name: tc
      path: tc.tar.zst
      kind: file
    - name: source
      path: tarball
      kind: file
    - name: gmp
      path: gmp
      kind: file
    - name: mpfr
      path: mpfr
      kind: file
    - name: mpc
      path: mpc
      kind: file
    - name: packtar
      path: packtar.py
      kind: file
  outputs:
    artifacts:
    - name: tc
      path: tc
      kind: file
  script: "set -eu\nif ! command -v zstd >/dev/null 2>&1; then\n  apt-get update -qq >/dev/null\n  apt-get install\
    \ -y -qq --no-install-recommends zstd >/dev/null\nfi\nmkdir -p /workspace/inputs\nmkdir -p \"/workspace/inputs/tc\"\
    \nzstd -dc \"/in/tc.tar.zst\" | tar -xf - -C \"/workspace/inputs/tc\"\nln -s \"/in/tarball\" \"/workspace/inputs/tarball\"\
    \nln -s \"/in/gmp\" \"/workspace/inputs/gmp\"\nln -s \"/in/mpfr\" \"/workspace/inputs/mpfr\"\nln -s \"/in/mpc\"\
    \ \"/workspace/inputs/mpc\"\nln -s \"/in/packtar.py\" \"/workspace/inputs/packtar.py\"\nexport FASE_INPUT_ROOT=/workspace/inputs\n\
    set -euo pipefail\n\ntc=/opt/tc\nsysroot=\"$tc/x86_64-linux-musl\"\nbuild=/workspace/build\n\nrm -rf \"$tc\"\
    \ \"$build\"\nmkdir -p \"$tc\" \"$build\"\ncp -a \"$FASE_INPUT_ROOT/tc/.\" \"$tc/\"\n\ncommand -v zstd >/dev/null\
    \ 2>&1 || {\n  export DEBIAN_FRONTEND=noninteractive\n  apt-get update -qq >/dev/null\n  apt-get install -y\
    \ -qq --no-install-recommends zstd >/dev/null\n}\n\ntest -x \"$tc/bin/x86_64-linux-musl-ld\"\ntest -f \"$sysroot/usr/include/stdio.h\"\
    \n\ntar -xf \"$FASE_INPUT_ROOT/tarball\" -C \"$build\"\nsrc=$(find \"$build\" -maxdepth 1 -type d -name 'gcc-*')\n\
    test -n \"$src\"\n\n# The three arithmetic libraries GCC needs, supplied as first-class fase\n# artifacts rather\
    \ than re-downloaded here. GCC's configure picks them up\n# from gmp/, mpfr/ and mpc/ inside the source tree.\n\
    for lib in gmp mpfr mpc; do\n  mkdir -p \"$build/$lib.d\"\n  tar -xf \"$FASE_INPUT_ROOT/$lib\" -C \"$build/$lib.d\"\
    \n  inner=$(find \"$build/$lib.d\" -maxdepth 1 -mindepth 1 -type d | head -1)\n  test -n \"$inner\"\n  mv \"\
    $inner\" \"$src/$lib\"\ndone\ntest -d \"$src/gmp\" && test -d \"$src/mpfr\" && test -d \"$src/mpc\"\n\nmkdir\
    \ -p \"$build/obj-gcc\"\ncd \"$build/obj-gcc\"\n\n\"$src/configure\" \\\n  --target=x86_64-linux-musl \\\n \
    \ --prefix=\"$tc\" \\\n  --with-sysroot=\"$sysroot\" \\\n  --with-build-sysroot=\"$sysroot\" \\\n  --enable-languages=c,c++\
    \ \\\n  --disable-nls \\\n  --disable-multilib \\\n  --disable-libssp \\\n  --disable-libquadmath \\\n  --disable-libsanitizer\
    \ \\\n  --disable-libvtv \\\n  --disable-libgomp \\\n  --disable-werror \\\n  --enable-lto \\\n  --enable-initfini-array\
    \ \\\n  --enable-__cxa_atexit \\\n  --enable-threads=posix \\\n  --enable-deterministic-archives\n\n# The Debian\
    \ image ships neither makeinfo nor install-info; a release\n# tarball does not need either, so point both at\
    \ `true` rather than letting\n# the doc rules fail the build.\nmake -j\"$FASE_VAR_JOBS\" MAKEINFO=true\nmake\
    \ install MAKEINFO=true INSTALL_INFO=true\n\n# --- verification ------------------------------------------------------\n\
    cc=\"$tc/bin/x86_64-linux-musl-gcc\"\ncxx=\"$tc/bin/x86_64-linux-musl-g++\"\ntest -x \"$cc\"\ntest -x \"$cxx\"\
    \n\"$cc\" --version | head -1\n\nexport PATH=\"$tc/bin:$PATH\"\n\n# A static C program: no interpreter, and\
    \ it must actually run.\ncat > \"$build/hello.c\" <<'C'\n#include <stdio.h>\n#include <string.h>\nint main(void)\
    \ {\n    const char *s = \"musl-c-static-ok\";\n    printf(\"%s %zu\\n\", s, strlen(s));\n    return 0;\n}\n\
    C\n\"$cc\" -O2 -static -o \"$build/hello\" \"$build/hello.c\"\nif readelf -l \"$build/hello\" | grep -q INTERP;\
    \ then\n  echo \"static C link produced an interpreter\" >&2; exit 1\nfi\n\"$build/hello\" | grep -q musl-c-static-ok\n\
    \n# A dynamic C program: the interpreter must be musl's loader, and it runs\n# because the loader can also be\
    \ installed next to it.\n\"$cc\" -O2 -o \"$build/hello-dyn\" \"$build/hello.c\"\nreadelf -l \"$build/hello-dyn\"\
    \ | grep -q 'ld-musl-x86_64.so.1'\n# $sysroot/usr/lib/libc.so *is* the shared object that doubles as the\n#\
    \ interpreter (the sysroot's lib/ld-musl-*.so.1 is a copy of it).\ninstall -D -m 0755 \"$sysroot/usr/lib/libc.so\"\
    \ /lib/ld-musl-x86_64.so.1\n\"$build/hello-dyn\" | grep -q musl-c-static-ok\n# ... and it must NOT need glibc.\n\
    if readelf -d \"$build/hello-dyn\" | grep -qi 'libc\\.so\\.6'; then\n  echo \"dynamic binary links against glibc\"\
    \ >&2; exit 1\nfi\n\n# A C++ program against libstdc++: LLVM needs a working C++ toolchain.\ncat > \"$build/hello.cc\"\
    \ <<'CPP'\n#include <iostream>\n#include <vector>\n#include <string>\n#include <algorithm>\nint main() {\n \
    \   std::vector<std::string> v{\"llvm\", \"musl\", \"busybox\"};\n    std::sort(v.begin(), v.end());\n    for\
    \ (const auto &s : v) std::cout << s << \"\\n\";\n    return 0;\n}\nCPP\n\"$cxx\" -O2 -static -o \"$build/hello-cc\"\
    \ \"$build/hello.cc\"\n\"$build/hello-cc\" | grep -qx llvm                     # 'busybox' < 'llvm' < 'musl'\n\
    \"$build/hello-cc\" | wc -l | grep -qx 3\n\n# The compiler must not depend on glibc itself in any way that leaks\
    \ into\n# produced binaries.\nif strings \"$build/hello\" | grep -q 'GLIBC_2\\.'; then\n  echo \"produced binary\
    \ carries glibc symbol versions\" >&2; exit 1\nfi\n\n{\n  printf 'gcc\\t%s\\n' \"$(\"$cc\" --version | head\
    \ -1)\"\n  printf 'gxx\\t%s\\n' \"$(\"$cxx\" --version | head -1)\"\n  printf 'target\\t%s\\n' \"$(\"$cc\" -dumpmachine)\"\
    \n  printf 'sysroot\\t%s\\n' \"$(\"$cc\" --print-sysroot)\"\n  printf 'libstdcxx_static_bytes\\t%s\\n' \"$(find\
    \ \"$tc\" -name 'libstdc++.a' -printf '%s\\n' | head -1)\"\n  printf 'jobs\\t%s\\n' \"$FASE_VAR_JOBS\"\n} >\
    \ \"$tc/BUILD-INFO-gcc.txt\"\n\n# Debug info is worth nothing to consumers and is most of the volume here.\n\
    # Archives and ELF images are stripped; relocatable objects inside archives\n# only lose their debug sections,\
    \ so linking behaviour is unchanged.\nfind \"$tc\" -type f -name '*.a' -exec strip -g {} + 2>/dev/null || true\n\
    find \"$tc\" -type f -perm -u+x -exec strip --strip-unneeded {} + 2>/dev/null || true\n\n# Refresh the recorded\
    \ sizes after stripping.\n{\n  printf 'stripped\\tyes\\n'\n  printf 'libstdcxx_static_bytes\\t%s\\n' \"$(find\
    \ \"$tc\" -name 'libstdc++.a' -printf '%s\\n' | head -1)\"\n  printf 'cc1plus_bytes\\t%s\\n' \"$(find \"$tc\"\
    \ -name 'cc1plus' -printf '%s\\n' | head -1)\"\n} >> \"$tc/BUILD-INFO-gcc.txt\"\n\n# Packing dereferences every\
    \ symlink, so a link that leaves the prefix\n# would silently embed host files. Refuse instead.\nif find \"\
    $tc\" -type l -printf '%p -> %l\\n' | grep -q ' -> /'; then\n  echo \"absolute symlink left inside the prefix:\"\
    \ >&2\n  find \"$tc\" -type l -printf '%p -> %l\\n' | grep ' -> /' >&2\n  exit 1\nfi\nif test -n \"$(find \"\
    $tc\" -xtype l)\"; then\n  echo \"dangling symlink left inside the prefix:\" >&2\n  find \"$tc\" -xtype l >&2\n\
    \  exit 1\nfi\n\n# Publish the cumulative prefix through the shared packer, which emits the\n# entry shapes\
    \ fase's archive validator accepts.\nmkdir -p \"$FASE_OUTPUT_ROOT\"\npython3 \"$FASE_INPUT_ROOT/packtar.py\"\
    \ \"$FASE_OUTPUT_ROOT/tc\" \"$tc\"\nzstd -q -t \"$FASE_OUTPUT_ROOT/tc\"\nzstd -dc \"$FASE_OUTPUT_ROOT/tc\" |\
    \ python3 -c \"\nimport sys, tarfile\ntf = tarfile.open(fileobj=sys.stdin.buffer, mode='r|')\nprint('entries',\
    \ sum(1 for _ in tf))\n\"\ndu -sh \"$tc\" \"$FASE_OUTPUT_ROOT/tc\"\n"
  workspace:
    taskSizeLimit: 300Gi
    inputSizeLimit: 32Gi
    outputSizeLimit: 32Gi
    transferSizeLimit: 32Gi
  nodeSelector:
    kubernetes.io/hostname: node1
