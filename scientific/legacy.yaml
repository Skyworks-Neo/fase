    \ ipiv[2];\n    cblas_dgemm(CblasRowMajor, CblasNoTrans, CblasNoTrans, 2, 2, 2, 1.0,\n                a, 2,\
    \ y, 2, 0.0, z, 2);\n    printf(\"gemm %.1f %.1f %.1f %.1f\\n\", z[0], z[1], z[2], z[3]);\n    if (LAPACKE_dgesv(LAPACK_ROW_MAJOR,\
