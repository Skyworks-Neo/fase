apiVersion: skyw.top/v1beta1
kind: Task
metadata:
  name: musl-clang
  labels:
    capability: musl-clang
spec:
  image: gcc:16.2.0-trixie
  imagePullSecrets:
  - name: fase-ghcr-pull
  - name: fase-registry-pull
  command:
  - /bin/bash
  securityContext:
    runAsUser: 0
    runAsNonRoot: false
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: '32'
      memory: 64Gi
      ephemeral-storage: 200Gi
    limits:
      cpu: '32'
      memory: 64Gi
      ephemeral-storage: 300Gi
  inputs:
    variables:
    - name: jobs
      env: FASE_VAR_JOBS
      required: true
    artifacts:
    - name: tc
      path: tc.tar.zst
      kind: file
    - name: source
      path: tarball
      kind: file
    - name: packtar
      path: packtar.py
      kind: file
  outputs:
    artifacts:
    - name: libc
      path: musl
      kind: file
  script: "set -eu\nif ! command -v zstd >/dev/null 2>&1; then\n  apt-get update -qq >/dev/null\n  apt-get install\
    \ -y -qq --no-install-recommends zstd >/dev/null\nfi\nmkdir -p /workspace/inputs\nmkdir -p \"/workspace/inputs/tc\"\
    \nzstd -dc \"/in/tc.tar.zst\" | tar -xf - -C \"/workspace/inputs/tc\"\nln -s \"/in/tarball\" \"/workspace/inputs/tarball\"\
    \nln -s \"/in/packtar.py\" \"/workspace/inputs/packtar.py\"\nexport FASE_INPUT_ROOT=/workspace/inputs\nset -euo\
    \ pipefail\n\ntc=/opt/tc\nsysroot=\"$tc/x86_64-linux-musl\"\nbuild=/workspace/build\njobs=\"$FASE_VAR_JOBS\"\
    \n\nrm -rf \"$tc\" \"$build\"\nmkdir -p \"$tc\" \"$build\"\ncp -a \"$FASE_INPUT_ROOT/tc/.\" \"$tc/\"\nexport\
    \ PATH=\"$tc/bin:$PATH\"\n\ncommand -v zstd >/dev/null 2>&1 || {\n  apt-get update -qq >/dev/null\n  apt-get\
    \ install -y -qq --no-install-recommends zstd >/dev/null\n}\n\ntar -xf \"$FASE_INPUT_ROOT/tarball\" -C \"$build\"\
    \nsrc=$(find \"$build\" -maxdepth 1 -mindepth 1 -type d -name 'musl-*' | head -1)\ntest -f \"$src/configure\"\
    \ncd \"$src\"\n\n# Same options as the first musl build, and the same deliberate absence of\n# --target: musl\
    \ derives CROSS_COMPILE=\"$target-\" the moment an explicit\n# target differs from the build triple, and would\
    \ then look for an\n# x86_64-linux-musl-gcc that does not exist in a clang toolchain. Without\n# --target it\
    \ takes the architecture from `clang -dumpmachine`, which is\n# already x86_64-linux-musl.\n#\n# CC carries\
    \ the sysroot because musl's configure compiles *and runs*\n# probe programs before configuring; those probes\
    \ need a working libc to\n# link against, and the only one on this machine is the first musl.\n# musl's own\
    \ sources are compiled with -nostdinc and use no part of it.\n./configure --prefix=/usr --syslibdir=/lib \\\n\
    \  CC=\"$tc/bin/clang --sysroot=$sysroot\"\n\nmake -j\"$jobs\" AR=\"$tc/bin/llvm-ar\" RANLIB=\"$tc/bin/llvm-ranlib\"\
    \nmake install DESTDIR=\"$build/musl\" \\\n  AR=\"$tc/bin/llvm-ar\" RANLIB=\"$tc/bin/llvm-ranlib\"\n\nout=\"\
    $build/musl\"\n\n# Same absolute-symlink problem as the first musl build, same fix: the\n# loader is installed\
    \ as /usr/lib/libc.so by absolute path, which does not\n# exist here, and the archive format has no symlink\
    \ entries anyway.\nloader=\"$out/lib/ld-musl-x86_64.so.1\"\ntest -L \"$loader\"\ntest \"$(readlink \"$loader\"\
    )\" = /usr/lib/libc.so\nrm -f \"$loader\"\ncp \"$out/usr/lib/libc.so\" \"$loader\"\nhead -c 4 \"$loader\" |\
    \ od -An -tx1 | tr -d ' \\n' | grep -qx 7f454c46\n\n# --- assemble a sysroot around the rebuilt libc ------------------------\n\
    #\n# Everything except the libc is taken from the toolchain's own sysroot:\n# the kernel's uapi headers, clang's\
    \ C++ standard library headers, and\n# GCC's libstdc++ and libgcc, which clang links against for C++ and for\n\
    # unwinding. Only the musl-derived parts -- headers, libc.a, libc.so, the\n# crt objects, the loader -- come\
    \ from the rebuild.\nnewsys=\"$build/newsys\"\nrm -rf \"$newsys\"\nmkdir -p \"$newsys\"\ncp -a \"$out/usr\"\
    \ \"$out/lib\" \"$newsys/\"\ncp -a \"$sysroot/usr/include/.\" \"$newsys/usr/include/\"\ncp -a \"$sysroot/usr/lib/.\"\
    \ \"$newsys/usr/lib/\"\nif [ -d \"$sysroot/lib64\" ]; then cp -a \"$sysroot/lib64\" \"$newsys/\"; fi\n\n# The\
    \ rebuilt libc has to be the one that wins: the toolchain's sysroot\n# also has a libc.a and a libc.so, and\
    \ `cp -a` above brought them along\n# with the C++ libraries it was actually after.\nfor f in libc.a libc.so\
    \ crt1.o crti.o crtn.o Scrt1.o rcrt1.o \\\n         libm.a librt.a libpthread.a libdl.a libutil.a libcrypt.a\
    \ \\\n         libresolv.a libxnet.a; do\n  if [ -e \"$out/usr/lib/$f\" ]; then cp -a \"$out/usr/lib/$f\" \"\
    $newsys/usr/lib/$f\"; fi\ndone\ntest -e \"$newsys/usr/lib/libc.a\"\ntest -e \"$newsys/usr/lib/libc.so\"\ncmp\
    \ -s \"$out/usr/lib/libc.a\" \"$newsys/usr/lib/libc.a\" || {\n  echo \"the rebuilt libc.a did not survive the\
    \ sysroot assembly\" >&2; exit 1\n}\n\ninstall -D -m 0755 \"$newsys/usr/lib/libc.so\" /lib/ld-musl-x86_64.so.1\n\
    \n# --- verification: use the rebuilt libc --------------------------------\ncat > \"$build/probe.c\" <<'C'\n\
    #include <math.h>\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <sys/utsname.h>\n\
    int main(void) {\n    struct utsname u;\n    if (uname(&u) != 0) return 1;\n    printf(\"clang-musl-ok %s %zu\
    \ %.1f\\n\", u.machine, strlen(\"clang-musl-ok\"), sqrt(81.0));\n    return 0;\n}\nC\n\n# Static: self-contained,\
    \ no interpreter, and it has to run.\nclang --sysroot=\"$newsys\" -O2 -static -o \"$build/probe-static\" \"\
    $build/probe.c\"\nif readelf -l \"$build/probe-static\" | grep -q INTERP; then\n  echo \"static probe has an\
    \ interpreter\" >&2; exit 1\nfi\n\"$build/probe-static\" | grep -q 'clang-musl-ok x86_64 13 9.0'\n\n# Dynamic:\
    \ the rebuilt libc.so is doing double duty as the loader, so this\n# is the test that the shared object is a\
    \ well-formed loader at all.\nclang --sysroot=\"$newsys\" -O2 -o \"$build/probe-dyn\" \"$build/probe.c\"\nreadelf\
    \ -l \"$build/probe-dyn\" | grep -q 'ld-musl-x86_64.so.1'\n\"$build/probe-dyn\" | grep -q 'clang-musl-ok x86_64\
    \ 13 9.0'\n\n# C++ on top of it, statically, so the whole stack is exercised at once.\ncat > \"$build/probe.cc\"\
    \ <<'CPP'\n#include <algorithm>\n#include <string>\n#include <vector>\n#include <iostream>\nint main() {\n \
    \   std::vector<std::string> v{\"llvm\", \"musl\", \"busybox\"};\n    std::sort(v.begin(), v.end());\n    for\
    \ (const auto &s : v) std::cout << s << \" \";\n    std::cout << std::endl;\n    return 0;\n}\nCPP\nclang++\
    \ --sysroot=\"$newsys\" -O2 -static -o \"$build/probe-cc\" \"$build/probe.cc\"\n\"$build/probe-cc\" | grep -qx\
    \ 'busybox llvm musl '\n\n# --- record what changed between the two musl builds -------------------\n#\n# Not\
    \ an assertion: two different compilers producing identical objects\n# would be the surprising outcome. The\
    \ sizes and digests are recorded so\n# that the report can state the difference rather than imply there is none.\n\
    {\n  printf 'musl\\t1.2.5\\n'\n  printf 'compiler\\t%s\\n' \"$(clang --version | head -1)\"\n  printf 'jobs\\\
    t%s\\n' \"$jobs\"\n  echo\n  echo \"digest, for information -- the two builds are not expected to match\"\n\
    \  printf '%-22s %10s %10s  %-16s %s\\n' \\\n    file \"first-bytes\" \"new-bytes\" first-digest new-digest\n\
    \  for f in lib/ld-musl-x86_64.so.1 usr/lib/libc.a usr/lib/libc.so \\\n           usr/lib/crt1.o usr/lib/libm.a;\
    \ do\n    if [ -e \"$sysroot/$f\" ] && [ -e \"$out/$f\" ]; then\n      printf '%-22s %10s %10s  %-16s %s\\n'\
    \ \"$f\" \\\n        \"$(stat -c %s \"$sysroot/$f\")\" \"$(stat -c %s \"$out/$f\")\" \\\n        \"$(sha256sum\
    \ \"$sysroot/$f\" | cut -c1-16)\" \\\n        \"$(sha256sum \"$out/$f\" | cut -c1-16)\"\n    fi\n  done\n} >\
    \ \"$out/BUILD-INFO-musl-clang.txt\"\ncat \"$out/BUILD-INFO-musl-clang.txt\"\n\nif find \"$out\" -type l -printf\
    \ '%p -> %l\\n' | grep -q ' -> /'; then\n  echo \"absolute symlink left in the rebuilt musl:\" >&2\n  find \"\
    $out\" -type l -printf '%p -> %l\\n' | grep ' -> /' >&2\n  exit 1\nfi\nif [ -n \"$(find \"$out\" -xtype l)\"\
    \ ]; then\n  echo \"dangling symlink in the rebuilt musl\" >&2\n  find \"$out\" -xtype l >&2; exit 1\nfi\n\n\
    mkdir -p \"$FASE_OUTPUT_ROOT\"\npython3 \"$FASE_INPUT_ROOT/packtar.py\" \"$FASE_OUTPUT_ROOT/musl\" \"$out\"\n\
    zstd -q -t \"$FASE_OUTPUT_ROOT/musl\"\ndu -sh \"$out\" \"$FASE_OUTPUT_ROOT/musl\"\n"
  workspace:
    taskSizeLimit: 300Gi
    inputSizeLimit: 32Gi
    outputSizeLimit: 32Gi
    transferSizeLimit: 32Gi
  nodeSelector:
    kubernetes.io/hostname: node1
---
