          recipe: fetch-v1
    - name: mpfr
      artifactSelector:
        matchLabels:
          name: mpfr-source
          recipe: fetch-v1
    - name: mpc
      artifactSelector:
        matchLabels:
          name: mpc-source
          recipe: fetch-v1
    - name: packtar
      artifactSelector:
        matchLabels:
          name: packtar-tool
          version: v2
  outputs:
    artifacts:
    - name: tc
      from:
        task: build
        artifact: tc
      labels:
        name:
          value: gcc-musl-tc
        version:
          fromInput:
            input: source
            label: version
        musl:
          fromInput:
            input: tc
            label: musl
        binutils:
          fromInput:
            input: tc
            label: version
        gmp:
          fromInput:
            input: gmp
            label: version
        mpfr:
          fromInput:
            input: mpfr
            label: version
        mpc:
          fromInput:
            input: mpc
            label: version
        arch:
          value: amd64
        target:
          value: x86_64-linux-musl
        rev:
          value: r1
        kind:
          value: toolchain
  tasks:
  - name: build
    variables:
      jobs:
        value: '32'
    inputs:
      artifacts:
      - name: tc
        from:
          recipeInput: tc
      - name: source
        from:
          recipeInput: source
      - name: gmp
        from:
          recipeInput: gmp
      - name: mpfr
        from:
          recipeInput: mpfr
      - name: mpc
        from:
          recipeInput: mpc
      - name: packtar
        from:
          recipeInput: packtar
    outputs:
    - name: tc
    taskSelector:
      matchLabels:
        capability: gcc-cross
---
apiVersion: skyw.top/v1beta1
kind: Task
metadata:
  name: gfortran
  labels:
    capability: gfortran
spec:
  image: gcc:16.2.0-trixie
  imagePullSecrets:
  - name: fase-ghcr-pull
  - name: fase-registry-pull
  command:
  - /bin/bash
  securityContext:
    runAsUser: 0
    runAsNonRoot: false
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: '32'
      memory: 64Gi
      ephemeral-storage: 200Gi
    limits:
      cpu: '32'
      memory: 64Gi
      ephemeral-storage: 300Gi
  env:
  - name: DEBIAN_FRONTEND
    value: noninteractive
  inputs:
    variables:
    - name: jobs
      env: FASE_VAR_JOBS
      required: true
    artifacts:
    - name: tc
      path: tc.tar.zst
      kind: file
    - name: source
      path: tarball
      kind: file
    - name: headers
      path: headers.tar.zst
      kind: file
    - name: gmp
      path: gmp
      kind: file
    - name: mpfr
      path: mpfr
      kind: file
    - name: mpc
      path: mpc
      kind: file
    - name: packtar
      path: packtar.py
      kind: file
  outputs:
    artifacts:
    - name: tc
      path: tc
      kind: file
  script: "set -eu\nif ! command -v zstd >/dev/null 2>&1; then\n  apt-get update -qq >/dev/null\n  apt-get install\
    \ -y -qq --no-install-recommends zstd >/dev/null\nfi\nmkdir -p /workspace/inputs\nmkdir -p \"/workspace/inputs/tc\"\
    \nzstd -dc \"/in/tc.tar.zst\" | tar -xf - -C \"/workspace/inputs/tc\"\nln -s \"/in/tarball\" \"/workspace/inputs/tarball\"\
    \nln -s \"/in/headers.tar.zst\" \"/workspace/inputs/headers.tar.zst\"\nln -s \"/in/gmp\" \"/workspace/inputs/gmp\"\
    \nln -s \"/in/mpfr\" \"/workspace/inputs/mpfr\"\nln -s \"/in/mpc\" \"/workspace/inputs/mpc\"\nln -s \"/in/packtar.py\"\
    \ \"/workspace/inputs/packtar.py\"\nexport FASE_INPUT_ROOT=/workspace/inputs\nset -euo pipefail\n\ntc=/opt/tc\n\
    sysroot=\"$tc/x86_64-linux-musl\"\nbuild=/workspace/build\n\nrm -rf \"$tc\" \"$build\"\nmkdir -p \"$tc\" \"\
    $build\"\ncp -a \"$FASE_INPUT_ROOT/tc/.\" \"$tc/\"\n\nif ! command -v zstd >/dev/null 2>&1; then\n  export DEBIAN_FRONTEND=noninteractive\n\
    \  apt-get update -qq >/dev/null\n  apt-get install -y -qq --no-install-recommends zstd >/dev/null\nfi\ncommand\
    \ -v zstd\n\n# The C/C++ toolchain is asserted to be present and complete before anything\n# is added to it.\
    \ This stage installs a second frontend into a prefix that\n# already holds a compiler, and the failure this\
    \ guards against is the one\n# where the install overwrites part of what was there: a prefix that builds\n#\
    \ Fortran and no longer builds C would be published as a toolchain by a\n# stage that never looked.\ntest -x\
    \ \"$tc/bin/x86_64-linux-musl-gcc\"\ntest -x \"$tc/bin/x86_64-linux-musl-g++\"\ntest -x \"$tc/bin/x86_64-linux-musl-as\"\
    \ntest -x \"$tc/bin/x86_64-linux-musl-ld\"\ntest -f \"$sysroot/usr/include/stdio.h\"\ntest -f \"$sysroot/usr/lib/libc.so\"\
    \ntest -e \"$(find \"$tc\" -name 'libstdc++.a' | head -1)\"\n\n# The kernel headers, which the C/C++ stage did\
    \ not need and this one does.\n# musl is a libc, not a definition of the kernel's user-space ABI: the\n# sysroot\
    \ carries no linux/ directory until these are unpacked into it, and\n# OpenBLAS reaches for <linux/...> through\
    \ its own headers. The llvm stage\n# unpacks the same artifact for the same reason.\ntar -xf \"$FASE_INPUT_ROOT/headers.tar.zst\"\
    \ -C \"$sysroot\"\ntest -f \"$sysroot/usr/include/linux/netlink.h\"\ntest -f \"$sysroot/usr/include/asm/unistd.h\"\
    \n\n# The loader, at the path every musl binary names in its own header. Without\n# it the verification programs\
    \ below cannot start, however correctly they\n# were linked. musl's own libc doubles as its loader, so this\
    \ one file is the\n# whole of what a dynamic musl program needs in order to begin.\nmkdir -p /lib\nln -sf \"\
    $sysroot/usr/lib/libc.so\" /lib/ld-musl-x86_64.so.1\n\n# And where the shared libraries are. musl's built-in\
    \ search path is\n# /lib:/usr/local/lib:/usr/lib -- its own defaults, in a container that has\n# no /etc/ld-musl-x86_64.path\
    \ because it is a Debian image. The file written\n# here *replaces* that default, so every directory has to\
    \ be named, and this\n# is the step that a previous revision of this stage got wrong: it named the\n# sysroot's\
    \ usr/lib, where musl lives and where this file was written, and\n# the verification program then failed to\
    \ start because libgfortran.so.5 had\n# been installed into the sysroot's lib64 instead. GCC puts its target\n\
    # libraries in the target's own library directory and that directory is not\n# the one a libc package uses;\
    \ the two are different and both are needed.\n#\n# So the directories are found rather than written down. The\
    \ libraries this\n# will look for do not exist yet at this point in the stage -- the list is\n# what the *toolchain*\
    \ already has, and it is rewritten after `make install`\n# with the list the finished toolchain has.\nwrite_ld_path()\
    \ {\n  local dirs\n  dirs=$(find \"$tc\" \\\n           \\( -name 'libgfortran.so.5' -o -name 'libquadmath.so.0'\
    \ \\\n              -o -name 'libgcc_s.so.1' -o -name 'libstdc++.so.6' \\) \\\n           -printf '%h\\n' |\
    \ sort -u | paste -sd:)\n  printf '%s\\n' \"$sysroot/usr/lib:$sysroot/lib64:$sysroot/lib${dirs:+:$dirs}:/lib:/usr/lib\"\
    \ \\\n    > /etc/ld-musl-x86_64.path\n  cat /etc/ld-musl-x86_64.path\n}\nwrite_ld_path\n\ntar -xf \"$FASE_INPUT_ROOT/tarball\"\
    \ -C \"$build\"\nsrc=$(find \"$build\" -maxdepth 1 -type d -name 'gcc-*')\ntest -n \"$src\"\n\n# GCC's configure\
    \ finds GMP, MPFR and MPC inside its own source tree; they\n# arrive as artifacts rather than being re-downloaded,\
    \ so the versions this\n# compiler is built with are the versions the rest of this pipeline already\n# has,\
    \ and the ones its artifact is labelled with.\nfor lib in gmp mpfr mpc; do\n  mkdir -p \"$build/$lib.d\"\n \
    \ tar -xf \"$FASE_INPUT_ROOT/$lib\" -C \"$build/$lib.d\"\n  inner=$(find \"$build/$lib.d\" -maxdepth 1 -mindepth\
    \ 1 -type d | head -1)\n  test -n \"$inner\"\n  mv \"$inner\" \"$src/$lib\"\ndone\ntest -d \"$src/gmp\" && test\
    \ -d \"$src/mpfr\" && test -d \"$src/mpc\"\n\nexport PATH=\"$tc/bin:$PATH\"\nmkdir -p \"$build/obj-gfortran\"\
    \ncd \"$build/obj-gfortran\"\n\n# The same configure line as the C/C++ stage, one language longer. Nothing\n\
    # here is Fortran-specific except --enable-languages=fortran, and that is the\n# point: a reader comparing the\
    \ two stages is comparing the thing that\n# changed rather than two lists of flags that mostly agree.\n#\n#\
    \ --disable-libquadmath is *not* carried over from the C/C++ configure, and\n# the reason is worth writing down\
    \ because the flag looks harmless and is\n# the one flag of that list which a Fortran build cannot have.\n#\n\
    # libgfortran.h includes <quadmath_weak.h> whenever HAVE_FLOAT128 is\n# defined -- not when the program asks\
    \ for REAL(16), but whenever the\n# compiler has _Float128 at all, which on x86_64 it does. quadmath_weak.h\n\
    # is a file in the libquadmath source directory and it is on the include\n# path only because libquadmath is\
    \ part of the build; with\n# --disable-libquadmath the first libgfortran source to include it dies with\n# \"\
    quadmath_weak.h: No such file or directory\". This combination is not\n# supported upstream: the choice is not\
    \ between libgfortran with quad\n# precision and libgfortran without it, it is between libgfortran and no\n\
    # libgfortran at all. (That is how this flag was found: the build failed in\n# libgfortran with exactly that\
    \ error, having compiled the whole frontend.)\n#\n# What settles it independently is the software above this\
    \ stage. OpenBLAS\n# sets -DEXPRECISION when it is compiled with clang, which sends its LAPACK\n# precision-detection\
    \ routines through __float128; a Fortran toolchain\n# without libquadmath can compile that LAPACK and cannot\
    \ link it. Debian\n# ships libquadmath0 as part of its GCC for the same reason, so enabling it\n# is also the\
    \ choice that matches the distribution this pipeline is measured\n# against. The cost is one shared object,\
    \ libquadmath.so.0, next to\n# libgfortran.so.5 in the sysroot.\n\"$src/configure\" \\\n  --target=x86_64-linux-musl\
    \ \\\n  --prefix=\"$tc\" \\\n  --with-sysroot=\"$sysroot\" \\\n  --with-build-sysroot=\"$sysroot\" \\\n  --enable-languages=fortran\
    \ \\\n  --disable-nls \\\n  --disable-multilib \\\n  --disable-libssp \\\n  --disable-libsanitizer \\\n  --disable-libvtv\
    \ \\\n  --disable-libgomp \\\n  --disable-werror \\\n  --enable-lto \\\n  --enable-initfini-array \\\n  --enable-__cxa_atexit\
    \ \\\n  --enable-threads=posix \\\n  --enable-deterministic-archives\n\nmake -j\"$FASE_VAR_JOBS\" MAKEINFO=true\n\
    make install MAKEINFO=true INSTALL_INFO=true\n\n# The search path again, now that the libraries it is about\
    \ exist: the\n# previous call could only name what the toolchain already had.\nwrite_ld_path\nlibgfortran_dir=$(find\
    \ \"$tc\" -name 'libgfortran.so.5' -printf '%h\\n' | head -1)\ntest -n \"$libgfortran_dir\"\n# The assertion\
    \ is the point: a path file that does not name the directory\n# the runtime was installed into is a path file\
    \ that describes a toolchain\n# this stage did not build, and the failure it causes is a program that\n# links\
    \ and will not run.\ngrep -q -- \"$libgfortran_dir\" /etc/ld-musl-x86_64.path\necho \"libgfortran in $libgfortran_dir\"\
    \n\n# --- verification ------------------------------------------------------\nfc=\"$tc/bin/x86_64-linux-musl-gfortran\"\
    \ntest -x \"$fc\"\n\"$fc\" --version | head -1\n\n# The C and C++ compilers must still be here, and must still\
    \ work rather\n# than merely exist: `make install` of a compiler configured for one language\n# writes over\
    \ the target libraries of the toolchain already installed at this\n# prefix -- libgcc among them -- and the\
    \ one outcome this stage must not\n# produce is a toolchain where installing Fortran cost it C.\ncc=\"$tc/bin/x86_64-linux-musl-gcc\"\
    \ncxx=\"$tc/bin/x86_64-linux-musl-g++\"\ntest -x \"$cc\" && test -x \"$cxx\"\n\"$cc\" --version | head -1\n\"\
    $cxx\" --version | head -1\n\n# The three languages, each compiled and each run. A cross compiler that\n# cannot\
    \ run what it compiles is a compiler whose output nobody has ever\n# executed, and this project does not publish\
    \ those; the loader and the\n# library path above are what make the runs possible.\ncat > \"$build/hello.c\"\
    \ <<'C'\n#include <stdio.h>\nint main(void) { printf(\"c-ok\\n\"); return 0; }\nC\ncat > \"$build/hello.cc\"\
    \ <<'CPP'\n#include <iostream>\n#include <vector>\n#include <string>\nint main() {\n    std::vector<std::string>\
    \ v{\"c\", \"c++\", \"fortran\"};\n    for (const auto &s : v) std::cout << s << \" \";\n    std::cout << std::endl;\n\
    \    return 0;\n}\nCPP\n\"$cc\" -O2 -static \"$build/hello.c\" -o \"$build/hello-c\"\n\"$build/hello-c\" | grep\
    \ -qx c-ok\n\"$cxx\" -O2 -static \"$build/hello.cc\" -o \"$build/hello-cxx\"\n\"$build/hello-cxx\" | grep -qx\
    \ 'c c++ fortran '\n\ncat > \"$build/fase.f90\" <<'F90'\nmodule fase_math\n  implicit none\ncontains\n  pure\
    \ function trace_of(a) result(t)\n    real(8), intent(in) :: a(:, :)\n    real(8) :: t\n    integer :: i\n \
    \   t = 0.0d0\n    do i = 1, min(size(a, 1), size(a, 2))\n      t = t + a(i, i)\n    end do\n  end function\
    \ trace_of\nend module fase_math\n\nprogram fase\n  use fase_math\n  implicit none\n  real(8), allocatable ::\
    \ a(:, :), b(:, :)\n  integer :: i\n  allocate(a(3, 3), b(3, 3))\n  a = reshape([(real(i, 8), i = 1, 9)], [3,\
    \ 3])\n  b = matmul(a, a)\n  write(*, '(A,F10.1)') 'trace ', trace_of(b)\n  write(*, '(A,F10.6)') 'sum   ',\
    \ sum(a)\n  deallocate(a, b)\nend program fase\nF90\n\n# Static first: this one crosses no boundary at all,\
    \ which separates \"the\n# compiler works\" from \"the runtime can be found\" -- different failures with\n#\
    \ the same symptom, and the second is the one a path file gets wrong.\n\"$fc\" -O2 -static \"$build/fase.f90\"\
    \ -o \"$build/fase-static\"\n\"$build/fase-static\" | tee \"$build/fortran.txt\"\ngrep -q '^trace *261\\.0$'\
    \ \"$build/fortran.txt\"\ngrep -q '^sum *45\\.000000$' \"$build/fortran.txt\"\n\n# Then the same program dynamically,\
    \ which needs libgfortran.so.5 to be\n# somewhere the loader looks. The dependency is asserted rather than assumed:\n\
    # a build that had quietly fallen back to a static libgfortran would pass a\n# check on the program's output\
    \ while testing nothing about the run-time\n# case, which is the case OpenBLAS and numpy will be in.\n\"$fc\"\
    \ -O2 \"$build/fase.f90\" -o \"$build/fase-dyn\"\nreadelf -d \"$build/fase-dyn\" | grep -q 'libgfortran'\n\"\
    $build/fase-dyn\" > \"$build/fortran-dyn.txt\"\ncmp -s \"$build/fortran.txt\" \"$build/fortran-dyn.txt\"\n\n\
    # The mixed-language case, which is OpenBLAS in miniature: a C main, a\n# Fortran routine called through a C\
    \ binding, and the Fortran driver doing\n# the linking. This is the shape of the build above it -- a C library\
    \ with\n# Fortran kernels inside it -- and it is the case where a missing runtime\n# library or a mismatched\
    \ calling convention hides until the day somebody\n# links, which here is now rather than then.\ncat > \"$build/scale.f90\"\
    \ <<'F90'\nmodule fase_scale_mod\n  use iso_c_binding, only: c_int, c_double\n  implicit none\ncontains\n  subroutine\
    \ fase_scale(n, alpha, x) bind(c, name=\"fase_scale\")\n    integer(c_int), value :: n\n    real(c_double),\
    \ value :: alpha\n    real(c_double) :: x(n)\n    x = alpha * x\n  end subroutine fase_scale\nend module fase_scale_mod\n\
    F90\ncat > \"$build/mixed.c\" <<'C'\n#include <stdio.h>\nvoid fase_scale(int n, double alpha, double *x);\n\
    int main(void) {\n    double x[3] = {1.0, 2.0, 3.0};\n    int i;\n    fase_scale(3, 2.5, x);\n    for (i = 0;\
    \ i < 3; i++) printf(\"%s%.1f\", i ? \" \" : \"\", x[i]);\n    printf(\"\\n\");\n    return x[2] == 7.5 ? 0\
    \ : 1;\n}\nC\n\"$fc\" -O2 \"$build/mixed.c\" \"$build/scale.f90\" -o \"$build/mixed\"\ngot=$(\"$build/mixed\"\
    )\ntest \"$got\" = \"2.5 5.0 7.5\"\n\n# Quad precision, the reason libquadmath is in this build at all. The\
    \ test\n# is built to fail for a double and to say so in a way that does not depend\n# on rounding: digits(real(16))\
    \ is 113 and digits(real(8)) is 53, and the\n# arithmetic assertion below is looser than quad precision and\
    \ tighter than\n# anything a double can reach. Both links are made -- the static one needs\n# libquadmath.a,\
    \ the dynamic one needs libquadmath.so.0 on the loader path,\n# and those are two different ways for this to\
    \ be absent.\ncat > \"$build/quad.f90\" <<'F90'\nprogram quad\n  implicit none\n  real(16) :: third, back\n\
    \  integer :: d\n  d = digits(1.0_16)\n  third = 1.0_16 / 3.0_16\n  back = third * 3.0_16\n  if (d /= 113) error\
    \ stop 1\n  if (abs(back - 1.0_16) > 1.0e-30_16) error stop 1\n  if (epsilon(1.0_16) >= 1.0e-33_16) error stop\
    \ 1\n  print '(A,I0)', 'digits ', d\n  write(*, '(A,F40.30)') 'third ', third\nend program quad\nF90\n\"$fc\"\
    \ -O2 -static \"$build/quad.f90\" -o \"$build/quad-static\"\n\"$build/quad-static\" | tee \"$build/quad-static.txt\"\
    \ngrep -qx 'digits 113' \"$build/quad-static.txt\"\ngrep -Eq '^third +0\\.3{25,}$' \"$build/quad-static.txt\"\
    \nif strings \"$build/quad-static\" | grep -q 'GLIBC_2\\.'; then\n  echo \"the static quad-precision binary\
    \ carries glibc symbol versions\" >&2\n  exit 1\nfi\n\"$fc\" -O2 \"$build/quad.f90\" -o \"$build/quad-dyn\"\n\
    readelf -d \"$build/quad-dyn\" | grep -q 'libquadmath'\n\"$build/quad-dyn\" > \"$build/quad-dyn.txt\"\ncmp -s\
    \ \"$build/quad-static.txt\" \"$build/quad-dyn.txt\"\n\n# Nothing here may be a glibc program. The compiler\
    \ runs on glibc and the\n# temptation is for something to leak through the driver's own defaults --\n# which\
    \ is exactly the check the C/C++ stage makes about its own output.\nif readelf -d \"$build/fase-dyn\" | grep\
    \ -qi 'libc\\.so\\.6'; then\n  echo \"the Fortran binary links against glibc\" >&2\n  exit 1\nfi\nif strings\
    \ \"$build/fase-static\" | grep -q 'GLIBC_2\\.'; then\n  echo \"the static Fortran binary carries glibc symbol\
    \ versions\" >&2\n  exit 1\nfi\n\n{\n  printf 'gfortran\\t%s\\n' \"$(\"$fc\" --version | head -1)\"\n  printf\
    \ 'gcc\\t%s\\n' \"$(\"$cc\" --version | head -1)\"\n  printf 'target\\t%s\\n' \"$(\"$fc\" -dumpmachine)\"\n\
    \  printf 'sysroot\\t%s\\n' \"$(\"$fc\" --print-sysroot)\"\n  printf 'libgfortran\\t%s\\n' \"$(find \"$tc\"\
    \ -name 'libgfortran.so.5' -printf '%p %s\\n' | head -1)\"\n  printf 'libquadmath\\t%s\\n' \"$(find \"$tc\"\
    \ -name 'libquadmath.so.0' -printf '%p %s\\n' | head -1)\"\n  printf 'f951_bytes\\t%s\\n' \"$(find \"$tc\" -name\
    \ f951 -printf '%s\\n' | head -1)\"\n  printf 'jobs\\t%s\\n' \"$FASE_VAR_JOBS\"\n} > \"$tc/BUILD-INFO-gfortran.txt\"\
    \n\n# --- stripping ---------------------------------------------------------\n#\n# GCC builds its own front\
    \ ends with -g, and in an unstripped prefix the\n# debug information is most of the file: the f951 and cc1 in\
    \ this prefix are\n# 396MB each, and the same two binaries stripped are around 30MB. An earlier\n# revision\
    \ of this stage stripped only the files it added, on the assumption\n# that the stage below had stripped its\
    \ own -- the artifact's contents say\n# otherwise, so the whole prefix is stripped here.\n#\n# A distribution\
    \ does this in the package and publishes the debug\n# information separately in a -dbg package; a stage that\
    \ publishes one\n# tarball has nowhere to put it and drops it. The two kinds of file do not\n# want the same\
    \ treatment: an archive keeps the symbol table its future\n# linker reads, so only the debug sections go (--strip-debug),\
    \ while a\n# program or shared object needs nothing but its dynamic symbols\n# (--strip-unneeded). Non-ELF files\
    \ -- the odd shell wrapper a `bin`\n# directory carries -- are skipped by their magic instead of by running\n\
    # strip and ignoring the failure, because an ignored failure is exactly how\n# a strip that stopped working\
    \ goes unnoticed until a transfer rejects the\n# result.\n#\n# One strip per inode, and the other names of that\
    \ inode relinked to the\n# result.\n#\n# The prefix is not a set of independent files. The artifacts it came\
    \ from\n# carried symlinks -- a soname is one -- and packing dereferences them, so\n# libstdc++.so.6 and libstdc++.so.6.0.36\
    \ are two names for one inode, and\n# the sysroot's lib64 and usr/lib hold more names for the same files: twelve\n\
    # inodes in this tree have more than one name, one of them six.\n#\n# strip decides whether it may rewrite a\
    \ file in place by comparing names.\n# Given one name it writes a temporary file and renames it over the\n#\
    \ original; given the same inode under two different names -- which is what\n# a loop over `find` does -- it\
    \ sees two files, opens the second for\n# writing, and truncates the inode the first is reading. Two of those\
    \ at\n# once produce a file that is half of each: \"file format not recognized\",\n# \"[.text]: invalid operation\"\
    , and, when the loser has the file mapped, a\n# Bus error inside strip. This is what cost this stage three revisions,\
    \ and\n# it was not rare: names of one inode sort adjacently, so handing the list\n# to eight workers hands\
    \ one inode to all eight at the same moment.\n#\n# So the names are grouped by inode and each group is one job:\
    \ the first\n# name is stripped and the rest are relinked to it. Relinking rather than\n# stripping each name\
    \ on its own is also what keeps the artifact small -- a\n# name left alone would hold the unstripped inode for\
    \ the rest of the\n# stage -- and it preserves the tree's own structure, which is the\n# structure the next\
    \ stage copies. Eight jobs at a time, because the work\n# is bound by the page cache and the disk rather than\
    \ by the CPU, and a\n# failure is retried once and then named, because the message strip prints\n# does not\
    \ say which file it was stripping.\nbefore_mib=$(du -sm \"$tc\" | cut -f1)\nstrip_failed=0\nfind \"$tc\" -type\
    \ f \\( -name '*.a' -o -perm -u+x \\) -printf '%i\\t%p\\n' \\\n  | sort -k1,1n -k2,2 \\\n  | awk -F'\\t' '\n\
    \      $1 != inode {\n        if (n) printf \"%s%c\", group, 0\n        inode = $1\n        group = \"\"\n \
    \       n = 0\n      }\n      {\n        group = group (n ? \"\\n\" : \"\") $2\n        n++\n      }\n     \
    \ END { if (n) printf \"%s%c\", group, 0 }\n    ' \\\n  | xargs -0 -r -n1 -P8 bash -c '\n    first=\"\"\n  \
    \  while IFS= read -r p; do\n      test -n \"$p\" || continue\n      if test -z \"$first\"; then\n        first=$p\n\
    \        magic=$(od -An -N4 -tx1 \"$p\" 2>/dev/null | tr -d \" \\n\")\n        test \"$magic\" = 7f454c46 ||\
    \ break\n        case \"$p\" in\n          *.a) kind=--strip-debug ;;\n          *)   kind=--strip-unneeded\
    \ ;;\n        esac\n        if ! strip \"$kind\" \"$p\"; then\n          strip \"$kind\" \"$p\" || { echo \"\
    strip failed twice: $p\" >&2; exit 1; }\n        fi\n      elif test \"$(stat -c %i \"$first\")\" != \"$(stat\
    \ -c %i \"$p\")\"; then\n        ln -f \"$first\" \"$p\"\n      fi\n    done <<< \"$1\"\n  ' _ || strip_failed=1\n\
    test \"$strip_failed\" = 0\nafter_mib=$(du -sm \"$tc\" | cut -f1)\n# 1674MiB is what this prefix measures unstripped\
    \ and 237MiB is what the\n# strip above makes of it; a tree that is still most of its original size\n# is a\
    \ strip that reached part of it -- which is what a relink that did not\n# happen leaves behind, since the names\
    \ it skipped keep the full file while\n# the stripped ones are small enough for every check above to pass.\n\
    test \"$after_mib\" -lt 400\ntest \"$after_mib\" -lt \"$before_mib\"\n{\n  printf 'stripped\\tyes\\n'\n  printf\
    \ 'prefix_mib\\t%s\\n' \"$after_mib\"\n  printf 'f951_bytes\\t%s\\n' \"$(find \"$tc\" -name f951 -printf '%s\\\
    n' | head -1)\"\n  printf 'cc1_bytes\\t%s\\n' \"$(find \"$tc\" -name cc1 -printf '%s\\n' | head -1)\"\n} >>\
    \ \"$tc/BUILD-INFO-gfortran.txt\"\n\n# The strip is checked rather than trusted. It is the last thing this stage\n\
    # does and the first thing every stage above it depends on, and it rewrote\n# every one of those dependencies:\
    \ the loader is musl's libc.so, the two\n# quad programs need libgfortran.so.5 and libquadmath.so.0 (the static\
    \ one\n# needs their archives instead), and lto1 is a front end that was 396MB and\n# is now a fraction of that.\
    \ Each program below is built or run after the\n# strip and fails if any of those went wrong -- a prefix that\
    \ is 1.4GB\n# smaller and cannot compile, link or run a program would otherwise be\n# published, and the stage\
    \ that noticed would be the one above.\n\"$build/fase-dyn\" > \"$build/fortran-stripped.txt\"\ncmp -s \"$build/fortran.txt\"\
    \ \"$build/fortran-stripped.txt\"\n\"$build/quad-dyn\" > \"$build/quad-stripped.txt\"\ncmp -s \"$build/quad-static.txt\"\
    \ \"$build/quad-stripped.txt\"\n\"$cc\" -O2 -static \"$build/hello.c\" -o \"$build/hello-c-stripped\"\n\"$build/hello-c-stripped\"\
    \ | grep -qx c-ok\n\"$fc\" -O2 -static \"$build/quad.f90\" -o \"$build/quad-static-stripped\"\n\"$build/quad-static-stripped\"\
    \ | grep -qx 'digits 113'\n\"$cc\" -O2 -flto \"$build/hello.c\" -o \"$build/lto-c\"\n\"$build/lto-c\" | grep\
    \ -qx c-ok\n\"$fc\" -O2 -flto \"$build/fase.f90\" -o \"$build/lto-f\"\n\"$build/lto-f\" | grep -q '^trace *261\\\
    .0$'\n\n# C++ again, both ways, because libstdc++ is the one library in this prefix\n# that is also a hardlinked\
    \ group of six names, and it is the one the\n# software above this stage ships: numpy's extension modules link\n\
    # libstdc++.so.6, and a strip that damaged either the archive's symbol table\n# or the shared object's dynamic\
    \ symbols would be found here rather than in\n# the numpy build an hour later.\n\"$cxx\" -O2 -static \"$build/hello.cc\"\
    \ -o \"$build/hello-cxx-stripped\"\n\"$build/hello-cxx-stripped\" | grep -qx 'c c++ fortran '\n\"$cxx\" -O2\
    \ \"$build/hello.cc\" -o \"$build/hello-cxx-dyn\"\nreadelf -d \"$build/hello-cxx-dyn\" | grep -q libstdc++\n\
    \"$build/hello-cxx-dyn\" | grep -qx 'c c++ fortran '\n\n# Packing dereferences symlinks, so a link that leaves\
    \ the prefix would\n# silently embed host files. Installing a second language into a prefix is\n# exactly the\
    \ operation that can leave one behind.\nif find \"$tc\" -type l -printf '%p -> %l\\n' | grep -q ' -> /'; then\n\
    \  echo \"absolute symlink left inside the prefix:\" >&2\n  find \"$tc\" -type l -printf '%p -> %l\\n' | grep\
    \ ' -> /' >&2\n  exit 1\nfi\nif test -n \"$(find \"$tc\" -xtype l)\"; then\n  echo \"dangling symlink left inside\
    \ the prefix:\" >&2\n  find \"$tc\" -xtype l >&2\n  exit 1\nfi\n\nmkdir -p \"$FASE_OUTPUT_ROOT\"\npython3 \"\
    $FASE_INPUT_ROOT/packtar.py\" \"$FASE_OUTPUT_ROOT/tc\" \"$tc\"\nzstd -q -t \"$FASE_OUTPUT_ROOT/tc\"\nzstd -dc\
    \ \"$FASE_OUTPUT_ROOT/tc\" | python3 -c \"\nimport sys, tarfile\nprint('entries', sum(1 for _ in tarfile.open(fileobj=sys.stdin.buffer,\
    \ mode='r|')))\n\"\ndu -sh \"$tc\" \"$FASE_OUTPUT_ROOT/tc\"\n# Every later stage fetches this artifact through\
    \ a transfer that refuses\n# more than 512MiB, and the refusal happens after the build, from a\n# container\
    \ that is not this one -- a sentence about bytes and nothing about\n# the strip above that was supposed to prevent\
    \ it. The bound is that limit\n# with room to spare, so the failure lands in the stage that caused it.\npacked=$(stat\
    \ -c %s \"$FASE_OUTPUT_ROOT/tc\")\nprintf 'packed_bytes\\t%s\\n' \"$packed\"\ntest \"$packed\" -lt 400000000\n"
  workspace:
    taskSizeLimit: 300Gi
    inputSizeLimit: 32Gi
    outputSizeLimit: 32Gi
    transferSizeLimit: 32Gi
  nodeSelector:
    kubernetes.io/hostname: node1
---
apiVersion: skyw.top/v1beta1
kind: Recipe
metadata:
  name: gfortran
spec:
  inputs:
    artifacts:
    - name: tc
      artifactSelector:
        matchLabels:
          name: gcc-musl-tc
          rev: r1
    - name: source
      artifactSelector:
        matchLabels:
          name: gcc-source
          recipe: fetch-v1
    - name: headers
      artifactSelector:
        matchLabels:
          name: linux-headers
          recipe: headers-v1
    - name: gmp
      artifactSelector:
        matchLabels:
          name: gmp-source
          recipe: fetch-v1
    - name: mpfr
      artifactSelector:
        matchLabels:
          name: mpfr-source
          recipe: fetch-v1
    - name: mpc
      artifactSelector:
        matchLabels:
          name: mpc-source
          recipe: fetch-v1
    - name: packtar
      artifactSelector:
        matchLabels:
          name: packtar-tool
          version: v2
  outputs:
    artifacts:
    - name: tc
      from:
        task: build
        artifact: tc
      labels:
        name:
          value: fase-tc
        languages:
          value: c-cpp-fortran
        gcc:
          fromInput:
            input: source
            label: version
        binutils:
          fromInput:
            input: tc
            label: binutils
        musl:
          fromInput:
            input: tc
            label: musl
        gmp:
          fromInput:
            input: gmp
            label: version
        mpfr:
          fromInput:
            input: mpfr
            label: version
        mpc:
          fromInput:
            input: mpc
            label: version
        arch:
          value: amd64
        target:
          value: x86_64-linux-musl
        rev:
          value: r5
        base:
          fromInput:
            input: tc
            label: name
        kind:
          value: toolchain
  tasks:
  - name: build
    variables:
      jobs:
        value: '32'
    inputs:
      artifacts:
      - name: tc
        from:
          recipeInput: tc
      - name: source
        from:
          recipeInput: source
      - name: headers
        from:
          recipeInput: headers
      - name: gmp
        from:
          recipeInput: gmp
      - name: mpfr
        from:
          recipeInput: mpfr
      - name: mpc
        from:
          recipeInput: mpc
      - name: packtar
        from:
          recipeInput: packtar
    outputs:
    - name: tc
    taskSelector:
      matchLabels:
        capability: gfortran
---
apiVersion: skyw.top/v1beta1
kind: Task
metadata:
  name: llvm-clang-l2
  labels:
    capability: llvm-clang-l2
spec:
  image: gcc:16.2.0-trixie
  imagePullSecrets:
  - name: fase-ghcr-pull
  - name: fase-registry-pull
  command:
  - /bin/bash
  securityContext:
    runAsUser: 0
    runAsNonRoot: false
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: '32'
      memory: 64Gi
      ephemeral-storage: 200Gi
    limits:
      cpu: '32'
      memory: 64Gi
      ephemeral-storage: 300Gi
  inputs:
    variables:
    - name: jobs
      env: FASE_VAR_JOBS
      required: true
    artifacts:
    - name: tc
      path: tc.tar.zst
      kind: file
    - name: source
      path: tarball
      kind: file
    - name: headers
      path: headers.tar.zst
      kind: file
    - name: packtar
      path: packtar.py
      kind: file
  outputs:
    artifacts:
    - name: tc
      path: tc
      kind: file
  script: "set -eu\nif ! command -v zstd >/dev/null 2>&1; then\n  apt-get update -qq >/dev/null\n  apt-get install\
    \ -y -qq --no-install-recommends zstd >/dev/null\nfi\nmkdir -p /workspace/inputs\nmkdir -p \"/workspace/inputs/tc\"\
    \nzstd -dc \"/in/tc.tar.zst\" | tar -xf - -C \"/workspace/inputs/tc\"\nln -s \"/in/tarball\" \"/workspace/inputs/tarball\"\
    \nln -s \"/in/headers.tar.zst\" \"/workspace/inputs/headers.tar.zst\"\nln -s \"/in/packtar.py\" \"/workspace/inputs/packtar.py\"\
    \nexport FASE_INPUT_ROOT=/workspace/inputs\nset -euo pipefail\n\ntc=/opt/tc\nsysroot=\"$tc/x86_64-linux-musl\"\
    \nbuild=/workspace/build\njobs=\"$FASE_VAR_JOBS\"\n\nrm -rf \"$tc\" \"$build\"\nmkdir -p \"$tc\" \"$build\"\n\
    cp -a \"$FASE_INPUT_ROOT/tc/.\" \"$tc/\"\n\n# cmake, ninja and zstd are host tools: they run on the build host\
    \ and never\n# on the target, so a glibc build of them from the Debian base image is the\n# correct choice,\
    \ not a shortcut.\nexport DEBIAN_FRONTEND=noninteractive\n\n# The command we need and the package that ships\
    \ it are not always the same\n# name: Debian's ninja is packaged as ninja-build while the binary it installs\n\
    # is plain `ninja`. Test for the binary -- that is what the build actually\n# invokes -- but ask apt for the\
    \ package.\npkg_for() {\n  case \"$1\" in\n    ninja) echo ninja-build ;;\n    *)     echo \"$1\" ;;\n  esac\n\
    }\nmissing=\"\"\nfor tool in cmake ninja zstd python3; do\n  command -v \"$tool\" >/dev/null 2>&1 || missing=\"\
    $missing $(pkg_for \"$tool\")\"\ndone\nif [ -n \"$missing\" ]; then\n  apt-get update -qq >/dev/null\n  # shellcheck\
    \ disable=SC2086\n  apt-get install -y -qq --no-install-recommends $missing >/dev/null\nfi\ncommand -v cmake\
    \ ninja zstd python3\n\n# The toolchain's own binaries are musl binaries. If one of them is linked\n# dynamically\
    \ its interpreter is the absolute path /lib/ld-musl-x86_64.so.1,\n# which does not exist on the Debian build\
    \ image; installing it here is what\n# lets a musl-linked clang run at all inside this container.\ninstall -D\
    \ -m 0755 \"$sysroot/usr/lib/libc.so\" /lib/ld-musl-x86_64.so.1\n\n# Prefer the toolchain's own binutils shims\
    \ over the host's.\nexport PATH=\"$tc/bin:$PATH\"\n# --- build --------------------------------------------------------------\n\
    mkdir -p \"$build/src\"\ntar -xf \"$FASE_INPUT_ROOT/tarball\" -C \"$build/src\"\nsrc=$(find \"$build/src\" -maxdepth\
    \ 1 -mindepth 1 -type d | head -1)\ntest -f \"$src/llvm/CMakeLists.txt\"\n# llvm-project-22.1.6.src -> 22.1.6\n\
    version=$(basename \"$src\" | sed -e 's/^llvm-project-//' -e 's/\\.src$//')\necho \"building llvm-project $version\
    \ from $src\"\ncmake -G Ninja -S \"$src/llvm\" -B \"$build/obj\" \\\n      -DCMAKE_BUILD_TYPE=Release \\\n \
    \     -DCMAKE_INSTALL_PREFIX=\"$tc\" \\\n      -DCMAKE_SYSROOT=\"$sysroot\" \\\n      -DCMAKE_C_COMPILER_TARGET=x86_64-linux-musl\
    \ \\\n      -DCMAKE_CXX_COMPILER_TARGET=x86_64-linux-musl \\\n      -DCMAKE_C_FLAGS=\"-fno-pie --sysroot=$sysroot\"\
    \ \\\n      -DCMAKE_CXX_FLAGS=\"-fno-pie --sysroot=$sysroot\" \\\n      -DCMAKE_C_FLAGS_RELEASE=\"-O2 -DNDEBUG\"\
    \ \\\n      -DCMAKE_CXX_FLAGS_RELEASE=\"-O2 -DNDEBUG\" \\\n      -DCMAKE_EXE_LINKER_FLAGS=\"-static -no-pie\"\
    \ \\\n      -DLLVM_PARALLEL_LINK_JOBS=4 \\\n      -DLLVM_ENABLE_PROJECTS=\"clang;lld\" \\\n      -DLLVM_ENABLE_RUNTIMES=\"\
    compiler-rt\" \\\n      -DLLVM_TARGETS_TO_BUILD=X86 \\\n      -DLLVM_DEFAULT_TARGET_TRIPLE=x86_64-linux-musl\
    \ \\\n      -DLLVM_HOST_TRIPLE=x86_64-linux-musl \\\n      -DLLVM_DISTRIBUTION_COMPONENTS=\"clang;clang-resource-headers;lld;builtins;llvm-ar;llvm-ranlib;llvm-nm;llvm-objcopy;llvm-objdump;llvm-readobj;llvm-readelf;llvm-size;llvm-strings;llvm-strip;llvm-symbolizer;llvm-profdata;llvm-cxxfilt;llvm-dwarfdump;llvm-config;llvm-addr2line\"\
    \ \\\n      -DLLVM_ENABLE_ASSERTIONS=OFF \\\n      -DLLVM_ENABLE_WERROR=OFF \\\n      -DLLVM_ENABLE_RTTI=OFF\
    \ \\\n      -DLLVM_ENABLE_EH=OFF \\\n      -DLLVM_ENABLE_PLUGINS=OFF \\\n      -DLLVM_ENABLE_ZLIB=OFF \\\n \
    \     -DLLVM_ENABLE_ZSTD=OFF \\\n      -DLLVM_ENABLE_LIBXML2=OFF \\\n      -DLLVM_ENABLE_LIBEDIT=OFF \\\n  \
    \    -DLLVM_ENABLE_CURL=OFF \\\n      -DLLVM_ENABLE_HTTPLIB=OFF \\\n      -DLLVM_ENABLE_BINDINGS=OFF \\\n  \
    \    -DLLVM_INCLUDE_TESTS=OFF \\\n      -DLLVM_INCLUDE_BENCHMARKS=OFF \\\n      -DLLVM_INCLUDE_EXAMPLES=OFF\
    \ \\\n      -DLLVM_INCLUDE_DOCS=OFF \\\n      -DLLVM_BUILD_EXAMPLES=OFF \\\n      -DLLVM_INSTALL_BINUTILS_SYMLINKS=OFF\
    \ \\\n      -DCLANG_INCLUDE_TESTS=OFF \\\n      -DCLANG_ENABLE_STATIC_ANALYZER=OFF \\\n      -DCLANG_LINKS_TO_CREATE=\"\
    clang++\" \\\n      -DLLD_SYMLINKS_TO_CREATE=\"ld.lld\" \\\n      -DCOMPILER_RT_DEFAULT_TARGET_ONLY=ON \\\n\
    \      -DCOMPILER_RT_BUILD_SANITIZERS=OFF \\\n      -DCOMPILER_RT_BUILD_XRAY=OFF \\\n      -DCOMPILER_RT_BUILD_LIBFUZZER=OFF\
    \ \\\n      -DCOMPILER_RT_BUILD_PROFILE=OFF \\\n      -DCOMPILER_RT_BUILD_MEMPROF=OFF \\\n      -DCOMPILER_RT_BUILD_ORC=OFF\
    \ \\\n      -DCOMPILER_RT_BUILD_CTX_PROFILE=OFF \\\n      -DCOMPILER_RT_BUILD_CRT=ON \\\n      -DCMAKE_C_COMPILER=\"\
    $tc/bin/x86_64-linux-musl-gcc\" \\\n      -DCMAKE_CXX_COMPILER=\"$tc/bin/x86_64-linux-musl-g++\" \\\n      -DCLANG_DEFAULT_RTLIB=compiler-rt\
    \ \\\n      -DCLANG_DEFAULT_CXX_STDLIB=libstdc++ \\\n      -DCLANG_DEFAULT_UNWINDLIB=libgcc \\\n\n# Only the\
    \ components named in LLVM_DISTRIBUTION_COMPONENTS are built and\n# installed, so this does not pull in the\
    \ two hundred other LLVM tools.\n#\n# DESTDIR, and not the prefix, is the point of this line. With a distribution\n\
    # build every component is installed as soon as its own target is ready, so\n# the installs are interleaved\
    \ with the build rather than following it: of the\n# three hundred-odd steps after this one, dozens are installs.\
    \ That makes\n# every file the build *executes out of the prefix* a file that another part\n# of the same build\
    \ may be rewriting at that moment -- and this build, whose\n# whole purpose is to replace the toolchain it is\
    \ running from, executes\n# llvm-ar on every static-library link, clang on every compile, and ld.lld\n# through\
    \ -fuse-ld=lld on every link. l3 found this the expensive way: a link\n# died with \"Permission denied\" on\
    \ a file that plainly existed and was\n# executable, four thousand targets into a build.\n#\n# Staging the tools\
    \ elsewhere would not be enough, and would be worse than it\n# looks: clang finds its builtin headers and compiler-rt\
    \ by walking up from\n# the path it was invoked at, so a copied clang needs --resource-dir, which\n# points\
    \ back into the tree this build installs into. The install is\n# redirected instead, and merged into the prefix\
    \ once nothing is left running\n# from it. Nothing that is exec'd, read as a header or searched for a library\n\
    # lives in a directory being written to.\nrm -rf \"$build/stage\"\nDESTDIR=\"$build/stage\" ninja -C \"$build/obj\"\
    \ -j\"$jobs\" install-distribution\ntest -d \"$build/stage$tc\"   # destdir + absolute prefix = $build/stage/opt/tc\n\
    # cp -a rather than a move: the prefix holds the previous generation's clang,\n# lld and clang.cfg as well,\
    \ and the copies this build does not install\n# (nothing, as it happens, but the invariant is what makes that\
    \ reviewable)\n# have to survive.\ncp -a \"$build/stage$tc/.\" \"$tc/\"\ntest -x \"$tc/bin/clang\"\ntest -x\
    \ \"$tc/bin/lld\"\n\n# Debug info is most of the volume and worth nothing to consumers. Archives\n# only lose\
    \ their debug sections, so linking behaviour is unchanged.\nfind \"$tc\" -type f -name '*.a' -exec strip -g\
    \ {} + 2>/dev/null || true\nfind \"$tc\" -type f -perm -u+x -exec strip --strip-unneeded {} + 2>/dev/null ||\
    \ true\n# --- give clang a sysroot it understands --------------------------------\n#\n# GCC does not install\
    \ in the layout clang searches: its target libraries land\n# in <sysroot>/lib64 and its C++ headers in <sysroot>/include/c++/<version>,\n\
    # while clang's GCCInstallationDetector looks for those libraries in\n# <sysroot>/usr/lib and derives the headers\
    \ from\n# <sysroot>/usr/lib/gcc/<triple>/<version>. The trees are moved to where clang\n# already looks rather\
    \ than hard-coding -isystem and -L into every downstream\n# consumer, which would still be wrong the moment\
    \ anything used the compiler\n# as plain `clang foo.c`.\n#\n# Every move below is written as \"move it if it\
    \ is still where GCC put it\",\n# because this fragment runs on all three llvm stages and only the first is\n\
    # built by GCC. l3 and l4 receive a toolchain that has already been through\n# here, with GCC itself pruned\
    \ away, and have nothing to move. l3 found out\n# what the alternative costs: an unguarded `find` of a directory\
    \ the previous\n# stage had deliberately deleted, whose message went to stderr unread, left\n# the version string\
    \ empty and an assertion two lines later ended a stage\n# whose twenty-minute build and install had already\
    \ succeeded.\ngccdir=\"$tc/lib/gcc/x86_64-linux-musl\"\nif [ -d \"$gccdir\" ]; then\n  gccver=$(basename \"\
    $(find \"$gccdir\" -mindepth 1 -maxdepth 1 -type d | head -1)\")\n  test -n \"$gccver\" || { echo \"no version\
    \ directory under $gccdir\" >&2; exit 1; }\n  mkdir -p \"$sysroot/usr/lib/gcc/x86_64-linux-musl\"\n  mv \"$gccdir/$gccver\"\
    \ \"$sysroot/usr/lib/gcc/x86_64-linux-musl/$gccver\"\nfi\n\n# C++ headers, if they are still beside the target\
    \ prefix. The assertion is\n# that they are somewhere under the directory clang searches; that clang then\n\
    # finds them without being told is what the C++ case of the verification is\n# for, and it is the check that\
    \ matters.\nfor d in \"$sysroot/include/c++\" \"$tc/include/c++\"; do\n  if [ -d \"$d\" ]; then mv \"$d\" \"\
    $sysroot/usr/include/\"; break; fi\ndone\ntest -d \"$sysroot/usr/include/c++\"\n\n# GCC's target libraries,\
    \ ditto, and for the same reason: rather than guess\n# which of lib64 and usr/lib clang will settle on, both\
    \ end up with them. They\n# are a few megabytes, and a toolchain that links C++ is worth more than a\n# toolchain\
    \ that is tidy. libitm is deliberately left behind -- it is\n# transactional-memory support that nothing in\
    \ this bootstrap uses. The two\n# assertions after the block are the real invariant and hold equally for a\n\
    # toolchain that arrived with the libraries already in place.\nif [ -d \"$sysroot/lib64\" ]; then\n  mkdir -p\
    \ \"$sysroot/usr/lib\"\n  for pattern in 'libstdc++*' 'libsupc++*' 'libgcc_s*' 'libatomic.a' 'libatomic.so*';\
    \ do\n    for f in \"$sysroot/lib64\"/$pattern; do\n      if [ -e \"$f\" ]; then cp \"$f\" \"$sysroot/usr/lib/\"\
    ; fi\n    done\n  done\nfi\ntest -e \"$sysroot/usr/lib/libstdc++.a\"\ntest -e \"$sysroot/usr/lib/libgcc_s.so.1\"\
    \n\n# musl ships no kernel headers and the kernel's user-space ABI is not the\n# libc's business to define,\
    \ so the sysroot is not complete until they are\n# unpacked into it. Everything that talks to the kernel directly\
    \ needs them.\ntar -xf \"$FASE_INPUT_ROOT/headers.tar.zst\" -C \"$sysroot\"\ntest -f \"$sysroot/usr/include/linux/netlink.h\"\
    \ntest -f \"$sysroot/usr/include/asm/unistd.h\"\n# --- publish a self-contained clang toolchain ---------------------------\n\
    #\n# clang needs none of the compiler that built it: not the GCC driver, not\n# cc1/cc1plus, not the cross binutils\
    \ (clang has its own integrated assembler\n# and links with lld). The sysroot keeps GCC's libgcc and libstdc++,\
    \ which is\n# not a compromise -- clang's default unwinder on Linux is libgcc, so those\n# archives are required\
    \ for static C++ regardless of what clang is built with.\n# ${tc:?} rather than $tc on the recursive deletions:\
    \ tc is a literal a few\n# lines up so an empty value is not reachable today, and the point of writing\n# it\
    \ this way is that \"-rf /lib64\" stays unreachable if that ever changes.\nrm -rf \"${tc:?}/lib/gcc\" \"$tc/libexec\"\
    \ \"$tc/include\" \"$tc/share\" \"$tc/lib/cmake\"\nrm -f  \"$tc/bin/x86_64-linux-musl-\"*\nrm -f  \"$tc/bin/gcc\"\
    * \"$tc/bin/g++\"* \"$tc/bin/cpp\"* \"$tc/bin/gcov\"*\n# $tc/lib64 holds GCC's libcc1, the GDB-facing compiler\
    \ plugin; the sysroot's\n# own lib64 is untouched and keeps the runtime libraries moved in above.\nrm -rf \"\
    ${tc:?}/lib64\" \"$tc/lib/bfd-plugins\" \"$tc/x86_64-linux-musl/bin\"\n\n# The alias drivers install as full\
    \ copies of the binary (LLVM_USE_SYMLINKS is\n# off by default, and fase's archive format has no symlink entries\
    \ either).\n# clang++ and ld.lld are each the same ~100 MB binary in a different driver\n# mode, so replace\
    \ the copies with two-line wrappers.\nwrap() { # wrap <name> <real-name> <flag>\n  rm -f \"$tc/bin/$1\"\n  #\
    \ The wrapper finds its sibling from its own path, not from the absolute\n  # prefix the toolchain was built\
    \ at. That prefix is correctly baked into\n  # plenty of things -- the sysroot in clang.cfg, the rpaths -- but\
    \ it must\n  # not be baked into this one. The l4 stage unpacks a *previous* toolchain\n  # under a different\
    \ path and runs its clang++ to compare against the new\n  # one; an absolute wrapper would quietly run the new\
    \ compiler twice and\n  # report a fixed point that was never tested.\n  printf '#!/bin/sh\\nexec \"$(dirname\
    \ \"$0\")/%s\" %s \"$@\"\\n' \"$2\" \"$3\" > \"$tc/bin/$1\"\n  chmod 0755 \"$tc/bin/$1\"\n}\nwrap clang++ clang\
    \ --driver-mode=g++\n# lld parses its -flavor only as a separate argument in position 1\n# (lld/Common/DriverDispatcher.cpp\
    \ checks argsV[1] == \"-flavor\" and\n# reads argsV[2]); \"-flavor=gnu\" is not recognised and would leave the\n\
    # generic driver with no flavour at all, which it refuses to run.\n#\n# The dispatcher picks its flavour from\
    \ argv[0], and there is no name it\n# accepts for \"you choose\": invoked as plain `lld` it prints \"lld is\
    \ a generic\n# driver\" *and exits non-zero*, so the binary LLVM installed as bin/lld is not\n# a usable entry\
    \ point at all, only the thing ld.lld is made from. That is\n# upstream's design -- real installs ship bin/lld\
    \ too and reach it through\n# ld.lld -- but it means ld.lld is the name every consumer and every check has\n\
    # to use, including the trivial `--version`. A verification here that read the\n# version as `lld --version`\
    \ would kill the step after a twenty-minute build.\nwrap ld.lld  lld   \"-flavor gnu\"\ntest -x \"$tc/bin/lld\"\
    \n\n# The driver reads <exe-dir>/clang.cfg on every run, which is what makes the\n# published toolchain usable\
    \ as plain `clang foo.c` with no flags at all.\n# Everything is also spelled out explicitly at build time, so\
    \ nothing in the\n# bootstrap itself depends on this file being picked up.\n# The driver's option is -fuse-ld=lld.\
    \ The two-dash spelling is not a synonym\n# clang tolerates: it is rejected as an unknown argument, and because\
    \ the\n# config file is parsed on *every* invocation -- including `clang --version`\n# -- a wrong flag here\
    \ makes the whole toolchain unusable rather than merely\n# changing how it links.\n{\n  printf '%s\\n' \"--sysroot=$sysroot\"\
    \n  printf '%s\\n' \"-fuse-ld=lld\"\n} > \"$tc/bin/clang.cfg\"\ncat \"$tc/bin/clang.cfg\"\n# --- verification\
    \ -------------------------------------------------------\nclang --version | head -1\n# ld.lld, not lld: the\
    \ binary installed as bin/lld is lld's *dispatcher*, and\n# with no flavour in argv[0] it refuses to do anything\
    \ -- including --version.\nld.lld --version | head -1\n\n# The builtins archive is what provides __udivti3 and\
    \ the rest of the compiler\n# support routines, and clang finds it only if it sits in the per-target\n# runtime\
    \ directory LLVM_ENABLE_PER_TARGET_RUNTIME_DIR put it in. The name has\n# no architecture suffix: that suffix\
    \ belongs to the *multi* target-directory\n# layout, where every target shares one directory and the file name\
    \ has to\n# distinguish them. Getting the path wrong does not fail here -- it fails much\n# later, as an undefined\
    \ symbol while linking something in C++.\nresdir=$(clang -print-resource-dir)\necho \"resource dir: $resdir\"\
    \nbuiltins=\"$resdir/lib/x86_64-unknown-linux-musl/libclang_rt.builtins.a\"\nif [ ! -e \"$builtins\" ]; then\n\
    \  echo \"no builtins archive at $builtins; what the toolchain has instead:\" >&2\n  find \"$resdir/lib\" -name\
    \ 'libclang_rt*' >&2 || true\n  exit 1\nfi\n\ncat > \"$build/hello.c\" <<'C'\n#include <math.h>\n#include <stdio.h>\n\
    #include <string.h>\nint main(void) {\n    printf(\"musl-clang-ok %zu %.1f\\n\", strlen(\"musl-clang-ok\"),\
    \ sqrt(81.0));\n    return 0;\n}\nC\n\n# Static C: no interpreter, and it has to run.\nclang --sysroot=\"$sysroot\"\
    \ -O2 -static -o \"$build/hello-static\" \"$build/hello.c\"\nif readelf -l \"$build/hello-static\" | grep -q\
    \ INTERP; then\n  echo \"static link produced an interpreter\" >&2; exit 1\nfi\n\"$build/hello-static\" | grep\
    \ -q 'musl-clang-ok 13 9.0'\n\n# Dynamic C: musl's loader, and no glibc anywhere.\nclang --sysroot=\"$sysroot\"\
    \ -O2 -o \"$build/hello-dyn\" \"$build/hello.c\"\nreadelf -l \"$build/hello-dyn\" | grep -q 'ld-musl-x86_64.so.1'\n\
    \"$build/hello-dyn\" | grep -q 'musl-clang-ok 13 9.0'\nif readelf -d \"$build/hello-dyn\" | grep -qi 'libc\\\
    .so\\.6'; then\n  echo \"dynamic binary links against glibc\" >&2; exit 1\nfi\n\n# C++ against libstdc++, statically:\
    \ the compiler has to be able to build the\n# language its own source is written in, with no help from the gcc\
    \ driver.\ncat > \"$build/hello.cc\" <<'CPP'\n#include <algorithm>\n#include <iostream>\n#include <memory>\n\
    #include <string>\n#include <vector>\nint main() {\n    std::vector<std::string> v{\"llvm\", \"musl\", \"busybox\"\
    };\n    std::sort(v.begin(), v.end());\n    auto joined = std::make_unique<std::string>();\n    for (const auto\
    \ &s : v) *joined += s + \" \";\n    std::cout << *joined << std::endl;\n    return 0;\n}\nCPP\nclang++ --sysroot=\"\
    $sysroot\" -O2 -static -o \"$build/hello-cc\" \"$build/hello.cc\"\n\"$build/hello-cc\" | grep -qx 'busybox llvm\
    \ musl '\n\n# Dynamically linked C++, with an rpath so the loader can find libstdc++ at\n# the location the\
    \ sysroot put it -- the sysroot is not the running root, so\n# without this the binary would not start. It is\
    \ the dynamic case that proves\n# clang found libstdc++.so and not just the archive.\nclang++ --sysroot=\"$sysroot\"\
    \ -O2 -o \"$build/hello-cc-dyn\" \"$build/hello.cc\" \\\n  -Wl,-rpath,\"$sysroot/usr/lib\" -Wl,-rpath,\"$sysroot/lib64\"\
    \nreadelf -d \"$build/hello-cc-dyn\" | grep -q 'libstdc++.so.6'\n\"$build/hello-cc-dyn\" | grep -qx 'busybox\
    \ llvm musl '\n\n# The C++ headers have to have been found without an explicit -isystem.\necho '#include <vector>'\
    \ | clang++ --sysroot=\"$sysroot\" -fsyntax-only -x c++ - || {\n  echo \"clang++ cannot find the C++ standard\
    \ library headers\" >&2; exit 1\n}\n# --- publish ------------------------------------------------------------\n\
    {\n  printf 'clang\\t%s\\n' \"$(clang --version | head -1)\"\n  printf 'lld\\t%s\\n' \"$(ld.lld --version |\
    \ head -1)\"\n  printf 'resource_dir\\t%s\\n' \"$(clang -print-resource-dir)\"\n  printf 'default_triple\\t%s\\\
    n' \"$(clang -dumpmachine)\"\n  printf 'compiler_rt\\t%s\\n' \"$(find \"$tc\" -name 'libclang_rt.builtins*.a'\
    \ -printf '%P\\n' | head -1)\"\n  printf 'sysroot\\t%s\\n' \"$sysroot\"\n  printf 'jobs\\t%s\\n' \"$jobs\"\n\
    } > \"$tc/BUILD-INFO-clang.txt\"\n\n# Packing dereferences every symlink, so a link pointing outside the prefix\n\
    # would silently embed host files in the artifact. Refuse instead.\nif find \"$tc\" -type l -printf '%p -> %l\\\
    n' | grep -q ' -> /'; then\n  echo \"absolute symlink left inside the prefix:\" >&2\n  find \"$tc\" -type l\
    \ -printf '%p -> %l\\n' | grep ' -> /' >&2\n  exit 1\nfi\nif [ -n \"$(find \"$tc\" -xtype l)\" ]; then\n  echo\
    \ \"dangling symlink left inside the prefix:\" >&2\n  find \"$tc\" -xtype l >&2\n  exit 1\nfi\n\nmkdir -p \"\
    $FASE_OUTPUT_ROOT\"\npython3 \"$FASE_INPUT_ROOT/packtar.py\" \"$FASE_OUTPUT_ROOT/tc\" \"$tc\"\nzstd -q -t \"\
    $FASE_OUTPUT_ROOT/tc\"\nzstd -dc \"$FASE_OUTPUT_ROOT/tc\" | python3 -c \"\nimport sys, tarfile\nprint('entries',\
    \ sum(1 for _ in tarfile.open(fileobj=sys.stdin.buffer, mode='r|')))\n\"\ndu -sh \"$tc\" \"$FASE_OUTPUT_ROOT/tc\"\
    \n"
  workspace:
    taskSizeLimit: 300Gi
    inputSizeLimit: 32Gi
    outputSizeLimit: 32Gi
    transferSizeLimit: 32Gi
  nodeSelector:
    kubernetes.io/hostname: node1
---
apiVersion: skyw.top/v1beta1
kind: Recipe
metadata:
  name: llvm-clang-l2
spec:
  inputs:
    artifacts:
    - name: tc
      artifactSelector:
        matchLabels:
          name: gcc-musl-tc
          rev: r1
    - name: source
      artifactSelector:
        matchLabels:
          name: llvm-project-source
          recipe: fetch-v1
    - name: headers
      artifactSelector:
        matchLabels:
          name: linux-headers
          recipe: headers-v1
    - name: packtar
      artifactSelector:
        matchLabels:
          name: packtar-tool
          version: v2
  outputs:
    artifacts:
    - name: tc
      from:
        task: build
        artifact: tc
      labels:
        name:
          value: clang-musl-tc
        version:
          fromInput:
            input: source
            label: version
        rev:
          value: l2
        builtBy:
          value: gcc-musl-tc
        base:
          fromInput:
            input: tc
            label: name
        arch:
          value: amd64
        target:
          value: x86_64-linux-musl
        kind:
          value: toolchain
  tasks:
  - name: build
    variables:
      jobs:
        value: '32'
    inputs:
      artifacts:
      - name: tc
        from:
          recipeInput: tc
      - name: source
        from:
          recipeInput: source
      - name: headers
        from:
          recipeInput: headers
      - name: packtar
        from:
          recipeInput: packtar
    outputs:
    - name: tc
    taskSelector:
      matchLabels:
        capability: llvm-clang-l2
---
apiVersion: skyw.top/v1beta1
kind: Task
metadata:
  name: llvm-clang-l3
  labels:
    capability: llvm-clang-l3
spec:
  image: gcc:16.2.0-trixie
  imagePullSecrets:
  - name: fase-ghcr-pull
  - name: fase-registry-pull
  command:
  - /bin/bash
  securityContext:
    runAsUser: 0
    runAsNonRoot: false
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: '32'
      memory: 64Gi
      ephemeral-storage: 200Gi
    limits:
      cpu: '32'
      memory: 64Gi
      ephemeral-storage: 300Gi
  inputs:
    variables:
    - name: jobs
      env: FASE_VAR_JOBS
      required: true
    artifacts:
    - name: tc
      path: tc.tar.zst
      kind: file
    - name: source
      path: tarball
      kind: file
    - name: headers
      path: headers.tar.zst
      kind: file
    - name: packtar
      path: packtar.py
      kind: file
  outputs:
    artifacts:
    - name: tc
      path: tc
      kind: file
  script: "set -eu\nif ! command -v zstd >/dev/null 2>&1; then\n  apt-get update -qq >/dev/null\n  apt-get install\
    \ -y -qq --no-install-recommends zstd >/dev/null\nfi\nmkdir -p /workspace/inputs\nmkdir -p \"/workspace/inputs/tc\"\
    \nzstd -dc \"/in/tc.tar.zst\" | tar -xf - -C \"/workspace/inputs/tc\"\nln -s \"/in/tarball\" \"/workspace/inputs/tarball\"\
    \nln -s \"/in/headers.tar.zst\" \"/workspace/inputs/headers.tar.zst\"\nln -s \"/in/packtar.py\" \"/workspace/inputs/packtar.py\"\
    \nexport FASE_INPUT_ROOT=/workspace/inputs\nset -euo pipefail\n\ntc=/opt/tc\nsysroot=\"$tc/x86_64-linux-musl\"\
    \nbuild=/workspace/build\njobs=\"$FASE_VAR_JOBS\"\n\nrm -rf \"$tc\" \"$build\"\nmkdir -p \"$tc\" \"$build\"\n\
    cp -a \"$FASE_INPUT_ROOT/tc/.\" \"$tc/\"\n\n# cmake, ninja and zstd are host tools: they run on the build host\
    \ and never\n# on the target, so a glibc build of them from the Debian base image is the\n# correct choice,\
    \ not a shortcut.\nexport DEBIAN_FRONTEND=noninteractive\n\n# The command we need and the package that ships\
    \ it are not always the same\n# name: Debian's ninja is packaged as ninja-build while the binary it installs\n\
    # is plain `ninja`. Test for the binary -- that is what the build actually\n# invokes -- but ask apt for the\
    \ package.\npkg_for() {\n  case \"$1\" in\n    ninja) echo ninja-build ;;\n    *)     echo \"$1\" ;;\n  esac\n\
    }\nmissing=\"\"\nfor tool in cmake ninja zstd python3; do\n  command -v \"$tool\" >/dev/null 2>&1 || missing=\"\
    $missing $(pkg_for \"$tool\")\"\ndone\nif [ -n \"$missing\" ]; then\n  apt-get update -qq >/dev/null\n  # shellcheck\
    \ disable=SC2086\n  apt-get install -y -qq --no-install-recommends $missing >/dev/null\nfi\ncommand -v cmake\
    \ ninja zstd python3\n\n# The toolchain's own binaries are musl binaries. If one of them is linked\n# dynamically\
    \ its interpreter is the absolute path /lib/ld-musl-x86_64.so.1,\n# which does not exist on the Debian build\
    \ image; installing it here is what\n# lets a musl-linked clang run at all inside this container.\ninstall -D\
    \ -m 0755 \"$sysroot/usr/lib/libc.so\" /lib/ld-musl-x86_64.so.1\n\n# Prefer the toolchain's own binutils shims\
    \ over the host's.\nexport PATH=\"$tc/bin:$PATH\"\n# --- build --------------------------------------------------------------\n\
    mkdir -p \"$build/src\"\ntar -xf \"$FASE_INPUT_ROOT/tarball\" -C \"$build/src\"\nsrc=$(find \"$build/src\" -maxdepth\
    \ 1 -mindepth 1 -type d | head -1)\ntest -f \"$src/llvm/CMakeLists.txt\"\n# llvm-project-22.1.6.src -> 22.1.6\n\
    version=$(basename \"$src\" | sed -e 's/^llvm-project-//' -e 's/\\.src$//')\necho \"building llvm-project $version\
    \ from $src\"\ncmake -G Ninja -S \"$src/llvm\" -B \"$build/obj\" \\\n      -DCMAKE_BUILD_TYPE=Release \\\n \
    \     -DCMAKE_INSTALL_PREFIX=\"$tc\" \\\n      -DCMAKE_SYSROOT=\"$sysroot\" \\\n      -DCMAKE_C_COMPILER_TARGET=x86_64-linux-musl\
    \ \\\n      -DCMAKE_CXX_COMPILER_TARGET=x86_64-linux-musl \\\n      -DCMAKE_C_FLAGS=\"-fno-pie --sysroot=$sysroot\"\
    \ \\\n      -DCMAKE_CXX_FLAGS=\"-fno-pie --sysroot=$sysroot\" \\\n      -DCMAKE_C_FLAGS_RELEASE=\"-O2 -DNDEBUG\"\
    \ \\\n      -DCMAKE_CXX_FLAGS_RELEASE=\"-O2 -DNDEBUG\" \\\n      -DCMAKE_EXE_LINKER_FLAGS=\"-static -no-pie\"\
    \ \\\n      -DLLVM_PARALLEL_LINK_JOBS=4 \\\n      -DLLVM_ENABLE_PROJECTS=\"clang;lld\" \\\n      -DLLVM_ENABLE_RUNTIMES=\"\
    compiler-rt\" \\\n      -DLLVM_TARGETS_TO_BUILD=X86 \\\n      -DLLVM_DEFAULT_TARGET_TRIPLE=x86_64-linux-musl\
    \ \\\n      -DLLVM_HOST_TRIPLE=x86_64-linux-musl \\\n      -DLLVM_DISTRIBUTION_COMPONENTS=\"clang;clang-resource-headers;lld;builtins;llvm-ar;llvm-ranlib;llvm-nm;llvm-objcopy;llvm-objdump;llvm-readobj;llvm-readelf;llvm-size;llvm-strings;llvm-strip;llvm-symbolizer;llvm-profdata;llvm-cxxfilt;llvm-dwarfdump;llvm-config;llvm-addr2line\"\
    \ \\\n      -DLLVM_ENABLE_ASSERTIONS=OFF \\\n      -DLLVM_ENABLE_WERROR=OFF \\\n      -DLLVM_ENABLE_RTTI=OFF\
    \ \\\n      -DLLVM_ENABLE_EH=OFF \\\n      -DLLVM_ENABLE_PLUGINS=OFF \\\n      -DLLVM_ENABLE_ZLIB=OFF \\\n \
    \     -DLLVM_ENABLE_ZSTD=OFF \\\n      -DLLVM_ENABLE_LIBXML2=OFF \\\n      -DLLVM_ENABLE_LIBEDIT=OFF \\\n  \
    \    -DLLVM_ENABLE_CURL=OFF \\\n      -DLLVM_ENABLE_HTTPLIB=OFF \\\n      -DLLVM_ENABLE_BINDINGS=OFF \\\n  \
    \    -DLLVM_INCLUDE_TESTS=OFF \\\n      -DLLVM_INCLUDE_BENCHMARKS=OFF \\\n      -DLLVM_INCLUDE_EXAMPLES=OFF\
    \ \\\n      -DLLVM_INCLUDE_DOCS=OFF \\\n      -DLLVM_BUILD_EXAMPLES=OFF \\\n      -DLLVM_INSTALL_BINUTILS_SYMLINKS=OFF\
    \ \\\n      -DCLANG_INCLUDE_TESTS=OFF \\\n      -DCLANG_ENABLE_STATIC_ANALYZER=OFF \\\n      -DCLANG_LINKS_TO_CREATE=\"\
    clang++\" \\\n      -DLLD_SYMLINKS_TO_CREATE=\"ld.lld\" \\\n      -DCOMPILER_RT_DEFAULT_TARGET_ONLY=ON \\\n\
    \      -DCOMPILER_RT_BUILD_SANITIZERS=OFF \\\n      -DCOMPILER_RT_BUILD_XRAY=OFF \\\n      -DCOMPILER_RT_BUILD_LIBFUZZER=OFF\
    \ \\\n      -DCOMPILER_RT_BUILD_PROFILE=OFF \\\n      -DCOMPILER_RT_BUILD_MEMPROF=OFF \\\n      -DCOMPILER_RT_BUILD_ORC=OFF\
    \ \\\n      -DCOMPILER_RT_BUILD_CTX_PROFILE=OFF \\\n      -DCOMPILER_RT_BUILD_CRT=ON \\\n      -DCMAKE_C_COMPILER=\"\
    $tc/bin/clang\" \\\n      -DCMAKE_CXX_COMPILER=\"$tc/bin/clang++\" \\\n      -DCMAKE_AR=\"$tc/bin/llvm-ar\"\
    \ \\\n      -DCMAKE_RANLIB=\"$tc/bin/llvm-ranlib\" \\\n      -DCMAKE_STRIP=\"$tc/bin/llvm-strip\" \\\n     \
    \ -DCLANG_DEFAULT_RTLIB=compiler-rt \\\n      -DCLANG_DEFAULT_CXX_STDLIB=libstdc++ \\\n      -DCLANG_DEFAULT_UNWINDLIB=libgcc\
    \ \\\n\n# Only the components named in LLVM_DISTRIBUTION_COMPONENTS are built and\n# installed, so this does\
    \ not pull in the two hundred other LLVM tools.\n#\n# DESTDIR, and not the prefix, is the point of this line.\
    \ With a distribution\n# build every component is installed as soon as its own target is ready, so\n# the installs\
    \ are interleaved with the build rather than following it: of the\n# three hundred-odd steps after this one,\
    \ dozens are installs. That makes\n# every file the build *executes out of the prefix* a file that another part\n\
    # of the same build may be rewriting at that moment -- and this build, whose\n# whole purpose is to replace\
    \ the toolchain it is running from, executes\n# llvm-ar on every static-library link, clang on every compile,\
    \ and ld.lld\n# through -fuse-ld=lld on every link. l3 found this the expensive way: a link\n# died with \"\
    Permission denied\" on a file that plainly existed and was\n# executable, four thousand targets into a build.\n\
    #\n# Staging the tools elsewhere would not be enough, and would be worse than it\n# looks: clang finds its builtin\
    \ headers and compiler-rt by walking up from\n# the path it was invoked at, so a copied clang needs --resource-dir,\
    \ which\n# points back into the tree this build installs into. The install is\n# redirected instead, and merged\
    \ into the prefix once nothing is left running\n# from it. Nothing that is exec'd, read as a header or searched\
    \ for a library\n# lives in a directory being written to.\nrm -rf \"$build/stage\"\nDESTDIR=\"$build/stage\"\
    \ ninja -C \"$build/obj\" -j\"$jobs\" install-distribution\ntest -d \"$build/stage$tc\"   # destdir + absolute\
    \ prefix = $build/stage/opt/tc\n# cp -a rather than a move: the prefix holds the previous generation's clang,\n\
    # lld and clang.cfg as well, and the copies this build does not install\n# (nothing, as it happens, but the\
    \ invariant is what makes that reviewable)\n# have to survive.\ncp -a \"$build/stage$tc/.\" \"$tc/\"\ntest -x\
    \ \"$tc/bin/clang\"\ntest -x \"$tc/bin/lld\"\n\n# Debug info is most of the volume and worth nothing to consumers.\
    \ Archives\n# only lose their debug sections, so linking behaviour is unchanged.\nfind \"$tc\" -type f -name\
    \ '*.a' -exec strip -g {} + 2>/dev/null || true\nfind \"$tc\" -type f -perm -u+x -exec strip --strip-unneeded\
    \ {} + 2>/dev/null || true\n# --- give clang a sysroot it understands --------------------------------\n#\n\
    # GCC does not install in the layout clang searches: its target libraries land\n# in <sysroot>/lib64 and its\
    \ C++ headers in <sysroot>/include/c++/<version>,\n# while clang's GCCInstallationDetector looks for those libraries\
    \ in\n# <sysroot>/usr/lib and derives the headers from\n# <sysroot>/usr/lib/gcc/<triple>/<version>. The trees\
    \ are moved to where clang\n# already looks rather than hard-coding -isystem and -L into every downstream\n\
    # consumer, which would still be wrong the moment anything used the compiler\n# as plain `clang foo.c`.\n#\n\
    # Every move below is written as \"move it if it is still where GCC put it\",\n# because this fragment runs\
    \ on all three llvm stages and only the first is\n# built by GCC. l3 and l4 receive a toolchain that has already\
    \ been through\n# here, with GCC itself pruned away, and have nothing to move. l3 found out\n# what the alternative\
    \ costs: an unguarded `find` of a directory the previous\n# stage had deliberately deleted, whose message went\
    \ to stderr unread, left\n# the version string empty and an assertion two lines later ended a stage\n# whose\
    \ twenty-minute build and install had already succeeded.\ngccdir=\"$tc/lib/gcc/x86_64-linux-musl\"\nif [ -d\
    \ \"$gccdir\" ]; then\n  gccver=$(basename \"$(find \"$gccdir\" -mindepth 1 -maxdepth 1 -type d | head -1)\"\
    )\n  test -n \"$gccver\" || { echo \"no version directory under $gccdir\" >&2; exit 1; }\n  mkdir -p \"$sysroot/usr/lib/gcc/x86_64-linux-musl\"\
    \n  mv \"$gccdir/$gccver\" \"$sysroot/usr/lib/gcc/x86_64-linux-musl/$gccver\"\nfi\n\n# C++ headers, if they\
    \ are still beside the target prefix. The assertion is\n# that they are somewhere under the directory clang\
    \ searches; that clang then\n# finds them without being told is what the C++ case of the verification is\n#\
    \ for, and it is the check that matters.\nfor d in \"$sysroot/include/c++\" \"$tc/include/c++\"; do\n  if [\
    \ -d \"$d\" ]; then mv \"$d\" \"$sysroot/usr/include/\"; break; fi\ndone\ntest -d \"$sysroot/usr/include/c++\"\
    \n\n# GCC's target libraries, ditto, and for the same reason: rather than guess\n# which of lib64 and usr/lib\
    \ clang will settle on, both end up with them. They\n# are a few megabytes, and a toolchain that links C++ is\
    \ worth more than a\n# toolchain that is tidy. libitm is deliberately left behind -- it is\n# transactional-memory\
    \ support that nothing in this bootstrap uses. The two\n# assertions after the block are the real invariant\
    \ and hold equally for a\n# toolchain that arrived with the libraries already in place.\nif [ -d \"$sysroot/lib64\"\
    \ ]; then\n  mkdir -p \"$sysroot/usr/lib\"\n  for pattern in 'libstdc++*' 'libsupc++*' 'libgcc_s*' 'libatomic.a'\
    \ 'libatomic.so*'; do\n    for f in \"$sysroot/lib64\"/$pattern; do\n      if [ -e \"$f\" ]; then cp \"$f\"\
    \ \"$sysroot/usr/lib/\"; fi\n    done\n  done\nfi\ntest -e \"$sysroot/usr/lib/libstdc++.a\"\ntest -e \"$sysroot/usr/lib/libgcc_s.so.1\"\
    \n\n# musl ships no kernel headers and the kernel's user-space ABI is not the\n# libc's business to define,\
    \ so the sysroot is not complete until they are\n# unpacked into it. Everything that talks to the kernel directly\
    \ needs them.\ntar -xf \"$FASE_INPUT_ROOT/headers.tar.zst\" -C \"$sysroot\"\ntest -f \"$sysroot/usr/include/linux/netlink.h\"\
    \ntest -f \"$sysroot/usr/include/asm/unistd.h\"\n# --- publish a self-contained clang toolchain ---------------------------\n\
    #\n# clang needs none of the compiler that built it: not the GCC driver, not\n# cc1/cc1plus, not the cross binutils\
    \ (clang has its own integrated assembler\n# and links with lld). The sysroot keeps GCC's libgcc and libstdc++,\
    \ which is\n# not a compromise -- clang's default unwinder on Linux is libgcc, so those\n# archives are required\
    \ for static C++ regardless of what clang is built with.\n# ${tc:?} rather than $tc on the recursive deletions:\
    \ tc is a literal a few\n# lines up so an empty value is not reachable today, and the point of writing\n# it\
    \ this way is that \"-rf /lib64\" stays unreachable if that ever changes.\nrm -rf \"${tc:?}/lib/gcc\" \"$tc/libexec\"\
    \ \"$tc/include\" \"$tc/share\" \"$tc/lib/cmake\"\nrm -f  \"$tc/bin/x86_64-linux-musl-\"*\nrm -f  \"$tc/bin/gcc\"\
    * \"$tc/bin/g++\"* \"$tc/bin/cpp\"* \"$tc/bin/gcov\"*\n# $tc/lib64 holds GCC's libcc1, the GDB-facing compiler\
    \ plugin; the sysroot's\n# own lib64 is untouched and keeps the runtime libraries moved in above.\nrm -rf \"\
    ${tc:?}/lib64\" \"$tc/lib/bfd-plugins\" \"$tc/x86_64-linux-musl/bin\"\n\n# The alias drivers install as full\
    \ copies of the binary (LLVM_USE_SYMLINKS is\n# off by default, and fase's archive format has no symlink entries\
    \ either).\n# clang++ and ld.lld are each the same ~100 MB binary in a different driver\n# mode, so replace\
    \ the copies with two-line wrappers.\nwrap() { # wrap <name> <real-name> <flag>\n  rm -f \"$tc/bin/$1\"\n  #\
    \ The wrapper finds its sibling from its own path, not from the absolute\n  # prefix the toolchain was built\
    \ at. That prefix is correctly baked into\n  # plenty of things -- the sysroot in clang.cfg, the rpaths -- but\
    \ it must\n  # not be baked into this one. The l4 stage unpacks a *previous* toolchain\n  # under a different\
    \ path and runs its clang++ to compare against the new\n  # one; an absolute wrapper would quietly run the new\
    \ compiler twice and\n  # report a fixed point that was never tested.\n  printf '#!/bin/sh\\nexec \"$(dirname\
    \ \"$0\")/%s\" %s \"$@\"\\n' \"$2\" \"$3\" > \"$tc/bin/$1\"\n  chmod 0755 \"$tc/bin/$1\"\n}\nwrap clang++ clang\
    \ --driver-mode=g++\n# lld parses its -flavor only as a separate argument in position 1\n# (lld/Common/DriverDispatcher.cpp\
    \ checks argsV[1] == \"-flavor\" and\n# reads argsV[2]); \"-flavor=gnu\" is not recognised and would leave the\n\
    # generic driver with no flavour at all, which it refuses to run.\n#\n# The dispatcher picks its flavour from\
    \ argv[0], and there is no name it\n# accepts for \"you choose\": invoked as plain `lld` it prints \"lld is\
    \ a generic\n# driver\" *and exits non-zero*, so the binary LLVM installed as bin/lld is not\n# a usable entry\
    \ point at all, only the thing ld.lld is made from. That is\n# upstream's design -- real installs ship bin/lld\
    \ too and reach it through\n# ld.lld -- but it means ld.lld is the name every consumer and every check has\n\
    # to use, including the trivial `--version`. A verification here that read the\n# version as `lld --version`\
    \ would kill the step after a twenty-minute build.\nwrap ld.lld  lld   \"-flavor gnu\"\ntest -x \"$tc/bin/lld\"\
    \n\n# The driver reads <exe-dir>/clang.cfg on every run, which is what makes the\n# published toolchain usable\
    \ as plain `clang foo.c` with no flags at all.\n# Everything is also spelled out explicitly at build time, so\
    \ nothing in the\n# bootstrap itself depends on this file being picked up.\n# The driver's option is -fuse-ld=lld.\
    \ The two-dash spelling is not a synonym\n# clang tolerates: it is rejected as an unknown argument, and because\
    \ the\n# config file is parsed on *every* invocation -- including `clang --version`\n# -- a wrong flag here\
    \ makes the whole toolchain unusable rather than merely\n# changing how it links.\n{\n  printf '%s\\n' \"--sysroot=$sysroot\"\
    \n  printf '%s\\n' \"-fuse-ld=lld\"\n} > \"$tc/bin/clang.cfg\"\ncat \"$tc/bin/clang.cfg\"\n# --- verification\
    \ -------------------------------------------------------\nclang --version | head -1\n# ld.lld, not lld: the\
    \ binary installed as bin/lld is lld's *dispatcher*, and\n# with no flavour in argv[0] it refuses to do anything\
    \ -- including --version.\nld.lld --version | head -1\n\n# The builtins archive is what provides __udivti3 and\
    \ the rest of the compiler\n# support routines, and clang finds it only if it sits in the per-target\n# runtime\
    \ directory LLVM_ENABLE_PER_TARGET_RUNTIME_DIR put it in. The name has\n# no architecture suffix: that suffix\
    \ belongs to the *multi* target-directory\n# layout, where every target shares one directory and the file name\
    \ has to\n# distinguish them. Getting the path wrong does not fail here -- it fails much\n# later, as an undefined\
    \ symbol while linking something in C++.\nresdir=$(clang -print-resource-dir)\necho \"resource dir: $resdir\"\
    \nbuiltins=\"$resdir/lib/x86_64-unknown-linux-musl/libclang_rt.builtins.a\"\nif [ ! -e \"$builtins\" ]; then\n\
    \  echo \"no builtins archive at $builtins; what the toolchain has instead:\" >&2\n  find \"$resdir/lib\" -name\
    \ 'libclang_rt*' >&2 || true\n  exit 1\nfi\n\ncat > \"$build/hello.c\" <<'C'\n#include <math.h>\n#include <stdio.h>\n\
    #include <string.h>\nint main(void) {\n    printf(\"musl-clang-ok %zu %.1f\\n\", strlen(\"musl-clang-ok\"),\
    \ sqrt(81.0));\n    return 0;\n}\nC\n\n# Static C: no interpreter, and it has to run.\nclang --sysroot=\"$sysroot\"\
    \ -O2 -static -o \"$build/hello-static\" \"$build/hello.c\"\nif readelf -l \"$build/hello-static\" | grep -q\
    \ INTERP; then\n  echo \"static link produced an interpreter\" >&2; exit 1\nfi\n\"$build/hello-static\" | grep\
    \ -q 'musl-clang-ok 13 9.0'\n\n# Dynamic C: musl's loader, and no glibc anywhere.\nclang --sysroot=\"$sysroot\"\
    \ -O2 -o \"$build/hello-dyn\" \"$build/hello.c\"\nreadelf -l \"$build/hello-dyn\" | grep -q 'ld-musl-x86_64.so.1'\n\
    \"$build/hello-dyn\" | grep -q 'musl-clang-ok 13 9.0'\nif readelf -d \"$build/hello-dyn\" | grep -qi 'libc\\\
    .so\\.6'; then\n  echo \"dynamic binary links against glibc\" >&2; exit 1\nfi\n\n# C++ against libstdc++, statically:\
    \ the compiler has to be able to build the\n# language its own source is written in, with no help from the gcc\
    \ driver.\ncat > \"$build/hello.cc\" <<'CPP'\n#include <algorithm>\n#include <iostream>\n#include <memory>\n\
    #include <string>\n#include <vector>\nint main() {\n    std::vector<std::string> v{\"llvm\", \"musl\", \"busybox\"\
    };\n    std::sort(v.begin(), v.end());\n    auto joined = std::make_unique<std::string>();\n    for (const auto\
    \ &s : v) *joined += s + \" \";\n    std::cout << *joined << std::endl;\n    return 0;\n}\nCPP\nclang++ --sysroot=\"\
    $sysroot\" -O2 -static -o \"$build/hello-cc\" \"$build/hello.cc\"\n\"$build/hello-cc\" | grep -qx 'busybox llvm\
    \ musl '\n\n# Dynamically linked C++, with an rpath so the loader can find libstdc++ at\n# the location the\
    \ sysroot put it -- the sysroot is not the running root, so\n# without this the binary would not start. It is\
    \ the dynamic case that proves\n# clang found libstdc++.so and not just the archive.\nclang++ --sysroot=\"$sysroot\"\
    \ -O2 -o \"$build/hello-cc-dyn\" \"$build/hello.cc\" \\\n  -Wl,-rpath,\"$sysroot/usr/lib\" -Wl,-rpath,\"$sysroot/lib64\"\
    \nreadelf -d \"$build/hello-cc-dyn\" | grep -q 'libstdc++.so.6'\n\"$build/hello-cc-dyn\" | grep -qx 'busybox\
    \ llvm musl '\n\n# The C++ headers have to have been found without an explicit -isystem.\necho '#include <vector>'\
    \ | clang++ --sysroot=\"$sysroot\" -fsyntax-only -x c++ - || {\n  echo \"clang++ cannot find the C++ standard\
    \ library headers\" >&2; exit 1\n}\n# --- publish ------------------------------------------------------------\n\
    {\n  printf 'clang\\t%s\\n' \"$(clang --version | head -1)\"\n  printf 'lld\\t%s\\n' \"$(ld.lld --version |\
    \ head -1)\"\n  printf 'resource_dir\\t%s\\n' \"$(clang -print-resource-dir)\"\n  printf 'default_triple\\t%s\\\
    n' \"$(clang -dumpmachine)\"\n  printf 'compiler_rt\\t%s\\n' \"$(find \"$tc\" -name 'libclang_rt.builtins*.a'\
    \ -printf '%P\\n' | head -1)\"\n  printf 'sysroot\\t%s\\n' \"$sysroot\"\n  printf 'jobs\\t%s\\n' \"$jobs\"\n\
    } > \"$tc/BUILD-INFO-clang.txt\"\n\n# Packing dereferences every symlink, so a link pointing outside the prefix\n\
    # would silently embed host files in the artifact. Refuse instead.\nif find \"$tc\" -type l -printf '%p -> %l\\\
    n' | grep -q ' -> /'; then\n  echo \"absolute symlink left inside the prefix:\" >&2\n  find \"$tc\" -type l\
    \ -printf '%p -> %l\\n' | grep ' -> /' >&2\n  exit 1\nfi\nif [ -n \"$(find \"$tc\" -xtype l)\" ]; then\n  echo\
    \ \"dangling symlink left inside the prefix:\" >&2\n  find \"$tc\" -xtype l >&2\n  exit 1\nfi\n\nmkdir -p \"\
    $FASE_OUTPUT_ROOT\"\npython3 \"$FASE_INPUT_ROOT/packtar.py\" \"$FASE_OUTPUT_ROOT/tc\" \"$tc\"\nzstd -q -t \"\
    $FASE_OUTPUT_ROOT/tc\"\nzstd -dc \"$FASE_OUTPUT_ROOT/tc\" | python3 -c \"\nimport sys, tarfile\nprint('entries',\
    \ sum(1 for _ in tarfile.open(fileobj=sys.stdin.buffer, mode='r|')))\n\"\ndu -sh \"$tc\" \"$FASE_OUTPUT_ROOT/tc\"\
    \n"
  workspace:
    taskSizeLimit: 300Gi
    inputSizeLimit: 32Gi
    outputSizeLimit: 32Gi
    transferSizeLimit: 32Gi
  nodeSelector:
    kubernetes.io/hostname: node1
---
apiVersion: skyw.top/v1beta1
kind: Recipe
metadata:
  name: llvm-clang-l3
spec:
  inputs:
    artifacts:
    - name: tc
      artifactSelector:
        matchLabels:
          name: clang-musl-tc
          rev: l2
    - name: source
      artifactSelector:
        matchLabels:
          name: llvm-project-source
          recipe: fetch-v1
    - name: headers
      artifactSelector:
        matchLabels:
          name: linux-headers
          recipe: headers-v1
    - name: packtar
      artifactSelector:
        matchLabels:
          name: packtar-tool
          version: v2
  outputs:
    artifacts:
    - name: tc
      from:
        task: build
        artifact: tc
      labels:
        name:
          value: clang-musl-tc
        version:
          fromInput:
            input: source
            label: version
        rev:
          value: l3
        builtBy:
          value: clang-l2
        base:
          fromInput:
            input: tc
            label: name
        arch:
          value: amd64
        target:
          value: x86_64-linux-musl
        kind:
          value: toolchain
  tasks:
  - name: build
    variables:
      jobs:
        value: '32'
    inputs:
      artifacts:
      - name: tc
        from:
          recipeInput: tc
      - name: source
        from:
          recipeInput: source
      - name: headers
        from:
          recipeInput: headers
      - name: packtar
        from:
          recipeInput: packtar
    outputs:
    - name: tc
    taskSelector:
      matchLabels:
        capability: llvm-clang-l3
---
apiVersion: skyw.top/v1beta1
kind: Task
metadata:
  name: llvm-clang-l4
  labels:
    capability: llvm-clang-l4
spec:
  image: gcc:16.2.0-trixie
  imagePullSecrets:
  - name: fase-ghcr-pull
  - name: fase-registry-pull
  command:
  - /bin/bash
  securityContext:
    runAsUser: 0
    runAsNonRoot: false
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: '32'
      memory: 64Gi
      ephemeral-storage: 200Gi
    limits:
      cpu: '32'
      memory: 64Gi
      ephemeral-storage: 300Gi
  inputs:
    variables:
    - name: jobs
      env: FASE_VAR_JOBS
      required: true
    - name: parent-rev
      env: FASE_VAR_PARENT_REV
      required: true
    - name: child-rev
      env: FASE_VAR_CHILD_REV
      required: true
    artifacts:
    - name: tc
      path: tc.tar.zst
      kind: file
    - name: source
      path: tarball
      kind: file
    - name: headers
      path: headers.tar.zst
      kind: file
    - name: packtar
      path: packtar.py
      kind: file
  outputs:
    artifacts:
    - name: report
      path: report.txt
      kind: file
  script: "set -eu\nif ! command -v zstd >/dev/null 2>&1; then\n  apt-get update -qq >/dev/null\n  apt-get install\
    \ -y -qq --no-install-recommends zstd >/dev/null\nfi\nmkdir -p /workspace/inputs\nmkdir -p \"/workspace/inputs/tc\"\
    \nzstd -dc \"/in/tc.tar.zst\" | tar -xf - -C \"/workspace/inputs/tc\"\nln -s \"/in/tarball\" \"/workspace/inputs/tarball\"\
    \nln -s \"/in/headers.tar.zst\" \"/workspace/inputs/headers.tar.zst\"\nln -s \"/in/packtar.py\" \"/workspace/inputs/packtar.py\"\
    \nexport FASE_INPUT_ROOT=/workspace/inputs\nset -euo pipefail\n\ntc=/opt/tc\nsysroot=\"$tc/x86_64-linux-musl\"\
    \nbuild=/workspace/build\njobs=\"$FASE_VAR_JOBS\"\n\nrm -rf \"$tc\" \"$build\"\nmkdir -p \"$tc\" \"$build\"\n\
    cp -a \"$FASE_INPUT_ROOT/tc/.\" \"$tc/\"\n\n# cmake, ninja and zstd are host tools: they run on the build host\
    \ and never\n# on the target, so a glibc build of them from the Debian base image is the\n# correct choice,\
    \ not a shortcut.\nexport DEBIAN_FRONTEND=noninteractive\n\n# The command we need and the package that ships\
    \ it are not always the same\n# name: Debian's ninja is packaged as ninja-build while the binary it installs\n\
    # is plain `ninja`. Test for the binary -- that is what the build actually\n# invokes -- but ask apt for the\
    \ package.\npkg_for() {\n  case \"$1\" in\n    ninja) echo ninja-build ;;\n    *)     echo \"$1\" ;;\n  esac\n\
    }\nmissing=\"\"\nfor tool in cmake ninja zstd python3; do\n  command -v \"$tool\" >/dev/null 2>&1 || missing=\"\
    $missing $(pkg_for \"$tool\")\"\ndone\nif [ -n \"$missing\" ]; then\n  apt-get update -qq >/dev/null\n  # shellcheck\
    \ disable=SC2086\n  apt-get install -y -qq --no-install-recommends $missing >/dev/null\nfi\ncommand -v cmake\
    \ ninja zstd python3\n\n# The toolchain's own binaries are musl binaries. If one of them is linked\n# dynamically\
    \ its interpreter is the absolute path /lib/ld-musl-x86_64.so.1,\n# which does not exist on the Debian build\
    \ image; installing it here is what\n# lets a musl-linked clang run at all inside this container.\ninstall -D\
    \ -m 0755 \"$sysroot/usr/lib/libc.so\" /lib/ld-musl-x86_64.so.1\n\n# Prefer the toolchain's own binutils shims\
    \ over the host's.\nexport PATH=\"$tc/bin:$PATH\"\n# --- build --------------------------------------------------------------\n\
    mkdir -p \"$build/src\"\ntar -xf \"$FASE_INPUT_ROOT/tarball\" -C \"$build/src\"\nsrc=$(find \"$build/src\" -maxdepth\
    \ 1 -mindepth 1 -type d | head -1)\ntest -f \"$src/llvm/CMakeLists.txt\"\n# llvm-project-22.1.6.src -> 22.1.6\n\
    version=$(basename \"$src\" | sed -e 's/^llvm-project-//' -e 's/\\.src$//')\necho \"building llvm-project $version\
    \ from $src\"\ncmake -G Ninja -S \"$src/llvm\" -B \"$build/obj\" \\\n      -DCMAKE_BUILD_TYPE=Release \\\n \
    \     -DCMAKE_INSTALL_PREFIX=\"$tc\" \\\n      -DCMAKE_SYSROOT=\"$sysroot\" \\\n      -DCMAKE_C_COMPILER_TARGET=x86_64-linux-musl\
    \ \\\n      -DCMAKE_CXX_COMPILER_TARGET=x86_64-linux-musl \\\n      -DCMAKE_C_FLAGS=\"-fno-pie --sysroot=$sysroot\"\
    \ \\\n      -DCMAKE_CXX_FLAGS=\"-fno-pie --sysroot=$sysroot\" \\\n      -DCMAKE_C_FLAGS_RELEASE=\"-O2 -DNDEBUG\"\
    \ \\\n      -DCMAKE_CXX_FLAGS_RELEASE=\"-O2 -DNDEBUG\" \\\n      -DCMAKE_EXE_LINKER_FLAGS=\"-static -no-pie\"\
    \ \\\n      -DLLVM_PARALLEL_LINK_JOBS=4 \\\n      -DLLVM_ENABLE_PROJECTS=\"clang;lld\" \\\n      -DLLVM_ENABLE_RUNTIMES=\"\
    compiler-rt\" \\\n      -DLLVM_TARGETS_TO_BUILD=X86 \\\n      -DLLVM_DEFAULT_TARGET_TRIPLE=x86_64-linux-musl\
    \ \\\n      -DLLVM_HOST_TRIPLE=x86_64-linux-musl \\\n      -DLLVM_DISTRIBUTION_COMPONENTS=\"clang;clang-resource-headers;lld;builtins;llvm-ar;llvm-ranlib;llvm-nm;llvm-objcopy;llvm-objdump;llvm-readobj;llvm-readelf;llvm-size;llvm-strings;llvm-strip;llvm-symbolizer;llvm-profdata;llvm-cxxfilt;llvm-dwarfdump;llvm-config;llvm-addr2line\"\
    \ \\\n      -DLLVM_ENABLE_ASSERTIONS=OFF \\\n      -DLLVM_ENABLE_WERROR=OFF \\\n      -DLLVM_ENABLE_RTTI=OFF\
    \ \\\n      -DLLVM_ENABLE_EH=OFF \\\n      -DLLVM_ENABLE_PLUGINS=OFF \\\n      -DLLVM_ENABLE_ZLIB=OFF \\\n \
    \     -DLLVM_ENABLE_ZSTD=OFF \\\n      -DLLVM_ENABLE_LIBXML2=OFF \\\n      -DLLVM_ENABLE_LIBEDIT=OFF \\\n  \
    \    -DLLVM_ENABLE_CURL=OFF \\\n      -DLLVM_ENABLE_HTTPLIB=OFF \\\n      -DLLVM_ENABLE_BINDINGS=OFF \\\n  \
    \    -DLLVM_INCLUDE_TESTS=OFF \\\n      -DLLVM_INCLUDE_BENCHMARKS=OFF \\\n      -DLLVM_INCLUDE_EXAMPLES=OFF\
    \ \\\n      -DLLVM_INCLUDE_DOCS=OFF \\\n      -DLLVM_BUILD_EXAMPLES=OFF \\\n      -DLLVM_INSTALL_BINUTILS_SYMLINKS=OFF\
    \ \\\n      -DCLANG_INCLUDE_TESTS=OFF \\\n      -DCLANG_ENABLE_STATIC_ANALYZER=OFF \\\n      -DCLANG_LINKS_TO_CREATE=\"\
    clang++\" \\\n      -DLLD_SYMLINKS_TO_CREATE=\"ld.lld\" \\\n      -DCOMPILER_RT_DEFAULT_TARGET_ONLY=ON \\\n\
    \      -DCOMPILER_RT_BUILD_SANITIZERS=OFF \\\n      -DCOMPILER_RT_BUILD_XRAY=OFF \\\n      -DCOMPILER_RT_BUILD_LIBFUZZER=OFF\
    \ \\\n      -DCOMPILER_RT_BUILD_PROFILE=OFF \\\n      -DCOMPILER_RT_BUILD_MEMPROF=OFF \\\n      -DCOMPILER_RT_BUILD_ORC=OFF\
    \ \\\n      -DCOMPILER_RT_BUILD_CTX_PROFILE=OFF \\\n      -DCOMPILER_RT_BUILD_CRT=ON \\\n      -DCMAKE_C_COMPILER=\"\
    $tc/bin/clang\" \\\n      -DCMAKE_CXX_COMPILER=\"$tc/bin/clang++\" \\\n      -DCMAKE_AR=\"$tc/bin/llvm-ar\"\
    \ \\\n      -DCMAKE_RANLIB=\"$tc/bin/llvm-ranlib\" \\\n      -DCMAKE_STRIP=\"$tc/bin/llvm-strip\" \\\n     \
    \ -DCLANG_DEFAULT_RTLIB=compiler-rt \\\n      -DCLANG_DEFAULT_CXX_STDLIB=libstdc++ \\\n      -DCLANG_DEFAULT_UNWINDLIB=libgcc\
    \ \\\n\n# Only the components named in LLVM_DISTRIBUTION_COMPONENTS are built and\n# installed, so this does\
    \ not pull in the two hundred other LLVM tools.\n#\n# DESTDIR, and not the prefix, is the point of this line.\
    \ With a distribution\n# build every component is installed as soon as its own target is ready, so\n# the installs\
    \ are interleaved with the build rather than following it: of the\n# three hundred-odd steps after this one,\
    \ dozens are installs. That makes\n# every file the build *executes out of the prefix* a file that another part\n\
    # of the same build may be rewriting at that moment -- and this build, whose\n# whole purpose is to replace\
    \ the toolchain it is running from, executes\n# llvm-ar on every static-library link, clang on every compile,\
    \ and ld.lld\n# through -fuse-ld=lld on every link. l3 found this the expensive way: a link\n# died with \"\
    Permission denied\" on a file that plainly existed and was\n# executable, four thousand targets into a build.\n\
    #\n# Staging the tools elsewhere would not be enough, and would be worse than it\n# looks: clang finds its builtin\
    \ headers and compiler-rt by walking up from\n# the path it was invoked at, so a copied clang needs --resource-dir,\
    \ which\n# points back into the tree this build installs into. The install is\n# redirected instead, and merged\
    \ into the prefix once nothing is left running\n# from it. Nothing that is exec'd, read as a header or searched\
    \ for a library\n# lives in a directory being written to.\nrm -rf \"$build/stage\"\nDESTDIR=\"$build/stage\"\
    \ ninja -C \"$build/obj\" -j\"$jobs\" install-distribution\ntest -d \"$build/stage$tc\"   # destdir + absolute\
    \ prefix = $build/stage/opt/tc\n# cp -a rather than a move: the prefix holds the previous generation's clang,\n\
    # lld and clang.cfg as well, and the copies this build does not install\n# (nothing, as it happens, but the\
    \ invariant is what makes that reviewable)\n# have to survive.\ncp -a \"$build/stage$tc/.\" \"$tc/\"\ntest -x\
    \ \"$tc/bin/clang\"\ntest -x \"$tc/bin/lld\"\n\n# Debug info is most of the volume and worth nothing to consumers.\
    \ Archives\n# only lose their debug sections, so linking behaviour is unchanged.\nfind \"$tc\" -type f -name\
    \ '*.a' -exec strip -g {} + 2>/dev/null || true\nfind \"$tc\" -type f -perm -u+x -exec strip --strip-unneeded\
    \ {} + 2>/dev/null || true\n# --- give clang a sysroot it understands --------------------------------\n#\n\
    # GCC does not install in the layout clang searches: its target libraries land\n# in <sysroot>/lib64 and its\
    \ C++ headers in <sysroot>/include/c++/<version>,\n# while clang's GCCInstallationDetector looks for those libraries\
    \ in\n# <sysroot>/usr/lib and derives the headers from\n# <sysroot>/usr/lib/gcc/<triple>/<version>. The trees\
    \ are moved to where clang\n# already looks rather than hard-coding -isystem and -L into every downstream\n\
    # consumer, which would still be wrong the moment anything used the compiler\n# as plain `clang foo.c`.\n#\n\
    # Every move below is written as \"move it if it is still where GCC put it\",\n# because this fragment runs\
    \ on all three llvm stages and only the first is\n# built by GCC. l3 and l4 receive a toolchain that has already\
    \ been through\n# here, with GCC itself pruned away, and have nothing to move. l3 found out\n# what the alternative\
    \ costs: an unguarded `find` of a directory the previous\n# stage had deliberately deleted, whose message went\
    \ to stderr unread, left\n# the version string empty and an assertion two lines later ended a stage\n# whose\
    \ twenty-minute build and install had already succeeded.\ngccdir=\"$tc/lib/gcc/x86_64-linux-musl\"\nif [ -d\
    \ \"$gccdir\" ]; then\n  gccver=$(basename \"$(find \"$gccdir\" -mindepth 1 -maxdepth 1 -type d | head -1)\"\
    )\n  test -n \"$gccver\" || { echo \"no version directory under $gccdir\" >&2; exit 1; }\n  mkdir -p \"$sysroot/usr/lib/gcc/x86_64-linux-musl\"\
    \n  mv \"$gccdir/$gccver\" \"$sysroot/usr/lib/gcc/x86_64-linux-musl/$gccver\"\nfi\n\n# C++ headers, if they\
    \ are still beside the target prefix. The assertion is\n# that they are somewhere under the directory clang\
    \ searches; that clang then\n# finds them without being told is what the C++ case of the verification is\n#\
    \ for, and it is the check that matters.\nfor d in \"$sysroot/include/c++\" \"$tc/include/c++\"; do\n  if [\
    \ -d \"$d\" ]; then mv \"$d\" \"$sysroot/usr/include/\"; break; fi\ndone\ntest -d \"$sysroot/usr/include/c++\"\
    \n\n# GCC's target libraries, ditto, and for the same reason: rather than guess\n# which of lib64 and usr/lib\
    \ clang will settle on, both end up with them. They\n# are a few megabytes, and a toolchain that links C++ is\
    \ worth more than a\n# toolchain that is tidy. libitm is deliberately left behind -- it is\n# transactional-memory\
    \ support that nothing in this bootstrap uses. The two\n# assertions after the block are the real invariant\
    \ and hold equally for a\n# toolchain that arrived with the libraries already in place.\nif [ -d \"$sysroot/lib64\"\
    \ ]; then\n  mkdir -p \"$sysroot/usr/lib\"\n  for pattern in 'libstdc++*' 'libsupc++*' 'libgcc_s*' 'libatomic.a'\
    \ 'libatomic.so*'; do\n    for f in \"$sysroot/lib64\"/$pattern; do\n      if [ -e \"$f\" ]; then cp \"$f\"\
    \ \"$sysroot/usr/lib/\"; fi\n    done\n  done\nfi\ntest -e \"$sysroot/usr/lib/libstdc++.a\"\ntest -e \"$sysroot/usr/lib/libgcc_s.so.1\"\
    \n\n# musl ships no kernel headers and the kernel's user-space ABI is not the\n# libc's business to define,\
    \ so the sysroot is not complete until they are\n# unpacked into it. Everything that talks to the kernel directly\
    \ needs them.\ntar -xf \"$FASE_INPUT_ROOT/headers.tar.zst\" -C \"$sysroot\"\ntest -f \"$sysroot/usr/include/linux/netlink.h\"\
    \ntest -f \"$sysroot/usr/include/asm/unistd.h\"\n# --- publish a self-contained clang toolchain ---------------------------\n\
    #\n# clang needs none of the compiler that built it: not the GCC driver, not\n# cc1/cc1plus, not the cross binutils\
    \ (clang has its own integrated assembler\n# and links with lld). The sysroot keeps GCC's libgcc and libstdc++,\
    \ which is\n# not a compromise -- clang's default unwinder on Linux is libgcc, so those\n# archives are required\
    \ for static C++ regardless of what clang is built with.\n# ${tc:?} rather than $tc on the recursive deletions:\
    \ tc is a literal a few\n# lines up so an empty value is not reachable today, and the point of writing\n# it\
    \ this way is that \"-rf /lib64\" stays unreachable if that ever changes.\nrm -rf \"${tc:?}/lib/gcc\" \"$tc/libexec\"\
    \ \"$tc/include\" \"$tc/share\" \"$tc/lib/cmake\"\nrm -f  \"$tc/bin/x86_64-linux-musl-\"*\nrm -f  \"$tc/bin/gcc\"\
    * \"$tc/bin/g++\"* \"$tc/bin/cpp\"* \"$tc/bin/gcov\"*\n# $tc/lib64 holds GCC's libcc1, the GDB-facing compiler\
    \ plugin; the sysroot's\n# own lib64 is untouched and keeps the runtime libraries moved in above.\nrm -rf \"\
    ${tc:?}/lib64\" \"$tc/lib/bfd-plugins\" \"$tc/x86_64-linux-musl/bin\"\n\n# The alias drivers install as full\
    \ copies of the binary (LLVM_USE_SYMLINKS is\n# off by default, and fase's archive format has no symlink entries\
    \ either).\n# clang++ and ld.lld are each the same ~100 MB binary in a different driver\n# mode, so replace\
    \ the copies with two-line wrappers.\nwrap() { # wrap <name> <real-name> <flag>\n  rm -f \"$tc/bin/$1\"\n  #\
    \ The wrapper finds its sibling from its own path, not from the absolute\n  # prefix the toolchain was built\
    \ at. That prefix is correctly baked into\n  # plenty of things -- the sysroot in clang.cfg, the rpaths -- but\
    \ it must\n  # not be baked into this one. The l4 stage unpacks a *previous* toolchain\n  # under a different\
    \ path and runs its clang++ to compare against the new\n  # one; an absolute wrapper would quietly run the new\
    \ compiler twice and\n  # report a fixed point that was never tested.\n  printf '#!/bin/sh\\nexec \"$(dirname\
    \ \"$0\")/%s\" %s \"$@\"\\n' \"$2\" \"$3\" > \"$tc/bin/$1\"\n  chmod 0755 \"$tc/bin/$1\"\n}\nwrap clang++ clang\
    \ --driver-mode=g++\n# lld parses its -flavor only as a separate argument in position 1\n# (lld/Common/DriverDispatcher.cpp\
    \ checks argsV[1] == \"-flavor\" and\n# reads argsV[2]); \"-flavor=gnu\" is not recognised and would leave the\n\
    # generic driver with no flavour at all, which it refuses to run.\n#\n# The dispatcher picks its flavour from\
    \ argv[0], and there is no name it\n# accepts for \"you choose\": invoked as plain `lld` it prints \"lld is\
    \ a generic\n# driver\" *and exits non-zero*, so the binary LLVM installed as bin/lld is not\n# a usable entry\
    \ point at all, only the thing ld.lld is made from. That is\n# upstream's design -- real installs ship bin/lld\
    \ too and reach it through\n# ld.lld -- but it means ld.lld is the name every consumer and every check has\n\
    # to use, including the trivial `--version`. A verification here that read the\n# version as `lld --version`\
    \ would kill the step after a twenty-minute build.\nwrap ld.lld  lld   \"-flavor gnu\"\ntest -x \"$tc/bin/lld\"\
    \n\n# The driver reads <exe-dir>/clang.cfg on every run, which is what makes the\n# published toolchain usable\
    \ as plain `clang foo.c` with no flags at all.\n# Everything is also spelled out explicitly at build time, so\
    \ nothing in the\n# bootstrap itself depends on this file being picked up.\n# The driver's option is -fuse-ld=lld.\
    \ The two-dash spelling is not a synonym\n# clang tolerates: it is rejected as an unknown argument, and because\
    \ the\n# config file is parsed on *every* invocation -- including `clang --version`\n# -- a wrong flag here\
    \ makes the whole toolchain unusable rather than merely\n# changing how it links.\n{\n  printf '%s\\n' \"--sysroot=$sysroot\"\
    \n  printf '%s\\n' \"-fuse-ld=lld\"\n} > \"$tc/bin/clang.cfg\"\ncat \"$tc/bin/clang.cfg\"\n# --- self-host comparison\
    \ -----------------------------------------------\n#\n# The parent toolchain arrives as an `archive` input,\
    \ which the controller\n# unpacks into $FASE_INPUT_ROOT/tc/, so the prefix is that directory and not a\n# file\
    \ inside it.\nprev=\"$FASE_INPUT_ROOT/tc\"\ntest -x \"$prev/bin/clang\"\n\npython3 - \"$prev\" \"$tc\" > \"\
    $build/tree-diff.txt\" <<'PY'\nimport hashlib, os, stat, sys\n\ndef tree(root):\n    out = {}\n    for dirpath,\
    \ dirnames, filenames in os.walk(root):\n        dirnames.sort()\n        for name in sorted(filenames):\n \
    \           path = os.path.join(dirpath, name)\n            if not os.path.isfile(path) or os.path.islink(path):\n\
    \                continue\n            digest = hashlib.sha256()\n            with open(path, \"rb\") as fh:\n\
    \                for chunk in iter(lambda: fh.read(1 << 20), b\"\"):\n                    digest.update(chunk)\n\
    \            out[os.path.relpath(path, root)] = (\n                digest.hexdigest(), stat.S_IMODE(os.stat(path).st_mode))\n\
    \    return out\n\nold, new = tree(sys.argv[1]), tree(sys.argv[2])\nonly_old = sorted(set(old) - set(new))\n\
    only_new = sorted(set(new) - set(old))\ndiffer = sorted(p for p in set(old) & set(new) if old[p] != new[p])\n\
    \nprint(\"files\\t%d parent\\t%d child\" % (len(old), len(new)))\nfor label, listing in ((\"only-in-parent\"\
    , only_old), (\"only-in-child\", only_new)):\n    print(\"%s\\t%d\" % (label, len(listing)))\n    for path in\
    \ listing[:40]:\n        print(\"\\t%s\" % path)\nprint(\"differing\\t%d\" % len(differ))\nfor path in differ[:80]:\n\
    \    print(\"\\t%s\" % path)\n\n# What actually decides whether this is a fixed point: the two compilers.\n\
    # bin/lld is the linker's real code -- bin/ld.lld is a two-line wrapper around\n# it -- so comparing the wrapper\
    \ would compare two files that are identical by\n# construction and prove nothing about the linker.\nfor name\
    \ in (\"bin/clang\", \"bin/lld\", \"bin/llvm-ar\", \"bin/ld.lld\"):\n    if name in old and name in new:\n \
    \       print(\"identical\\t%s\\t%s\" % (name, old[name][0] == new[name][0]))\nPY\ncat \"$build/tree-diff.txt\"\
    \n\n# Functional equivalence: the same source compiled by each compiler must give\n# byte-identical output.\
    \ This is the assertion; the tree diff above is context\n# for the report.\ncat > \"$build/fixed.c\" <<'C'\n\
    #include <math.h>\n#include <stdint.h>\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nstatic\
    \ uint64_t mix(uint64_t x) { x ^= x >> 33; x *= 0xff51afd7ed558ccdULL; return x ^ (x >> 29); }\nint main(int\
    \ argc, char **argv) {\n    uint64_t h = 1469598103934665603ULL;\n    for (int i = 1; i < argc; i++)\n     \
    \   for (const char *p = argv[i]; *p; p++) h = mix(h ^ (unsigned char)*p);\n    printf(\"%llu %.3f\\n\", (unsigned\
    \ long long)h, sqrt((double)(h % 1000)));\n    return (int)(h & 0x7f);\n}\nC\ncat > \"$build/fixed.cc\" <<'CPP'\n\
    #include <algorithm>\n#include <map>\n#include <string>\n#include <vector>\nint main() {\n    std::map<std::string,\
    \ int> m{{\"llvm\", 3}, {\"musl\", 2}, {\"busybox\", 1}};\n    std::vector<int> v;\n    for (const auto &kv\
    \ : m) v.push_back(kv.second);\n    std::sort(v.rbegin(), v.rend());\n    return v.size() == 3 ? v[0] : 99;\n\
    }\nCPP\n\nmkdir -p \"$build/corpus\"\nfor which in parent child; do\n  if [ \"$which\" = parent ]; then bin=\"\
    $prev/bin\"; else bin=\"$tc/bin\"; fi\n  # Both compilers are given the same sysroot and the same PATH, so the\
    \ same\n  # lld: the only variable in this comparison is meant to be the compiler\n  # itself. clang++ is invoked\
    \ as clang --driver-mode=g++ rather than through\n  # the installed wrapper, so that a bug in the wrapper cannot\
    \ turn this test\n  # into a comparison of the child against itself.\n  for opt in -O0 -O2; do\n    \"$bin/clang\"\
    \ --driver-mode=gcc   --sysroot=\"$sysroot\" $opt -static -o \"$build/corpus/fixed-$which$opt\"    \"$build/fixed.c\"\
    \n    \"$bin/clang\" --driver-mode=g++   --sysroot=\"$sysroot\" $opt -static -o \"$build/corpus/fixed-cc-$which$opt\"\
    \ \"$build/fixed.cc\"\n  done\ndone\n( cd \"$build/corpus\" && sha256sum ./* ) | sed 's|  \\./|  |' | sort -k2\
    \ > \"$build/corpus.sha\"\ncat \"$build/corpus.sha\"\n\n# Every parent binary must appear with exactly one identical\
    \ child binary.\nfail=0\nwhile read -r digest name; do\n  twin=${name/parent/child}\n  want=$(awk -v n=\"$twin\"\
    \ '$2 == n { print $1 }' \"$build/corpus.sha\")\n  if [ \"$digest\" != \"$want\" ]; then\n    echo \"not a fixed\
    \ point: $name and $twin differ\" >&2\n    fail=1\n  fi\ndone < <(grep parent \"$build/corpus.sha\")\ntest \"\
    $fail\" -eq 0\necho \"functional fixed point reached: $(grep -c . \"$build/corpus.sha\") binaries, all parent/child\
    \ pairs identical\"\n# --- publish the report -------------------------------------------------\nmkdir -p \"\
    $FASE_OUTPUT_ROOT\"\n{\n  echo \"llvm self-host fixed point report\"\n  echo \"parent        $FASE_VAR_PARENT_REV\"\
    \n  echo \"child         $FASE_VAR_CHILD_REV\"\n  echo \"source        llvm-project $version\"\n  echo \"clang\
    \         $(clang --version | head -1)\"\n  echo \"triple        $(clang -dumpmachine)\"\n  echo \"host    \
    \      $(uname -m) $(uname -s)\"\n  echo\n  echo \"--- toolchain tree comparison (informational) ---\"\n  cat\
    \ \"$build/tree-diff.txt\"\n  echo\n  echo \"--- compiled corpus comparison (asserted) ---\"\n  cat \"$build/corpus.sha\"\
    \n  echo\n  echo \"functional fixed point reached: every parent binary has an identical child\"\n} > \"$FASE_OUTPUT_ROOT/report.txt\"\
    \n# The verdict is the sentence the report exists for, and it is written last, so\n# finding it here is also\
    \ the check that the file was written whole. The\n# comparison that decides it has already run and asserted;\
    \ what this catches is\n# a report that is missing its own conclusion. It used to grep for a line that\n# only\
    \ ever went to the step's stdout -- never into the file -- so it could not\n# match, and a stage that had reached\
    \ its fixed point died here in silence.\ngrep -q '^functional fixed point reached' \"$FASE_OUTPUT_ROOT/report.txt\"\
    \nwc -l \"$FASE_OUTPUT_ROOT/report.txt\"\n"
  workspace:
    taskSizeLimit: 300Gi
    inputSizeLimit: 32Gi
    outputSizeLimit: 32Gi
    transferSizeLimit: 32Gi
  nodeSelector:
    kubernetes.io/hostname: node1
---
apiVersion: skyw.top/v1beta1
kind: Recipe
metadata:
  name: llvm-clang-l4
spec:
  inputs:
    artifacts:
    - name: tc
      artifactSelector:
        matchLabels:
          name: clang-musl-tc
          rev: l3
    - name: source
      artifactSelector:
        matchLabels:
          name: llvm-project-source
          recipe: fetch-v1
    - name: headers
      artifactSelector:
        matchLabels:
          name: linux-headers
          recipe: headers-v1
    - name: packtar
      artifactSelector:
        matchLabels:
          name: packtar-tool
          version: v2
  outputs:
    artifacts:
    - name: report
      from:
        task: build
        artifact: report
      labels:
        name:
          value: llvm-selfhost-report
        llvm:
          fromInput:
            input: source
            label: version
        parent:
          value: l3
        child:
          value: l4
        arch:
          value: amd64
        kind:
          value: report
  tasks:
  - name: build
    variables:
      jobs:
        value: '32'
      parent-rev:
        value: l3
      child-rev:
        value: l4
    inputs:
      artifacts:
      - name: tc
        from:
          recipeInput: tc
      - name: source
        from:
          recipeInput: source
      - name: headers
        from:
          recipeInput: headers
      - name: packtar
        from:
          recipeInput: packtar
    outputs:
    - name: report
    taskSelector:
      matchLabels:
        capability: llvm-clang-l4
---
apiVersion: skyw.top/v1beta1
kind: Task
metadata:
  name: python-build
  labels:
    capability: python-build
spec:
  image: gcc:16.2.0-trixie
  imagePullSecrets:
  - name: fase-ghcr-pull
  - name: fase-registry-pull
  command:
  - /bin/bash
  securityContext:
    runAsUser: 0
    runAsNonRoot: false
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: '32'
      memory: 64Gi
      ephemeral-storage: 200Gi
    limits:
      cpu: '32'
      memory: 64Gi
      ephemeral-storage: 300Gi
  inputs:
    variables:
    - name: jobs
      env: FASE_VAR_JOBS
      required: true
    artifacts:
    - name: tc
      path: tc.tar.zst
      kind: file
    - name: deps
      path: deps.tar.zst
      kind: file
    - name: source
      path: source
      kind: file
    - name: packtar
      path: packtar.py
      kind: file
  outputs:
    artifacts:
    - name: runtime
      path: python-runtime.tar.zst
      kind: file
    - name: stdlib
      path: python-stdlib.tar.zst
      kind: file
    - name: dev
      path: python-dev.tar.zst
      kind: file
  script: "set -eu\nif ! command -v zstd >/dev/null 2>&1; then\n  apt-get update -qq >/dev/null\n  apt-get install\
    \ -y -qq --no-install-recommends zstd >/dev/null\nfi\nmkdir -p /workspace/inputs\nmkdir -p \"/workspace/inputs/tc\"\
    \nzstd -dc \"/in/tc.tar.zst\" | tar -xf - -C \"/workspace/inputs/tc\"\nmkdir -p \"/workspace/inputs/deps\"\n\
    zstd -dc \"/in/deps.tar.zst\" | tar -xf - -C \"/workspace/inputs/deps\"\nln -s \"/in/source\" \"/workspace/inputs/source\"\
    \nln -s \"/in/packtar.py\" \"/workspace/inputs/packtar.py\"\nexport FASE_INPUT_ROOT=/workspace/inputs\nset -Eeuo\
    \ pipefail\n\n# ---------------------------------------------------------------------------\n# CPython 3.13.15,\
    \ built for x86_64-linux-musl by the clang this bootstrap\n# produced, linked against the eleven libraries the\
    \ previous step built.\n#\n# Three decisions shape the whole script, and each of them is Debian's:\n#\n#   *\
    \ **No shared libpython.** Debian's python3.13 has no `libpython3.13.so`;\n#     the interpreter and the extension\
    \ modules share symbols through the\n#     interpreter's own dynamic symbol table, which is why `LINKFORSHARED`\
    \ is\n#     `-Xlinker -export-dynamic` and why `libpython3.13.a` is a *development*\n#     artefact. A shared\
    \ libpython would be a different (and, on musl, an\n#     unusual) design.\n#   * **Cross-configured, with a\
    \ build python.** configure is told the build\n#     host is `x86_64-pc-linux-gnu` and the target `x86_64-linux-musl`,\
    \ so it\n#     compiles its probes instead of running them, and takes their answers from\n#     `config.site`\
    \ below. Every value in that file was measured by running the\n#     same probe under the toolchain (the measurement\
    \ is in the comment above\n#     each line). It needs a python for the *build* host to generate the frozen\n\
    #     modules and the opcode tables; that python is built here, from this same\n#     source, with the host's\
    \ gcc -- a build tool, not part of the output, in\n#     the same sense as `make`.\n#   * **Hardened like a\
    \ distribution build.** The same flags Debian's\n#     dpkg-buildflags would put in CFLAGS are used, minus the\
    \ ones that are\n#     glibc-specific (`_FORTIFY_SOURCE` has no meaning in musl's headers).\n#\n# The install\
    \ tree is then split three ways -- runtime, standard library,\n# development -- and the three are this step's\
    \ three outputs. The split is by\n# path, the way Fedora splits python3 from python3-libs; Debian's split is\n\
    # finer-grained (it curates a minimal stdlib subset) and this one is not, which\n# is written down in the report\
    \ rather than glossed over.\n# ---------------------------------------------------------------------------\n\
    \ntc=/opt/tc\nsrc=\"$FASE_INPUT_ROOT\"\nroot=\"$FASE_OUTPUT_ROOT\"\njobs=\"$FASE_VAR_JOBS\"\nsys=\"$tc/x86_64-linux-musl\"\
    \ndeps=\"$src/deps/usr\"\nbuild=/workspace/build\nstage=\"$build/stage\"\n# Each part is written straight into\
    \ a directory of its own under the output\n# root, because the Step declares each as an artifact path: what\
    \ is inside\n# `$FASE_OUTPUT_ROOT/python-runtime` is what the runtime artifact contains.\nsplit=\"$root\"\n\
    runtime=\"$split/python-runtime\"\nstdlib=\"$split/python-stdlib\"\ndev=\"$split/python-dev\"\nlogs=\"$root/build-logs\"\
    \n\nmkdir -p \"$tc\"\ncp -a \"$FASE_INPUT_ROOT/tc/.\" \"$tc/\"\nrm -rf \"$build\"\nmkdir -p \"$build\" \"$stage\"\
    \ \"$split\" \"$logs\"\nexport PATH=\"$tc/bin:$PATH\"\n\n# `packtar.py` compresses with zstd, and the image\
    \ this step runs in does not\n# have it: it is the same Debian gcc image the image stage runs in, where the\n\
    # same tool had to be installed at the top of the script for the same reason.\n# It is asked for here rather\
    \ than at the end, so that a missing packer is\n# discovered before two interpreters have been built rather\
    \ than after -- the\n# step before this one built its whole prefix and then died in `publish` with\n# `FileNotFoundError:\
    \ 'zstd'`, which is a ten-minute way to learn one word.\nif ! command -v zstd >/dev/null 2>&1; then\n  export\
    \ DEBIAN_FRONTEND=noninteractive\n  apt-get update -qq >/dev/null\n  apt-get install -y -qq --no-install-recommends\
    \ zstd >/dev/null\nfi\ncommand -v zstd\n\nmkdir -p /lib\nln -sf \"$sys/lib/ld-musl-x86_64.so.1\" /lib/ld-musl-x86_64.so.1\n\
    \ncurrent=startup\nonfail() {\n  rc=$?\n  printf '\\n=== FAILED in %s (exit %s) ===\\n' \"$current\" \"$rc\"\
    \ >&2\n  if [ -f \"$logs/$current.log\" ]; then\n    printf -- '--- last 40 lines of %s.log ---\\n' \"$current\"\
    \ >&2\n    tail -40 \"$logs/$current.log\" >&2\n  fi\n  exit \"$rc\"\n}\ntrap onfail ERR\n\n# Two copies of\
    \ the source tree, from one tarball. The first is what the build\n# python is built from -- on the build host,\
    \ with the host's compiler and the\n# host's C library. The second is the tree the target is configured and\
    \ built\n# in. They are unpacked separately because they are two different programs, and\n# a tree that has\
    \ been configured for the target must not be the tree a\n# host binary is compiled from: that is how a cross\
    \ build ends up with a build\n# tool compiled against the target's headers. `make` in either tree would also\n\
    # collide with the other's generated files.\nhostsrc=\"$build/host-src\"\nsrcdir=\"$build/target-src\"\ntar\
    \ -xf \"$src/source\" -C \"$build\"\nmv \"$build/Python-3.13.15\" \"$hostsrc\"\ntar -xf \"$src/source\" -C \"\
    $build\"\nmv \"$build/Python-3.13.15\" \"$srcdir\"\ntest -f \"$srcdir/configure\"\ntest -f \"$hostsrc/configure\"\
    \n\necho \"==================================================================\"\necho \" the build python: this\
    \ same source, for the build host\"\necho \"==================================================================\"\
    \ncurrent=host-python\n\n# The build host's environment is emptied of everything that names the target,\n# for\
    \ `configure` and for `make` alike. Unsetting them only for configure is\n# the mistake that makes this section\
    \ look like it works: configure records\n# the host's compiler, and then make -- which does read the environment\
    \ --\n# hands the target's flags to that compiler. The result compiles, and fails on\n# the first symbol the\
    \ two C libraries do not share.\nhost_env() {\n  # PATH is replaced rather than extended: the bootstrap toolchain\
    \ must not be\n  # reachable from here at all. clang reads the clang.cfg next to its own\n  # binary, and that\
    \ file names the target sysroot -- a clang reached through\n  # the inherited PATH would pull the target's headers\
    \ into a host build\n  # whether or not any flag in this script says so.\n  env -u CFLAGS -u CPPFLAGS -u LDFLAGS\
    \ -u CC -u CXX -u AR -u RANLIB -u NM \\\n      -u STRIP -u CONFIG_SITE -u CFLAGS_NODIST -u LDFLAGS_NODIST \\\
    \n      PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \"$@\"\n}\nrm -rf \"$build/host\"\n\
    mkdir -p \"$build/host\"\nhost_env sh -c '\n  set -e\n  cd \"$1\"\n  \"$2\" --prefix=\"$3\" --without-ensurepip\
    \ --disable-shared > \"$4\" 2>&1\n  make -j\"$5\" >> \"$4\" 2>&1\n  make install >> \"$4\" 2>&1\n' host-python\
    \ \"$build/host\" \"$hostsrc/configure\" \"$build/host-inst\" \\\n  \"$logs/host-python.log\" \"$jobs\"\n\"\
    $build/host-inst/bin/python3.13\" -c 'import sys; print(\"build python:\", sys.version)'\n\n# The target's flags,\
    \ exported now and not earlier, for the same reason.\n# --sysroot everywhere, the dependency prefix on both\
    \ search paths, and the\n# same -Wl,--undefined-version lld needs for the map files some of these\n# packages\
    \ ship.\nexport CC=clang CXX=clang++\nexport AR=llvm-ar RANLIB=llvm-ranlib NM=llvm-nm STRIP=llvm-strip\nexport\
    \ CFLAGS=\"--sysroot=$sys -O2 -fno-strict-aliasing -fstack-protector-strong -fcf-protection=full -ffile-prefix-map=$srcdir=.\"\
    \nexport CPPFLAGS=\"-I$deps/include\"\nexport LDFLAGS=\"--sysroot=$sys -L$deps/lib -Wl,-rpath-link,$deps/lib\
    \ -Wl,-z,relro -Wl,-z,now -Wl,--undefined-version\"\n\necho \"==================================================================\"\
    \necho \" configure\"\necho \"==================================================================\"\ncurrent=configure\n\
    # Each ac_cv_ value is a probe that cannot be *run* in a cross build, answered\n# from a measurement. The two\
    \ file checks are the ones configure refuses to\n# guess; the rest are the answers this platform actually gives.\n\
    cat > \"$build/config.site\" <<'SITE'\n# Measured, not assumed. `ac_cv_buggy_getaddrinfo`: musl's getaddrinfo\
    \ handles\n# the AI_V4MAPPED/AI_ADDRCONFIG combination CPython's probe is about.\nac_cv_buggy_getaddrinfo=no\n\
    # The two device files configure checks for. /dev/ptmx exists on every Linux\n# that can allocate a pty; /dev/ptc\
    \ does not (it is an AIX spelling).\nac_cv_file__dev_ptmx=yes\nac_cv_file__dev_ptc=no\n# Whether sem_getvalue()\
    \ can be trusted; musl's is a real implementation that\n# returns the current value.\nac_cv_broken_sem_getvalue=no\n\
    # Whether a thread is required to align the stack itself -- true for some\n# architectures (armv7 with certain\
    \ toolchains). Not for x86-64.\nac_cv_aligned_required=no\n# tzset() must notice a changed TZ variable; musl's\
    \ does.\nac_cv_working_tzset=yes\n# Whether pthreads are available and usable; musl is pthreads.\nac_cv_pthread_system_supported=yes\n\
    SITE\n\ncd \"$srcdir\"\nCONFIG_SITE=\"$build/config.site\" ./configure \\\n  --build=x86_64-pc-linux-gnu \\\n\
    \  --host=x86_64-linux-musl \\\n  --with-build-python=\"$build/host-inst/bin/python3.13\" \\\n  --prefix=/usr\
    \ --libdir=/usr/lib \\\n  --with-system-expat \\\n  --with-openssl=\"$deps\" \\\n  --enable-loadable-sqlite-extensions\
    \ \\\n  --with-pkg-config=no \\\n  --without-ensurepip \\\n  > \"$logs/configure.log\" 2>&1\n\n# Read back rather\
    \ than assume. BLDLIBRARY is the one that says whether\n# libpython is static, and LINKFORSHARED is the one\
    \ that decides whether an\n# extension module can resolve CPython's symbols at all.\ngrep -E '^(CONFIG_ARGS|LINKFORSHARED|BLDLIBRARY)='\
    \ Makefile\n\necho \"==================================================================\"\necho \" build\"\n\
    echo \"==================================================================\"\ncurrent=build\nmake -j\"$jobs\"\
    \ > \"$logs/workspace/build.log\" 2>&1\ntest -x \"$srcdir/python\"\n\"$srcdir/python\" -c 'import sys; print(\"\
    target python built:\", sys.version.split()[0])' 2>/dev/null ||\n  env LD_LIBRARY_PATH=\"$deps/lib\" \"$sys/lib/ld-musl-x86_64.so.1\"\
    \ \"$srcdir/python\" \\\n    -c 'import sys; print(\"target python built:\", sys.version.split()[0])'\n\necho\
    \ \"==================================================================\"\necho \" install\"\necho \"==================================================================\"\
    \ncurrent=install\nmake DESTDIR=\"$stage\" install > \"$logs/install.log\" 2>&1\ntest -x \"$stage/usr/bin/python3.13\"\
    \n\n# A stable, honest way to run the interpreter that was just installed: through\n# musl's loader explicitly,\
    \ with the dependency prefix on the library path.\n# This is also how the verification step runs it.\ntarget_python()\
    \ {\n  env LD_LIBRARY_PATH=\"$deps/lib\" \"$sys/lib/ld-musl-x86_64.so.1\" \\\n    \"$stage/usr/bin/python3.13\"\
    \ \"$@\"\n}\n\necho \"==================================================================\"\necho \" byte-compile\
    \ the standard library\"\necho \"==================================================================\"\ncurrent=compileall\n\
    # Two reasons the standard library is compiled here rather than left to the\n# compileall `make install` runs\
    \ by itself.\n#\n# The first is the filename recorded in each .pyc. `make install` compiles with\n# the *build*\
    \ python, and the name it records is the path it compiled -- the\n# staging path. -s strips that prefix and\
    \ -p puts the installed one back, so\n# the compiled-in name is the name the file will have in the image. (-d\
    \ would be\n# the natural way to say \"the destination is /usr/lib/python3.13\", and it is\n# refused in combination\
    \ with -s; the two are alternatives, not complements.)\n#\n# The second is invalidation. A timestamp .pyc is\
    \ checked by comparing the\n# source's mtime against the mtime recorded at compile time, and this artifact\n\
    # cannot carry mtimes at all: the archive format stores every file with mtime 0.\n# A timestamp .pyc would be\
    \ invalid the moment it was unpacked -- the recorded\n# build-time mtime never matches 0 -- so every process\
    \ start would recompile the\n# standard library in memory and then fail to write the result into a read-only\n\
    # image. unchecked-hash does not consult the source, which is the right property\n# for a standard library that\
    \ ships inside an immutable image. Debian ships\n# timestamp-mode .pyc; that difference is deliberate, and it\
    \ follows from the\n# packaging rather than from the interpreter.\n# Both, and neither is enough on its own:\
    \ `set +e` is what stops the shell\n# from exiting on the failure, and withdrawing the ERR trap is what stops\
    \ it\n# from being reported through onfail and exiting there instead. The expected\n# failure is handled by\
    \ the exit code below.\n#\n# Three levels, because `make install` compiles three: the Makefile passes\n# `-o\
    \ 0 -o 1 -o 2` to its own compileall, so every module exists as\n# __init__.cpython-313.pyc and an .opt-1 and\
    \ an .opt-2 beside it -- and those\n# two were compiled in timestamp mode, which is the mode the paragraph above\n\
    # says cannot work here. What is recompiled here is therefore all three, and\n# the check below reads every\
    \ .pyc in the tree rather than one of them, because\n# \"the plain ones are hash-based and the optimised ones\
    \ are not\" is a state\n# that looks correct in any listing and recompiles the standard library on\n# every\
    \ import.\nset +e\ntrap - ERR\n# The config-3.13 directory is compiled as well: `make install` compiles\n# python-config.py\
    \ along with the standard library, and a timestamp .pyc left\n# there would be the same fault in a smaller place.\n\
    compile_dirs=(\"$stage/usr/lib/python3.13\")\nfor d in \"$stage/usr/lib\"/config-*; do\n  [ -d \"$d\" ] && compile_dirs+=(\"\
    $d\")\ndone\ntarget_python -m compileall -q -f -j \"$jobs\" \\\n  --invalidation-mode unchecked-hash -o 0 -o\
    \ 1 -o 2 \\\n  -s \"$stage\" -p / \\\n  \"${compile_dirs[@]}\" > \"$logs/compileall.log\" 2>&1\nrc=$?\ntrap\
    \ onfail ERR\nset -e\n\n# compileall exits 1 if any file failed to compile, and five files in this\n# standard\
    \ library are *supposed* to fail: Lib/test ships fixtures whose\n# syntax is broken on purpose -- a __future__\
    \ import that is not first, files\n# with deliberately wrong encodings -- because the tests are about how the\n\
    # parser reports them. The exit code therefore says nothing by itself; what\n# says something is whether the\
    \ failures are all inside Lib/test.\nif [ \"$rc\" != 0 ]; then\n  broken=$(grep -c '^\\*\\*\\* Error compiling'\
    \ \"$logs/compileall.log\" || true)\n  outside=$(grep '^\\*\\*\\* Error compiling' \"$logs/compileall.log\"\
    \ \\\n            | grep -vc \"$stage/usr/lib/python3.13/test/\" || true)\n  if [ \"$broken\" -eq 0 ] || [ \"\
    $outside\" != 0 ]; then\n    echo \"compileall failed outside Lib/test ($outside files)\" >&2\n    exit 1\n\
    \  fi\n  printf 'byte-compile: %s files refuse to compile, all of them test fixtures\\n' \"$broken\"\nfi\npyc=$(find\
    \ \"$stage/usr/lib\" -name '*.pyc' | wc -l)\necho \"byte-compiled modules: $pyc\"\ntest \"$pyc\" -gt 500\n\n\
    # Nothing in a package should name the directory it was built in.\nif grep -rl \"$stage\" \"$stage/usr\" --include='*.pyc'\
    \ -q 2>/dev/null; then\n  echo \"a .pyc names the staging directory\" >&2\n  exit 1\nfi\n\n# Read the answer\
    \ back out of every file rather than trusting the command line,\n# and out of every file rather than out of\
    \ one of them: the flags field of a\n# .pyc header says which invalidation mode wrote it, and the name marshalled\n\
    # inside is the path that was compiled in. Both are things a wrong flag\n# produces silently, and the flags\
    \ encoding is worth stating because it reads\n# backwards: bit 0 means \"hash-based\", bit 1 means \"the loader\
    \ must re-check\n# the source hash\". So 3 is *checked* hash and 1 is the unchecked one -- the\n# mode this\
    \ build wants, and the one that does not consult the source at all.\n# A tree with 5286 files in it is exactly\
    \ where one of them being different is\n# invisible, which is how the .opt-1 and .opt-2 files were found: flags\
    \ 0, left\n# behind by make install, in a tree whose plain .pyc were all flags 1.\ntarget_python - \"$stage/usr\"\
    \ <<'PY'\nimport collections, marshal, os, sys\n\nroot = sys.argv[1]\nseen = collections.Counter()\nwrong, named\
    \ = [], []\nfor dirpath, _dirnames, filenames in os.walk(root):\n    for name in sorted(filenames):\n      \
    \  if not name.endswith(\".pyc\"):\n            continue\n        path = os.path.join(dirpath, name)\n     \
    \   with open(path, \"rb\") as fh:\n            raw = fh.read()\n        flags = int.from_bytes(raw[4:8], \"\
    little\")\n        seen[flags] += 1\n        if flags not in (1, 3):\n            wrong.append(\"%s: flags %d\"\
    \ % (path, flags))\n        elif marshal.loads(raw[16:]).co_filename.startswith(\"/workspace/build\"):\n   \
    \         named.append(path)\n\ntotal = sum(seen.values())\nprint(\"pyc: %d files, flags %s\" % (\n    total,\
    \ \", \".join(\"%d x%d\" % (f, n) for f, n in sorted(seen.items()))))\nif wrong:\n    sys.exit(\"timestamp-invalidated\
    \ .pyc in the tree (the archive carries no \"\n             \"mtimes, so these would be recompiled on every\
    \ import):\\n\" +\n             \"\\n\".join(wrong[:10]))\nif named:\n    sys.exit(\"a .pyc names the build\
    \ directory: %s\" % named[:3])\nPY\n\necho \"==================================================================\"\
    \necho \" split: runtime, standard library, development\"\necho \"==================================================================\"\
    \ncurrent=split\nrm -rf \"$runtime\" \"$stdlib\" \"$dev\"\nmkdir -p \"$runtime/usr/bin\" \"$stdlib/usr/lib\"\
    \ \\\n         \"$dev/usr/bin\" \"$dev/usr/lib\" \"$dev/usr/include\"\n\ninstall -m 0755 \"$stage/usr/bin/python3.13\"\
    \ \"$runtime/usr/bin/\"\n# Three names are deliberately *not* created here: python3, pydoc3 and idle3 are\n\
    # links to their versioned twins, and this step's output is collected by fase's\n# archive writer, which refuses\
    \ a symlink entry -- `visit()` in the controller's\n# storage.rs returns \"unsafe output\" for one. The links\
    \ are made in the OCI\n# layer instead, where a symlink is an ordinary tar entry, and the pass at the\n# end\
    \ of this script asserts that no link of any kind survives in the output.\n# (The same constraint is what materialises\
    \ the shared libraries' soname links\n# as copies, and the same layer restores them.)\n# Deliberately no /usr/bin/python\
    \ either: Debian does not ship one, for the\n# reason PEP 394 gives -- the name belongs to whatever the distribution\
    \ chose,\n# and guessing wrong breaks scripts.\nfor tool in pydoc3.13 idle3.13; do\n  [ -f \"$stage/usr/bin/$tool\"\
    \ ] && install -m 0755 \"$stage/usr/bin/$tool\" \"$runtime/usr/bin/\"\ndone\n\n# The standard library, minus\
    \ the two directories that are for people who\n# compile against Python rather than run it.\ncp -a \"$stage/usr/lib/python3.13\"\
    \ \"$stdlib/usr/lib/\"\nfor d in \"$stdlib/usr/lib/python3.13\"/config-*; do\n  [ -d \"$d\" ] && mv \"$d\" \"\
    $dev/usr/lib/\"\ndone\n\ncp -a \"$stage/usr/include/.\" \"$dev/usr/include/\"\ninstall -m 0644 \"$stage/usr/lib/libpython3.13.a\"\
    \ \"$dev/usr/lib/\"\n[ -d \"$stage/usr/lib/pkgconfig\" ] && { mkdir -p \"$dev/usr/lib/pkgconfig\"; cp -a \"\
    $stage/usr/lib/pkgconfig/.\" \"$dev/usr/lib/pkgconfig/\"; }\nfor cfg in \"$stage\"/usr/bin/*-config; do\n  [\
    \ -f \"$cfg\" ] && install -m 0755 \"$cfg\" \"$dev/usr/bin/\"\ndone\n\n# --- strip the runtime, the way dh_strip\
    \ does ---------------------------\n#\n# The symbol table of the interpreter alone is 16 MB of a 21 MB file\
    \ (measured:\n# 21276264 bytes before, 5183608 after), and of an extension module about half.\n# Debian ships\
    \ the stripped binary and keeps the symbols in a separate dbgsym\n# package, which is the shape of this split\
    \ as well: what is stripped is the\n# runtime part only. `--strip-all` on the executables and `--strip-unneeded`\
    \ on\n# the shared objects is exactly what dh_strip runs, and neither touches .dynsym\n# -- which is the thing\
    \ the stripping could break, because an extension module\n# resolves CPython's symbols out of the interpreter's\
    \ dynamic symbol table and\n# lib-dynload resolves the eleven libraries the same way. The check that it did\n\
    # not break is the extension-module import in the verification step, which is\n# the only thing that can check\
    \ it.\nunstripped=0\n# Which of these files are ELF is asked of the files rather than assumed: of\n# the three\
    \ executables this part installs, only the interpreter is a program.\n# `pydoc3.13` and `idle3.13` are Python\
    \ source with a shebang naming that\n# interpreter, and llvm-strip says so at length (\"The file was not recognized\n\
    # as a valid object file\") and exits non-zero, which under `set -e` ends the\n# build two thirds of the way\
    \ through the split.\nis_elf() { [ \"$(od -An -tx1 -N4 \"$1\" | tr -d ' \\n')\" = 7f454c46 ]; }\nfor exe in\
    \ \"$runtime/usr/bin\"/*; do\n  [ -f \"$exe\" ] || continue\n  is_elf \"$exe\" || continue\n  before=$(stat\
    \ -c %s \"$exe\")\n  llvm-strip --strip-all \"$exe\"\n  after=$(stat -c %s \"$exe\")\n  unstripped=$((unstripped\
    \ + before - after))\ndone\n# The extension modules are in the standard-library part, not the runtime one:\n\
    # they are the C half of the library, and the split here is by what a file is\n# for rather than by what language\
    \ it is written in.\nfor so in \"$stdlib/usr/lib/python3.13/lib-dynload\"/*.so; do\n  [ -f \"$so\" ] || continue\n\
    \  is_elf \"$so\" || continue\n  before=$(stat -c %s \"$so\")\n  llvm-strip --strip-unneeded \"$so\"\n  after=$(stat\
    \ -c %s \"$so\")\n  unstripped=$((unstripped + before - after))\ndone\n# The library still names its loader\
    \ and still exports its API. A strip that\n# had removed the dynamic symbol table would leave an interpreter\
    \ that starts\n# and then fails on the first import of an extension module, with an undefined\n# symbol naming\
    \ a function that is obviously present in the file -- so it is\n# asserted here, by name, before anything gets\
    \ a chance to run it.\n#\n# readelf writes to a file and the file is what gets grepped, rather than\n# `readelf\
    \ ... | grep -q`: the interpreter has some 200000 dynamic symbols, so\n# grep finds its match and exits while\
    \ readelf is still writing, readelf dies\n# of SIGPIPE, and with `pipefail` the pipeline reports 141 as the\
    \ failure --\n# which is how this check failed the first time it ran, on a build whose\n# stripping had in fact\
    \ been correct.\nreadelf -l \"$runtime/usr/bin/python3.13\" > \"$build/interp.program\" 2>/dev/null\ngrep -q\
    \ 'program interpreter' \"$build/interp.program\"\nreadelf --dyn-syms -W \"$runtime/usr/bin/python3.13\" > \"\
    $build/interp.syms\" 2>/dev/null\ngrep -q 'PyExc_RuntimeError' \"$build/interp.syms\"\nreadelf -SW \"$runtime/usr/bin/python3.13\"\
    \ > \"$build/interp.sections\" 2>/dev/null\nif grep -q '\\.symtab' \"$build/interp.sections\"; then\n  echo\
    \ \"the interpreter still has a static symbol table\" >&2\n  exit 1\nfi\nprintf 'stripped %s bytes from the\
    \ runtime part\\n' \"$unstripped\"\n\n# Every one of the three gets the documentation Debian would put in it:\
    \ a\n# copyright file naming the licence each part is under, and the notice CPython\n# asks to be distributed\
    \ with the interpreter.\nfor part in \"$runtime\" \"$stdlib\" \"$dev\"; do\n  mkdir -p \"$part/usr/share/doc/python3.13\"\
    \n  cp \"$srcdir/LICENSE\" \"$part/usr/share/doc/python3.13/LICENSE\"\ndone\ncat > \"$runtime/usr/share/doc/python3.13/copyright\"\
    \ <<'COPY'\nName: python3.13 (runtime)\nVersion: 3.13.15\nLicense: PSF-2.0\nSource: https://www.python.org/ftp/python/3.13.15/Python-3.13.15.tar.xz\n\
    \nThis package is the interpreter. The standard library is in python3.13-stdlib\nand the headers and static\
    \ library are in python3.13-dev, which is also where\nlibpython3.13.a lives: this interpreter has no shared\
    \ libpython, and extension\nmodules resolve CPython's symbols through the interpreter's dynamic symbol\ntable.\n\
    \nThe licence text is in LICENSE, next to this file.\nCOPY\ncat > \"$stdlib/usr/share/doc/python3.13/copyright\"\
    \ <<'COPY'\nName: python3.13-stdlib\nVersion: 3.13.15\nLicense: PSF-2.0\nSource: https://www.python.org/ftp/python/3.13.15/Python-3.13.15.tar.xz\n\
    \nThe Python standard library and the extension modules in lib-dynload. The\nextension modules link the libraries\
    \ built by the python-deps step (OpenSSL,\nlibsqlite3, libffi, zlib, bzip2, xz, ncurses, readline, gdbm, expat,\
    \ libuuid);\ntheir licences are in /usr/share/doc/<library>/copyright.\n\nThe licence text is in LICENSE, next\
    \ to this file.\nCOPY\ncat > \"$dev/usr/share/doc/python3.13/copyright\" <<'COPY'\nName: python3.13-dev\nVersion:\
    \ 3.13.15\nLicense: PSF-2.0\nSource: https://www.python.org/ftp/python/3.13.15/Python-3.13.15.tar.xz\n\nThe\
    \ headers, the static libpython3.13.a, python3.13-config and the pkg-config\nfiles. A C extension is built against\
    \ these and loaded by the interpreter in\npython3.13.\n\nThe licence text is in LICENSE, next to this file.\n\
    COPY\n\n# --- no symlinks in the output ------------------------------------------\n#\n# fase's archive writer\
    \ refuses a symlink entry outright -- `visit()` in the\n# controller's storage.rs returns \"unsafe output\"\
    \ -- so a step whose output\n# contains one fails at collection, after all the work is done. The dependency\n\
    # step learned this the same way and has the same pass; what it does is make\n# every link a copy of its target,\
    \ and delete the ones it cannot resolve, so\n# that what is collected and what is delivered are the same bytes.\n\
    #\n# The links that matter here are the two pkg-config names, which are copies of\n# python-3.13.pc by the time\
    \ this returns. The names themselves are not lost:\n# the OCI layer re-creates them, along with the three CPython\
    \ publishes beside\n# the interpreter and the seventeen soname links in the libraries. Making them\n# here would\
    \ not survive the trip anyway.\nmaterialise_links() { # materialise_links PART\n  local part=$1 link target\
    \ resolved copied=0 removed=0\n  while IFS= read -r -d '' link; do\n    target=$(readlink \"$link\")\n    case\
    \ \"$target\" in /*) rm -f \"$link\"; removed=$((removed+1)); continue ;; esac\n    resolved=\"$(dirname \"\
    $link\")/$target\"\n    if [ -d \"$resolved\" ]; then\n      rm -f \"$link\"; removed=$((removed+1))\n    elif\
    \ [ -f \"$resolved\" ]; then\n      cp -f \"$resolved\" \"$link.copy\"; mv -f \"$link.copy\" \"$link\"; copied=$((copied+1))\n\
    \    else\n      printf 'dangling symlink in the output: %s -> %s\\n' \"$link\" \"$target\" >&2\n      return\
    \ 1\n    fi\n  done < <(find \"$part\" -type l -print0)\n  printf 'links: %s materialised as copies, %s to directories\
    \ removed\\n' \\\n    \"$copied\" \"$removed\"\n}\nfor part in \"$runtime\" \"$stdlib\" \"$dev\"; do\n  printf\
    \ '%-18s ' \"$(basename \"$part\")\"\n  current=links\n  materialise_links \"$part\"\n  test -z \"$(find \"\
    $part\" -type l -print -quit)\"\ndone\n\necho \"==================================================================\"\
    \necho \" what was produced\"\necho \"==================================================================\"\n\
    for part in \"$runtime\" \"$stdlib\" \"$dev\"; do\n  printf '%-24s %8s bytes  %5s files\\n' \"$(basename \"\
    $part\")\" \\\n    \"$(du -sb \"$part\" | cut -f1)\" \"$(find \"$part\" -type f | wc -l)\"\ndone\n\ncurrent=report\n\
    {\n  printf 'python3.13\\n'\n  printf 'version\\t%s\\n' \"$(target_python -c 'import platform; print(platform.python_version())')\"\
    \n  printf 'implementation\\t%s\\n' \"$(target_python -c 'import platform; print(platform.python_implementation())')\"\
    \n  printf 'platform\\t%s\\n' \"$(target_python -c 'import sysconfig; print(sysconfig.get_platform())')\"\n\
    \  printf 'compiler\\t%s\\n' \"$(target_python -c 'import sysconfig; print(sysconfig.get_config_var(\"CC\"))')\"\
    \n  printf 'config-args\\t%s\\n' \"$(target_python -c 'import sysconfig; print(sysconfig.get_config_var(\"CONFIG_ARGS\"\
    ))')\"\n  printf 'link-for-shared\\t%s\\n' \"$(target_python -c 'import sysconfig; print(sysconfig.get_config_var(\"\
    LINKFORSHARED\"))')\"\n  printf 'shared-python\\t%s\\n' \"$(target_python -c 'import sysconfig; print(bool(sysconfig.get_config_var(\"\
    Py_ENABLE_SHARED\")))')\"\n  printf 'stdlib-dir\\t%s\\n' \"$(target_python -c 'import sysconfig; print(sysconfig.get_path(\"\
    stdlib\"))')\"\n  printf 'include-dir\\t%s\\n' \"$(target_python -c 'import sysconfig; print(sysconfig.get_path(\"\
    include\"))')\"\n  printf 'extension-suffix\\t%s\\n' \"$(target_python -c 'import sysconfig; print(sysconfig.get_config_var(\"\
    EXT_SUFFIX\"))')\"\n  printf 'bytecode\\tunchecked-hash\\n'\n  printf 'compiled-mods\\t%s\\n' \"$pyc\"\n  printf\
    \ 'build-python\\t%s\\n' \"$(\"$build/host-inst/bin/python3.13\" -c 'import sys; print(sys.version.split()[0])')\"\
    \n  printf 'toolchain\\t%s\\n' \"$(clang --version | head -1)\"\n  printf 'triple\\t%s\\n' \"$(clang -dumpmachine)\"\
    \n  printf 'hardening\\t-fstack-protector-strong -fcf-protection=full -Wl,-z,relro -Wl,-z,now\\n'\n  printf\
    \ 'extension-exts\\t%s\\n' \"$(find \"$stdlib/usr/lib/python3.13/lib-dynload\" -name '*.so' | wc -l)\"\n} >\
    \ \"$runtime/usr/share/doc/python3.13/BUILD.txt\"\ncat \"$runtime/usr/share/doc/python3.13/BUILD.txt\"\n\n#\
    \ The extension modules that were built, and the libraries they linked, which\n# is the whole point of the dependency\
    \ step: a module that is absent here is\n# absent because its library was not found, and this is where that\
    \ shows.\necho\necho \"--- extension modules and what they link ---\"\nfor so in \"$stdlib/usr/lib/python3.13/lib-dynload\"\
    /*.so; do\n  printf '%-28s %s\\n' \"$(basename \"$so\")\" \\\n    \"$(llvm-readelf -d \"$so\" | awk '/NEEDED/\
    \ {gsub(/[][]/,\"\",$5); printf \"%s \", $5}')\"\ndone | sort\n\n# --- publish ---------------------------------------------------------------\n\
    #\n# The three parts leave as zstd tars, for the same two reasons the dependency\n# step's prefix does. Every\
    \ input that receives one is declared as an archive\n# and is extracted into a directory before the receiving\
    \ script runs, so the\n# two ends agree without either of them mentioning compression; and a tar is\n# one object\
    \ in the store rather than the eight thousand files the standard\n# library would otherwise arrive as. `packtar.py`\
    \ writes it deterministically\n# -- entries sorted, ownership and timestamps zeroed, modes reduced to\n# 0755/0644\
    \ -- so the digest of each artifact is a property of the tree and not\n# of the run. It materialises links as\
    \ copies, which is the same thing\n# `materialise_links` above did by hand because an archive cannot carry a\
    \ link;\n# packing is therefore the second place that would notice a link left behind,\n# and the assertion\
    \ below is that nothing is.\nmkdir -p \"$root\"\nfor part in python-runtime python-stdlib python-dev; do\n \
    \ current=pack-$part\n  printf '%-18s ' \"$part\"\n  python3 \"$FASE_INPUT_ROOT/packtar.py\" \"$root/$part.tar.zst\"\
    \ \"$root/$part\"\n  zstd -q -t \"$root/$part.tar.zst\"\n  zstd -dc \"$root/$part.tar.zst\" | python3 -c \"\n\
    import sys, tarfile\nprint(sum(1 for _ in tarfile.open(fileobj=sys.stdin.buffer, mode='r|')), 'entries')\n\"\
    \ndone\ndu -sh \"$root\"/python-*.tar.zst\n"
  workspace:
    taskSizeLimit: 300Gi
    inputSizeLimit: 32Gi
    outputSizeLimit: 32Gi
    transferSizeLimit: 32Gi
  nodeSelector:
    kubernetes.io/hostname: node1
---
apiVersion: skyw.top/v1beta1
kind: Recipe
metadata:
  name: python-build
spec:
  inputs:
    artifacts:
    - name: tc
      artifactSelector:
        matchLabels:
          name: clang-musl-tc
          rev: l3
    - name: deps
      artifactSelector:
        matchLabels:
          name: python-deps
          recipe: python-deps-v1
    - name: source
      artifactSelector:
        matchLabels:
          name: python-source
          version: 3.13.15
          recipe: fetch-v1
    - name: packtar
      artifactSelector:
        matchLabels:
          name: packtar-tool
          version: v2
  outputs:
    artifacts:
    - name: python-runtime
      from:
        task: build
        artifact: runtime
      labels:
        name:
          value: python-runtime
        version:
          fromInput:
            input: source
            label: version
        recipe:
          value: python-build-v1
        libc:
          value: musl
        toolchain:
          fromInput:
            input: tc
            label: rev
        compiler:
          value: clang
        link:
          value: static
        arch:
          value: amd64
        kind:
          value: runtime
    - name: python-stdlib
      from:
        task: build
        artifact: stdlib
      labels:
        name:
          value: python-stdlib
        version:
          fromInput:
            input: source
            label: version
        recipe:
          value: python-build-v1
        libc:
          value: musl
        toolchain:
          fromInput:
            input: tc
            label: rev
        compiler:
          value: clang
        arch:
          value: amd64
        kind:
          value: stdlib
    - name: python-dev
      from:
        task: build
        artifact: dev
      labels:
        name:
          value: python-dev
        version:
          fromInput:
            input: source
            label: version
        recipe:
          value: python-build-v1
        libc:
          value: musl
        toolchain:
          fromInput:
            input: tc
            label: rev
        compiler:
          value: clang
        arch:
          value: amd64
        kind:
          value: dev
  tasks:
  - name: build
    variables:
      jobs:
        value: '48'
    inputs:
      artifacts:
      - name: tc
        from:
          recipeInput: tc
      - name: deps
        from:
          recipeInput: deps
      - name: source
        from:
          recipeInput: source
      - name: packtar
        from:
          recipeInput: packtar
    outputs:
    - name: runtime
    - name: stdlib
    - name: dev
    taskSelector:
      matchLabels:
        capability: python-build
---
apiVersion: skyw.top/v1beta1
kind: Task
metadata:
  name: python-deps
  labels:
    capability: python-deps
spec:
  image: gcc:16.2.0-trixie
  imagePullSecrets:
  - name: fase-ghcr-pull
  - name: fase-registry-pull
  command:
  - /bin/bash
  securityContext:
    runAsUser: 0
    runAsNonRoot: false
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: '32'
      memory: 64Gi
      ephemeral-storage: 200Gi
    limits:
      cpu: '32'
      memory: 64Gi
      ephemeral-storage: 300Gi
  inputs:
    variables:
    - name: jobs
      env: FASE_VAR_JOBS
      required: true
    artifacts:
    - name: tc
      path: tc.tar.zst
      kind: file
    - name: packtar
      path: packtar.py
      kind: file
    - name: zlib
      path: zlib
      kind: file
    - name: bzip2
      path: bzip2
      kind: file
    - name: xz
      path: xz
      kind: file
    - name: openssl
      path: openssl
      kind: file
    - name: sqlite
      path: sqlite
      kind: file
    - name: libffi
      path: libffi
      kind: file
    - name: ncurses
      path: ncurses
      kind: file
    - name: readline
      path: readline
      kind: file
    - name: expat
      path: expat
      kind: file
    - name: gdbm
      path: gdbm
      kind: file
    - name: util-linux
      path: util-linux
      kind: file
  outputs:
    artifacts:
    - name: deps
      path: deps.tar.zst
      kind: file
  script: "set -eu\nif ! command -v zstd >/dev/null 2>&1; then\n  apt-get update -qq >/dev/null\n  apt-get install\
    \ -y -qq --no-install-recommends zstd >/dev/null\nfi\nmkdir -p /workspace/inputs\nmkdir -p \"/workspace/inputs/tc\"\
    \nzstd -dc \"/in/tc.tar.zst\" | tar -xf - -C \"/workspace/inputs/tc\"\nln -s \"/in/packtar.py\" \"/workspace/inputs/packtar.py\"\
    \nln -s \"/in/zlib\" \"/workspace/inputs/zlib\"\nln -s \"/in/bzip2\" \"/workspace/inputs/bzip2\"\nln -s \"/in/xz\"\
    \ \"/workspace/inputs/xz\"\nln -s \"/in/openssl\" \"/workspace/inputs/openssl\"\nln -s \"/in/sqlite\" \"/workspace/inputs/sqlite\"\
    \nln -s \"/in/libffi\" \"/workspace/inputs/libffi\"\nln -s \"/in/ncurses\" \"/workspace/inputs/ncurses\"\nln\
    \ -s \"/in/readline\" \"/workspace/inputs/readline\"\nln -s \"/in/expat\" \"/workspace/inputs/expat\"\nln -s\
    \ \"/in/gdbm\" \"/workspace/inputs/gdbm\"\nln -s \"/in/util-linux\" \"/workspace/inputs/util-linux\"\nexport\
    \ FASE_INPUT_ROOT=/workspace/inputs\nset -euo pipefail\n\n# ---------------------------------------------------------------------------\n\
    # The eleven libraries CPython's standard library links against.\n#\n# They are built here, by the toolchain\
    \ this bootstrap produced, into a single\n# staging prefix that the later stages copy wholesale. One Step rather\
    \ than\n# eleven because the differences between them are flag-level and a shared\n# skeleton is what keeps\
    \ those differences comparable. What is *not* shared is\n# the documentation: each library gets its own Debian-style\n\
    # /usr/share/doc/<name>/copyright, written from the licence text that ships in\n# its own tarball, so the claim\
    \ in the file is checkable against the source it\n# came from rather than asserted by the build.\n#\n# Three\
    \ things about the environment shape every recipe below:\n#\n#   * The toolchain is musl, and its binaries are\
    \ dynamically linked. A target\n#     binary needs /lib/ld-musl-x86_64.so.1 to exist to start at all, and this\n\
    #     build runs programs it has just built -- ncurses' `tic` compiles the\n#     terminfo database during `make\
    \ install`. The loader is put in place for\n#     that reason. musl's dynamic linker treats libc.so as itself,\
    \ so a\n#     libc-only binary needs nothing else to be reachable.\n#   * Everything is built -fPIC and shared.\
    \ CPython's extension modules are\n#     shared objects that link these libraries at run time, so a static libssl\n\
    #     would be of no use to them.\n#   * The sysroot carries no third-party libraries at all. What one library\n\
    #     needs from another -- libssl needs libcrypto, libncursesw needs libtinfo,\n#     libreadline needs libncursesw\
    \ -- comes from the staging prefix, which is\n#     why CPPFLAGS and LDFLAGS name it from the first library\
    \ on, and why\n#     -rpath-link is set: a configure test that links -lreadline has to resolve\n#     readline's\
    \ own dependencies without being able to run them.\n# ---------------------------------------------------------------------------\n\
    \ntc=/opt/tc\nsrc=\"$FASE_INPUT_ROOT\"\nout=\"$FASE_OUTPUT_ROOT/deps\"\njobs=\"$FASE_VAR_JOBS\"\nsys=\"$tc/x86_64-linux-musl\"\
    \nprefix=\"$out/usr\"\nbuild=/workspace/build\nlogs=\"$FASE_OUTPUT_ROOT/build-logs\"\n\nmkdir -p \"$tc\"\ncp\
    \ -a \"$FASE_INPUT_ROOT/tc/.\" \"$tc/\"\nrm -rf \"$build\"\nmkdir -p \"$build\" \"$logs\" \"$prefix\"\nexport\
    \ PATH=\"$tc/bin:$PATH\"\n\n# `packtar.py` compresses with zstd, and the image this step runs in does not\n\
    # have it: it is the same Debian gcc image the image stage runs in, where the\n# same tool had to be installed\
    \ at the top of the script for the same reason.\n# It is asked for here rather than at the end, so that a missing\
    \ packer is\n# discovered before eleven libraries have been built rather than after -- the\n# first attempt\
    \ at this step built all of them and then died in `publish` with\n# `FileNotFoundError: 'zstd'`, which is a\
    \ ten-minute way to learn one word.\nif ! command -v zstd >/dev/null 2>&1; then\n  export DEBIAN_FRONTEND=noninteractive\n\
    \  apt-get update -qq >/dev/null\n  apt-get install -y -qq --no-install-recommends zstd >/dev/null\nfi\ncommand\
    \ -v zstd\n\nmkdir -p /lib\nln -sf \"$sys/lib/ld-musl-x86_64.so.1\" /lib/ld-musl-x86_64.so.1\n\nexport CC=clang\
    \ CXX=clang++\nexport AR=llvm-ar RANLIB=llvm-ranlib NM=llvm-nm STRIP=llvm-strip\nexport CFLAGS=\"--sysroot=$sys\
    \ -O2 -fPIC\"\nexport CXXFLAGS=\"$CFLAGS\"\nexport CPPFLAGS=\"-I$prefix/include\"\n# -Wl,--undefined-version\
    \ because lld rejects a version script that names a\n# symbol the object does not define, where GNU ld only\
    \ warns. Several of these\n# packages ship a map file written for GNU ld, and zlib's `configure` uses its\n\
    # own map file to *test* whether shared libraries work at all -- without this\n# flag that test fails, zlib\
    \ concludes the platform has no shared library\n# support, and installs a static-only prefix without saying\
    \ so.\nexport LDFLAGS=\"--sysroot=$sys -L$prefix/lib -Wl,-rpath-link,$prefix/lib -Wl,--undefined-version\"\n\
    \n# The toolchain describes itself; the report quotes it rather than restating it.\nclang --version | head -1\n\
    \n# Every library's output goes to its own log, so a failure has to say which\n# library it was and show what\
    \ its compiler said. Without this the step's log\n# ends at the last library that worked, and the reason is\
    \ in a file nobody\n# looks at.\ncurrent=startup\nonfail() {\n  rc=$?\n  printf '\\n=== FAILED in %s (exit %s)\
    \ ===\\n' \"$current\" \"$rc\" >&2\n  if [ -f \"$logs/$current.log\" ]; then\n    printf -- '--- last 40 lines\
    \ of %s.log ---\\n' \"$current\" >&2\n    tail -40 \"$logs/$current.log\" >&2\n  fi\n  exit \"$rc\"\n}\ntrap\
    \ onfail ERR\n\nunpack() { # unpack <input name>; sets srcdir, relative to $build\n  # Each archive is unpacked\
    \ into a directory of its own, named after the input.\n  # Unpacking them all into one directory and looking\
    \ for \"the directory that\n  # appeared\" is not the same thing: the third library's build would find the\n\
    \  # first one's source tree, and the error would be a missing .c file.\n  mkdir -p \"$build/$1\"\n  tar -xf\
    \ \"$src/$1\" -C \"$build/$1\"\n  srcdir=\"$1/$(basename \"$(find \"$build/$1\" -maxdepth 1 -mindepth 1 -type\
    \ d | head -1)\")\"\n}\n\ncopyright() { # copyright <name> <spdx> <licence-file>...\n  name=\"$1\"; spdx=\"\
    $2\"; shift 2\n  doc=\"$prefix/share/doc/$name\"\n  mkdir -p \"$doc\"\n  {\n    printf 'Name: %s\\n' \"$name\"\
    \n    printf 'Version: %s\\n' \"$upstream_version\"\n    printf 'License: %s\\n' \"$spdx\"\n    printf 'Source:\
    \ %s\\n' \"$upstream_url\"\n    printf '\\nThe licence text below is the one published with the source named\\\
    n'\n    printf 'above, included here as it shipped.\\n\\n'\n    for f in \"$@\"; do\n      if [ -f \"$build/$srcdir/$f\"\
    \ ]; then\n        printf '===== %s =====\\n' \"$f\"\n        cat \"$build/$srcdir/$f\"\n      else\n      \
    \  printf '===== %s (not present in this tarball) =====\\n' \"$f\"\n      fi\n      printf '\\n'\n    done\n\
    \  } > \"$doc/copyright\"\n}\n\nreport() { # report <name> <version> <spdx> <library files...>\n  name=\"$1\"\
    ; version=\"$2\"; spdx=\"$3\"; shift 3\n  # The files are named by pattern, so a library that was not built\
    \ is a\n  # pattern that matches nothing rather than an absent name. Checked here\n  # because a prefix missing\
    \ one of these still links and still installs: it\n  # fails much later, as a stdlib module that cannot be imported.\n\
    \  for f in \"$@\"; do\n    if [ ! -f \"$f\" ]; then\n      printf 'report: %s declares %s, which was not built\\\
    n' \"$name\" \"$f\" >&2\n      exit 1\n    fi\n  done\n  printf '%-32s %-9s %s\\n' \"$name\" \"$version\" \"\
    $spdx\"\n  printf '%s\\t%s\\t%s\\n' \"$name\" \"$version\" \"$spdx\" >> \"$logs/versions.txt\"\n  for f in \"\
    $@\"; do\n    printf '%30s  %9s bytes  %s\\n' \"$(basename \"$f\")\" \"$(stat -c %s \"$f\")\" \\\n      \"$(llvm-readelf\
    \ -d \"$f\" | awk '/NEEDED/ {gsub(/[][]/,\"\",$5); printf \"%s \", $5}')\"\n  done\n}\n\necho \"==================================================================\"\
    \necho \" zlib 1.3.2 -- zipimport, gzip, zlib, tarfile, zipfile\"\necho \"==================================================================\"\
    \ncurrent=zlib\nunpack zlib\n(\n  cd \"$build/$srcdir\"\n  # No CHOST, deliberately. zlib's configure picks\
    \ its shared-library link\n  # command from the name it is given, and only the literal `Linux` selects the\n\
    \  # one that works here: a CHOST of `x86_64-linux-musl` makes it skip the\n  # shared library altogether and\
    \ quietly install a static-only prefix.\n  ./configure --prefix=/usr --libdir=/usr/lib --shared\n  make -j\"\
    $jobs\"\n  make DESTDIR=\"$out\" install\n) > \"$logs/zlib.log\" 2>&1\nupstream_url=https://zlib.net/fossils/zlib-1.3.2.tar.gz\
    \ upstream_version=1.3.2\ncopyright zlib Zlib LICENSE\nreport zlib 1.3.2 Zlib \"$prefix\"/lib/libz.so.1.*\n\n\
    echo \"==================================================================\"\necho \" bzip2 1.0.8 -- bz2, tarfile's\
    \ bz2 filter\"\necho \"==================================================================\"\ncurrent=bzip2\n\
    unpack bzip2\n(\n  cd \"$build/$srcdir\"\n  # bzip2 has no configure and no shared-library build: upstream ships\
    \ one\n  # Makefile that builds a static library and the command line tools, and\n  # every distribution carries\
    \ a patch that adds the shared one. This is that\n  # patch written out, and it is the whole of it -- seven\
    \ objects, -fPIC, and a\n  # SONAME. Nothing else from this tarball is installed: `bunzip2` is a program\n \
    \ # and this prefix is a library prefix.\n  objs=\n  for c in blocksort huffman crctable randtable compress\
    \ decompress bzlib; do\n    clang $CFLAGS -c -o \"$c.o\" \"$c.c\"\n    objs=\"$objs $c.o\"\n  done\n  clang\
    \ -shared -o libbz2.so.1.0.8 $objs -Wl,-soname,libbz2.so.1.0\n  install -m 0755 libbz2.so.1.0.8 \"$prefix/lib/\"\
    \n  install -m 0644 bzlib.h \"$prefix/include/\"\n  for v in libbz2.so.1.0 libbz2.so.1 libbz2.so; do ln -sf\
    \ libbz2.so.1.0.8 \"$prefix/lib/$v\"; done\n) > \"$logs/bzip2.log\" 2>&1\nupstream_url=https://sourceware.org/pub/bzip2/bzip2-1.0.8.tar.gz\
    \ upstream_version=1.0.8\ncopyright bzip2 bzip2-1.0.6 LICENSE\nreport bzip2 1.0.8 bzip2-1.0.6 \"$prefix\"/lib/libbz2.so.1.0.8\n\
    \necho \"==================================================================\"\necho \" xz 5.8.4 (liblzma) --\
    \ lzma, tarfile's xz filter\"\necho \"==================================================================\"\n\
    current=xz\nunpack xz\n(\n  cd \"$build/$srcdir\"\n  ./configure --prefix=/usr --libdir=/usr/lib --disable-static\
    \ --enable-shared \\\n    --disable-doc --disable-nls --disable-xz --disable-xzdec \\\n    --disable-lzmadec\
    \ --disable-lzmainfo --disable-scripts\n  make -j\"$jobs\"\n  make DESTDIR=\"$out\" install\n) > \"$logs/xz.log\"\
    \ 2>&1\nupstream_url=https://github.com/tukaani-project/xz/releases/download/v5.8.4/xz-5.8.4.tar.xz upstream_version=5.8.4\n\
    copyright xz 0BSD COPYING COPYING.0BSD\nreport xz 5.8.4 0BSD \"$prefix\"/lib/liblzma.so.5.*\n\necho \"==================================================================\"\
    \necho \" openssl 3.6.4 -- ssl, hashlib, hmac, sockets that speak TLS\"\necho \"==================================================================\"\
    \ncurrent=openssl\nunpack openssl\n(\n  cd \"$build/$srcdir\"\n  # `linux-x86_64` is the right target name for\
    \ musl as well: it selects ELF,\n  # PIC and the x86-64 assembly and says nothing about the C library. What\
    \ is\n  # switched off is everything CPython does not use: the command line tools,\n  # the test suite, the\
    \ documentation, and the engines -- OpenSSL 3 provides\n  # its algorithms through providers, and an engine\
    \ is a compatibility shim\n  # that would only add a dlopen path nothing here exercises.\n  perl ./Configure\
    \ linux-x86_64 \\\n    --prefix=/usr --libdir=lib --openssldir=/usr/lib/ssl \\\n    shared no-tests no-apps\
    \ no-docs no-engine no-afalgeng \\\n    no-ssl3 no-weak-ssl-ciphers\n  make -j\"$jobs\"\n  make DESTDIR=\"$out\"\
    \ install_sw\n) > \"$logs/openssl.log\" 2>&1\nupstream_url=https://www.openssl.org/source/openssl-3.6.4.tar.gz\
    \ upstream_version=3.6.4\ncopyright openssl Apache-2.0 LICENSE.txt\nreport openssl 3.6.4 Apache-2.0 \"$prefix\"\
    /lib/libcrypto.so.3 \"$prefix\"/lib/libssl.so.3\n\necho \"==================================================================\"\
    \necho \" sqlite 3.53.4 -- sqlite3 and everything built on it\"\necho \"==================================================================\"\
    \ncurrent=sqlite\nunpack sqlite\n(\n  cd \"$build/$srcdir\"\n  # sqlite-autoconf is not autoconf: it is autosetup,\
    \ a Jim TCL build system\n  # that builds itself a jimsh from the tarball when none is installed. It has\n \
    \ # its own option vocabulary, and two of its defaults are wrong for anything\n  # that will be packaged:\n\
    \  #\n  #   --soname          defaults to *none*, so the shared library would carry no\n  #                \
    \     SONAME and every consumer would record whichever file\n  #                     name happened to be there.\n\
    \  #   --disable-rpath   is not the default. autosetup adds an rpath pointing at\n  #                     its\
    \ own library directory, which inside an image names a\n  #                     directory that does not exist.\n\
    \  #\n  # --all turns on the extensions that are off by default (FTS4, FTS5, RTREE,\n  # GEOPOLY, SESSION, dbpage,\
    \ dbstat, carray) and --fts3 adds the one --all\n  # leaves out. This is what Debian's libsqlite3 offers and\
    \ what a Python\n  # program installing sqlite3 extensions expects to find.\n  ./configure --prefix=/usr --host=x86_64-linux-musl\
    \ \\\n    --disable-static --disable-readline --disable-rpath --soname=legacy \\\n    --fts3 --all\n  make -j\"\
    $jobs\"\n  make DESTDIR=\"$out\" install\n) > \"$logs/sqlite.log\" 2>&1\nupstream_url=https://www.sqlite.org/2026/sqlite-autoconf-3530400.tar.gz\
    \ upstream_version=3.53.4\ncopyright sqlite blessing PUBLIC-DOMAIN.txt\nreport sqlite 3.53.4 blessing \"$prefix\"\
    /lib/libsqlite3.so*\n\necho \"==================================================================\"\necho \"\
    \ libffi 3.8.0 -- ctypes\"\necho \"==================================================================\"\ncurrent=libffi\n\
    unpack libffi\n(\n  cd \"$build/$srcdir\"\n  ./configure --prefix=/usr --libdir=/usr/lib --disable-static --enable-shared\
    \ --disable-docs\n  make -j\"$jobs\"\n  make DESTDIR=\"$out\" install\n) > \"$logs/libffi.log\" 2>&1\nupstream_url=https://github.com/libffi/libffi/releases/download/v3.8.0/libffi-3.8.0.tar.gz\
    \ upstream_version=3.8.0\ncopyright libffi MIT LICENSE\nreport libffi 3.8.0 MIT \"$prefix\"/lib/libffi.so.8.*\n\
    \necho \"==================================================================\"\necho \" ncurses 6.6 -- curses,\
    \ and the terminfo database readline needs\"\necho \"==================================================================\"\
    \ncurrent=ncurses\nunpack ncurses\n(\n  cd \"$build/$srcdir\"\n  # Wide characters are ncurses' default and\
    \ are left on. --with-termlib is\n  # the split Debian ships as libncursesw6 and libtinfo6, and --with-abi-version=6\n\
    \  # is the SONAME those packages have. The terminfo database that `tic` compiles\n  # during `make install`\
    \ is kept: a Python REPL without it loses line editing\n  # on every terminal whose definition is not compiled\
    \ into ncurses.\n  # ncurses does not use autoconf's --enable-shared/--disable-static spelling:\n  # its shared\
    \ libraries are --with-shared and its static ones --without-normal.\n  # Passing the autoconf spelling, as this\
    \ script first did, is accepted in\n  # silence and produces a static-only install, which is what the report\
    \ check\n  # below is for.\n  #\n  # --with-termlib=tinfo, not bare --with-termlib: with wide characters on,\
    \ the\n  # bare form names the terminfo library libtinfow, and Debian's is libtinfo --\n  # the terminfo code\
    \ does not depend on wide characters, so the wide build's\n  # version of it is the same library under a longer\
    \ name.\n  ./configure --prefix=/usr --libdir=/usr/lib \\\n    --with-shared --without-normal --with-abi-version=6\
    \ \\\n    --with-termlib=tinfo \\\n    --enable-pc-files --with-pkg-config-libdir=/usr/lib/pkgconfig \\\n  \
    \  --without-ada --without-cxx-binding --without-debug --without-manpages \\\n    --with-default-terminfo-dir=/usr/share/terminfo\n\
    \  make -j\"$jobs\"\n  make DESTDIR=\"$out\" install\n) > \"$logs/ncurses.log\" 2>&1\nupstream_url=https://mirrors.tuna.tsinghua.edu.cn/gnu/ncurses/ncurses-6.6.tar.gz\
    \ upstream_version=6.6\ncopyright ncurses X11 README\nreport ncurses 6.6 X11 \"$prefix\"/lib/libncursesw.so.6.*\
    \ \"$prefix\"/lib/libtinfo.so.6.*\n\necho \"==================================================================\"\
    \necho \" readline 8.3 -- line editing in the interactive interpreter\"\necho \"==================================================================\"\
    \ncurrent=readline\nunpack readline\n(\n  cd \"$build/$srcdir\"\n  # readline's configure answers questions\
    \ by running programs it has just\n  # linked, and the ones about the terminal library cannot be answered that\
    \ way\n  # in a build that links a library it cannot yet load. The answers are known\n  # here, so they are\
    \ written down: there is one termcap library on this system\n  # and it is ncursesw, and musl's wcwidth is not\
    \ broken.\n  ./configure --prefix=/usr --libdir=/usr/lib --disable-static --enable-shared \\\n    --with-curses\
    \ \\\n    bash_cv_termcap_lib=libncursesw \\\n    bash_cv_wcwidth_broken=no \\\n    bash_cv_func_sigsetjmp=present\
    \ \\\n    bash_cv_func_strcoll_broken=no \\\n    bash_cv_must_reinstall_sighandlers=no \\\n    bash_cv_printf_a_format=yes\n\
    \  make -j\"$jobs\" SHLIB_LIBS=\"-lncursesw -ltinfo\"\n  make DESTDIR=\"$out\" install SHLIB_LIBS=\"-lncursesw\
    \ -ltinfo\"\n) > \"$logs/readline.log\" 2>&1\nupstream_url=https://mirrors.tuna.tsinghua.edu.cn/gnu/readline/readline-8.3.tar.gz\
    \ upstream_version=8.3\ncopyright readline GPL-3.0-or-later COPYING\nreport readline 8.3 GPL-3.0-or-later \"\
    $prefix\"/lib/libreadline.so.8.*\n\necho \"==================================================================\"\
    \necho \" expat 2.8.4 -- pyexpat, xml.etree, xmlrpc, plistlib\"\necho \"==================================================================\"\
    \ncurrent=expat\nunpack expat\n(\n  cd \"$build/$srcdir\"\n  ./configure --prefix=/usr --libdir=/usr/lib --disable-static\
    \ --enable-shared \\\n    --without-docbook --without-examples --without-tests --without-xmlwf\n  make -j\"\
    $jobs\"\n  make DESTDIR=\"$out\" install\n) > \"$logs/expat.log\" 2>&1\nupstream_url=https://github.com/libexpat/libexpat/releases/download/R_2_8_4/expat-2.8.4.tar.xz\
    \ upstream_version=2.8.4\ncopyright expat MIT COPYING\nreport expat 2.8.4 MIT \"$prefix\"/lib/libexpat.so.1.*\n\
    \necho \"==================================================================\"\necho \" gdbm 1.26 -- dbm.gnu,\
    \ dbm.ndbm, shelve, whichdb\"\necho \"==================================================================\"\n\
    current=gdbm\nunpack gdbm\n(\n  cd \"$build/$srcdir\"\n  # --enable-libgdbm-compat is what Python's dbm modules\
    \ were written against.\n  # Without it the compat headers and the second library are absent and two\n  # stdlib\
    \ modules quietly go missing, which is the worst way to lose them.\n  ./configure --prefix=/usr --libdir=/usr/lib\
    \ --disable-static --enable-shared \\\n    --enable-libgdbm-compat --without-readline\n  make -j\"$jobs\"\n\
    \  make DESTDIR=\"$out\" install\n) > \"$logs/gdbm.log\" 2>&1\nupstream_url=https://mirrors.tuna.tsinghua.edu.cn/gnu/gdbm/gdbm-1.26.tar.gz\
    \ upstream_version=1.26\ncopyright gdbm GPL-3.0-or-later COPYING\nreport gdbm 1.26 GPL-3.0-or-later \"$prefix\"\
    /lib/libgdbm.so.* \"$prefix\"/lib/libgdbm_compat.so.*\n\necho \"==================================================================\"\
    \necho \" util-linux 2.42.3 (libuuid) -- _uuid, and therefore uuid.uuid1\"\necho \"==================================================================\"\
    \ncurrent=util-linux\nunpack util-linux\n(\n  cd \"$build/$srcdir\"\n  # Only libuuid. util-linux is thirty\
    \ programs and a dozen libraries; what\n  # _uuid needs is the one small library, and building the rest would\
    \ put\n  # mount(8) and login(1) into an image whose job is to run Python.\n  ./configure --prefix=/usr --libdir=/usr/lib\
    \ --disable-static --enable-shared \\\n    --disable-all-programs --enable-libuuid --disable-liblastlog2 \\\n\
    \    --disable-nls --disable-bash-completion --without-python --disable-widechar\n  make -j\"$jobs\"\n  make\
    \ DESTDIR=\"$out\" install\n) > \"$logs/util-linux.log\" 2>&1\nupstream_url=https://mirrors.edge.kernel.org/pub/linux/utils/util-linux/v2.42/util-linux-2.42.3.tar.xz\
    \ upstream_version=2.42.3\ncopyright util-linux BSD-3-Clause Documentation/licenses/COPYING.BSD-3-Clause\nreport\
    \ util-linux 2.42.3 BSD-3-Clause \"$prefix\"/lib/libuuid.so.1.*\n\n# --- the links the artifact cannot carry\
    \ -----------------------------------\n# The helper refuses any output tree that contains a symlink -- not dereferences\n\
    # it, refuses it (fase-controller/src/storage.rs, `visit`: an entry that is\n# neither a plain file nor a directory\
    \ is \"unsafe output\"). Every build system\n# here creates the usual SONAME links, so each one is materialised\
    \ as a copy of\n# the file it pointed at. The bytes are identical, and the image stage stores\n# repeated content\
    \ once, so the picture the image gets is the library twice\n# under two names, which is what the link would\
    \ have given it. A link to a\n# *directory* is removed rather than copied: ncurses' compatibility link\n# /usr/lib/terminfo\
    \ -> /usr/share/terminfo would otherwise duplicate the whole\n# terminfo database.\nmaterialise_links() {\n\
    \  root=\"$1\"\n  copied=0\n  removed=0\n  while IFS= read -r -d '' link; do\n    target=$(readlink \"$link\"\
    )\n    case \"$target\" in\n      /*) rm -f \"$link\"; removed=$((removed + 1)); continue ;;\n    esac\n   \
    \ resolved=\"$(dirname \"$link\")/$target\"\n    if [ -d \"$resolved\" ]; then\n      rm -f \"$link\"; removed=$((removed\
    \ + 1))\n    elif [ -f \"$resolved\" ]; then\n      cp -f \"$resolved\" \"$link.copy\"\n      mv -f \"$link.copy\"\
    \ \"$link\"\n      copied=$((copied + 1))\n    else\n      printf 'dangling symlink in the output: %s -> %s\\\
    n' \"$link\" \"$target\" >&2\n      return 1\n    fi\n  done < <(find \"$root\" -type l -print0)\n  printf 'links:\
    \ %s materialised as copies, %s to directories removed\\n' \"$copied\" \"$removed\"\n}\ncurrent=links\nmaterialise_links\
    \ \"$prefix\"\ntest -z \"$(find \"$prefix\" -type l -print -quit)\"\n\necho\necho \"==================================================================\"\
    \necho \" what is in the prefix\"\necho \"==================================================================\"\
    \nfind \"$prefix/lib\" -maxdepth 1 -name '*.so*' -printf '%f\\n' | sort | sed 's/^/  /'\necho\necho \"--- every\
    \ recorded dependency resolves, or says so ---\"\nstatus=0\nfor so in \"$prefix\"/lib/*.so.*; do\n  for need\
    \ in $(llvm-readelf -d \"$so\" | awk '/NEEDED/ {gsub(/[][]/,\"\",$5); print $5}'); do\n    case \"$need\" in\n\
    \      libc.so|libm.so|libpthread.so|libdl.so|librt.so|libutil.so|libresolv.so|libcrypt.so) continue ;;\n  \
    \  esac\n    if [ ! -e \"$prefix/lib/$need\" ] && [ ! -e \"$sys/usr/lib/$need\" ]; then\n      printf 'MISSING\
    \  %s needs %s\\n' \"$(basename \"$so\")\" \"$need\"\n      status=1\n    fi\n  done\ndone\ntest \"$status\"\
    \ -eq 0\necho \"ok\"\n\n# A version script the image stages read, and the reason there is no\n# libpython here:\
    \ CPython is linked against these, not the other way round.\n{\n  printf 'name\\tversion\\tlicence\\n'\n  cat\
    \ \"$logs/versions.txt\"\n} > \"$prefix/share/doc/python-deps.tsv\"\n{\n  printf 'python-deps\\n'\n  printf\
    \ 'toolchain\\t%s\\n' \"$(clang --version | head -1)\"\n  printf 'triple\\t%s\\n' \"$(clang -dumpmachine)\"\n\
    \  printf 'sysroot\\t%s\\n' \"$sys\"\n  printf 'jobs\\t%s\\n' \"$jobs\"\n  printf 'libraries\\t%s\\n' \"$(ls\
    \ \"$prefix\"/lib/*.so.* | wc -l)\"\n  printf 'prefix-bytes\\t%s\\n' \"$(du -sb \"$prefix\" | cut -f1)\"\n \
    \ printf '\\nname\\tversion\\tlicence\\n'\n  cat \"$logs/versions.txt\"\n  printf '\\nterminfo entries\\t%s\\\
    n' \"$(find \"$prefix/share/terminfo\" -type f 2>/dev/null | wc -l)\"\n} > \"$prefix/share/doc/python-deps.txt\"\
    \ncat \"$prefix/share/doc/python-deps.txt\"\necho\ndu -sh \"$prefix\"\n\n# --- publish ---------------------------------------------------------------\n\
    #\n# The artifact is a zstd tar and not the directory itself, which is what every\n# other prefix-carrying artifact\
    \ in this bootstrap is. The next stage declares\n# this input as an archive and fase extracts it into a directory\
    \ before that\n# stage's script runs, so the two ends agree without either of them naming a\n# compression;\
    \ and a tar is one object in the store rather than the several\n# thousand files a prefix of eleven libraries\
    \ is. `packtar.py` writes it\n# deterministically -- entries sorted, ownership and timestamps zeroed, modes\n\
    # reduced to 0755/0644 -- so the digest of the artifact is a property of what\n# was built and not of the day\
    \ it was built, and a rebuild that changes\n# nothing publishes nothing new.\ncurrent=publish\nmkdir -p \"$FASE_OUTPUT_ROOT\"\
    \npython3 \"$FASE_INPUT_ROOT/packtar.py\" \"$out.tar.zst\" \"$out\"\nzstd -q -t \"$out.tar.zst\"\nzstd -dc \"\
    $out.tar.zst\" | python3 -c \"\nimport sys, tarfile\nprint('entries', sum(1 for _ in tarfile.open(fileobj=sys.stdin.buffer,\
    \ mode='r|')))\n\"\ndu -sh \"$out\" \"$out.tar.zst\"\n"
  workspace:
    taskSizeLimit: 300Gi
    inputSizeLimit: 32Gi
    outputSizeLimit: 32Gi
    transferSizeLimit: 32Gi
  nodeSelector:
    kubernetes.io/hostname: node1
---
apiVersion: skyw.top/v1beta1
kind: Recipe
metadata:
  name: python-deps
spec:
  inputs:
    artifacts:
    - name: tc
      artifactSelector:
        matchLabels:
          name: clang-musl-tc
          rev: l3
    - name: packtar
      artifactSelector:
        matchLabels:
          name: packtar-tool
          version: v2
    - name: zlib
      artifactSelector:
        matchLabels:
          name: zlib-source
          version: 1.3.2
          recipe: fetch-v1
    - name: bzip2
      artifactSelector:
        matchLabels:
          name: bzip2-source
          version: 1.0.8
          recipe: fetch-v1
    - name: xz
      artifactSelector:
        matchLabels:
          name: xz-source
          version: 5.8.4
          recipe: fetch-v1
    - name: openssl
      artifactSelector:
        matchLabels:
          name: openssl-source
          version: 3.6.4
          recipe: fetch-v1
    - name: sqlite
      artifactSelector:
        matchLabels:
          name: sqlite-source
          version: 3.53.4
          recipe: fetch-v1
    - name: libffi
      artifactSelector:
        matchLabels:
          name: libffi-source
          version: 3.8.0
          recipe: fetch-v1
    - name: ncurses
      artifactSelector:
        matchLabels:
          name: ncurses-source
          version: '6.6'
          recipe: fetch-v1
    - name: readline
      artifactSelector:
        matchLabels:
          name: readline-source
          version: '8.3'
          recipe: fetch-v1
    - name: expat
      artifactSelector:
        matchLabels:
          name: expat-source
          version: 2.8.4
          recipe: fetch-v1
    - name: gdbm
      artifactSelector:
        matchLabels:
          name: gdbm-source
          version: '1.26'
          recipe: fetch-v1
    - name: util-linux
      artifactSelector:
        matchLabels:
          name: util-linux-source
          version: 2.42.3
          recipe: fetch-v1
  outputs:
    artifacts:
    - name: deps
      from:
        task: build
        artifact: deps
      labels:
        name:
          value: python-deps
        recipe:
          value: python-deps-v1
        libc:
          value: musl
        toolchain:
          fromInput:
            input: tc
            label: rev
        compiler:
          value: clang
        arch:
          value: amd64
        kind:
          value: tree
  tasks:
  - name: build
    variables:
      jobs:
        value: '48'
    inputs:
      artifacts:
      - name: tc
        from:
          recipeInput: tc
      - name: packtar
        from:
          recipeInput: packtar
      - name: zlib
        from:
          recipeInput: zlib
      - name: bzip2
        from:
          recipeInput: bzip2
      - name: xz
        from:
          recipeInput: xz
      - name: openssl
        from:
          recipeInput: openssl
      - name: sqlite
        from:
          recipeInput: sqlite
      - name: libffi
        from:
          recipeInput: libffi
      - name: ncurses
        from:
          recipeInput: ncurses
      - name: readline
        from:
          recipeInput: readline
      - name: expat
        from:
          recipeInput: expat
      - name: gdbm
        from:
          recipeInput: gdbm
      - name: util-linux
        from:
          recipeInput: util-linux
    outputs:
    - name: deps
    taskSelector:
      matchLabels:
        capability: python-deps
---
apiVersion: skyw.top/v1beta1
kind: Task
metadata:
  name: python-verify
  labels:
    capability: python-verify
spec:
  image: gcc:16.2.0-trixie
  imagePullSecrets:
  - name: fase-ghcr-pull
  - name: fase-registry-pull
  command:
  - /bin/bash
  securityContext:
    runAsUser: 0
    runAsNonRoot: false
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: '32'
      memory: 64Gi
      ephemeral-storage: 200Gi
    limits:
      cpu: '32'
      memory: 64Gi
      ephemeral-storage: 300Gi
  inputs:
    variables:
    - name: jobs
      env: FASE_VAR_JOBS
      required: true
    artifacts:
    - name: tc
      path: tc.tar.zst
      kind: file
    - name: deps
      path: deps.tar.zst
      kind: file
    - name: runtime
      path: python-runtime.tar.zst
      kind: file
    - name: stdlib
      path: python-stdlib.tar.zst
      kind: file
    - name: dev
      path: python-dev.tar.zst
      kind: file
  outputs:
    artifacts:
    - name: report
      path: verify-report.txt
      kind: file
  script: "set -eu\nif ! command -v zstd >/dev/null 2>&1; then\n  apt-get update -qq >/dev/null\n  apt-get install\
    \ -y -qq --no-install-recommends zstd >/dev/null\nfi\nmkdir -p /workspace/inputs\nmkdir -p \"/workspace/inputs/tc\"\
    \nzstd -dc \"/in/tc.tar.zst\" | tar -xf - -C \"/workspace/inputs/tc\"\nmkdir -p \"/workspace/inputs/deps\"\n\
    zstd -dc \"/in/deps.tar.zst\" | tar -xf - -C \"/workspace/inputs/deps\"\nmkdir -p \"/workspace/inputs/python-runtime\"\
    \nzstd -dc \"/in/python-runtime.tar.zst\" | tar -xf - -C \"/workspace/inputs/python-runtime\"\nmkdir -p \"/workspace/inputs/python-stdlib\"\
    \nzstd -dc \"/in/python-stdlib.tar.zst\" | tar -xf - -C \"/workspace/inputs/python-stdlib\"\nmkdir -p \"/workspace/inputs/python-dev\"\
    \nzstd -dc \"/in/python-dev.tar.zst\" | tar -xf - -C \"/workspace/inputs/python-dev\"\nexport FASE_INPUT_ROOT=/workspace/inputs\n\
    set -Eeuo pipefail\n\n# ---------------------------------------------------------------------------\n# Verify\
    \ python3.13 the way a distribution verifies a package: by laying the\n# parts out as an image, and then using\
    \ it.\n#\n# The question this step answers is not \"does python run\" -- the build step\n# already answered\
    \ that, in the build directory, where every path is the one\n# the build happened to use. The question is whether\
    \ the *artifact* is complete:\n# whether the interpreter finds its standard library when the standard library\n\
    # is a separate artifact, whether the extension modules find the eleven\n# libraries the dependency step built\
    \ when none of them are on the build\n# machine's library path, whether a C extension can be compiled against\
    \ the\n# development part and loaded into the runtime part, and whether the standard\n# library's own test suite\
    \ agrees.\n#\n# So the tree is assembled the way the image will be assembled -- the\n# dependency libraries\
    \ into /usr/lib, the three Python parts over the top, and\n# musl's loader into /lib, because that is the path\
    \ the ELF interpreter field\n# names and nothing in this image starts without it -- and then most of the\n#\
    \ checks run *inside a chroot of that tree*. The chroot is the point: run\n# outside it, a check that passes\
    \ may have found the pod's libraries.\n#\n# What the chroot cannot provide is /proc and a real /dev (creating\
    \ those needs\n# privileges this pod does not have: CAP_MKNOD is enough for the device nodes\n# below, CAP_SYS_ADMIN\
    \ is what mounting /proc would cost). The probes that need\n# a process table or a pty therefore run a second\
    \ time outside the chroot, with\n# the interpreter started by name, with the tree on the musl loader's search\n\
    # path; that is a weaker test of the layout and a stronger test of the modules,\n# and the report says which\
    \ check ran where.\n# ---------------------------------------------------------------------------\n\ntc=/opt/tc\n\
    src=\"$FASE_INPUT_ROOT\"\nout=\"$FASE_OUTPUT_ROOT\"\nsys=\"$tc/x86_64-linux-musl\"\nroot=\"$out/root\"\nimg=\"\
    $root/usr\"\nlogs=\"$out/build-logs\"\nreport=\"$out/verify-report.txt\"\nbuild=/workspace/build\njobs=\"${FASE_VAR_JOBS:-8}\"\
    \n\nmkdir -p \"$tc\"\ncp -a \"$FASE_INPUT_ROOT/tc/.\" \"$tc/\"\nrm -rf \"$build\" \"$root\" \"$logs\"\nmkdir\
    \ -p \"$build\" \"$logs\" \"$img\" \"$root/lib\" \"$root/dev\" \"$root/tmp\" \"$root/etc\"\nexport PATH=\"$tc/bin:$PATH\"\
    \n\ncurrent=startup\nonfail() {\n  rc=$?\n  printf '\\n=== FAILED in %s (exit %s) ===\\n' \"$current\" \"$rc\"\
    \ >&2\n  for log in \"$logs/$current.log\" \"$logs/verify.log\"; do\n    if [ -f \"$log\" ]; then\n      printf\
    \ -- '--- last 40 lines of %s ---\\n' \"$(basename \"$log\")\" >&2\n      tail -40 \"$log\" >&2\n      break\n\
    \    fi\n  done\n  exit \"$rc\"\n}\ntrap onfail ERR\n\n# ---------------------------------------------------------------------------\n\
    # assemble\n# ---------------------------------------------------------------------------\ncurrent=assemble\n\
    cp -a \"$src/deps/usr/.\" \"$img/\"\nfor part in python-runtime python-stdlib python-dev; do\n  test -d \"$src/$part/usr\"\
    \n  cp -a \"$src/$part/usr/.\" \"$img/\"\ndone\n\n# musl's loader, at the one path every binary in this image\
    \ asks for. The image\n# build is what will make this a symlink into the toolchain layer; here a copy\n# is\
    \ enough, and a copy is what the archive format can carry.\ncp \"$sys/lib/ld-musl-x86_64.so.1\" \"$root/lib/\"\
    \n\n# The same loader again, at the same path *outside* the tree, because some of\n# the checks below run the\
    \ image's interpreter directly rather than through a\n# chroot of it, and the ELF interpreter field of every\
    \ binary in the tree names\n# this path. It is the one thing this step writes outside its own output\n# directory,\
    \ and without it those runs would either fail to start or start\n# under a loader that is not the one being\
    \ verified.\nln -sf \"$sys/lib/ld-musl-x86_64.so.1\" /lib/ld-musl-x86_64.so.1\n\n# The devices a supervised\
    \ interpreter expects, made by hand because there is\n# no /dev to mount. The numbers are the kernel's, not\
    \ a convention: null is\n# 1:3, urandom 1:9, tty 5:0.\nmknod -m 666 \"$root/dev/null\" c 1 3\nmknod -m 666 \"\
    $root/dev/zero\" c 1 5\nmknod -m 666 \"$root/dev/full\" c 1 7\nmknod -m 666 \"$root/dev/random\" c 1 8\nmknod\
    \ -m 666 \"$root/dev/urandom\" c 1 9\nmknod -m 666 \"$root/dev/tty\" c 5 0\nmkdir -p \"$root/dev/shm\"\nchmod\
    \ 1777 \"$root/tmp\"\n\n# A passwd and a group, so that the modules that read them have something to\n# read:\
    \ pwd and grp are extension modules in the standard library, and a\n# standard library test that cannot find\
    \ uid 0 fails for a reason that has\n# nothing to do with the build.\ncat > \"$root/etc/passwd\" <<'PASSWD'\n\
    root:x:0:0:root:/root:/bin/sh\nnobody:x:65534:65534:nobody:/nonexistent:/usr/sbin/nologin\nPASSWD\ncat > \"\
    $root/etc/group\" <<'GROUP'\nroot:x:0:\nnogroup:x:65534:\nGROUP\n\ntest -x \"$img/bin/python3.13\"\nprintf 'assembled:\
    \ %s files, %s\\n' \\\n  \"$(find \"$root\" -type f | wc -l)\" \"$(du -sh \"$root\" | cut -f1)\"\n\n# The version,\
    \ asked of the interpreter rather than written down here: the\n# checks below that spell it out are asserting\
    \ that this tree is 3.13.15, and a\n# constant copied into a script is a constant that can quietly stop matching\n\
    # what was built.\npython_version=$(chroot \"$root\" /usr/bin/python3.13 \\\n  -c 'import sys; print(\"%d.%d.%d\"\
    \ % sys.version_info[:3])')\nprintf 'version: %s\\n' \"$python_version\"\n\n# The same interpreter the chroot\
    \ runs, started the way the pod can start a\n# musl binary. It is the substitute for the checks that need a\
    \ real /proc, a\n# real /dev/shm or a pty -- none of which a chroot can be given without\n# CAP_SYS_ADMIN --\
    \ and it runs the same libpython, the same standard library\n# and the same extension modules.\n#\n# Where its\
    \ libraries come from is worth a note, because the first version of\n# this got it wrong in a way that took\
    \ the whole test suite down with it. The\n# obvious answer is LD_LIBRARY_PATH pointing at the tree, and it works\
    \ -- for\n# the interpreter, and for every child it starts, the pod's own /bin/sh\n# included. Those children\
    \ are glibc programs, and glibc's loader then resolves\n# their libtinfo.so.6 (and anything else whose name\
    \ this tree also has) to the\n# *musl* library here, which asks for a library called `libc.so` -- musl's\n#\
    \ soname for the C library. glibc's loader finds that name at\n# /lib/x86_64-linux-gnu/libc.so, which is Debian's\
    \ 283 byte linker script, and\n# rejects it: \"invalid ELF header\". Every test that ran a subprocess failed\
    \ on\n# that, and none of them for a reason that had anything to do with the build.\n#\n# A musl system has\
