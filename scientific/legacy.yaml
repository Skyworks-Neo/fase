apiVersion: skyw.top/v1beta1
kind: Task
metadata:
  name: mldtypes-build
  labels:
    capability: mldtypes-build
spec:
  image: gcc:16.2.0-trixie
  imagePullSecrets:
  - name: fase-ghcr-pull
  - name: fase-registry-pull
  command:
  - /bin/bash
  securityContext:
    runAsUser: 0
    runAsNonRoot: false
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: '32'
      memory: 64Gi
      ephemeral-storage: 200Gi
    limits:
      cpu: '32'
      memory: 64Gi
      ephemeral-storage: 300Gi
  env:
  - name: DEBIAN_FRONTEND
    value: noninteractive
  inputs:
    variables:
    - name: jobs
      env: FASE_VAR_JOBS
      required: true
    artifacts:
    - name: tc
      path: tc.tar.zst
      kind: file
    - name: pyruntime
      path: python-runtime.tar.zst
      kind: file
    - name: pystdlib
      path: python-stdlib.tar.zst
      kind: file
    - name: pydev
      path: python-dev.tar.zst
      kind: file
    - name: pydeps
      path: python-deps.tar.zst
      kind: file
    - name: numpywheel
      path: numpy.whl
      kind: file
    - name: numpyruntime
      path: numpy-runtime.tar.zst
      kind: file
    - name: source
      path: tarball
      kind: file
    - name: pip
      path: pip.whl
      kind: file
    - name: scikitbuildcore
      path: scikit-build-core.whl
      kind: file
    - name: pathspec
      path: pathspec.whl
      kind: file
    - name: packaging
      path: packaging.whl
      kind: file
    - name: ninja
      path: ninja.whl
      kind: file
  outputs:
    artifacts:
    - name: wheel
      path: ml_dtypes-0.6.0-cp313-cp313-musllinux_1_2_x86_64.whl
      kind: file
    - name: report
      path: ml_dtypes-build-info.txt
      kind: file
  script: "set -eu\nif ! command -v zstd >/dev/null 2>&1; then\n  apt-get update -qq >/dev/null\n  apt-get install\
    \ -y -qq --no-install-recommends zstd >/dev/null\nfi\nmkdir -p /workspace/inputs\nmkdir -p \"/workspace/inputs/tc\"\
    \nzstd -dc \"/in/tc.tar.zst\" | tar -xf - -C \"/workspace/inputs/tc\"\nmkdir -p \"/workspace/inputs/python-runtime\"\
    \nzstd -dc \"/in/python-runtime.tar.zst\" | tar -xf - -C \"/workspace/inputs/python-runtime\"\nmkdir -p \"/workspace/inputs/python-stdlib\"\
    \nzstd -dc \"/in/python-stdlib.tar.zst\" | tar -xf - -C \"/workspace/inputs/python-stdlib\"\nmkdir -p \"/workspace/inputs/python-dev\"\
    \nzstd -dc \"/in/python-dev.tar.zst\" | tar -xf - -C \"/workspace/inputs/python-dev\"\nmkdir -p \"/workspace/inputs/python-deps\"\
    \nzstd -dc \"/in/python-deps.tar.zst\" | tar -xf - -C \"/workspace/inputs/python-deps\"\nmkdir -p \"/workspace/inputs/numpy-runtime\"\
    \nzstd -dc \"/in/numpy-runtime.tar.zst\" | tar -xf - -C \"/workspace/inputs/numpy-runtime\"\nln -s \"/in/numpy.whl\"\
    \ \"/workspace/inputs/numpy.whl\"\nln -s \"/in/tarball\" \"/workspace/inputs/tarball\"\nln -s \"/in/pip.whl\"\
    \ \"/workspace/inputs/pip.whl\"\nln -s \"/in/scikit-build-core.whl\" \"/workspace/inputs/scikit-build-core.whl\"\
    \nln -s \"/in/pathspec.whl\" \"/workspace/inputs/pathspec.whl\"\nln -s \"/in/packaging.whl\" \"/workspace/inputs/packaging.whl\"\
    \nln -s \"/in/ninja.whl\" \"/workspace/inputs/ninja.whl\"\nexport FASE_INPUT_ROOT=/workspace/inputs\nset -Eeuo\
    \ pipefail\ntrap 'code=$?; printf \"FAILED (exit %s) line %s: %s\\n\" \"$code\" \"$LINENO\" \"$BASH_COMMAND\"\
    \ >&2' ERR\n\ntc=/opt/tc\nsys=\"$tc/x86_64-linux-musl\"\npy=/opt/py\nnr=/opt/nr\nbuild=/workspace/build\nsrc=\"\
    $build/src\"\nwheelhouse=\"$build/wheelhouse\"\nout=\"$build/out\"\n\nrm -rf \"$tc\" \"$py\" \"$nr\" \"$build\"\
    \nmkdir -p \"$tc\" \"$py\" \"$nr\" \"$src\" \"$wheelhouse\" \"$out\"\n\ncp -a \"$FASE_INPUT_ROOT/tc/.\" \"$tc/\"\
    \ncp -a \"$FASE_INPUT_ROOT/numpy-runtime/.\" \"$nr/\"\nfor part in python-runtime python-stdlib python-dev python-deps;\
    \ do\n  cp -a \"$FASE_INPUT_ROOT/$part/.\" \"$py/\"\ndone\n\n# --- the tools the container does not have -----------------------------\n\
    #\n# zstd unpacks the inputs and patchelf is scikit-build-core's counterpart to\n# meson-python's RPATH rewriter;\
    \ cmake is the build system itself. The first\n# two come from the same place every other stage gets them, the\
    \ third is the\n# deliberate exception described at the top of this file. Five attempts,\n# because this is\
    \ the only network access any of these stages has and a pod\n# cannot tell a mirror that is briefly down from\
    \ a package that is absent.\nmissing=()\nfor t in zstd patchelf cmake; do\n  command -v \"$t\" >/dev/null 2>&1\
    \ || missing+=(\"$t\")\ndone\nif test \"${#missing[@]}\" -gt 0; then\n  echo \"installing: ${missing[*]}\"\n\
    \  installed=0\n  for attempt in 1 2 3 4 5; do\n    apt-get update -qq >/dev/null 2>&1 || true\n    if apt-get\
    \ install -y -qq --no-install-recommends \"${missing[@]}\" >/dev/null 2>&1; then\n      installed=1\n      break\n\
    \    fi\n    echo \"apt attempt $attempt did not complete, retrying in $((attempt * 15))s\" >&2\n    sleep $((attempt\
    \ * 15))\n  done\n  test \"$installed\" = 1\nfi\ncommand -v zstd\ncommand -v patchelf\ncommand -v cmake\n\n\
    # The CMake major version, asserted rather than recorded: the vendored Eigen\n# declares a minimum below CMake\
    \ 4's compatibility floor, so a container that\n# started shipping 4.x would fail inside Eigen's configure step\
    \ with a\n# message about policies that says nothing about this decision.\ncmake --version | head -1\ncmake_major=$(cmake\
    \ --version | head -1 | sed -n 's/^cmake version \\([0-9][0-9]*\\)\\..*/\\1/p')\ntest -n \"$cmake_major\"\n\
    test \"$cmake_major\" -ge 3\ntest \"$cmake_major\" -lt 4\n\n# --- the inputs, asserted before any of them is\
    \ used -------------------\npypy=\"$py/usr/bin/python3.13\"\ntest -x \"$pypy\"\ntest -s \"$py/usr/include/python3.13/Python.h\"\
    \n# The deps tree, and the one file that says whether it arrived: `zlib` is the\n# first standard library module\
    \ anything here uses -- pip cannot even read\n# its own wheel without it -- so an interpreter with no libz.so.1\
    \ is an\n# interpreter that runs `-V` and nothing else.\ntest -s \"$py/usr/lib/libz.so.1\"\ntest -x \"$tc/bin/clang\"\
    \ntest -x \"$tc/bin/clang++\"\ntest -s \"$FASE_INPUT_ROOT/numpy.whl\"\nfor lib in libopenblas.so.0 libgfortran.so.5\
    \ libquadmath.so.0 libgcc_s.so.1 libstdc++.so.6; do\n  test -s \"$nr/usr/lib/$lib\"\ndone\nls \"$nr/usr/lib\"\
    \n\n# --- the loader, and every directory the run needs ---------------------\n#\n# Before the two binaries\
    \ asserted at the end of the block above: a musl\n# binary whose ELF interpreter field names a loader that is\
    \ not at that\n# path does not run at all, and the message it prints --\n# `/opt/py/usr/bin/python3.13: cannot\
    \ execute: required file not found` --\n# names neither musl nor the loader. Learned in the numpy stage, where\
    \ the\n# revision that first reached that line printed exactly that.\n#\n# `$nr` is searched as well as `$tc`,\
    \ and that was learned the same way: the\n# first revision of this stage to get this far installed the loader,\
    \ ran the\n# interpreter, and died on `import numpy` -- `Error loading shared library\n# libopenblas.so.0`.\
    \ The artifact named `numpy-wheel` is the wheel; the\n# libraries it *runs on* are the `numpy-runtime` artifact,\
    \ which is a\n# separate input at a separate path, and the OpenBLAS this stage's build is\n# about is in there.\n\
    mkdir -p /lib\nln -sf \"$sys/lib/ld-musl-x86_64.so.1\" /lib/ld-musl-x86_64.so.1\nexport PATH=\"$py/usr/bin:$tc/bin:$PATH\"\
    \nrt=$(find \"$nr\" \"$tc\" \\\n       \\( -name 'libopenblas.so.0' -o -name 'libgfortran.so.5' \\\n       \
    \   -o -name 'libquadmath.so.0' -o -name 'libgcc_s.so.1' \\\n          -o -name 'libstdc++.so.6' \\) \\\n  \
    \     -printf '%h\\n' | sort -u | paste -sd:)\ntest -n \"$rt\"\nprintf '%s\\n' \"$py/usr/lib:$sys/usr/lib:$sys/lib64:$sys/lib:$rt:/lib:/usr/lib\"\
    \ > /etc/ld-musl-x86_64.path\ncat /etc/ld-musl-x86_64.path\n\n# --- the binaries, run now that there is a loader\
    \ to run them ----------\n\"$pypy\" -V\n\"$tc/bin/clang++\" --version | head -1\n\n# --- the build tools ---------------------------------------------------\n\
    install -m 0644 \"$FASE_INPUT_ROOT/pip.whl\"             \"$wheelhouse/pip-26.2.1-py3-none-any.whl\"\ninstall\
    \ -m 0644 \"$FASE_INPUT_ROOT/scikit-build-core.whl\" \"$wheelhouse/scikit_build_core-1.1.0-py3-none-any.whl\"\
    \ninstall -m 0644 \"$FASE_INPUT_ROOT/pathspec.whl\"        \"$wheelhouse/pathspec-1.1.1-py3-none-any.whl\"\n\
    install -m 0644 \"$FASE_INPUT_ROOT/packaging.whl\"       \"$wheelhouse/packaging-26.3-py3-none-any.whl\"\ninstall\
    \ -m 0644 \"$FASE_INPUT_ROOT/ninja.whl\"           \"$wheelhouse/ninja-1.13.2-py3-none-musllinux_1_2_x86_64.whl\"\
    \ninstall -m 0644 \"$FASE_INPUT_ROOT/numpy.whl\"           \"$wheelhouse/numpy-2.5.3-cp313-cp313-musllinux_1_2_x86_64.whl\"\
    \n\n\"$pypy\" \"$wheelhouse/pip-26.2.1-py3-none-any.whl/pip\" install \\\n  --no-index --find-links \"$wheelhouse\"\
    \ --no-cache-dir --no-deps \\\n  pip scikit-build-core pathspec packaging ninja\n\"$pypy\" -c \"import scikit_build_core,\
    \ pathspec, packaging; print('scikit-build-core', scikit_build_core.__version__); print('pathspec', pathspec.__version__)\"\
    \nninja --version\n\n# scikit-build-core runs CMake out of PATH and prefers ninja when it finds\n# it; the ninja\
    \ here is the wheel, so the generator is the same version in\n# every rebuild rather than whatever the container\
    \ happens to ship.\n\"$pypy\" -m pip install --no-index --no-deps \"$wheelhouse/numpy-2.5.3-cp313-cp313-musllinux_1_2_x86_64.whl\"\
    \ >/dev/null\n\"$pypy\" -c \"import numpy; print('numpy', numpy.__version__, numpy.get_include())\"\n\n# ---\
    \ the source --------------------------------------------------------\ntar -xf \"$FASE_INPUT_ROOT/tarball\"\
    \ -C \"$src\"\nsrcdir=$(find \"$src\" -maxdepth 1 -mindepth 1 -type d -name 'ml_dtypes-*' | head -1)\ntest -n\
    \ \"$srcdir\"\ncd \"$srcdir\"\ntest -f CMakeLists.txt\n# Eigen is vendored in the sdist, which is the difference\
    \ between a stage\n# that can build offline and one that would try to fetch it during the\n# build. Asserted,\
    \ because a build system that fetches is a build system\n# that fails on a machine without network rather than\
    \ here.\ntest -f third_party/eigen/CMakeLists.txt\ntest -f third_party/eigen/Eigen/Core\ntest -f ml_dtypes/_src/dtypes.cc\n\
    grep -m1 '__version__' ml_dtypes/__init__.py\ngrep -m1 'cmake_minimum_required' third_party/eigen/CMakeLists.txt\n\
    grep -m1 'add_subdirectory(third_party/eigen' CMakeLists.txt\n\n# --- the build ---------------------------------------------------------\n\
    #\n# The compiler is named on the command line as well as in the environment.\n# CMake records whichever compiler\
    \ it finds first and then uses the cached\n# path for every later invocation, so naming it explicitly is the\
    \ difference\n# between a build that is reproducible and one that is reproducible as long\n# as PATH is.\nexport\
    \ CC=\"$tc/bin/clang\"\nexport CXX=\"$tc/bin/clang++\"\n\n# --- the target platform, and where it has to be\
    \ declared --------------\n#\n# A cross-built wheel has to be told its target platform, and there are two\n\
    # places to put it. numpy and scipy export `_PYTHON_HOST_PLATFORM`, because\n# that is the one their build system\
    \ reads. This stage does not export it,\n# and the difference is not stylistic: exporting it here builds a different\n\
    # wheel.\n#\n# scikit-build-core computes the tag with `packaging.tags.sys_tags()` and\n# takes the interpreter\
    \ and the ABI from the first tag in it whose platform\n# is neither manylinux nor musllinux -- in an untouched\
    \ environment that is\n# `cp313-cp313-linux_x86_64`, whose ABI is `cp313` -- and then replaces the\n# platform\
    \ with `_PYTHON_HOST_PLATFORM`. Export the variable into the\n# interpreter's own environment and `sysconfig.get_platform()`\
    \ already\n# answers `musllinux_1_2_x86_64`, so every `cp313-cp313-*` tag is filtered\n# out as musllinux, `abi3`\
    \ with them, and the first survivor is the\n# `cp313-none-any` that `compatible_tags()` yields for a known interpreter.\n\
    # The wheel is then named\n# `ml_dtypes-0.6.0-cp313-none-musllinux_1_2_x86_64.whl`, and an ABI of\n# `none`\
    \ is a claim that the extension loads under any 3.13 interpreter:\n# true of a limited-API extension, false\
    \ of this one, which is an ordinary\n# `cp313` extension module. The first revision of this stage built exactly\n\
    # that wheel, and the step below failed on the output path because the\n# manifest names the wheel the other\
    \ tag produces.\n#\n# So the variable goes to the build system's own `env` table instead --\n# `-Cenv._PYTHON_HOST_PLATFORM`,\
    \ the same value the other two stages\n# export -- which scikit-build-core applies to the environment CMake\
    \ runs\n# in and to the environment the tag is computed against, while leaving\n# `sysconfig` alone. That is\
    \ the whole of the difference: CMake builds in\n# the same environment as before, and the ABI half of the tag\
    \ survives.\n#\n# The two tags are measured from scikit-build-core's own code rather than\n# asserted from the\
    \ paragraph above, so a revision that changed either\n# building block fails here rather than by publishing\
    \ a wheel with the\n# wrong name.\n_PYTHON_HOST_PLATFORM=musllinux_1_2_x86_64 \\\n  \"$pypy\" -c 'import sysconfig;\
    \ p = sysconfig.get_platform(); print(\"platform\", p); assert p == \"musllinux_1_2_x86_64\", p'\ntag_exported=$(_PYTHON_HOST_PLATFORM=musllinux_1_2_x86_64\
    \ \"$pypy\" -c \\\n  'from scikit_build_core.builder.wheel_tag import WheelTag; print(WheelTag.compute_best([]))')\n\
    tag_env_table=$(\"$pypy\" -c \\\n  'import os; from scikit_build_core.builder.wheel_tag import WheelTag; print(WheelTag.compute_best([],\
    \ env=dict(os.environ, _PYTHON_HOST_PLATFORM=\"musllinux_1_2_x86_64\")))')\necho \"tag with the variable exported:\
    \ $tag_exported\"\necho \"tag with the env table:         $tag_env_table\"\ntest \"$tag_exported\" = cp313-none-musllinux_1_2_x86_64\n\
    test \"$tag_env_table\" = cp313-cp313-musllinux_1_2_x86_64\n\n\"$pypy\" -m pip wheel --no-build-isolation --no-deps\
    \ -w \"$out\" \\\n  -Cenv._PYTHON_HOST_PLATFORM=musllinux_1_2_x86_64 \\\n  -Ccmake.define.CMAKE_CXX_COMPILER=\"\
    $tc/bin/clang++\" \\\n  -Ccmake.build-type=Release \\\n  -Cbuild.verbose=true \\\n  . > \"$build/workspace/build.log\"\
    \ 2>&1 || { tail -60 \"$build/workspace/build.log\"; exit 1; }\ngrep -c 'ml_dtypes/_src/dtypes.cc' \"$build/workspace/build.log\"\
    \ || true\ntail -5 \"$build/workspace/build.log\"\n\nwheel=\"$out/ml_dtypes-0.6.0-cp313-cp313-musllinux_1_2_x86_64.whl\"\
    \n# The wheel is the one the env-table measurement predicted, by name. The\n# declared output path below repeats\
    \ that tag rather than composing it from\n# the variable, so the two are checked against each other here.\n\
    test \"$wheel\" = \"$out/ml_dtypes-0.6.0-$tag_env_table.whl\"\ntest -s \"$wheel\"\nls -l \"$out\"\n\n# --- verification\
    \ ------------------------------------------------------\nvf=\"$build/verify\"\nmkdir -p \"$vf\"\n# Out of the\
    \ source tree, before anything is imported. The build above runs\n# with the cwd inside `ml_dtypes-0.6.0` because\
    \ that is where `pip wheel .`\n# was pointed -- and a Python program whose script is read from stdin has\n#\
    \ `''` as `sys.path[0]`, which is the cwd, which is searched *ahead* of\n# PYTHONPATH. Left there, `import ml_dtypes`\
    \ finds the source package, whose\n# `_ml_dtypes_ext` was written into the wheel and not into the tree, so the\n\
    # check fails after the build has been paid for. Same trap as the numpy and\n# scipy stages; every path below\
    \ is absolute.\ncd \"$vf\"\n\n\"$pypy\" - \"$wheel\" > \"$vf/wheel-metadata.txt\" <<'PY'\nimport sys, zipfile\n\
    z = zipfile.ZipFile(sys.argv[1])\nfor name in z.namelist():\n    if name.endswith(\".dist-info/WHEEL\"):\n \
    \       print(z.read(name).decode())\nprint(\"members\", len(z.namelist()))\nprint(\"extensions\", [n for n\
    \ in z.namelist() if n.endswith(\".so\")])\nPY\ncat \"$vf/wheel-metadata.txt\"\ngrep -q 'Tag: cp313-cp313-musllinux_1_2_x86_64'\
    \ \"$vf/wheel-metadata.txt\"\n# Exactly one shared object: the extension is the artifact, and a wheel that\n\
    # carried a second one would be carrying a library this stage did not build.\ngrep -q \"'ml_dtypes/_ml_dtypes_ext\"\
    \ \"$vf/wheel-metadata.txt\"\n\nsite=\"$build/site\"\n\"$pypy\" -m pip install --no-index --no-deps --target\
    \ \"$site\" \"$wheel\" >/dev/null\nexport PYTHONPATH=\"$site\"\n\n# The dtypes, and what they mean. Every number\
    \ below is a property of the\n# format rather than of this build, which is checked rather than asserted:\n#\
    \ the same program against the *published* manylinux wheel of the same\n# version, on the same numpy, printed\
    \ every one of these lines identically\n# before this revision was written, down to the float32 in `matmul`.\
    \ So a\n# line that differs here is a line this build got wrong, and the four lines\n# that explain the float32\
    \ are ones the published wheel produces too.\n# bfloat16 has eight mantissa bits, so the\n# nearest bfloat16\
    \ to 1.1 is 1.1015625 and a type that returned 1.1 would be\n# a type that is not bfloat16; float8_e4m3fn has\
    \ no infinity, so an overflow\n# is a NaN and a type that saturated to inf would be the wrong format; int4\n\
    # is four bits of range in a whole byte of storage, which is the storage\n# decision jax's arrays are built\
    \ on.\n\"$pypy\" - > \"$vf/dtypes.txt\" <<'PY'\nimport numpy as np\nimport ml_dtypes\n\nprint(\"version\", ml_dtypes.__version__)\n\
    print(\"module\", ml_dtypes.__file__)\n\n# bfloat16: 1 sign, 8 exponent, 7 mantissa bits.\nprint(\"bfloat16_1_5\"\
    , repr(float(ml_dtypes.bfloat16(1.5))))\nprint(\"bfloat16_1_1\", repr(float(ml_dtypes.bfloat16(1.1))))\nprint(\"\
    bfloat16_eps\", repr(float(ml_dtypes.finfo(ml_dtypes.bfloat16).eps)))\nprint(\"bfloat16_itemsize\", np.dtype(ml_dtypes.bfloat16).itemsize)\n\
    \n# The float8 family: e4m3fn has no infinity, e5m2 does, and both say so.\nprint(\"e4m3fn_max\", repr(float(ml_dtypes.finfo(ml_dtypes.float8_e4m3fn).max)))\n\
    print(\"e4m3fn_overflow\", repr(float(ml_dtypes.float8_e4m3fn(1e10))))\nprint(\"e5m2_max\", repr(float(ml_dtypes.finfo(ml_dtypes.float8_e5m2).max)))\n\
    print(\"e5m2_overflow\", repr(float(ml_dtypes.float8_e5m2(1e10))))\nprint(\"e3m2_max\", repr(float(ml_dtypes.finfo(ml_dtypes.float6_e3m2fn).max)))\n\
    print(\"e2m1_max\", repr(float(ml_dtypes.finfo(ml_dtypes.float4_e2m1fn).max)))\n\n# The sub-byte integers: stored\
    \ one per byte, ranged by their bit width.\nprint(\"int4\", ml_dtypes.iinfo(ml_dtypes.int4).min, ml_dtypes.iinfo(ml_dtypes.int4).max,\
    \ np.dtype(ml_dtypes.int4).itemsize)\nprint(\"uint4\", ml_dtypes.iinfo(ml_dtypes.uint4).min, ml_dtypes.iinfo(ml_dtypes.uint4).max,\
    \ np.dtype(ml_dtypes.uint4).itemsize)\n\n# And the arithmetic, which is what the extension is for: a sum and\
    \ a matrix\n# product in a dtype numpy does not have, computed by the C++ underneath.\n# The sum stays in bfloat16\
    \ and the product comes back float32, and the four\n# lines after that one are the difference: a *gufunc* selects\
    \ its loop from\n# its own loop table, and bfloat16 has no `matmul` loop -- asking for one by\n# name raises\
    \ -- so numpy casts to the smallest loop that fits. It is not a\n# promotion of the dtype, which is why `result_type`\
    \ still says bfloat16 and\n# why the elementwise and reduction loops, which *are* registered, keep it.\na =\
    \ np.array([1.0, 2.0, 3.0], dtype=ml_dtypes.bfloat16)\ns = np.sum(a)\nprint(\"sum\", repr(float(s)), s.dtype.name)\n\
    m = np.matmul(a.reshape(1, 3), a.reshape(3, 1))\nprint(\"matmul\", repr(float(m[0, 0])), m.dtype.name)\nprint(\"\
    matmul_result_type\", np.result_type(ml_dtypes.bfloat16, ml_dtypes.bfloat16).name)\nprint(\"matmul_dot_dtype\"\
    , np.dot(a, a).dtype.name)\ntry:\n    np.matmul(a.reshape(1, 3), a.reshape(3, 1), dtype=ml_dtypes.bfloat16)\n\
    \    print(\"matmul_loop\", \"present\")\nexcept TypeError as exc:\n    print(\"matmul_loop\", \"absent:\",\
    \ exc)\nf8 = np.array([1.0, 2.0], dtype=ml_dtypes.float8_e4m3fn)\nprint(\"float8_sum\", repr(float(np.sum(f8))),\
    \ np.sum(f8).dtype.name)\nprint(\"roundtrip\", np.array([1.0, 1.1015625], dtype=ml_dtypes.bfloat16).astype(np.float32).tolist())\n\
    PY\ncat \"$vf/dtypes.txt\"\ngrep -qx 'version 0.6.0' \"$vf/dtypes.txt\"\ngrep -qx 'bfloat16_1_1 1.1015625' \"\
    $vf/dtypes.txt\"\ngrep -qx 'bfloat16_eps 0.0078125' \"$vf/dtypes.txt\"\ngrep -qx 'bfloat16_itemsize 2' \"$vf/dtypes.txt\"\
    \ngrep -qx 'e4m3fn_max 448.0' \"$vf/dtypes.txt\"\ngrep -qx 'e4m3fn_overflow nan' \"$vf/dtypes.txt\"\ngrep -qx\
    \ 'e5m2_max 57344.0' \"$vf/dtypes.txt\"\ngrep -qx 'e5m2_overflow inf' \"$vf/dtypes.txt\"\ngrep -qx 'e3m2_max\
    \ 28.0' \"$vf/dtypes.txt\"\ngrep -qx 'e2m1_max 6.0' \"$vf/dtypes.txt\"\ngrep -qx 'int4 -8 7 1' \"$vf/dtypes.txt\"\
    \ngrep -qx 'uint4 0 15 1' \"$vf/dtypes.txt\"\ngrep -qx 'sum 6.0 bfloat16' \"$vf/dtypes.txt\"\ngrep -qx 'matmul\
    \ 14.0 float32' \"$vf/dtypes.txt\"\ngrep -qx 'matmul_result_type bfloat16' \"$vf/dtypes.txt\"\ngrep -qx 'matmul_dot_dtype\
    \ bfloat16' \"$vf/dtypes.txt\"\ngrep -qx 'matmul_loop absent: No loop matching the specified signature and casting\
    \ was found for ufunc matmul' \"$vf/dtypes.txt\"\ngrep -qx 'float8_sum 3.0 float8_e4m3fn' \"$vf/dtypes.txt\"\
    \ngrep -qx 'roundtrip \\[1.0, 1.1015625\\]' \"$vf/dtypes.txt\"\n\n# The extension is the only thing that may\
    \ be linked, and it must link\n# nothing the numpy runtime artifact does not already carry: those five\n# objects\
    \ are what the image will have. Eigen is header-only, so the only\n# shared objects this wheel may need are\
    \ the C++ runtime and the C library.\next=$(find \"$site/ml_dtypes\" -type f -name '*.so')\ntest -n \"$ext\"\
    \necho \"$ext\"\nreadelf -d \"$ext\" | sed -n 's/.*NEEDED.*\\[\\(.*\\)\\]/\\1/p' | sort -u | tee \"$vf/needed.txt\"\
    \nfor dep in $(cat \"$vf/needed.txt\"); do\n  test \"$dep\" = libc.so && continue\n  test -e \"$nr/usr/lib/$dep\"\
    \ || {\n    echo \"$dep is needed by ml_dtypes and is not in the numpy runtime artifact\" >&2\n    exit 1\n\
    \  }\ndone\ngrep -qx 'libstdc++.so.6' \"$vf/needed.txt\"\nif readelf -d \"$ext\" | grep -qi 'libc\\.so\\.6';\
    \ then\n  echo \"the extension links against glibc\" >&2\n  exit 1\nfi\n# Not `strings \u2026 | grep -q`. Under\
    \ `set -o pipefail` that idiom is dead:\n# grep -q exits at the first match, strings dies of SIGPIPE, and the\n\
    # pipeline's status is 141 -- so the test takes the *false* branch in\n# exactly the case it exists to catch.\
    \ Measured on 11 MB of text with the\n# pattern on the first line: 141. Process substitution leaves grep as\
    \ the\n# only process whose status is read.\nif grep -q 'GLIBC_2\\.' < <(strings \"$ext\"); then\n  echo \"\
    the extension carries glibc symbol versions\" >&2\n  exit 1\nfi\n\n# And the C++ really is C++: the extension\
    \ must have C++ symbols and a\n# dependency on libstdc++, which is the one thing a C-only build of the same\n\
    # source could not produce.\nnm -D --defined-only \"$ext\" | sed -n 's/.* \\(PyInit_[A-Za-z_]*\\)$/\\1/p' |\
    \ tee \"$vf/pyinit.txt\"\ngrep -qx 'PyInit__ml_dtypes_ext' \"$vf/pyinit.txt\"\n\n# The other half of that claim\
    \ used to be `nm -D --defined-only | grep -q '\n# _ZN'`: mangled C++ names in the *dynamic* symbol table. It\
    \ found none, and\n# the wheel was not at fault -- the assertion was another one written from\n# reading rather\
    \ than from measuring. What it assumes is that C++\n# vague-linkage symbols are exported, and that is the compiler's\
    \ inlining\n# decision rather than a property of the language: the project's own\n# published manylinux wheel\
    \ exports sixteen of them (every one a\n# `std::basic_stringbuf` or `basic_stringstream` constructor, every\
    \ one\n# weak), while a two-line translation unit that formats a number keeps\n# three at `-O2` and none with\
    \ `-fvisibility-inlines-hidden`. What is\n# measured below instead is what the extension *imports*: a C++ translation\n\
    # unit that throws, allocates, or formats has to reach libstdc++ for it, and\n# that is the question the check\
    \ was trying to ask. The counts are printed\n# and carried into the report; the assertion that uses them is\
    \ the line\n# after the block.\nnm --version | head -1\ndynsym_defined=$(nm -D --defined-only \"$ext\" | wc\
    \ -l)\ndynsym_defined_cxx=$(nm -D --defined-only \"$ext\" | grep -c ' _Z' || true)\ndynsym_undefined_cxx=$(nm\
    \ -D --undefined-only \"$ext\" | grep -c ' _Z' || true)\nsymtab_defined_cxx=$(nm --defined-only \"$ext\" 2>/dev/null\
    \ | grep -c ' _Z' || true)\n{\n  printf 'dynsym_defined %s\\n' \"$dynsym_defined\"\n  printf 'dynsym_defined_cxx\
    \ %s\\n' \"$dynsym_defined_cxx\"\n  printf 'dynsym_undefined_cxx %s\\n' \"$dynsym_undefined_cxx\"\n  printf\
    \ 'symtab_defined_cxx %s\\n' \"$symtab_defined_cxx\"\n  printf 'cxx_import_examples\\n'\n  nm -D --undefined-only\
    \ \"$ext\" | grep ' _Z' | head -5\n  printf 'comment\\n'\n  readelf -p .comment \"$ext\" 2>/dev/null | sed -n\
    \ '2,4p'\n} | tee \"$vf/symbols.txt\"\n# The claim in the form the measurement supports: the extension *imports*\n\
    # mangled C++ names, which is to say that C++ code in it calls into the C++\n# runtime. Both compilers this\
    \ pipeline could have used produce that -- a\n# translation unit that formats a number imports between 16 and\
    \ 24 of them\n# at `-O3` with `-fvisibility=hidden`, under g++ 16.2 and clang 22 alike,\n# whether the linker\
    \ is bfd or lld -- because allocation and exception\n# handling are never inlined away. It is the export side\
    \ that does not\n# survive optimization, and that is what the deleted assertion was reading.\ntest \"$dynsym_undefined_cxx\"\
    \ -gt 0\n\n# --- what the artifact says about itself -------------------------------\n#\n# Each value is computed\
    \ into a variable before the block that prints it.\n# `printf 'k\\t%s\\n' \"$(cmd)\"` is not equivalent and\
    \ is a trap: printf's\n# status is its own, so a substitution that fails writes an empty field and\n# the step\
    \ still exits 0 -- and this file is the published record of what\n# the artifact is. A field that could not\
    \ be computed fails the step.\n#\n# The Eigen header path is absolute on purpose: the cwd is `$vf` by now, and\n\
    # a relative path here would be read as `$vf/third_party/...`, which does\n# not exist. That is the one place\
    \ in this stage where stepping out of the\n# source tree changed what a path means.\nmkdir -p \"$FASE_OUTPUT_ROOT\"\
    \ncp \"$wheel\" \"$FASE_OUTPUT_ROOT/ml_dtypes-0.6.0-cp313-cp313-musllinux_1_2_x86_64.whl\"\n# With the variable\
    \ set for this one command, because that is what the build\n# was given -- through the build system's env table,\
    \ which leaves the\n# interpreter's own environment alone. The two are the same value here; the\n# tags below\
    \ are where the difference between them showed.\nstage=$(_PYTHON_HOST_PLATFORM=musllinux_1_2_x86_64 \"$pypy\"\
    \ -c 'import sysconfig; print(sysconfig.get_platform())')\ninterpreter=$(\"$pypy\" -V 2>&1)\nsbc_version=$(\"\
    $pypy\" -c 'import scikit_build_core; print(scikit_build_core.__version__)')\ncmake_version=$(cmake --version\
    \ | head -1 | sed 's/^cmake version //')\nninja_version=$(ninja --version)\ncompiler=$(\"$CXX\" --version |\
    \ head -1)\nnumpy_version=$(\"$pypy\" -c 'import numpy; print(numpy.__version__)')\n# Eigen's version is the\
    \ checked-in `Eigen/Version` header -- the one CMake\n# reads to generate the `Eigen/Version` it installs --\
    \ and not anything\n# under `src/Core/util`, where the first revision of this stage looked. The\n# macros it\
    \ uses there are the ones Eigen *tests* its version with, so awk\n# found nothing, the field came out empty,\
    \ and under the masked-printf form\n# this file used to have, it would have been published as a blank. Read\
    \ as\n# the version string rather than assembled from three macros, because the\n# header already carries the\
    \ assembled one.\neigen_version=$(sed -n 's/^#define EIGEN_VERSION_STRING \"\\(.*\\)\"$/\\1/p' \\\n  \"$srcdir/third_party/eigen/Eigen/Version\"\
    )\nextension_bytes=$(stat -c %s \"$ext\")\nneeded=$(paste -sd, \"$vf/needed.txt\")\ndtypes=$(\"$pypy\" -c 'import\
    \ ml_dtypes; print(len(ml_dtypes.__all__) - 3)')\nfor v in stage interpreter tag_env_table tag_exported sbc_version\
    \ \\\n         cmake_version ninja_version compiler numpy_version eigen_version \\\n         extension_bytes\
    \ needed dtypes dynsym_defined dynsym_defined_cxx \\\n         dynsym_undefined_cxx symtab_defined_cxx; do\n\
    \  : \"${!v:?$v came out empty}\"\ndone\ntest \"$stage\" = musllinux_1_2_x86_64\n{\n  printf 'name\\tml_dtypes\\\
    n'\n  printf 'version\\t0.6.0\\n'\n  printf 'python\\tcp313\\n'\n  printf 'platform\\t%s\\n' \"$stage\"\n  printf\
    \ 'tag_env_table\\t%s\\n' \"$tag_env_table\"\n  printf 'tag_exported\\t%s\\n' \"$tag_exported\"\n  printf 'wheel\\\
    t%s\\n' \"$(basename \"$wheel\")\"\n  printf 'wheel_bytes\\t%s\\n' \"$(stat -c %s \"$wheel\")\"\n  printf 'interpreter\\\
    t%s\\n' \"$interpreter\"\n  printf 'buildsystem\\tscikit-build-core %s + CMake %s\\n' \"$sbc_version\" \"$cmake_version\"\
    \n  printf 'generator\\tninja %s\\n' \"$ninja_version\"\n  printf 'compiler\\t%s\\n' \"$compiler\"\n  printf\
    \ 'numpy\\t%s\\n' \"$numpy_version\"\n  printf 'eigen\\t%s\\n' \"$eigen_version\"\n  printf 'extension_bytes\\\
    t%s\\n' \"$extension_bytes\"\n  printf 'dynsym_defined\\t%s\\n' \"$dynsym_defined\"\n  printf 'dynsym_defined_cxx\\\
    t%s\\n' \"$dynsym_defined_cxx\"\n  printf 'dynsym_undefined_cxx\\t%s\\n' \"$dynsym_undefined_cxx\"\n  printf\
    \ 'symtab_defined_cxx\\t%s\\n' \"$symtab_defined_cxx\"\n  printf 'needed\\t%s\\n' \"$needed\"\n  printf 'dtypes\\\
    t%s\\n' \"$dtypes\"\n  printf 'jobs\\t%s\\n' \"$FASE_VAR_JOBS\"\n} > \"$FASE_OUTPUT_ROOT/ml_dtypes-build-info.txt\"\
    \ncat \"$FASE_OUTPUT_ROOT/ml_dtypes-build-info.txt\"\ndu -sh \"$site\" \"$wheel\"\n"
  workspace:
    taskSizeLimit: 300Gi
    inputSizeLimit: 32Gi
    outputSizeLimit: 32Gi
    transferSizeLimit: 32Gi
  nodeSelector:
    kubernetes.io/hostname: node1
---
apiVersion: skyw.top/v1beta1
kind: Recipe
metadata:
  name: mldtypes-build
spec:
  inputs:
    artifacts:
    - name: tc
      artifactSelector:
        matchLabels:
          name: clang-musl-tc
          rev: l3
    - name: pyruntime
      artifactSelector:
        matchLabels:
          name: python-runtime
          version: 3.13.15
          recipe: python-build-v1
    - name: pystdlib
      artifactSelector:
        matchLabels:
          name: python-stdlib
          version: 3.13.15
          recipe: python-build-v1
    - name: pydev
      artifactSelector:
        matchLabels:
          name: python-dev
          version: 3.13.15
          recipe: python-build-v1
    - name: pydeps
      artifactSelector:
        matchLabels:
          name: python-deps
          recipe: python-deps-v1
    - name: numpywheel
      artifactSelector:
        matchLabels:
          name: numpy
          version: 2.5.3
          recipe: numpy-build-v1
    - name: numpyruntime
      artifactSelector:
        matchLabels:
          name: numpy-runtime
          version: 2.5.3
          recipe: numpy-build-v1
    - name: source
      artifactSelector:
        matchLabels:
          name: ml_dtypes-source
          version: 0.6.0
          recipe: fetch-v1
    - name: pip
      artifactSelector:
        matchLabels:
          name: pip-wheel
          version: 26.2.1
          recipe: fetch-v1
    - name: scikitbuildcore
      artifactSelector:
        matchLabels:
          name: scikit-build-core-wheel
          version: 1.1.0
          recipe: fetch-v1
    - name: pathspec
      artifactSelector:
        matchLabels:
          name: pathspec-wheel
          version: 1.1.1
          recipe: fetch-v1
    - name: packaging
      artifactSelector:
        matchLabels:
          name: packaging-wheel
          version: '26.3'
          recipe: fetch-v1
    - name: ninja
      artifactSelector:
        matchLabels:
          name: ninja-wheel
          version: 1.13.2
          recipe: fetch-v1
  outputs:
    artifacts:
    - name: wheel
      from:
        task: build
        artifact: wheel
      labels:
        name:
          value: ml_dtypes
        version:
          fromInput:
            input: source
            label: version
        recipe:
          value: mldtypes-build-v1
        python:
          value: cp313
        libc:
          value: musl
        numpy:
          fromInput:
            input: numpywheel
            label: version
        toolchain:
          fromInput:
            input: tc
            label: rev
        arch:
