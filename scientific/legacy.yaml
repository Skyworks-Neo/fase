    \ \".join(f\"{v:.6f}\" for v in x))\nprint(\"det\", f\"{linalg.det(a):.1f}\")\nlu, piv = linalg.lu_factor(a)\n\
    print(\"lu\", f\"{lu[0, 0]:.1f} {lu[1, 1]:.6f}\")\nw = linalg.eigvalsh(np.array([[2.0, 0.0], [0.0, 5.0]]))\n\
