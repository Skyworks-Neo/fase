    \ of checks further\n# down: `libgfortran.so.5` in the NEEDED set, and the `odrpack` sources\n# checked in at\
    \ the top of this script.\n\"$pypy\" - > \"$vf/numerics.txt\" <<'PY'\nimport numpy as np\nfrom scipy import\
    \ integrate, special, optimize, interpolate, fft\nv, err = integrate.quad(lambda x: np.exp(-x * x), 0.0, np.inf)\n\
    print(\"quad\", f\"{v:.6f}\", f\"{err:.2e}\")\nv2, err2 = integrate.quad(lambda x: 4.0 / (1.0 + x * x), 0.0,\
    \ 1.0)\nprint(\"quad2\", f\"{v2:.6f}\")\nv3, err3 = integrate.quad(lambda x: x ** 3, 0.0, 1.0)\nprint(\"quad3\"\
