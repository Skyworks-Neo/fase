    \ \"$vf/config.txt\"\n\n# The interface files, from a consumer's side.\n#\n# OpenBLAS writes one pkg-config\
    \ file -- for itself, carrying its own\n# version -- and the openblas stage adds blas, cblas and lapack, which\
