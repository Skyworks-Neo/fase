      variables:
        url: {value: "https://github.com/ROCm/jax.git"}
        ref: {value: "rocm-jax-v0.11.1"}
        commit: {value: "9606999edf6bb63d9454e990d81d9d28e796e215"}
      outputs: [{name: source}]
  outputs:
    artifacts:
      - name: source
        from: {task: fetch, artifact: source}
