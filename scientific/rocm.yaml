apiVersion: skyw.top/v1beta1
kind: Task
metadata: {name: fetch-pinned-git-source, labels: {capability: fetch-pinned-git-source}}
spec:
  image: alpine:3.21
  command: [/bin/sh]
  securityContext:
    runAsUser: 0
    runAsNonRoot: false
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
    seccompProfile: {type: RuntimeDefault}
  resources:
    requests: {cpu: 500m, memory: 512Mi, ephemeral-storage: 1Gi}
    limits: {cpu: "2", memory: 2Gi, ephemeral-storage: 4Gi}
  inputs:
    variables:
      - {name: url, env: FASE_VAR_URL, required: true}
      - {name: ref, env: FASE_VAR_REF, required: true}
      - {name: commit, env: FASE_VAR_COMMIT, required: true}
  outputs:
    artifacts:
      - {name: source, path: source.tar.gz, kind: file}
  script: |
    set -eu
    export HOME=/workspace/home
    mkdir -p "$HOME"
    apk add --no-cache git ca-certificates
    git clone --depth 1 --branch "$FASE_VAR_REF" "$FASE_VAR_URL" /workspace/repo
    actual=$(git -C /workspace/repo rev-parse HEAD)
    test "$actual" = "$FASE_VAR_COMMIT"
    tar -czf "$FASE_OUTPUT_ROOT/source.tar.gz" -C /workspace/repo .
    printf 'pinned git source: %s %s %s\n' "$FASE_VAR_URL" "$FASE_VAR_REF" "$actual"
---
apiVersion: skyw.top/v1beta1
kind: Recipe
metadata: {name: fetch-therock-7-14-1}
spec:
  tasks:
    - name: fetch
      taskSelector:
        matchLabels: {capability: fetch-pinned-git-source}
      variables:
        url: {value: "https://github.com/ROCm/TheRock.git"}
        ref: {value: "therock-7.14.1"}
        commit: {value: "f51dc6c91e0d3214f22853fd5cb3f96dbc7d2c4b"}
      outputs: [{name: source}]
  outputs:
    artifacts:
      - name: source
        from: {task: fetch, artifact: source}
        labels:
          name: {value: therock-source}
          version: {value: "7.14.1"}
          recipe: {value: fetch-git-v1}
---
apiVersion: skyw.top/v1beta1
kind: Recipe
metadata: {name: fetch-rocm-jax-0-11-1}
spec:
  tasks:
    - name: fetch
      taskSelector:
