---
apiVersion: skyw.top/v1beta1
kind: Task
metadata: {name: therock-gfx942-source-build, labels: {capability: therock-gfx942-source-build}}
spec:
  image: docker.io/library/ubuntu@sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3
  command: [/bin/bash]
  nodeSelector: {kubernetes.io/hostname: node1}
  securityContext:
    runAsUser: 0
    runAsNonRoot: false
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
    seccompProfile: {type: RuntimeDefault}
  resources:
    requests: {cpu: "32", memory: 64Gi, ephemeral-storage: 200Gi}
    limits: {cpu: "32", memory: 64Gi, ephemeral-storage: 300Gi}
  workspace: {taskSizeLimit: 300Gi, inputSizeLimit: 32Gi, outputSizeLimit: 32Gi, transferSizeLimit: 32Gi}
  inputs:
    artifacts:
      - {name: source, path: therock.tar.gz, kind: file}
  outputs:
    artifacts:
      - {name: sdk, path: rocm-gfx942.tar.zst, kind: file}
      - {name: report, path: rocm-gfx942-build.txt, kind: file}
  script: |
    set -Eeuo pipefail
    umask 022
    export PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple
    export DEBIAN_FRONTEND=noninteractive HOME=/workspace/home TMPDIR=/workspace/tmp
    mkdir -p "$HOME" "$TMPDIR" /workspace/src/therock
    sed -i \
      -e 's#http://archive.ubuntu.com/ubuntu/#http://mirrors.tuna.tsinghua.edu.cn/ubuntu/#g' \
      -e 's#http://security.ubuntu.com/ubuntu/#http://mirrors.tuna.tsinghua.edu.cn/ubuntu/#g' \
      /etc/apt/sources.list.d/ubuntu.sources
    apt-get update -qq
    apt-get install -y -qq --no-install-recommends \
      ca-certificates curl make gfortran git ninja-build cmake g++ pkg-config xxd \
      automake libtool python3-venv python3-dev libegl1-mesa-dev texinfo \
      bison flex zstd
    tar -xf "$FASE_INPUT_ROOT/therock.tar.gz" -C /workspace/src/therock
    src=/workspace/src/therock
    test -f "$src/CMakeLists.txt"
    cd "$src"
    git config --global http.version HTTP/1.1
    INSTALL_PREFIX=/usr/local ./dockerfiles/install_pinned_patchelf.sh
    python3 -m venv /workspace/venv
    /workspace/venv/bin/python -m pip install --disable-pip-version-check -r requirements.txt
    for attempt in 1 2 3 4 5; do
      if /workspace/venv/bin/python build_tools/fetch_sources.py --depth 1 --jobs 2; then
        break
      fi
      test "$attempt" -lt 5
      printf 'TheRock source fetch failed; retrying (%s/5)\n' "$attempt" >&2
      sleep 15
    done
    cmake -S . -B /workspace/build -GNinja -DTHEROCK_AMDGPU_TARGETS=gfx942 \
      -DCMAKE_BUILD_TYPE=Release
    cmake --build /workspace/build --target therock-dist-rocm -j32
    test -d /workspace/build/dist/rocm/lib
    tar -C /workspace/build/dist/rocm -cf - . | zstd -T16 -9 \
      -o "$FASE_OUTPUT_ROOT/rocm-gfx942.tar.zst"
    zstd -t "$FASE_OUTPUT_ROOT/rocm-gfx942.tar.zst"
    {
      printf 'TheRock 7.14.1 source build for gfx942 (MI300), static artifact verification only\n'
      printf 'files: '; find /workspace/build/dist/rocm -type f | wc -l
      printf 'archive: '; stat -c %s "$FASE_OUTPUT_ROOT/rocm-gfx942.tar.zst"
      sha256sum "$FASE_OUTPUT_ROOT/rocm-gfx942.tar.zst"
    } > "$FASE_OUTPUT_ROOT/rocm-gfx942-build.txt"
---
apiVersion: skyw.top/v1beta1
kind: Recipe
metadata: {name: therock-gfx942-source-build}
spec:
  inputs:
    artifacts:
      - name: source
        artifactSelector:
          matchLabels: {name: therock-source, version: "7.14.1", recipe: fetch-git-v1}
  tasks:
    - name: build
      taskSelector:
        matchLabels: {capability: therock-gfx942-source-build}
      inputs:
        artifacts:
          - {name: source, from: {recipeInput: source}}
      outputs: [{name: sdk}, {name: report}]
  outputs:
    artifacts:
      - name: sdk
        from: {task: build, artifact: sdk}
        labels:
          name: {value: rocm-gfx942-sdk}
          version: {value: "7.14.1"}
          arch: {value: amd64}
          gpu: {value: gfx942}
          source: {value: therock-7.14.1}
      - name: report
        from: {task: build, artifact: report}
        labels:
          name: {value: rocm-gfx942-build-report}
          version: {value: "7.14.1"}
---
apiVersion: skyw.top/v1beta1
kind: Task
metadata: {name: rocm-jax-gfx942-source-build, labels: {capability: rocm-jax-gfx942-source-build}}
spec:
  image: quay.io/pypa/manylinux_2_28_x86_64@sha256:407f771c51a2c3e83ebe5a7970b4289ead3a6db21d9b9c089168775cad11d328
  command: [/bin/bash]
  nodeSelector: {kubernetes.io/hostname: node1}
  securityContext:
    runAsUser: 0
    runAsNonRoot: false
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
    seccompProfile: {type: RuntimeDefault}
  resources:
    requests: {cpu: "32", memory: 64Gi, ephemeral-storage: 200Gi}
    limits: {cpu: "32", memory: 64Gi, ephemeral-storage: 300Gi}
  workspace: {taskSizeLimit: 300Gi, inputSizeLimit: 32Gi, outputSizeLimit: 32Gi, transferSizeLimit: 32Gi}
  inputs:
    artifacts:
      - {name: source, path: rocm-jax.tar.gz, kind: file}
      - {name: rocm, path: rocm-gfx942.tar.zst, kind: file}
      - {name: jax, path: jax-wheels, kind: tree}
  outputs:
    artifacts:
      - {name: wheels, path: wheels, kind: tree}
      - {name: report, path: rocm-jax-gfx942-build.txt, kind: file}
  script: |
    set -Eeuo pipefail
    umask 022
    export PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple
    export HOME=/workspace/home TMPDIR=/workspace/tmp XDG_CACHE_HOME=/workspace/cache
    mkdir -p "$HOME" "$TMPDIR" "$XDG_CACHE_HOME" /workspace/src/jax /workspace/rocm \
      /workspace/wheels "$FASE_OUTPUT_ROOT/wheels"
    python=/opt/python/cp313-cp313/bin/python
    "$python" -m pip install --disable-pip-version-check --no-cache-dir 'zstandard==0.25.0'
    "$python" -c 'import zstandard as z,sys; z.ZstdDecompressor().copy_stream(open(sys.argv[1], "rb"), sys.stdout.buffer)' \
      "$FASE_INPUT_ROOT/rocm-gfx942.tar.zst" | tar -xf - -C /workspace/rocm
    export ROCM_PATH=/workspace/rocm ROCM_VERSION=7.14.1
    export PATH="$ROCM_PATH/bin:$ROCM_PATH/llvm/bin:$PATH"
    export LD_LIBRARY_PATH="$ROCM_PATH/lib:$ROCM_PATH/lib64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
    test -s "$FASE_INPUT_ROOT"/jax-wheels/jaxlib-0.11.1-*.whl
    tar -xf "$FASE_INPUT_ROOT/rocm-jax.tar.gz" -C /workspace/src/jax
    src=/workspace/src/jax
    cd "$src"
    "$python" build/build.py build --wheels=jax-rocm-plugin,jax-rocm-pjrt \
      --bazel_startup_options=--bazelrc=build/rocm/rocm.bazelrc \
      --bazel_startup_options=--host_jvm_args=-Djava.net.preferIPv6Addresses=true \
      --bazel_options=--config=rocm_release_wheel \
      --bazel_options=--repo_env=ROCM_PATH=/workspace/rocm \
      --bazel_options=--repo_env=TF_ROCM_AMDGPU_TARGETS=gfx942 \
      --bazel_options=--jobs=32 --python_version=3.13 \
      --output_path=/workspace/wheels --verbose
    cp /workspace/wheels/*.whl "$FASE_OUTPUT_ROOT/wheels/"
    test "$(find "$FASE_OUTPUT_ROOT/wheels" -name '*.whl' | wc -l)" -ge 2
    for wheel in "$FASE_OUTPUT_ROOT"/wheels/*.whl; do unzip -t "$wheel" >/dev/null; done
    {
      printf 'ROCm JAX 0.11.1 plugin and PJRT built for gfx942 with TheRock 7.14.1\n'
      printf 'No GPU runtime test: cluster has no AMD GPU\n'
      sha256sum "$FASE_OUTPUT_ROOT"/wheels/*.whl
    } > "$FASE_OUTPUT_ROOT/rocm-jax-gfx942-build.txt"
---
apiVersion: skyw.top/v1beta1
kind: Recipe
metadata: {name: rocm-jax-gfx942-source-build}
spec:
  inputs:
    artifacts:
      - name: source
        artifactSelector:
          matchLabels: {name: rocm-jax-source, version: "0.11.1", recipe: fetch-git-v1}
      - name: rocm
        artifactSelector:
          matchLabels: {name: rocm-gfx942-sdk, version: "7.14.1", gpu: gfx942}
      - name: jax
        artifactSelector:
          matchLabels: {name: jax-cpu-wheels, version: "0.11.1"}
  tasks:
    - name: build
      taskSelector:
        matchLabels: {capability: rocm-jax-gfx942-source-build}
      inputs:
        artifacts:
          - {name: source, from: {recipeInput: source}}
          - {name: rocm, from: {recipeInput: rocm}}
          - {name: jax, from: {recipeInput: jax}}
      outputs: [{name: wheels}, {name: report}]
  outputs:
    artifacts:
      - name: wheels
        from: {task: build, artifact: wheels}
        labels:
          name: {value: rocm-jax-gfx942-wheels}
          version: {value: "0.11.1"}
          python: {value: cp313}
          gpu: {value: gfx942}
          rocm: {value: "7.14.1"}
          arch: {value: amd64}
      - name: report
        from: {task: build, artifact: report}
        labels:
          name: {value: rocm-jax-gfx942-build-report}
          version: {value: "0.11.1"}
