apiVersion: skyw.top/v1beta1
kind: Task
metadata:
  name: verify-pymc-cpu-offline
  labels:
    capability: verify-pymc-cpu-offline
spec:
  image: quay.io/pypa/manylinux_2_28_x86_64@sha256:407f771c51a2c3e83ebe5a7970b4289ead3a6db21d9b9c089168775cad11d328
  command:
  - /bin/bash
  nodeSelector:
    kubernetes.io/hostname: node1
  securityContext:
    runAsUser: 0
    runAsNonRoot: false
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: '4'
      memory: 16Gi
      ephemeral-storage: 32Gi
    limits:
      cpu: '16'
      memory: 32Gi
      ephemeral-storage: 64Gi
  workspace:
    taskSizeLimit: 64Gi
    inputSizeLimit: 32Gi
    outputSizeLimit: 2Gi
    transferSizeLimit: 32Gi
  inputs:
    artifacts:
    - name: arviz
      path: deps/arviz
      kind: tree
    - name: arviz-base
      path: deps/arviz-base
      kind: tree
    - name: arviz-plots
      path: deps/arviz-plots
      kind: tree
    - name: arviz-stats
      path: deps/arviz-stats
      kind: tree
    - name: cachetools
      path: deps/cachetools
      kind: tree
    - name: cloudpickle
      path: deps/cloudpickle
      kind: tree
    - name: filelock
      path: deps/filelock
      kind: tree
    - name: jax
      path: deps/jax
      kind: tree
    - name: lazy-loader
      path: deps/lazy-loader
      kind: tree
    - name: llvmlite
      path: deps/llvmlite
      kind: tree
    - name: markdown-it-py
      path: deps/markdown-it-py
      kind: tree
    - name: mdurl
      path: deps/mdurl
      kind: tree
    - name: ml-dtypes
      path: deps/ml-dtypes
      kind: tree
    - name: numba
      path: deps/numba
      kind: tree
    - name: numpy
      path: deps/numpy
      kind: tree
    - name: opt-einsum
      path: deps/opt-einsum
      kind: tree
    - name: packaging
      path: deps/packaging
      kind: tree
    - name: pandas
      path: deps/pandas
      kind: tree
    - name: pygments
      path: deps/pygments
      kind: tree
    - name: pymc
      path: deps/pymc
      kind: tree
    - name: pytensor
      path: deps/pytensor
      kind: tree
    - name: python
      path: deps/python
      kind: tree
    - name: python-dateutil
      path: deps/python-dateutil
      kind: tree
    - name: rich
      path: deps/rich
      kind: tree
    - name: scipy
      path: deps/scipy
      kind: tree
    - name: setuptools
      path: deps/setuptools
      kind: tree
    - name: six
      path: deps/six
      kind: tree
    - name: threadpoolctl
      path: deps/threadpoolctl
      kind: tree
    - name: typing-extensions
      path: deps/typing-extensions
      kind: tree
    - name: xarray
      path: deps/xarray
      kind: tree
    - name: xarray-einstats
      path: deps/xarray-einstats
      kind: tree
  outputs:
    artifacts:
    - name: report
      path: pymc-cpu-verified.txt
      kind: file
  script: |
    set -Eeuo pipefail
    export HOME=/workspace/home TMPDIR=/workspace/tmp
    mkdir -p "$HOME" "$TMPDIR" /workspace/wheelhouse
    find "$FASE_INPUT_ROOT/deps" -mindepth 2 -maxdepth 2 -type f -name '*.whl' -exec cp -t /workspace/wheelhouse {} +
    python="$FASE_INPUT_ROOT/deps/python/bin/python3.13"
    export LD_LIBRARY_PATH="$FASE_INPUT_ROOT/deps/python/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
    "$python" -m venv /workspace/venv
    /workspace/venv/bin/python -m pip install --disable-pip-version-check \
      --no-index --find-links=/workspace/wheelhouse \
      'pymc==6.3.2' 'pytensor==3.3.2' 'jax==0.11.1' 'numba==0.67.0'
    /workspace/venv/bin/python -m pip check
    /workspace/venv/bin/python - <<'PY'
    import numpy as np
    import scipy.linalg as la
    import jax
    import jax.numpy as jnp
    import pytensor
    import pytensor.tensor as pt
    import pymc as pm
    from numba import njit

    @njit
    def add(a, b):
        return a + b

    assert add(2, 3) == 5
    assert np.allclose(la.solve([[3., 1.], [1., 2.]], [9., 8.]), [2., 3.])
    assert jax.devices('cpu')
    assert float(jnp.dot(jnp.array([1., 2.]), jnp.array([3., 4.]))) == 11.
    x = pt.dscalar('x')
    assert float(pytensor.function([x], x * x)(3.)) == 9.
    with pm.Model():
        variable = pm.Normal('value', mu=0., sigma=1.)
        sample = pm.draw(variable, draws=2, random_seed=7)
    assert len(sample) == 2
    print('NumPy', np.__version__, 'JAX', jax.__version__, 'PyTensor', pytensor.__version__, 'PyMC', pm.__version__)
    print('offline CPU smoke passed')
    PY
    {
      printf 'All target wheels installed offline from source-built Fase artifacts.\n'
      /workspace/venv/bin/python -m pip freeze | sort
    } > "$FASE_OUTPUT_ROOT/pymc-cpu-verified.txt"
---
