apiVersion: skyw.top/v1beta1
kind: Task
metadata: {name: pytensor-source-build, labels: {capability: pytensor-source-build}}
spec:
  image: quay.io/pypa/manylinux_2_28_x86_64@sha256:407f771c51a2c3e83ebe5a7970b4289ead3a6db21d9b9c089168775cad11d328
  command: [/bin/bash]
  nodeSelector: {kubernetes.io/hostname: node1}
  securityContext:
    runAsUser: 0
    runAsNonRoot: false
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
    seccompProfile: {type: RuntimeDefault}
  resources:
    requests: {cpu: "8", memory: 16Gi, ephemeral-storage: 32Gi}
    limits: {cpu: "32", memory: 64Gi, ephemeral-storage: 300Gi}
  workspace: {taskSizeLimit: 300Gi, inputSizeLimit: 32Gi, outputSizeLimit: 32Gi, transferSizeLimit: 32Gi}
  inputs:
    artifacts:
      - {name: source, path: source.tar.gz, kind: file}
      - {name: numpy, path: numpy-wheels, kind: tree}
      - {name: scipy, path: scipy-wheels, kind: tree}
      - {name: numba, path: numba-wheels, kind: tree}
      - {name: llvmlite, path: llvmlite-wheels, kind: tree}
      - {name: filelock, path: filelock-wheels, kind: tree}
  outputs:
    artifacts:
      - {name: wheels, path: wheels, kind: tree}
      - {name: report, path: pytensor-build.txt, kind: file}
  script: |
    set -Eeuo pipefail
    umask 022
    export HOME=/workspace/home TMPDIR=/workspace/tmp XDG_CACHE_HOME=/workspace/cache
    python=/opt/python/cp313-cp313/bin/python
    mkdir -p "$HOME" "$TMPDIR" "$XDG_CACHE_HOME" /workspace/src "$FASE_OUTPUT_ROOT/wheels"
    "$python" -m pip install --disable-pip-version-check --no-cache-dir \
      'setuptools==84.0.0' 'wheel==0.45.1' 'Cython==3.2.4' 'versioneer[toml]==0.29'
    "$python" -m pip install --no-index --no-deps "$FASE_INPUT_ROOT"/numpy-wheels/numpy-*.whl
    "$python" -m pip install --no-index --no-deps "$FASE_INPUT_ROOT"/scipy-wheels/scipy-*.whl
    "$python" -m pip install --no-index --no-deps "$FASE_INPUT_ROOT"/llvmlite-wheels/llvmlite-*.whl
    "$python" -m pip install --no-index --no-deps "$FASE_INPUT_ROOT"/numba-wheels/numba-*.whl
    "$python" -m pip install --no-index --no-deps "$FASE_INPUT_ROOT"/filelock-wheels/filelock-*.whl
    "$python" -c 'import numpy, scipy, numba, filelock; print(numpy.__version__, scipy.__version__, numba.__version__)'
    tar -xf "$FASE_INPUT_ROOT/source.tar.gz" -C /workspace/src
    cd /workspace/src/pytensor-3.3.2
    "$python" -m pip wheel --disable-pip-version-check --no-deps --no-build-isolation \
      --wheel-dir "$FASE_OUTPUT_ROOT/wheels" .
    test "$(find "$FASE_OUTPUT_ROOT/wheels" -name 'pytensor-*.whl' | wc -l)" -eq 1
    unzip -t "$FASE_OUTPUT_ROOT"/wheels/pytensor-*.whl >/dev/null
    {
      printf 'PyTensor 3.3.2 built from source with source-built NumPy and SciPy\n'
      sha256sum "$FASE_OUTPUT_ROOT"/wheels/pytensor-*.whl
    } > "$FASE_OUTPUT_ROOT/pytensor-build.txt"
---
apiVersion: skyw.top/v1beta1
kind: Recipe
metadata: {name: pytensor-source-build}
spec:
  inputs:
    artifacts:
      - name: source
        artifactSelector:
          matchLabels: {name: pytensor-source, version: "3.3.2", recipe: fetch-v2}
      - name: numpy
        artifactSelector:
          matchLabels: {name: numpy-glibc-wheels, version: "2.5.3"}
      - name: scipy
        artifactSelector:
          matchLabels: {name: scipy-glibc-wheels, version: "1.18.1"}
      - name: numba
        artifactSelector:
          matchLabels: {name: numba-glibc-wheels, version: "0.67.0"}
      - name: llvmlite
        artifactSelector:
          matchLabels: {name: llvmlite-glibc-wheels, version: "0.49.0"}
      - name: filelock
        artifactSelector:
          matchLabels: {name: filelock-glibc-wheels, version: "3.20.3"}
  tasks:
    - name: build
      taskSelector:
        matchLabels: {capability: pytensor-source-build}
      inputs:
        artifacts:
          - {name: source, from: {recipeInput: source}}
          - {name: numpy, from: {recipeInput: numpy}}
          - {name: scipy, from: {recipeInput: scipy}}
          - {name: numba, from: {recipeInput: numba}}
          - {name: llvmlite, from: {recipeInput: llvmlite}}
          - {name: filelock, from: {recipeInput: filelock}}
      outputs: [{name: wheels}, {name: report}]
  outputs:
    artifacts:
      - name: wheels
        from: {task: build, artifact: wheels}
        labels:
          name: {value: pytensor-glibc-wheels}
          version: {value: "3.3.2"}
          python: {value: cp313}
          libc: {value: glibc}
          arch: {value: amd64}
      - name: report
        from: {task: build, artifact: report}
        labels:
          name: {value: pytensor-build-report}
          version: {value: "3.3.2"}
---
