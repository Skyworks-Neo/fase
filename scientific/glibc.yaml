apiVersion: skyw.top/v1beta1
kind: Task
metadata: {name: glibc-openblas-build, labels: {capability: glibc-openblas-build}}
spec:
  image: quay.io/pypa/manylinux_2_28_x86_64@sha256:407f771c51a2c3e83ebe5a7970b4289ead3a6db21d9b9c089168775cad11d328
  command: [/bin/bash]
  nodeSelector: {kubernetes.io/hostname: node1}
  securityContext:
    runAsUser: 0
    runAsNonRoot: false
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
    seccompProfile: {type: RuntimeDefault}
  resources:
    requests: {cpu: "32", memory: 64Gi, ephemeral-storage: 200Gi}
    limits: {cpu: "32", memory: 64Gi, ephemeral-storage: 300Gi}
  workspace: {taskSizeLimit: 300Gi, inputSizeLimit: 32Gi, outputSizeLimit: 32Gi, transferSizeLimit: 32Gi}
  inputs:
    artifacts:
      - {name: source, path: source.tar.gz, kind: file}
  outputs:
    artifacts:
      - {name: prefix, path: openblas, kind: tree}
      - {name: report, path: openblas-glibc-build.txt, kind: file}
  script: |
    set -Eeuo pipefail
    umask 022
    mkdir -p /workspace/src "$FASE_OUTPUT_ROOT/openblas"
    tar -xf "$FASE_INPUT_ROOT/source.tar.gz" -C /workspace/src
    src=$(find /workspace/src -mindepth 1 -maxdepth 1 -type d -name 'OpenBLAS*' | head -1)
    test -n "$src"
    make -C "$src" -j32 DYNAMIC_ARCH=1 TARGET=NEHALEM USE_OPENMP=0 \
      BINARY=64 INTERFACE64=0 NO_AFFINITY=1
    make -C "$src" PREFIX="$FASE_OUTPUT_ROOT/openblas" install
    test -s "$FASE_OUTPUT_ROOT/openblas/lib/libopenblas.so.0"
    test -s "$FASE_OUTPUT_ROOT/openblas/lib/pkgconfig/openblas.pc"
    {
      printf 'OpenBLAS 0.3.34 built from source with GCC and gfortran on manylinux_2_28\n'
      sha256sum "$FASE_OUTPUT_ROOT/openblas/lib/libopenblas.so.0"
    } > "$FASE_OUTPUT_ROOT/openblas-glibc-build.txt"
---
apiVersion: skyw.top/v1beta1
kind: Recipe
metadata: {name: glibc-openblas-build}
spec:
  inputs:
    artifacts:
      - name: source
        artifactSelector:
          matchLabels: {name: openblas-source, version: "0.3.34", recipe: fetch-v1}
  tasks:
    - name: build
      taskSelector:
        matchLabels: {capability: glibc-openblas-build}
      inputs:
        artifacts:
          - {name: source, from: {recipeInput: source}}
      outputs: [{name: prefix}, {name: report}]
  outputs:
    artifacts:
      - name: prefix
        from: {task: build, artifact: prefix}
        labels:
          name: {value: openblas-glibc}
          version: {value: "0.3.34"}
          libc: {value: glibc}
          arch: {value: amd64}
          source: {value: openblas-0.3.34}
      - name: report
        from: {task: build, artifact: report}
        labels:
          name: {value: openblas-glibc-report}
          version: {value: "0.3.34"}
---
apiVersion: skyw.top/v1beta1
kind: Task
metadata: {name: glibc-numpy-build, labels: {capability: glibc-numpy-build}}
spec:
  image: quay.io/pypa/manylinux_2_28_x86_64@sha256:407f771c51a2c3e83ebe5a7970b4289ead3a6db21d9b9c089168775cad11d328
  command: [/bin/bash]
  nodeSelector: {kubernetes.io/hostname: worker1.adamanteye.cc}
  securityContext:
    runAsUser: 0
    runAsNonRoot: false
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
    seccompProfile: {type: RuntimeDefault}
  resources:
    requests: {cpu: "32", memory: 64Gi, ephemeral-storage: 200Gi}
    limits: {cpu: "32", memory: 64Gi, ephemeral-storage: 300Gi}
  workspace: {taskSizeLimit: 300Gi, inputSizeLimit: 32Gi, outputSizeLimit: 32Gi, transferSizeLimit: 32Gi}
  inputs:
    artifacts:
      - {name: source, path: source.tar.gz, kind: file}
      - {name: openblas, path: openblas, kind: tree}
  outputs:
    artifacts:
      - {name: wheels, path: wheels, kind: tree}
      - {name: report, path: numpy-glibc-build.txt, kind: file}
  script: |
    set -Eeuo pipefail
    umask 022
    export HOME=/workspace/home TMPDIR=/workspace/tmp XDG_CACHE_HOME=/workspace/cache
    mkdir -p /workspace/pkgconfig
    sed "s|/out/openblas|$FASE_INPUT_ROOT/openblas|g" \
      "$FASE_INPUT_ROOT/openblas/lib/pkgconfig/openblas.pc" > /workspace/pkgconfig/openblas.pc
    export PKG_CONFIG_PATH=/workspace/pkgconfig
    test "$(pkg-config --variable=libdir openblas)" = "$FASE_INPUT_ROOT/openblas/lib"
    export LD_LIBRARY_PATH="$FASE_INPUT_ROOT/openblas/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
    export NINJAFLAGS=-j32
    python=/opt/python/cp313-cp313/bin/python
    export PATH=/opt/python/cp313-cp313/bin:$PATH
    mkdir -p "$HOME" "$TMPDIR" "$XDG_CACHE_HOME" /workspace/src /workspace/wheels "$FASE_OUTPUT_ROOT/wheels"
    "$python" -m pip install --disable-pip-version-check --no-cache-dir \
      'meson==1.12.1' 'meson-python==0.21.1' 'pyproject-metadata==0.12.1' \
      'packaging==26.3' 'Cython==3.3.0' 'ninja==1.13.2' 'auditwheel==6.5.0'
    tar -xf "$FASE_INPUT_ROOT/source.tar.gz" -C /workspace/src
    cd /workspace/src/numpy-2.5.3
    "$python" -m pip wheel --disable-pip-version-check --no-build-isolation --no-deps \
      -w /workspace/wheels -Csetup-args=-Dblas=openblas -Csetup-args=-Dlapack=openblas \
      -Csetup-args=-Dbuildtype=release -Ccompile-args=-j32 .
    "$python" -m auditwheel repair --plat manylinux_2_28_x86_64 \
      /workspace/wheels/numpy-2.5.3-*.whl -w "$FASE_OUTPUT_ROOT/wheels"
    test "$(find "$FASE_OUTPUT_ROOT/wheels" -name 'numpy-*.whl' | wc -l)" -eq 1
    unzip -t "$FASE_OUTPUT_ROOT"/wheels/numpy-*.whl >/dev/null
    {
      printf 'NumPy 2.5.3 built from source against OpenBLAS 0.3.34\n'
      sha256sum "$FASE_OUTPUT_ROOT"/wheels/numpy-*.whl
    } > "$FASE_OUTPUT_ROOT/numpy-glibc-build.txt"
---
apiVersion: skyw.top/v1beta1
kind: Recipe
metadata: {name: glibc-numpy-build}
spec:
  inputs:
    artifacts:
      - name: source
        artifactSelector:
          matchLabels: {name: numpy-source, version: "2.5.3", recipe: fetch-v1}
      - name: openblas
        artifactSelector:
          matchLabels: {name: openblas-glibc, version: "0.3.34"}
  tasks:
    - name: build
      taskSelector:
        matchLabels: {capability: glibc-numpy-build}
      inputs:
        artifacts:
          - {name: source, from: {recipeInput: source}}
          - {name: openblas, from: {recipeInput: openblas}}
      outputs: [{name: wheels}, {name: report}]
  outputs:
    artifacts:
      - name: wheels
        from: {task: build, artifact: wheels}
        labels:
          name: {value: numpy-glibc-wheels}
          version: {value: "2.5.3"}
          source-deps: {value: fase-openblas}
          python: {value: cp313}
          platform: {value: manylinux_2_28_x86_64}
          libc: {value: glibc}
          arch: {value: amd64}
          source: {value: numpy-2.5.3}
      - name: report
        from: {task: build, artifact: report}
        labels:
          name: {value: numpy-glibc-report}
          version: {value: "2.5.3"}
---
apiVersion: skyw.top/v1beta1
kind: Task
metadata: {name: glibc-scipy-build, labels: {capability: glibc-scipy-build}}
spec:
  image: quay.io/pypa/manylinux_2_28_x86_64@sha256:407f771c51a2c3e83ebe5a7970b4289ead3a6db21d9b9c089168775cad11d328
  command: [/bin/bash]
  nodeSelector: {kubernetes.io/hostname: worker1.adamanteye.cc}
  securityContext:
    runAsUser: 0
    runAsNonRoot: false
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
    seccompProfile: {type: RuntimeDefault}
  resources:
    requests: {cpu: "32", memory: 64Gi, ephemeral-storage: 200Gi}
    limits: {cpu: "32", memory: 64Gi, ephemeral-storage: 300Gi}
  workspace: {taskSizeLimit: 300Gi, inputSizeLimit: 32Gi, outputSizeLimit: 32Gi, transferSizeLimit: 32Gi}
  inputs:
    artifacts:
      - {name: source, path: source.tar.gz, kind: file}
      - {name: openblas, path: openblas, kind: tree}
      - {name: numpy, path: numpy-wheels, kind: tree}
  outputs:
    artifacts:
      - {name: wheels, path: wheels, kind: tree}
      - {name: report, path: scipy-glibc-build.txt, kind: file}
  script: |
    set -Eeuo pipefail
    umask 022
    export PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple
    export HOME=/workspace/home TMPDIR=/workspace/tmp XDG_CACHE_HOME=/workspace/cache
    mkdir -p /workspace/pkgconfig
    sed "s|/out/openblas|$FASE_INPUT_ROOT/openblas|g" \
      "$FASE_INPUT_ROOT/openblas/lib/pkgconfig/openblas.pc" > /workspace/pkgconfig/openblas.pc
    export PKG_CONFIG_PATH=/workspace/pkgconfig
    test "$(pkg-config --variable=libdir openblas)" = "$FASE_INPUT_ROOT/openblas/lib"
    export LD_LIBRARY_PATH="$FASE_INPUT_ROOT/openblas/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
    export NINJAFLAGS=-j32
    python=/opt/python/cp313-cp313/bin/python
    export PATH=/opt/python/cp313-cp313/bin:$PATH
    mkdir -p "$HOME" "$TMPDIR" "$XDG_CACHE_HOME" /workspace/src /workspace/wheels "$FASE_OUTPUT_ROOT/wheels"
    "$python" -m pip install --no-index --no-deps --force-reinstall "$FASE_INPUT_ROOT"/numpy-wheels/numpy-*.whl
    "$python" -m pip install --disable-pip-version-check --no-cache-dir \
      'meson==1.12.1' 'meson-python==0.21.1' 'pyproject-metadata==0.12.1' \
      'packaging==26.3' 'Cython==3.2.4' 'ninja==1.13.2' 'pybind11==3.0.4' \
      'pythran==0.19.0' 'beniget==0.5.0' 'gast==0.7.0' 'ply==3.11' 'setuptools==84.0.0' \
      'auditwheel==6.5.0'
    "$python" -c 'import numpy; assert numpy.__version__ == "2.5.3"'
    tar -xf "$FASE_INPUT_ROOT/source.tar.gz" -C /workspace/src
    cd /workspace/src/scipy-1.18.1
    "$python" -m pip wheel --disable-pip-version-check --no-build-isolation --no-deps \
      -w /workspace/wheels -Csetup-args=-Dblas=openblas -Csetup-args=-Dlapack=openblas \
      -Csetup-args=-Dbuildtype=release -Ccompile-args=-j32 .
    "$python" -m auditwheel repair --plat manylinux_2_28_x86_64 \
      /workspace/wheels/scipy-1.18.1-*.whl -w "$FASE_OUTPUT_ROOT/wheels"
    test "$(find "$FASE_OUTPUT_ROOT/wheels" -name 'scipy-*.whl' | wc -l)" -eq 1
    unzip -t "$FASE_OUTPUT_ROOT"/wheels/scipy-*.whl >/dev/null
    {
      printf 'SciPy 1.18.1 built from source against source-built NumPy and OpenBLAS\n'
      sha256sum "$FASE_OUTPUT_ROOT"/wheels/scipy-*.whl
    } > "$FASE_OUTPUT_ROOT/scipy-glibc-build.txt"
---
