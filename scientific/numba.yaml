    unzip -t "$FASE_OUTPUT_ROOT"/wheels/numba-*.whl >/dev/null
    {
      printf 'Numba 0.67.0 built from source with source-built llvmlite and NumPy\n'
      sha256sum "$FASE_OUTPUT_ROOT"/wheels/numba-*.whl
    } > "$FASE_OUTPUT_ROOT/numba-glibc-build.txt"
