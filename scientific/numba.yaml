    umask 022
    export PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple
    export HOME=/workspace/home TMPDIR=/workspace/tmp XDG_CACHE_HOME=/workspace/cache
    python=/opt/python/cp313-cp313/bin/python
    mkdir -p "$HOME" "$TMPDIR" "$XDG_CACHE_HOME" /workspace/src /workspace/wheels "$FASE_OUTPUT_ROOT/wheels"
    "$python" -m pip install --disable-pip-version-check --no-cache-dir \
      'setuptools==84.0.0' 'wheel==0.45.1' 'auditwheel==6.5.0'
    "$python" -m pip install --no-index --no-deps --force-reinstall "$FASE_INPUT_ROOT"/numpy-wheels/numpy-*.whl
    "$python" -m pip install --no-index --no-deps --force-reinstall "$FASE_INPUT_ROOT"/llvmlite-wheels/llvmlite-*.whl
    "$python" -c 'import llvmlite, numpy; assert llvmlite.__version__ == "0.49.0"; assert numpy.__version__ == "2.5.3"'
