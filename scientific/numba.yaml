apiVersion: skyw.top/v1beta1
kind: Task
metadata: {name: glibc-llvmlite-build, labels: {capability: glibc-llvmlite-build}}
spec:
  image: quay.io/pypa/manylinux_2_28_x86_64@sha256:407f771c51a2c3e83ebe5a7970b4289ead3a6db21d9b9c089168775cad11d328
  command: [/bin/bash]
  nodeSelector: {kubernetes.io/hostname: node1}
  securityContext:
    runAsUser: 0
    runAsNonRoot: false
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
    seccompProfile: {type: RuntimeDefault}
  resources:
    requests: {cpu: "16", memory: 32Gi, ephemeral-storage: 64Gi}
    limits: {cpu: "32", memory: 64Gi, ephemeral-storage: 300Gi}
  workspace: {taskSizeLimit: 300Gi, inputSizeLimit: 32Gi, outputSizeLimit: 32Gi, transferSizeLimit: 32Gi}
  inputs:
    artifacts:
      - {name: source, path: llvmlite.tar.gz, kind: file}
      - {name: llvm, path: llvm, kind: tree}
  outputs:
    artifacts:
      - {name: wheels, path: wheels, kind: tree}
      - {name: report, path: llvmlite-glibc-build.txt, kind: file}
  script: |
    set -Eeuo pipefail
    umask 022
    export PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple
    export HOME=/workspace/home TMPDIR=/workspace/tmp XDG_CACHE_HOME=/workspace/cache
    export CMAKE_PREFIX_PATH="$FASE_INPUT_ROOT/llvm"
    export CMAKE_ARGS="-DLLVM_DIR=$FASE_INPUT_ROOT/llvm/lib/cmake/llvm"
    export LLVM_CONFIG="$FASE_INPUT_ROOT/llvm/bin/llvm-config"
    export LD_LIBRARY_PATH="$FASE_INPUT_ROOT/llvm/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
    export LLVMLITE_PACKAGE_FORMAT=wheel LLVMLITE_USE_RTTI=ON
    python=/opt/python/cp313-cp313/bin/python
    mkdir -p "$HOME" "$TMPDIR" "$XDG_CACHE_HOME" /workspace/src /workspace/wheels "$FASE_OUTPUT_ROOT/wheels"
    "$python" -m pip install --disable-pip-version-check --no-cache-dir \
      'setuptools==84.0.0' 'wheel==0.45.1' 'auditwheel==6.5.0'
    "$LLVM_CONFIG" --version | grep -q '^22\.'
    tar -xf "$FASE_INPUT_ROOT/llvmlite.tar.gz" -C /workspace/src
    cd /workspace/src/llvmlite-0.49.0
    "$python" -m pip wheel --disable-pip-version-check --no-deps --no-build-isolation \
      --wheel-dir /workspace/wheels .
    "$python" -m auditwheel repair --plat manylinux_2_28_x86_64 \
      /workspace/wheels/llvmlite-0.49.0-*.whl -w "$FASE_OUTPUT_ROOT/wheels"
    test "$(find "$FASE_OUTPUT_ROOT/wheels" -name 'llvmlite-*.whl' | wc -l)" -eq 1
    unzip -t "$FASE_OUTPUT_ROOT"/wheels/llvmlite-*.whl >/dev/null
    {
      printf 'llvmlite 0.49.0 built from source against source-built LLVM 22.1.6\n'
      sha256sum "$FASE_OUTPUT_ROOT"/wheels/llvmlite-*.whl
    } > "$FASE_OUTPUT_ROOT/llvmlite-glibc-build.txt"
---
