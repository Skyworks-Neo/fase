apiVersion: skyw.top/v1beta1
kind: Task
metadata: {name: glibc-llvm22-build, labels: {capability: glibc-llvm22-build}}
spec:
  image: quay.io/pypa/manylinux_2_28_x86_64@sha256:407f771c51a2c3e83ebe5a7970b4289ead3a6db21d9b9c089168775cad11d328
  command: [/bin/bash]
  nodeSelector: {kubernetes.io/hostname: worker1.adamanteye.cc}
  securityContext:
    runAsUser: 0
    runAsNonRoot: false
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
    seccompProfile: {type: RuntimeDefault}
  resources:
    requests: {cpu: "32", memory: 64Gi, ephemeral-storage: 200Gi}
    limits: {cpu: "32", memory: 64Gi, ephemeral-storage: 300Gi}
  workspace: {taskSizeLimit: 300Gi, inputSizeLimit: 32Gi, outputSizeLimit: 32Gi, transferSizeLimit: 32Gi}
  inputs:
    artifacts:
      - {name: source, path: llvm-project.tar.xz, kind: file}
  outputs:
    artifacts:
      - {name: prefix, path: llvm, kind: tree}
      - {name: report, path: llvm22-glibc-build.txt, kind: file}
  script: |
    set -Eeuo pipefail
    umask 022
    export PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple
    export HOME=/workspace/home TMPDIR=/workspace/tmp
    python=/opt/python/cp313-cp313/bin/python
    mkdir -p "$HOME" "$TMPDIR" /workspace/src "$FASE_OUTPUT_ROOT/llvm"
    "$python" -m pip install --disable-pip-version-check --no-cache-dir 'ninja==1.13.2'
    export PATH=/opt/python/cp313-cp313/bin:$PATH
    tar -xf "$FASE_INPUT_ROOT/llvm-project.tar.xz" -C /workspace/src
    src=$(find /workspace/src -mindepth 1 -maxdepth 1 -type d | head -1)
    test -f "$src/llvm/CMakeLists.txt"
    cmake -S "$src/llvm" -B /workspace/build -GNinja \
      -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$FASE_OUTPUT_ROOT/llvm" \
      -DLLVM_TARGETS_TO_BUILD=X86 -DLLVM_ENABLE_RTTI=ON \
      -DLLVM_BUILD_LLVM_DYLIB=ON -DLLVM_LINK_LLVM_DYLIB=ON \
      -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_EXAMPLES=OFF
    cmake --build /workspace/build -j32
    cmake --install /workspace/build
    test -x "$FASE_OUTPUT_ROOT/llvm/bin/llvm-config"
    "$FASE_OUTPUT_ROOT/llvm/bin/llvm-config" --version | grep -q '^22\.'
    {
      printf 'LLVM 22.1.6 built from source for llvmlite 0.49.0\n'
      "$FASE_OUTPUT_ROOT/llvm/bin/llvm-config" --version
      find "$FASE_OUTPUT_ROOT/llvm/lib" -maxdepth 1 -name 'libLLVM*.so*' -type f -exec sha256sum {} +
    } > "$FASE_OUTPUT_ROOT/llvm22-glibc-build.txt"
---
