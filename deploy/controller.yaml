apiVersion: v1
kind: ServiceAccount
metadata:
  name: fase-controller
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fase-output
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fase-controller
rules:
  - apiGroups: [fase.io]
    resources: [requests, requestgenerators, plans, steps]
    verbs: [get, list]
  - apiGroups: [fase.io]
    resources: [requests]
    verbs: [create]
  - apiGroups: [fase.io]
    resources: [requests/status, requestgenerators/status]
    verbs: [patch]
  - apiGroups: [fase.io]
    resources: [artifacts]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fase-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fase-controller
subjects:
  - kind: ServiceAccount
    name: fase-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fase-output
rules:
  - apiGroups: [fase.io]
    resources: [artifacts]
    verbs: [create, get]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create, get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fase-output
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fase-output
subjects:
  - kind: ServiceAccount
    name: fase-output
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fase-controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fase-controller
  template:
    metadata:
      labels:
        app: fase-controller
    spec:
      serviceAccountName: fase-controller
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: fase-controller:dev
          imagePullPolicy: IfNotPresent
          args: [run]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 512Mi
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: FASE_HELPER_IMAGE
              value: fase-helper:dev
            - name: FASE_OUTPUT_SERVICE_ACCOUNT
              value: fase-output
            - name: FASE_S3_BUCKET
              value: fase
            - name: FASE_S3_ENDPOINT
              value: http://silo.infra.svc.cluster.local
            # Development Silo endpoint only; use HTTPS in production.
            - name: FASE_ALLOW_INSECURE_S3
              value: "true"
            - name: FASE_MAX_ARTIFACT_BYTES
              value: "536870912"
            - name: FASE_STEP_TIMEOUT_SECONDS
              value: "3600"
            - name: FASE_S3_REGION
              value: us-east-1
            - name: FASE_S3_PREFIX
              value: ""
            - name: FASE_S3_ANONYMOUS
              value: "false"
            - name: FASE_S3_READ_SECRET
              value: fase-s3-read
            - name: FASE_S3_WRITE_SECRET
              value: fase-s3-write
